<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi — Daily Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--black:#0f0f0f;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#fff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--blue:#2563eb;--blue-bg:#eff6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:8px;--radius-lg:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;}
.header{background:var(--black);padding:0;}
.header-inner{max-width:700px;margin:0 auto;padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-text{font-size:12px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.dept-pill{font-size:11px;padding:3px 12px;border-radius:20px;font-weight:600;}
.page{max-width:700px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
/* LOGIN */
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:2rem;width:360px;max-width:95%;}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--gray-500);margin-bottom:1.5rem;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select{font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);}
.field input:focus,.field select:focus{outline:none;border-color:var(--black);}
.btn-login{width:100%;font-family:var(--font);font-size:13px;font-weight:600;padding:10px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer;margin-top:4px;}
.btn-login:hover{opacity:0.85;}
.err{font-size:12px;color:var(--red);text-align:center;margin-bottom:8px;display:none;}
/* WEEK TABS */
.week-tabs{display:flex;gap:4px;margin-bottom:1.25rem;}
.wtab{font-size:12px;padding:6px 16px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;background:var(--white);color:var(--gray-700);font-family:var(--font);font-weight:500;}
.wtab.active{background:var(--black);color:white;border-color:var(--black);}
/* PROJECT CARDS */
.proj-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;}
.proj-card-head{padding:12px 16px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
.proj-name{font-size:14px;font-weight:600;color:var(--black);}
.proj-so{font-family:var(--mono);font-size:11px;color:var(--red);}
/* CHECKIN ROWS */
.ci-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--gray-50);}
.ci-row:last-child{border-bottom:none;}
.ci-info{min-width:0;}
.ci-label{font-size:13px;font-weight:500;color:var(--black);}
.ci-date{font-size:11px;color:var(--gray-500);margin-top:2px;font-family:var(--mono);}
.ci-date.overdue{color:var(--red);}
.ci-date.today{color:var(--success);font-weight:600;}
.ci-date.soon{color:var(--blue);}
.ci-done{width:28px;height:28px;border-radius:50%;border:2px solid var(--gray-300);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all 0.15s;}
.ci-done.checked{background:var(--success);border-color:var(--success);color:white;}
.ci-done:hover{border-color:var(--black);}
/* STOPLIGHT */
.stoplight{display:flex;gap:5px;flex-shrink:0;}
.sl-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.15s;opacity:0.3;}
.sl-btn:hover{opacity:0.7;transform:scale(1.1);}
.sl-btn.active{opacity:1;border-color:rgba(0,0,0,0.2);}
.sl-green{background:#22c55e;}
.sl-yellow{background:#eab308;}
.sl-red{background:#ef4444;}
/* EMPTY */
.empty{text-align:center;padding:3rem;color:var(--gray-500);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
/* SUMMARY BAR */
.summary-bar{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:1rem;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.sb-val{font-size:20px;font-weight:600;}
.sb-label{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
.sb-green{color:#22c55e;}
.sb-yellow{color:#eab308;}
.sb-red{color:#ef4444;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:white;padding:10px 18px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <svg height="20" viewBox="0 0 90 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#e22f4a"/>
        <rect x="9" y="0" width="8" height="8" rx="1.5" fill="#e22f4a"/>
        <rect x="0" y="9" width="8" height="8" rx="1.5" fill="#797879"/>
        <rect x="9" y="9" width="8" height="8" rx="1.5" fill="#797879"/>
        <text x="22" y="13" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">SIGNIFI</text>
        <text x="22" y="22" font-family="DM Sans,sans-serif" font-size="6" font-weight="400" fill="#555" letter-spacing="1.5">DAILY CHECK-IN</text>
      </svg>
    </div>
    <div id="dept-badge" style="display:flex;align-items:center;gap:8px"></div>
  </div>
</div>

<!-- LOGIN -->
<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div class="login-title">Daily check-in</div>
    <div class="login-sub">Enter your department passcode to access your check-in.</div>
    <div id="login-err" class="err">Incorrect passcode — try again.</div>
    <div class="field">
      <label>Your name</label>
      <input type="text" id="ci-name" placeholder="e.g. Itoro" onkeydown="if(event.key==='Enter')document.getElementById('ci-pass').focus()">
    </div>
    <div class="field">
      <label>Department passcode</label>
      <input type="password" id="ci-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doCheckinLogin()">
    </div>
    <button class="btn-login" onclick="doCheckinLogin()">Sign in →</button>
  </div>
</div>

<!-- MAIN -->
<div id="main-wrap" style="display:none">
  <div class="page">
    <div id="ci-header" style="margin-bottom:1rem"></div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <button id="all-clear-btn" onclick="markAllClear()" style="font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:var(--radius);background:var(--success);color:white;cursor:pointer">✅ All clear today</button>
      <button onclick="openExtensionModal()" style="font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer">⏳ Request more time</button>
    </div>
    <div class="week-tabs">
      <button class="wtab active" id="wt-this" onclick="setWeek('this',this)">This week</button>
      <button class="wtab" id="wt-next" onclick="setWeek('next',this)">Next week</button>
    </div>
    <div id="summary-bar"></div>
    <div id="ci-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- EXTENSION REQUEST MODAL -->
<div id="ext-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeExtensionModal()">
  <div style="background:var(--white);border-radius:var(--radius-lg);padding:1.5rem;width:400px;max-width:90%">
    <div style="font-size:15px;font-weight:600;margin-bottom:4px">⏳ Request more time</div>
    <div style="font-size:12px;color:var(--gray-500);margin-bottom:14px">This documents the delay and notifies the PM. Nothing changes until they approve.</div>
    <div class="field">
      <label>Which project / item</label>
      <select id="ext-item"></select>
    </div>
    <div class="field">
      <label>How many extra days?</label>
      <input type="number" id="ext-days" min="1" value="1">
    </div>
    <div class="field">
      <label>Why? <span style="color:var(--red)">*required</span></label>
      <textarea id="ext-reason" placeholder="e.g. Waiting on a part from Procurement, ETA Thursday" style="width:100%;min-height:70px;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="closeExtensionModal()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);cursor:pointer">Cancel</button>
      <button id="ext-submit-btn" onclick="submitExtensionRequest()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:600;padding:9px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer">Submit request</button>
    </div>
  </div>
</div>

<!-- NOTE MODAL (required for red, optional add-on for yellow) -->
<div id="note-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeNoteModal(true)">
  <div style="background:var(--white);border-radius:var(--radius-lg);padding:1.5rem;width:360px;max-width:90%">
    <div id="note-modal-title" style="font-size:15px;font-weight:600;margin-bottom:4px">What's missing?</div>
    <div id="note-modal-sub" style="font-size:12px;color:var(--gray-500);margin-bottom:12px">Let the team know what you're waiting on.</div>
    <textarea id="note-modal-text" placeholder="e.g. Missing badge reader cable — waiting on Procurement" style="width:100%;min-height:80px;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical" oninput="document.getElementById('note-modal-save').disabled=(this.value.trim()===''&&document.getElementById('note-modal-required').value==='1')"></textarea>
    <input type="hidden" id="note-modal-required" value="0">
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="closeNoteModal(true)" style="flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);cursor:pointer">Cancel</button>
      <button id="note-modal-save" onclick="saveNoteModal()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:600;padding:9px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://oykgpkolliqjeznblayv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2dwa29sbGlxamV6bmJsYXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTI3ODgsImV4cCI6MjA5NTYyODc4OH0.kkOBhxyaqLG7PLPNI0SwPNwQSWmbpFjDoP2VQp33_X4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ── DEPT PASSCODES & CONFIG ─────────────────────────────────
const DEPT_CONFIG={
  'prod2026':{name:'Production',color:'#7c3aed',milestoneKeys:['production-start','production-end'],labels:{'production-start':'Build start','production-end':'Build end'}},
  'ui2026':{name:'Software / UI',color:'#2563eb',milestoneKeys:['other'],labelMatch:['UI start','UI end'],labels:{}},
  'inv2026':{name:'Inventory',color:'#0891b2',milestoneKeys:['arrival'],labelMatch:['Inventory pick'],labels:{'arrival':'Inventory pick'}},
  'proc2026':{name:'Procurement',color:'#d97706',milestoneKeys:['po-release'],labelMatch:['Parts ordering start','Parts arrival'],labels:{'po-release':'PO Release'}},
  'mo2026':{name:'MO Release (Niraj)',color:'#6b6b6b',milestoneKeys:['mo-release'],labels:{'mo-release':'MO Release'}},
  'qa2026':{name:'Quality',color:'#d97706',milestoneKeys:['quality-start','quality-end','final-qc','vinyl'],labels:{'quality-start':'QA start','quality-end':'QA end','final-qc':'Final QC','vinyl':'Vinyl / branding'}},
  'ship2026':{name:'Shipping',color:'#059669',milestoneKeys:['shipping','delivery'],labels:{'shipping':'Ship date','delivery':'Delivery date'}},
  'deploy2026':{name:'Deployment',color:'#db2777',milestoneKeys:['installation'],labels:{'installation':'Installation date'}},
};

let currentDept=null;
let currentUserName=null;
let projects=[];
let milestones=[];
let checkins={};
let currentWeek='this';

// ── UTILS ──────────────────────────────────────────────────
function today(){let t=new Date();t.setHours(0,0,0,0);return t;}
function monday(dt){let r=new Date(dt);let d=r.getDay();r.setDate(r.getDate()+(d===0?-6:1-d));r.setHours(0,0,0,0);return r;}
function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function isoD(dt){return dt.toISOString().split('T')[0];}
function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function daysDiff(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-today())/86400000);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}

function getWeekRange(){
  const base=currentWeek==='this'?monday(today()):monday(addD(today(),7));
  return{start:base,end:addD(base,6)};
}

// ── LOGIN ──────────────────────────────────────────────────
function doCheckinLogin(){
  const pass=document.getElementById('ci-pass').value;
  const name=document.getElementById('ci-name').value.trim();
  const dept=DEPT_CONFIG[pass];
  if(!name){document.getElementById('login-err').textContent='Please enter your name.';document.getElementById('login-err').style.display='block';return;}
  if(!dept){
    document.getElementById('login-err').textContent='Incorrect passcode — try again.';
    document.getElementById('login-err').style.display='block';
    document.getElementById('ci-pass').value='';
    return;
  }
  currentDept={...dept,passcode:pass};
  currentUserName=name;
  sessionStorage.setItem('ci_pass',pass);
  sessionStorage.setItem('ci_name',name);
  document.getElementById('login-err').style.display='none';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('main-wrap').style.display='block';
  // Show dept badge in header
  document.getElementById('dept-badge').innerHTML=`<span class="dept-pill" style="background:\${dept.color}20;color:\${dept.color};border:1px solid \${dept.color}40">\${dept.name}</span><button onclick="signOut()" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-family:var(--font)">Sign out</button>`;
  // Header greeting
  document.getElementById('ci-header').innerHTML=`
    <div style="font-size:18px;font-weight:600;margin-bottom:2px">Good ${getGreeting()}, ${name} 👋</div>
    <div style="font-size:12px;color:var(--gray-500)">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · ${dept.name}</div>`;
  loadCheckinData();
}
function getGreeting(){const h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening';}

// ── DATA ──────────────────────────────────────────────────
async function loadCheckinData(){
  const[pr,ms,ci,ah,sod]=await Promise.all([
    sb.from('projects').select('*').neq('status','complete').order('created_at'),
    sb.from('milestones').select('*').order('date'),
    sb.from('checkin_status').select('*'),
    sb.from('adhoc_schedule').select('*').order('created_at'),
    sb.from('so_details').select('*'),
  ]);
  projects=pr.data||[];
  milestones=ms.data||[];
  window._soDetails=sod.data||[];
  checkins={};
  (ci.data||[]).forEach(c=>{checkins[c.milestone_id]=c;});
  // Also index by adhoc id for ad hoc stoplights
  (ci.data||[]).forEach(c=>{if(c.adhoc_id)checkins['adhoc-'+c.adhoc_id]=c;});
  window._adHocShipping=(ah.data||[]).filter(r=>r.dept==='shipping');
  window._adHocInstall=(ah.data||[]).filter(r=>r.dept==='installation');
  render();
}

function setWeek(w,el){
  currentWeek=w;
  document.querySelectorAll('.wtab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  if(!currentDept)return;
  const{start,end}=getWeekRange();
  const dept=currentDept;

  // Find all milestones for this dept in the week range
  const deptMilestones=milestones.filter(m=>{
    if(!m.date)return false;
    const d=new Date(m.date+'T00:00:00');
    if(d<start||d>end)return false;
    if(dept.milestoneKeys.includes(m.key))return true;
    if(dept.labelMatch){
      return dept.labelMatch.some(lbl=>(m.label||'').toLowerCase().includes(lbl.toLowerCase()));
    }
    return false;
  });

  // Add ad hoc items for shipping/deployment depts
  const adHocItems=[];
  if(dept.passcode==='ship2026'){
    (window._adHocShipping||[]).forEach(r=>{
      const d=r.ship_date||'';
      if(!d)return;
      const dt=new Date(d+'T00:00:00');
      if(dt>=start&&dt<=end)adHocItems.push({_id:'adhoc-ship-'+r.id,_adhoc:true,label:r.name,date:d,so:r.so||'',client:r.client||'',status:r.status||''});
    });
  }
  if(dept.passcode==='deploy2026'){
    (window._adHocInstall||[]).forEach(r=>{
      const d=r.install_date||'';
      if(!d)return;
      const dt=new Date(d+'T00:00:00');
      if(dt>=start&&dt<=end)adHocItems.push({_id:'adhoc-inst-'+r.id,_adhoc:true,label:r.name,date:d,so:r.so||'',client:r.client||'',status:r.status||''});
    });
  }

  // Group project milestones by project, then deduplicate by label within each project.
  // For SO-split projects (e.g. Unisys with 20 SOs), every SO gets its own "Build start"
  // milestone row — but Production gives one status for the whole build, not one per SO.
  // We keep only the earliest-dated milestone per unique label per project, and use that
  // single row to represent the whole label. The checkin_status key is the milestone id
  // of the representative row, which is consistent on reload since we always pick earliest.
  const byProject={};
  deptMilestones.forEach(m=>{
    if(!byProject[m.project_id])byProject[m.project_id]=[];
    byProject[m.project_id].push(m);
  });
  // Deduplicate: within each project, keep only one row per unique label (earliest date)
  Object.keys(byProject).forEach(pid=>{
    const seen={};
    byProject[pid]=byProject[pid]
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''))
      .filter(m=>{
        if(seen[m.label])return false;
        seen[m.label]=true;
        return true;
      });
  });

  // Summary counts (project milestones + ad hoc)
  const allItems=[...deptMilestones,...adHocItems];
  window._currentCheckinItems=allItems; // used by markAllClear() and the extension request dropdown
  let greens=0,yellows=0,reds=0;
  allItems.forEach(m=>{
    const id=m._id||m.id;
    const ci=checkins[id];
    if(ci?.stoplight==='green')greens++;
    else if(ci?.stoplight==='yellow')yellows++;
    else if(ci?.stoplight==='red')reds++;
  });

  document.getElementById('summary-bar').innerHTML=allItems.length?`
    <div class="summary-bar">
      <div><div class="sb-val sb-green">${greens}</div><div class="sb-label">On track</div></div>
      <div><div class="sb-val sb-yellow">${yellows}</div><div class="sb-label">In trouble</div></div>
      <div><div class="sb-val sb-red">${reds}</div><div class="sb-label">Escalation</div></div>
    </div>`:'';

  const thisBase=monday(today());
  const nextBase=monday(addD(today(),7));
  const fmtRange=(s,e)=>fmt(isoD(s))+' – '+fmt(isoD(e));
  document.getElementById('wt-this').textContent='This week  '+fmtRange(thisBase,addD(thisBase,4));
  document.getElementById('wt-next').textContent='Next week  '+fmtRange(nextBase,addD(nextBase,4));

  const wLabel=currentWeek==='this'?'this week':'next week';
  const ciContent=document.getElementById('ci-content');

  if(!allItems.length){
    ciContent.innerHTML=`<div class="empty"><div class="empty-icon">🎉</div>No ${dept.name} items ${wLabel}.<br>Check next week!</div>`;
    return;
  }

  // Render project milestone cards
  const projIds=Object.keys(byProject);
  const projHtml=projIds.map(pid=>{
    const proj=projects.find(p=>p.id===pid);
    if(!proj)return'';
    const rows=byProject[pid].map(m=>ciRow(m.id,m,dept)).join('');
    return`<div class="proj-card">
      <div class="proj-card-head">
        <div class="proj-name">${proj.name}</div>
        <div class="proj-so">${proj.so_number||''}</div>
      </div>
      ${rows}
    </div>`;
  }).join('');

  // Render ad hoc cards
  const adHocHtml=adHocItems.length?`
    <div class="proj-card">
      <div class="proj-card-head">
        <div class="proj-name" style="display:flex;align-items:center;gap:6px">Ad hoc entries <span style="font-size:10px;background:var(--blue);color:white;padding:1px 6px;border-radius:8px">Standalone</span></div>
        <div class="proj-so">${adHocItems.length} item${adHocItems.length>1?'s':''}</div>
      </div>
      ${adHocItems.map(m=>ciRow(m._id,m,dept)).join('')}
    </div>`:'';

  ciContent.innerHTML=projHtml+adHocHtml;
}

function ciRow(id,m,dept){
  window._ciItemMap[id]=m; // store for save callbacks
  const ci=checkins[id]||{};
  const d=daysDiff(m.date);
  const dateCls=d<0?'overdue':d===0?'today':d<=3?'soon':'';
  const dateLabel=d<0?`${Math.abs(d)}d overdue`:d===0?'Today':d===1?'Tomorrow':`${fmt(m.date)}`;
  const isChecked=ci.checked||false;
  const stoplight=ci.stoplight||'';
  const lbl=m._adhoc?m.label:(dept.labels[m.key]||m.label);
  const noteHtml=ci.notes?`<div style="font-size:11px;color:var(--gray-500);margin-top:3px;font-style:italic">💬 "${ci.notes.replace(/</g,'&lt;')}" ${ci.stoplight_by?`— ${ci.stoplight_by}`:''}</div>`:'';
  const addNoteLink=(!ci.notes&&stoplight)?`<div style="margin-top:3px"><button onclick="openNoteModal('${id}',false)" style="background:none;border:none;cursor:pointer;color:var(--blue);font-size:10px;padding:0;font-family:var(--font)">+ Add note</button></div>`:'';
  const isShipping=dept.passcode==='ship2026';
  const shipStatusHtml=isShipping?`<div style="margin-top:6px">
    <select id="ss-${id.replace(/[^a-zA-Z0-9]/g,'_')}" onchange="const itm=window._ciItemMap['${id}'];if(itm)saveCheckinShipStatus(itm,this.value)" style="font-size:11px;padding:3px 8px;border:1px solid var(--gray-300);border-radius:20px;font-family:var(--font);font-weight:600;cursor:pointer;background:white;color:var(--gray-700)">
      ${SHIP_STATUS_OPTS.map(o=>`<option value="${o}"${o===getCheckinShippingStatus(m)?' selected':''}>${o}</option>`).join('')}
    </select>
  </div>`:'';
  return`<div class="ci-row" style="align-items:flex-start;padding-top:10px;padding-bottom:10px">
    <div class="ci-info">
      <div class="ci-label">${lbl}${m._adhoc?` <span style="font-size:9px;color:var(--gray-400)">${m.client||m.so||''}</span>`:''}</div>
      <div class="ci-date ${dateCls}">${dateLabel}</div>
      ${noteHtml}${addNoteLink}${shipStatusHtml}
    </div>
    <div class="stoplight">
      <div class="sl-btn sl-green${stoplight==='green'?' active':''}" title="On track" onclick="setStoplight('${id}','green',this)"></div>
      <div class="sl-btn sl-yellow${stoplight==='yellow'?' active':''}" title="In trouble" onclick="setStoplight('${id}','yellow',this)"></div>
      <div class="sl-btn sl-red${stoplight==='red'?' active':''}" title="Escalation needed" onclick="setStoplight('${id}','red',this)"></div>
    </div>
    <div class="ci-done${isChecked?' checked':''}" onclick="toggleCheck('${id}',this)" title="${isChecked?'Uncheck':'Mark done'}">
      ${isChecked?'✓':''}
    </div>
  </div>`;
}

// ── ACTIONS ────────────────────────────────────────────────
let _pendingStoplight=null; // {milestoneId,color}
async function setStoplight(milestoneId,color,el){
  const existing=checkins[milestoneId];
  const newColor=existing?.stoplight===color?null:color; // toggle off if same
  if(newColor==='red'){
    // Red requires a note before saving
    _pendingStoplight={milestoneId,color:newColor};
    openNoteModal(milestoneId,true,newColor);
    return;
  }
  await applyStoplight(milestoneId,newColor,existing?.notes||null);
  showToast(newColor?`Marked ${newColor==='green'?'on track':'in trouble'}!`:'Status cleared');
}

async function applyStoplight(milestoneId,newColor,note){
  const existing=checkins[milestoneId];
  const now=new Date().toISOString();
  const payload={stoplight:newColor,notes:note||null,stoplight_by:newColor?currentUserName:null,stoplight_at:newColor?now:null,dept:currentDept.name,updated_at:now};
  if(existing){
    await sb.from('checkin_status').update(payload).eq('milestone_id',milestoneId);
    checkins[milestoneId]={...existing,...payload};
  } else {
    const{data}=await sb.from('checkin_status').insert({milestone_id:milestoneId,project_id:milestones.find(m=>m.id===milestoneId)?.project_id,checked:false,...payload}).select().single();
    if(data)checkins[milestoneId]=data;
  }
  render();
}

function openNoteModal(milestoneId,required,color){
  _pendingStoplight={milestoneId,color:color||checkins[milestoneId]?.stoplight||null};
  document.getElementById('note-modal-title').textContent=required?'What\'s missing?':'Add a note';
  document.getElementById('note-modal-sub').textContent=required?'Let the team know what you\'re waiting on — this is required for an escalation.':'Optional context for the team.';
  document.getElementById('note-modal-text').value=checkins[milestoneId]?.notes||'';
  document.getElementById('note-modal-required').value=required?'1':'0';
  document.getElementById('note-modal-save').disabled=required;
  document.getElementById('note-modal-backdrop').style.display='flex';
  setTimeout(()=>document.getElementById('note-modal-text').focus(),50);
}

function closeNoteModal(cancelled){
  document.getElementById('note-modal-backdrop').style.display='none';
  document.getElementById('note-modal-text').value='';
  if(cancelled)_pendingStoplight=null;
}

async function saveNoteModal(){
  if(!_pendingStoplight)return;
  const note=document.getElementById('note-modal-text').value.trim();
  const required=document.getElementById('note-modal-required').value==='1';
  if(required&&!note)return; // guard, button should already be disabled
  const{milestoneId,color}=_pendingStoplight;
  await applyStoplight(milestoneId,color,note||null);
  closeNoteModal(false);
  showToast(color==='red'?'Escalation logged ⚠️':'Note saved ✓');
}

async function toggleCheck(milestoneId,el){
  const existing=checkins[milestoneId];
  const newVal=!(existing?.checked||false);
  const now=new Date().toISOString();
  const payload={checked:newVal,checked_by:newVal?currentUserName:null,checked_at:newVal?now:null,dept:currentDept.name,updated_at:now};
  if(existing){
    await sb.from('checkin_status').update(payload).eq('milestone_id',milestoneId);
    checkins[milestoneId]={...existing,...payload};
  } else {
    const{data}=await sb.from('checkin_status').insert({milestone_id:milestoneId,project_id:milestones.find(m=>m.id===milestoneId)?.project_id,stoplight:null,...payload}).select().single();
    if(data)checkins[milestoneId]=data;
  }
  render();
  showToast(newVal?'Checked ✓':'Unchecked');
}

// ── ALL CLEAR (one tap = green + done on every item currently visible) ──────
async function markAllClear(){
  const items=window._currentCheckinItems||[];
  // Only touch items that aren't already green+done, AND skip anything already
  // flagged yellow/red — All Clear should never silently overwrite an active
  // escalation. Those still need to be resolved individually.
  const flagged=items.filter(m=>{
    const id=m._id||m.id;
    const ci=checkins[id];
    return ci?.stoplight==='yellow'||ci?.stoplight==='red';
  });
  const todo=items.filter(m=>{
    const id=m._id||m.id;
    const ci=checkins[id];
    if(ci?.stoplight==='yellow'||ci?.stoplight==='red')return false; // never auto-clear these
    return!(ci?.stoplight==='green'&&ci?.checked);
  });
  if(!todo.length){
    showToast(flagged.length?`${flagged.length} flagged item(s) need individual attention`:'Already all clear ✓');
    return;
  }
  const confirmMsg=flagged.length
    ?`Mark ${todo.length} item(s) as on track and done? (${flagged.length} flagged item${flagged.length>1?'s':''} will be left as-is — resolve ${flagged.length>1?'them':'it'} individually.)`
    :`Mark all ${todo.length} item(s) as on track and done?`;
  if(!confirm(confirmMsg))return;
  const now=new Date().toISOString();
  for(const m of todo){
    const id=m._id||m.id;
    const existing=checkins[id];
    // Ad hoc items aren't real milestone rows — still keyed the same way in checkin_status via milestone_id (works as a free-text key here)
    const payload={stoplight:'green',checked:true,stoplight_by:currentUserName,stoplight_at:now,checked_by:currentUserName,checked_at:now,dept:currentDept.name,updated_at:now,notes:existing?.notes||null};
    if(existing){
      await sb.from('checkin_status').update(payload).eq('milestone_id',id);
      checkins[id]={...existing,...payload};
    } else {
      const{data}=await sb.from('checkin_status').insert({milestone_id:id,project_id:m.project_id||null,...payload}).select().single();
      if(data)checkins[id]=data;
    }
  }
  render();
  showToast(`✅ ${todo.length} item(s) marked all clear`);
}

// ── EXTENSION REQUESTS ───────────────────────────────────────────────────
function openExtensionModal(){
  const items=window._currentCheckinItems||[];
  const sel=document.getElementById('ext-item');
  if(!items.length){
    sel.innerHTML='<option value="">No items in your queue this week</option>';
  } else {
    sel.innerHTML=items.map(m=>{
      const id=m._id||m.id;
      const proj=projects.find(p=>p.id===m.project_id);
      const lbl=m._adhoc?m.label:(currentDept.labels[m.key]||m.label);
      const projName=proj?proj.name:(m._adhoc?m.label:'');
      const soTag=m.so_tag||'';
      return`<option value="${id}" data-projid="${m.project_id||''}" data-sotag="${soTag}">${projName}${soTag?' ('+soTag+')':''} — ${lbl}</option>`;
    }).join('');
  }
  document.getElementById('ext-days').value='1';
  document.getElementById('ext-reason').value='';
  document.getElementById('ext-modal-backdrop').style.display='flex';
}
function closeExtensionModal(){
  document.getElementById('ext-modal-backdrop').style.display='none';
}
async function submitExtensionRequest(){
  const sel=document.getElementById('ext-item');
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value){showToast('No item selected');return;}
  const days=parseInt(document.getElementById('ext-days').value)||0;
  const reason=document.getElementById('ext-reason').value.trim();
  if(days<1){showToast('Enter at least 1 day');return;}
  if(!reason){showToast('Please explain why — this gets logged for the PM');return;}
  const milestoneId=opt.value;
  const projId=opt.dataset.projid||null;
  const soTag=opt.dataset.sotag||null;
  const btn=document.getElementById('ext-submit-btn');
  btn.disabled=true;btn.textContent='Submitting...';
  await sb.from('extension_requests').insert({
    project_id:projId,so_tag:soTag||null,milestone_id:milestoneId,
    dept:currentDept.name,requested_by:currentUserName,
    days,reason,status:'pending'
  });
  btn.disabled=false;btn.textContent='Submit request';
  closeExtensionModal();
  showToast('⏳ Request sent — PM will review the new timeline');
}

// ── SHIPPING STATUS (CHECKIN) ──────────────────────────────
const SHIP_STATUS_OPTS=['Pending','Scheduled','Shipped','Delivered'];
function shipStatusChipCls(s){return s==='Delivered'?'chip-done':s==='Shipped'?'chip-atrisk':s==='Scheduled'?'chip-active':'chip-future';}
function getCheckinShippingStatus(m){
  if(m._adhoc){
    const r=(window._adHocShipping||[]).find(x=>'adhoc-ship-'+x.id===m._id);
    return r?.status||'Pending';
  }
  const soTag=m.so_tag||null;
  const proj=projects.find(p=>p.id===m.project_id);
  if(soTag){const soDet=(window._soDetails||[]).find(d=>d.project_id===m.project_id&&d.so_tag===soTag);if(soDet?.shipping_status)return soDet.shipping_status;}
  if(proj?.shipping_status)return proj.shipping_status;
  // Auto-compute from milestone state (checkin has milestone data)
  const shipMs=milestones.find(x=>x.project_id===m.project_id&&x.key==='shipping'&&(soTag?x.so_tag===soTag:true));
  const delivMs=milestones.find(x=>x.project_id===m.project_id&&x.key==='delivery'&&(soTag?x.so_tag===soTag:true));
  const isDone=(ms)=>ms&&checkins[ms.id]?.checked&&checkins[ms.id]?.stoplight==='green';
  if(delivMs&&isDone(delivMs))return'Delivered';
  if(shipMs&&isDone(shipMs))return'Shipped';
  if(shipMs&&shipMs.date)return'Scheduled';
  return'Pending';
}
async function saveCheckinShipStatus(m,status){
  if(m._adhoc){
    const ahId=m._id.replace('adhoc-ship-','');
    await sb.from('adhoc_schedule').update({status}).eq('id',ahId);
    const r=(window._adHocShipping||[]).find(x=>x.id==ahId);if(r)r.status=status;
  } else {
    const soTag=m.so_tag||null;
    if(soTag){
      const existing=(window._soDetails||[]).find(d=>d.project_id===m.project_id&&d.so_tag===soTag);
      if(existing){await sb.from('so_details').update({shipping_status:status,updated_at:new Date().toISOString()}).eq('id',existing.id);existing.shipping_status=status;}
      else{const{data}=await sb.from('so_details').insert({project_id:m.project_id,so_tag:soTag,shipping_status:status}).select().single();if(data)(window._soDetails||[]).push(data);}
    } else {
      await sb.from('projects').update({shipping_status:status}).eq('id',m.project_id);
      const p=projects.find(x=>x.id===m.project_id);if(p)p.shipping_status=status;
    }
  }
  render();
}
// Store current items for save callbacks
window._ciItemMap={};

function signOut(){
  sessionStorage.removeItem('ci_pass');
  sessionStorage.removeItem('ci_name');
  currentDept=null;currentUserName=null;
  document.getElementById('main-wrap').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('ci-pass').value='';
  document.getElementById('ci-name').value='';
  document.getElementById('dept-badge').innerHTML='';
}
const savedPass=sessionStorage.getItem('ci_pass');
const savedName=sessionStorage.getItem('ci_name');
if(savedPass&&savedName&&DEPT_CONFIG[savedPass]){
  document.getElementById('ci-pass').value=savedPass;
  document.getElementById('ci-name').value=savedName;
  doCheckinLogin();
}
