<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi — Daily Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--black:#0f0f0f;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#fff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--blue:#2563eb;--blue-bg:#eff6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:8px;--radius-lg:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;}
.header{background:var(--black);padding:0;}
.header-inner{max-width:700px;margin:0 auto;padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-text{font-size:12px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.dept-pill{font-size:11px;padding:3px 12px;border-radius:20px;font-weight:600;}
.page{max-width:700px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
/* LOGIN */
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:2rem;width:360px;max-width:95%;}
.login-title{font-size:18px;font-weight:600;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--gray-500);margin-bottom:1.5rem;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select{font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);}
.field input:focus,.field select:focus{outline:none;border-color:var(--black);}
.btn-login{width:100%;font-family:var(--font);font-size:13px;font-weight:600;padding:10px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer;margin-top:4px;}
.btn-login:hover{opacity:0.85;}
.err{font-size:12px;color:var(--red);text-align:center;margin-bottom:8px;display:none;}
/* WEEK TABS */
.week-tabs{display:flex;gap:4px;margin-bottom:1.25rem;}
.wtab{font-size:12px;padding:6px 16px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;background:var(--white);color:var(--gray-700);font-family:var(--font);font-weight:500;}
.wtab.active{background:var(--black);color:white;border-color:var(--black);}
/* PROJECT CARDS */
.proj-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;}
.proj-card-head{padding:12px 16px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
.proj-name{font-size:14px;font-weight:600;color:var(--black);}
.proj-so{font-family:var(--mono);font-size:11px;color:var(--red);}
/* CHECKIN ROWS */
.ci-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--gray-50);}
.ci-row:last-child{border-bottom:none;}
.ci-info{min-width:0;}
.ci-label{font-size:13px;font-weight:500;color:var(--black);}
.ci-date{font-size:11px;color:var(--gray-500);margin-top:2px;font-family:var(--mono);}
.ci-date.overdue{color:var(--red);}
.ci-date.today{color:var(--success);font-weight:600;}
.ci-date.soon{color:var(--blue);}
.ci-done{width:28px;height:28px;border-radius:50%;border:2px solid var(--gray-300);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all 0.15s;}
.ci-done.checked{background:var(--success);border-color:var(--success);color:white;}
.ci-done:hover{border-color:var(--black);}
/* STOPLIGHT */
.stoplight{display:flex;gap:5px;flex-shrink:0;}
.sl-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.15s;opacity:0.3;}
.sl-btn:hover{opacity:0.7;transform:scale(1.1);}
.sl-btn.active{opacity:1;border-color:rgba(0,0,0,0.2);}
.sl-green{background:#22c55e;}
.sl-yellow{background:#eab308;}
.sl-red{background:#ef4444;}
/* EMPTY */
.empty{text-align:center;padding:3rem;color:var(--gray-500);font-size:13px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
/* SUMMARY BAR */
.summary-bar{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:1rem;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.sb-val{font-size:20px;font-weight:600;}
.sb-label{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}
.sb-green{color:#22c55e;}
.sb-yellow{color:#eab308;}
.sb-red{color:#ef4444;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:white;padding:10px 18px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;}
/* ═══ PRODUCTION BOARD ═══ */
.pb-wrap{padding:0 4px}
.pb-cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.pb-col{background:#f7f7f8;border:1px solid #e5e5e5;border-radius:10px;min-height:70vh;display:flex;flex-direction:column;min-width:0}
.pb-col.pb-over{outline:2px dashed #7c3aed;outline-offset:-2px;background:#f3efff}
.pb-col-head{padding:9px 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e5}
.pb-col-cnt{font-size:11px;font-weight:600;background:#fff;border:1px solid #d4d4d4;border-radius:10px;padding:1px 8px}
.pb-col-body{padding:8px;flex:1;overflow-y:auto}
.pb-card{background:#fff;border:1px solid #e5e5e5;border-left:4px solid #7c3aed;border-radius:8px;margin-bottom:8px;cursor:grab;overflow:hidden}
.pb-card.pb-waiting{border-left-color:#d97706;background:#fffaf2}
.pb-card:active{cursor:grabbing}
.pb-img{width:100%;height:110px;object-fit:cover;display:block;background:#eee;cursor:zoom-in}
.pb-noimg{width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;background:#f2f2f2;cursor:pointer}
.pb-body{padding:8px 10px}
.pb-so{font-family:var(--mono,monospace);font-size:11px;font-weight:700;color:#c2255c;word-break:break-word}
.pb-name{font-size:13px;font-weight:700;line-height:1.25;margin:1px 0 3px}
.pb-meta{font-size:10.5px;color:#666;line-height:1.5}
.pb-meta b{color:#333;font-weight:600}
.pb-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pb-badge{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:9px;background:#f1f1f1;color:#555}
.pb-badge.wait{background:#fef3c7;color:#92400e}
.pb-badge.pri-High{background:#fee2e2;color:#b91c1c}
.pb-badge.late{background:#fee2e2;color:#b91c1c}
.pb-actions{display:flex;gap:5px;margin-top:7px}
.pb-btn{font-size:10px;padding:3px 9px;border:1px solid #d4d4d4;border-radius:12px;background:#fff;cursor:pointer;font-family:var(--font)}
.pb-btn:hover{border-color:#7c3aed;color:#7c3aed}
.pb-sel{font-size:10px;padding:2px 4px;border:1px solid #d4d4d4;border-radius:6px;background:#fff;font-family:var(--font);max-width:92px}
@media(max-width:1100px){.pb-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <svg height="20" viewBox="0 0 90 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="8" height="8" rx="1.5" fill="#e22f4a"/>
        <rect x="9" y="0" width="8" height="8" rx="1.5" fill="#e22f4a"/>
        <rect x="0" y="9" width="8" height="8" rx="1.5" fill="#797879"/>
        <rect x="9" y="9" width="8" height="8" rx="1.5" fill="#797879"/>
        <text x="22" y="13" font-family="DM Sans,sans-serif" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">SIGNIFI</text>
        <text x="22" y="22" font-family="DM Sans,sans-serif" font-size="6" font-weight="400" fill="#555" letter-spacing="1.5">DAILY CHECK-IN</text>
      </svg>
    </div>
    <div id="dept-badge" style="display:flex;align-items:center;gap:8px"></div>
  </div>
</div>

<!-- LOGIN -->
<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div class="login-title">Daily check-in</div>
    <div class="login-sub">Enter your department passcode to access your check-in.</div>
    <div id="login-err" class="err">Incorrect passcode — try again.</div>
    <div class="field">
      <label>Your name</label>
      <input type="text" id="ci-name" placeholder="e.g. Itoro" onkeydown="if(event.key==='Enter')document.getElementById('ci-pass').focus()">
    </div>
    <div class="field">
      <label>Department passcode</label>
      <input type="password" id="ci-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doCheckinLogin()">
    </div>
    <button class="btn-login" onclick="doCheckinLogin()">Sign in →</button>
  </div>
</div>

<!-- MAIN -->
<div id="main-wrap" style="display:none">
  <div class="page">
    <div id="ci-header" style="margin-bottom:1rem"></div>
    <div id="standard-checkin-actions" style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <button id="all-clear-btn" onclick="markAllClear()" style="font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:var(--radius);background:var(--success);color:white;cursor:pointer">✅ All clear today</button>
      <button onclick="openExtensionModal()" style="font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer">⏳ Request more time</button>
    </div>
    <div class="week-tabs" id="week-tabs-row">
      <button class="wtab active" id="wt-this" onclick="setWeek('this',this)">This week</button>
      <button class="wtab" id="wt-next" onclick="setWeek('next',this)">Next week</button>
      <button class="wtab" id="wt-2" style="display:none" onclick="setWeek('2',this)">Week 3</button>
      <button class="wtab" id="wt-3" style="display:none" onclick="setWeek('3',this)">Week 4</button>
    </div>
    <div id="summary-bar"></div>
    <div id="attention-summary"></div>
    <div id="ci-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- EXTENSION REQUEST MODAL -->
<div id="ext-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeExtensionModal()">
  <div style="background:var(--white);border-radius:var(--radius-lg);padding:1.5rem;width:400px;max-width:90%">
    <div style="font-size:15px;font-weight:600;margin-bottom:4px">⏳ Request more time</div>
    <div style="font-size:12px;color:var(--gray-500);margin-bottom:14px">This documents the delay and notifies the PM. Nothing changes until they approve.</div>
    <div class="field">
      <label>Which project / item</label>
      <select id="ext-item"></select>
    </div>
    <div class="field">
      <label>How many extra days?</label>
      <input type="number" id="ext-days" min="1" value="1">
    </div>
    <div class="field">
      <label>Why? <span style="color:var(--red)">*required</span></label>
      <textarea id="ext-reason" placeholder="e.g. Waiting on a part from Procurement, ETA Thursday" style="width:100%;min-height:70px;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="closeExtensionModal()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);cursor:pointer">Cancel</button>
      <button id="ext-submit-btn" onclick="submitExtensionRequest()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:600;padding:9px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer">Submit request</button>
    </div>
  </div>
</div>

<!-- NOTE MODAL (required for red, optional add-on for yellow) -->
<div id="note-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeNoteModal(true)">
  <div style="background:var(--white);border-radius:var(--radius-lg);padding:1.5rem;width:360px;max-width:90%">
    <div id="note-modal-title" style="font-size:15px;font-weight:600;margin-bottom:4px">What's missing?</div>
    <div id="note-modal-sub" style="font-size:12px;color:var(--gray-500);margin-bottom:12px">Let the team know what you're waiting on.</div>
    <textarea id="note-modal-text" placeholder="e.g. Missing badge reader cable — waiting on Procurement" style="width:100%;min-height:80px;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical" oninput="document.getElementById('note-modal-save').disabled=(this.value.trim()===''&&document.getElementById('note-modal-required').value==='1')"></textarea>
    <input type="hidden" id="note-modal-required" value="0">
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="closeNoteModal(true)" style="flex:1;font-family:var(--font);font-size:13px;font-weight:500;padding:9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);cursor:pointer">Cancel</button>
      <button id="note-modal-save" onclick="saveNoteModal()" style="flex:1;font-family:var(--font);font-size:13px;font-weight:600;padding:9px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer">Save</button>
    </div>
  </div>
</div>

<!-- ═══════════ PROCUREMENT WORKSPACE — takes over check-in for proc2026 ═══════════ -->
<style>
body.proc-mode .page{max-width:1160px;}
.proc-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start;}
@media(max-width:880px){.proc-layout{grid-template-columns:1fr;}}
.proc-queue{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;}
@media(max-width:880px){.proc-queue{position:static;max-height:340px;}}
.proc-qhead{padding:12px 14px;border-bottom:1px solid var(--gray-100);}
.proc-qtitle{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.proc-qtitle .cnt{font-family:var(--mono);font-size:11px;color:var(--gray-500);font-weight:400;}
.proc-tabs{display:flex;gap:4px;margin-top:8px;}
.proc-qtab{flex:1;font-size:10px;font-weight:600;padding:5px 4px;border-radius:6px;border:1px solid var(--gray-100);background:var(--gray-50);cursor:pointer;text-align:center;color:var(--gray-500);font-family:var(--font);}
.proc-qtab.on{background:var(--black);color:#fff;border-color:var(--black);}
.proc-qlist{overflow-y:auto;flex:1;padding:6px;}
.proc-qitem{padding:10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:3px;}
.proc-qitem:hover{background:var(--gray-50);}
.proc-qitem.sel{background:var(--red-light);border-color:#f4c2cb;}
.proc-qname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proc-qso{font-family:var(--mono);font-size:10px;color:var(--gray-500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proc-qbottom{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center;}
.proc-chip{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.02em;}
.pc-ok{background:var(--gray-100);color:var(--gray-700);}
.pc-soon{background:var(--warning-bg);color:var(--warning);}
.pc-crit{background:var(--red-light);color:var(--red);}
.proc-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;}
.proc-chead{padding:12px 16px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.proc-ctitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-700);}
.proc-top{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.proc-name{font-size:21px;font-weight:600;line-height:1.2;}
.proc-soline{font-family:var(--mono);font-size:12px;color:var(--red);margin-top:3px;}
.proc-statuspill{font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;white-space:nowrap;}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--gray-50);margin-top:12px;}
.proc-cell{padding:12px 18px;border-right:1px solid var(--gray-50);}
.proc-cell:last-child{border-right:none;}
.proc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);margin-bottom:4px;}
.proc-val{font-size:14px;font-weight:600;}
.proc-val small{font-size:10px;color:var(--gray-500);font-weight:400;}
.proc-days{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;}
.proc-prio{font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;border:1px solid var(--gray-300);cursor:pointer;background:var(--white);font-family:var(--font);}
.proc-stop{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--gray-50);flex-wrap:wrap;}
.proc-stopq{font-size:12px;font-weight:600;color:var(--gray-700);margin-right:4px;}
.proc-stopbtn{font-size:12px;font-weight:600;padding:7px 16px;border-radius:20px;border:2px solid var(--gray-100);background:var(--white);cursor:pointer;font-family:var(--font);opacity:.55;}
.proc-stopbtn.on{opacity:1;}
.psg.on{border-color:var(--success);background:var(--success-bg);color:var(--success);}
.psy.on{border-color:#d97706;background:var(--warning-bg);color:var(--warning);}
.psr.on{border-color:var(--red);background:var(--red-light);color:var(--red);}
.proc-stopnote{font-size:11px;color:var(--gray-500);flex-basis:100%;}
.proc-table{width:100%;border-collapse:collapse;}
.proc-table th{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);text-align:left;padding:8px 12px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);white-space:nowrap;}
.proc-table td{font-size:12px;padding:9px 12px;border-bottom:1px solid var(--gray-50);vertical-align:middle;}
.proc-ponum{font-family:var(--mono);font-weight:500;}
.proc-pos{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;}
.pp-open{background:var(--blue-bg);color:var(--blue);}
.pp-partial{background:var(--warning-bg);color:var(--warning);}
.pp-received{background:var(--success-bg);color:var(--success);}
.pp-cancelled{background:var(--gray-100);color:var(--gray-500);text-decoration:line-through;}
.pp-rfq{background:#f3e8ff;color:#7c3aed;}
.proc-late{color:var(--red);font-weight:700;}
.proc-ibtn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 6px;color:var(--gray-500);}
.proc-ibtn:hover{color:var(--black);}
.proc-recv{font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px;border:1px solid var(--success);background:var(--white);color:var(--success);cursor:pointer;font-family:var(--font);white-space:nowrap;}
.proc-recv:hover{background:var(--success-bg);}
.proc-empty{text-align:center;color:var(--gray-500);font-size:12.5px;padding:2.2rem 1rem;}
.proc-variance{margin:0 16px 12px;background:var(--warning-bg);border:1px solid #f2dfb3;border-radius:var(--radius);padding:9px 12px;font-size:11.5px;color:var(--warning);}
.proc-mback{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
.proc-modal{background:var(--white);border-radius:var(--radius-lg);width:540px;max-width:100%;max-height:90vh;overflow-y:auto;}
.proc-mhead{padding:14px 18px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;}
.proc-mtitle{font-size:14px;font-weight:700;}
.proc-mclose{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-500);}
.proc-mbody{padding:16px 18px;}
.proc-fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.proc-fgrid .full{grid-column:1/-1;}
.proc-socheck{font-family:var(--mono);font-size:11px;padding:5px 10px;border:1px solid var(--gray-300);border-radius:16px;cursor:pointer;user-select:none;display:inline-block;margin:0 6px 6px 0;}
.proc-socheck.on{background:var(--black);color:#fff;border-color:var(--black);}

@media(max-width:700px){.proc-powrap{overflow-x:auto;}.proc-table{min-width:760px;}.proc-fgrid{grid-template-columns:1fr;}}
</style>
<div id="proc-modal-root"></div>
<script>
// ═══ PRODUCTION BOARD MODULE — active only for the prod2026 passcode ═══
// Replaces the traffic-light check-in for Production ONLY. Mirrors the
// physical floor board: Upcoming → WIP → Issues → Ready for QA/QC → Shipped,
// plus a Waiting overlay state that pauses any stage without losing it.
// STAGE LOGIC BLOCK — keep identical to the copy in signifi-ops-index.html.
const PB_STAGES=[
  {key:'upcoming',label:'Upcoming / Waiting for Parts',color:'#6b7280'},
  {key:'wip',label:'WIP',color:'#7c3aed'},
  {key:'issues',label:'Issues',color:'#dc2626'},
  {key:'ready_qa',label:'Ready for QA/QC',color:'#d97706'},
  {key:'shipped',label:'Shipped',color:'#059669'},
];
const PB_IDX=Object.fromEntries(PB_STAGES.map((s,i)=>[s.key,i]));
let pbBoard={},pbHistory=[],pbReasons=[],pbPhotos={},pbMsDone={},pbDrag=null;
function pbCloseModal(){const r=document.getElementById('pb-modal-root');if(r)r.innerHTML='';}
function pbModal(inner){
  let r=document.getElementById('pb-modal-root');
  if(!r){r=document.createElement('div');r.id='pb-modal-root';document.body.appendChild(r);}
  r.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px" onclick="if(event.target===this)pbCloseModal()">
    <div style="background:#fff;border-radius:12px;width:400px;max-width:95vw;overflow:hidden" onclick="event.stopPropagation()">${inner}</div></div>`;
}
const PB_BTN='font-family:var(--font);font-size:13px;font-weight:500;padding:9px 16px;border:1px solid #d4d4d4;border-radius:8px;background:#fff;cursor:pointer';
const PB_BTNP='font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border:none;border-radius:8px;background:#111;color:#fff;cursor:pointer';

async function prodEnter(){
  document.body.classList.add('production-mode');
  const acts=document.getElementById('standard-checkin-actions');if(acts)acts.style.display='none';
  const wt=document.getElementById('week-tabs-row');if(wt)wt.style.display='none';
  const sb1=document.getElementById('summary-bar');if(sb1)sb1.style.display='none';
  const as1=document.getElementById('attention-summary');if(as1)as1.style.display='none';
  const content=document.getElementById('ci-content');
  if(!content){console.error('Production board cannot render: ci-content was not found.');return;}
  content.innerHTML='<div style="padding:40px;text-align:center;color:#888">Loading production board…</div>';
  try{
    await pbLoad();
    pbRender();
  }catch(error){
    console.error('Production board failed to load:',error);
    if(!content.innerHTML.includes('Production board tables not found')){
      content.innerHTML='<div style="padding:40px;text-align:center;color:#b91c1c"><strong>Production board could not be loaded.</strong><br><span style="font-size:12px">Check the browser console and Supabase setup.</span></div>';
    }
  }
}
async function pbLoad(){
  const[pr,ms,md,bd,rc,ph]=await Promise.all([
    sbAll('projects','created_at'),
    sbAll('milestones','date'),
    sbAll('milestone_done'),
    sbAll('production_board',null,false,'project_id'),
    sb.from('production_reason_codes').select('*').eq('active',true).order('sort_order'),
    sbAll('project_photos','created_at'),
  ]);
  if(bd.error&&/does not exist|relation/i.test(bd.error.message||'')){
    document.getElementById('ci-content').innerHTML='<div style="padding:40px;text-align:center;color:#b91c1c">⚠️ Production board tables not found.<br>Run <b>production-board-migration.sql</b> in the Supabase SQL editor first, then refresh.</div>';
    throw new Error('migration not run');
  }
  projects=(pr.data||[]).filter(p=>p.status!=='complete');
  milestones=ms.data||[];
  pbMsDone={};(md.data||[]).forEach(d=>pbMsDone[d.milestone_id]=d);
  pbBoard={};(bd.data||[]).forEach(b=>pbBoard[b.project_id]=b);
  pbReasons=rc.data||[];
  pbPhotos={};(ph.data||[]).forEach(p=>{if((p.label||'').toLowerCase()==='kickoff')pbPhotos[p.project_id]=p;});
}
function pbMsOf(pid,key){return milestones.filter(m=>m.project_id===pid&&m.key===key);}
function pbKeyDone(pid,key){const ms=pbMsOf(pid,key);return ms.length>0&&ms.every(m=>pbMsDone[m.id]);}
// Legacy projects with no board row: derive stage from milestone completion so
// nothing needs manual backfill. First real move lazily creates their row.
function pbStageOf(pid){
  const b=pbBoard[pid];
  if(b)return b.stage;
  if(pbKeyDone(pid,'shipping'))return'shipped';
  if(pbKeyDone(pid,'production-end'))return'ready_qa';
  if(pbKeyDone(pid,'production-start'))return'wip';
  return'upcoming';
}
function pbSecsInStage(pid){
  const b=pbBoard[pid];
  if(!b)return null;
  return Math.max(0,Math.round((Date.now()-new Date(b.stage_entered_at).getTime())/1000));
}
function pbFmtDur(s){
  if(s==null)return'—';
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600);
  if(d>0)return d+'d '+h+'h';
  const m=Math.floor((s%3600)/60);
  return h>0?h+'h '+m+'m':m+'m';
}
function pbRender(){
  const q=(document.getElementById('pb-search')?.value||'').toLowerCase();
  const cols=PB_STAGES.map(s=>{
    const cards=projects.filter(p=>pbStageOf(p.id)===s.key)
      .filter(p=>!q||(p.name||'').toLowerCase().includes(q)||(p.so_number||'').toLowerCase().includes(q)||(p.client||'').toLowerCase().includes(q))
      .sort((a,b)=>{
        const pa=pbBoard[a.id]?.priority==='High'?0:1,pb_=pbBoard[b.id]?.priority==='High'?0:1;
        if(pa!==pb_)return pa-pb_;
        const da=(pbMsOf(a.id,'production-end')[0]?.date)||'9999',db=(pbMsOf(b.id,'production-end')[0]?.date)||'9999';
        return da.localeCompare(db);
      });
    return`<div class="pb-col" data-stage="${s.key}" ondragover="pbOver(event)" ondragleave="pbLeave(event)" ondrop="pbDrop(event,'${s.key}')">
      <div class="pb-col-head" style="color:${s.color}">${s.label}<span class="pb-col-cnt">${cards.length}</span></div>
      <div class="pb-col-body">${cards.map(pbCard).join('')||'<div style="text-align:center;font-size:11px;color:#aaa;padding:20px 0">—</div>'}</div>
    </div>`;
  }).join('');
  document.getElementById('ci-content').innerHTML=`<div class="pb-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
      <div style="font-size:12px;color:#666">Drag cards between stages · <b>Wait</b> pauses without losing the stage · moving backward asks for a reason</div>
      <input id="pb-search" placeholder="Search SO / kiosk / customer…" oninput="pbRender()" value="${q.replace(/"/g,'&quot;')}" style="font-size:12px;padding:6px 12px;border:1px solid #d4d4d4;border-radius:16px;width:230px;font-family:var(--font)">
    </div>
    <div class="pb-cols">${cols}</div></div>`;
}
function pbOwnerList(){return[...new Set(Object.values(pbBoard).map(b=>b.owner).filter(Boolean))].sort();}
function pbSoDisplay(soRaw){
  const sos=(soRaw||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  if(sos.length<=3)return{text:sos.join(', ')||'—',title:''};
  return{text:sos.slice(0,3).join(', ')+' +'+(sos.length-3)+' more',title:sos.join(', ')};
}
function pbCard(p){
  const b=pbBoard[p.id]||{};
  const so=pbSoDisplay(p.so_number);
  const prodEnd=pbMsOf(p.id,'production-end').map(m=>m.date).filter(Boolean).sort()[0]||null;
  const shipDate=pbMsOf(p.id,'shipping').map(m=>m.date).filter(Boolean).sort()[0]||null;
  const secs=pbSecsInStage(p.id);
  const waitSecs=b.waiting&&b.waiting_since?Math.round((Date.now()-new Date(b.waiting_since).getTime())/1000):null;
  const img=pbPhotos[p.id];
  const late=prodEnd&&daysDiff(prodEnd)<0&&pbStageOf(p.id)!=='shipped';
  const reasonLbl=(pbReasons.find(r=>r.code===b.waiting_reason)||{}).label||b.waiting_reason||'';
  const machine=[p.product_type,p.form_factor].filter(Boolean).join(' · ');
  return`<div class="pb-card ${b.waiting?'pb-waiting':''}" draggable="${b.waiting?'false':'true'}" ondragstart="pbDragStart(event,'${p.id}')" ondragover="pbCardDragOver(event)" ondragleave="pbCardDragLeave(event)" ondrop="pbCardFileDrop(event,'${p.id}')">
    ${img?`<img class="pb-img" src="${img.url}" alt="kickoff" onclick="window.open('${img.url}','_blank')" onerror="this.outerHTML='<div class=\\'pb-noimg\\' onclick=\\'pbAddPhoto(&quot;${p.id}&quot;)\\'>📷 image link broken — tap to replace</div>'">`
        :`<div class="pb-noimg" onclick="pbAddPhoto('${p.id}')">📷 add kick-off screenshot</div>`}
    <div class="pb-body">
      <div class="pb-so" ${so.title?`title="${so.title}"`:''}>${so.text}</div>
      <div class="pb-name">${p.name||''}</div>
      <div class="pb-meta">
        <b>${p.client||'—'}</b>${machine?' · '+machine:''}<br>
        Prod due: <b>${prodEnd?fmt(prodEnd):'—'}</b> · Ship: <b>${shipDate?fmt(shipDate):'—'}</b><br>
        Owner: <select class="pb-sel" onchange="if(this.value==='__new'){const n=prompt('Owner name:');if(n&&n.trim()){pbSetOwner('${p.id}',n.trim());}else{pbRender();}}else{pbSetOwner('${p.id}',this.value)}" onclick="event.stopPropagation()">
          <option value="">—</option>${pbOwnerList().map(o=>`<option ${b.owner===o?'selected':''}>${o}</option>`).join('')}
          <option value="__new">+ Add…</option>
        </select>
        Pri: <select class="pb-sel" style="max-width:64px" onchange="pbSetPriority('${p.id}',this.value)" onclick="event.stopPropagation()">
          ${['','Normal','High','Low'].map(x=>`<option value="${x}" ${b.priority===x?'selected':''}>${x||'—'}</option>`).join('')}
        </select>
      </div>
      <div class="pb-badges">
        <span class="pb-badge">⏱ ${pbFmtDur(secs)} in stage</span>
        ${late?'<span class="pb-badge late">Overdue</span>':''}
        ${b.priority==='High'?'<span class="pb-badge pri-High">High priority</span>':''}
        ${b.waiting?`<span class="pb-badge wait">⏸ Waiting · ${reasonLbl} · ${pbFmtDur(waitSecs)}</span>`:''}
      </div>
      <div class="pb-actions">
        ${b.waiting?`<button class="pb-btn" onclick="pbResume('${p.id}')">▶ Resume</button>`
                   :`<button class="pb-btn" onclick="pbOpenWait('${p.id}')">⏸ Wait</button>`}
        ${img?`<button class="pb-btn" onclick="pbAddPhoto('${p.id}')">📷</button>`:''}
      </div>
    </div></div>`;
}
// ── drag & drop ──
function pbDragStart(e,pid){pbDrag=pid;e.dataTransfer.effectAllowed='move';}
function pbOver(e){e.preventDefault();e.currentTarget.classList.add('pb-over');}
function pbLeave(e){e.currentTarget.classList.remove('pb-over');}
function pbDrop(e,stage){
  e.preventDefault();e.currentTarget.classList.remove('pb-over');
  const pid=pbDrag;pbDrag=null;
  if(!pid)return;
  const cur=pbStageOf(pid);
  if(cur===stage)return;
  const goingBack=PB_IDX[stage]<PB_IDX[cur];
  if(goingBack||stage==='issues'){pbOpenReason(pid,stage,goingBack?'backward':'forward');return;}
  pbMove(pid,stage,'forward',null,null);
}
// ── reason modal (backward moves + waiting) ──
function pbReasonOpts(){return pbReasons.map(r=>`<option value="${r.code}">${r.label}</option>`).join('');}
function pbOpenReason(pid,stage,kind){
  const p=projects.find(x=>x.id===pid);
  const isIssues=stage==='issues'&&kind==='forward';
  pbModal(`<div style="padding:14px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:600">${isIssues?'⚠ Moving '+(p?.name||'')+' to Issues':'↩ Moving '+(p?.name||'')+' backward'}</div>
    <div style="padding:14px 16px">
      <div style="font-size:12px;color:#666;margin-bottom:10px">${PB_STAGES[PB_IDX[pbStageOf(pid)]].label} → <b>${PB_STAGES[PB_IDX[stage]].label}</b>. A reason is required.</div>
      <label style="font-size:11px;font-weight:600">Reason *</label>
      <select id="pb-reason" style="width:100%;font-size:13px;padding:7px;border:1px solid #d4d4d4;border-radius:8px;margin:4px 0 10px;font-family:var(--font)"><option value="">Select…</option>${pbReasonOpts()}</select>
      <label style="font-size:11px;font-weight:600">Notes (optional)</label>
      <textarea id="pb-notes" rows="2" style="width:100%;font-size:12px;padding:7px;border:1px solid #d4d4d4;border-radius:8px;margin-top:4px;font-family:var(--font)"></textarea>
    </div>
    <div style="padding:12px 16px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end">
      <button style="${PB_BTN}" onclick="pbCloseModal()">Cancel</button>
      <button style="${PB_BTNP}" onclick="pbConfirmBack('${pid}','${stage}','${kind}')">${isIssues?'Move to Issues':'Move backward'}</button></div>`);
}
function pbConfirmBack(pid,stage,kind){
  const code=document.getElementById('pb-reason').value;
  if(!code){document.getElementById('pb-reason').style.borderColor='#dc2626';return;}
  const notes=document.getElementById('pb-notes').value.trim()||null;
  pbCloseModal();
  pbMove(pid,stage,kind==='forward'?'forward':'backward',code,notes);
}
function pbOpenWait(pid){
  const p=projects.find(x=>x.id===pid);
  pbModal(`<div style="padding:14px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:600">⏸ Pause ${p?.name||''}</div>
    <div style="padding:14px 16px">
      <div style="font-size:12px;color:#666;margin-bottom:10px">Stays in <b>${PB_STAGES[PB_IDX[pbStageOf(pid)]].label}</b> — the clock switches to waiting time. A reason is required.</div>
      <label style="font-size:11px;font-weight:600">Waiting on *</label>
      <select id="pb-reason" style="width:100%;font-size:13px;padding:7px;border:1px solid #d4d4d4;border-radius:8px;margin:4px 0 10px;font-family:var(--font)"><option value="">Select…</option>${pbReasonOpts()}</select>
      <label style="font-size:11px;font-weight:600">Notes (optional)</label>
      <textarea id="pb-notes" rows="2" style="width:100%;font-size:12px;padding:7px;border:1px solid #d4d4d4;border-radius:8px;margin-top:4px;font-family:var(--font)"></textarea>
    </div>
    <div style="padding:12px 16px;border-top:1px solid #eee;display:flex;gap:8px;justify-content:flex-end">
      <button style="${PB_BTN}" onclick="pbCloseModal()">Cancel</button>
      <button style="${PB_BTNP}" onclick="pbConfirmWait('${pid}')">Pause</button></div>`);
}
async function pbConfirmWait(pid){
  const code=document.getElementById('pb-reason').value;
  if(!code){document.getElementById('pb-reason').style.borderColor='#dc2626';return;}
  const notes=document.getElementById('pb-notes').value.trim()||null;
  pbCloseModal();
  const b=await pbEnsureRow(pid);if(!b)return;
  const now=new Date().toISOString();
  const{error}=await sb.from('production_board').update({waiting:true,waiting_reason:code,waiting_notes:notes,waiting_since:now,updated_by:currentUserName,updated_at:now}).eq('project_id',pid);
  if(error){showToast('⚠ '+error.message);return;}
  Object.assign(b,{waiting:true,waiting_reason:code,waiting_notes:notes,waiting_since:now});
  await pbLog(pid,b.stage,b.stage,'waiting',code,notes,null);
  showToast('⏸ Paused — waiting on '+((pbReasons.find(r=>r.code===code)||{}).label||code));
  pbRender();
}
async function pbResume(pid){
  const b=pbBoard[pid];if(!b||!b.waiting)return;
  const waitedSecs=b.waiting_since?Math.round((Date.now()-new Date(b.waiting_since).getTime())/1000):null;
  const now=new Date().toISOString();
  const{error}=await sb.from('production_board').update({waiting:false,waiting_reason:null,waiting_notes:null,waiting_since:null,updated_by:currentUserName,updated_at:now}).eq('project_id',pid);
  if(error){showToast('⚠ '+error.message);return;}
  Object.assign(b,{waiting:false,waiting_reason:null,waiting_notes:null,waiting_since:null});
  await pbLog(pid,b.stage,b.stage,'resumed',null,null,waitedSecs);
  showToast('▶ Resumed — back in '+PB_STAGES[PB_IDX[b.stage]].label);
  pbRender();
}
// ── the single move handler: board row + history + milestone sync ──
async function pbEnsureRow(pid){
  if(pbBoard[pid])return pbBoard[pid];
  const stage=pbStageOf(pid);
  const{data,error}=await sb.from('production_board').insert({project_id:pid,stage,updated_by:currentUserName}).select().single();
  if(error){showToast('⚠ '+error.message);return null;}
  pbBoard[pid]=data;return data;
}
async function pbMove(pid,toStage,moveType,reasonCode,notes){
  const b=await pbEnsureRow(pid);if(!b)return;
  if(b.waiting){showToast('Resume from Waiting before moving stages');pbRender();return;}
  const fromStage=b.stage;
  const secs=pbSecsInStage(pid);
  const now=new Date().toISOString();
  const{error}=await sb.from('production_board').update({stage:toStage,stage_entered_at:now,updated_by:currentUserName,updated_at:now}).eq('project_id',pid);
  if(error){showToast('⚠ Move failed: '+error.message);return;}
  Object.assign(b,{stage:toStage,stage_entered_at:now});
  await pbLog(pid,fromStage,toStage,moveType,reasonCode,notes,secs);
  await pbSyncMilestones(pid,fromStage,toStage);
  const s=PB_STAGES[PB_IDX[toStage]];
  showToast((moveType==='backward'?'↩ ':'')+s.label+' ✓');
  pbRender();
}
async function pbLog(pid,from,to,type,code,notes,secs){
  const p=projects.find(x=>x.id===pid);
  const{error}=await sb.from('production_stage_history').insert({project_id:pid,so_number:p?.so_number||null,kiosk_name:p?.name||null,from_stage:from,to_stage:to,move_type:type,reason_code:code,notes,moved_by:currentUserName,seconds_in_prev_stage:secs});
  if(error)console.error('pbLog failed',error);
}
// Milestone sync — mark/unmark done + fill empty dates. Applies to every
// milestone row of the key (covers SO-split copies) so hub-wide status,
// health, and blockers derive correctly from ONE action.
async function pbSetKeyDone(pid,key,done,fillDate){
  for(const m of pbMsOf(pid,key)){
    if(done){
      if(!m.date&&fillDate){
        const{error}=await sb.from('milestones').update({date:isoD(new Date()),changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',m.id);
        if(!error)m.date=isoD(new Date());
      }
      if(!pbMsDone[m.id]){
        const{data,error}=await sb.from('milestone_done').insert({milestone_id:m.id,project_id:pid,marked_done:true,marked_by:currentUserName,marked_at:new Date().toISOString()}).select().single();
        if(error){showToast('⚠ Milestone sync: '+error.message);continue;}
        if(data)pbMsDone[m.id]=data;
      }
    } else if(pbMsDone[m.id]){
      const{error}=await sb.from('milestone_done').delete().eq('milestone_id',m.id);
      if(error){showToast('⚠ Milestone reopen: '+error.message);continue;}
      delete pbMsDone[m.id];
    }
  }
}
async function pbSyncMilestones(pid,from,to){
  const fi=PB_IDX[from],ti=PB_IDX[to];
  if(ti>fi){ // forward — complete everything the new stage implies
    if(ti>=PB_IDX.wip)await pbSetKeyDone(pid,'production-start',true,true);
    if(ti>=PB_IDX.ready_qa){await pbSetKeyDone(pid,'production-end',true,true);
      // QA milestone starts: fill its date if empty, but QA marks it done themselves
      for(const m of pbMsOf(pid,'quality-start')){if(!m.date){const{error}=await sb.from('milestones').update({date:isoD(new Date()),changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',m.id);if(!error)m.date=isoD(new Date());}}
    }
    if(ti>=PB_IDX.shipped)await pbSetKeyDone(pid,'shipping',true,true);
  } else { // backward — reopen what the departed stages had completed
    if(ti<PB_IDX.shipped)await pbSetKeyDone(pid,'shipping',false,false);
    if(ti<PB_IDX.ready_qa)await pbSetKeyDone(pid,'production-end',false,false);
    if(ti<PB_IDX.wip)await pbSetKeyDone(pid,'production-start',false,false);
  }
}
// ── owner / priority / kickoff photo ──
async function pbSetOwner(pid,owner){
  const b=await pbEnsureRow(pid);if(!b)return;
  const{error}=await sb.from('production_board').update({owner:owner||null,updated_by:currentUserName,updated_at:new Date().toISOString()}).eq('project_id',pid);
  if(error){showToast('⚠ '+error.message);return;}
  b.owner=owner||null;showToast('Owner saved ✓');pbRender();
}
async function pbSetPriority(pid,pri){
  const b=await pbEnsureRow(pid);if(!b)return;
  const{error}=await sb.from('production_board').update({priority:pri||null,updated_by:currentUserName,updated_at:new Date().toISOString()}).eq('project_id',pid);

// Kick-off photo: real file upload to the 'kickoff' Storage bucket, with
// URL-paste kept as a fallback. Images are downscaled client-side (max
// 1600px, JPEG) so floor tablets on wifi upload fast and cards load fast.
const PB_BUCKET='kickoff';
function pbAddPhoto(pid){
  pbModal(`<div style="padding:14px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:600">📷 Kick-off screenshot</div>

function pbUpStatus(msg){const el=document.getElementById('pb-up-status');if(el){el.style.display='block';el.textContent=msg;}}
async function pbUploadFile(pid,file){
  if(!file)return;
  if(!/^image\//.test(file.type)){pbUpStatus('That file is not an image.');return;}
  try{
    pbUpStatus('Preparing image…');
    const blob=await pbShrinkImage(file);
    const path=pid+'/'+Date.now()+'.jpg';
    pbUpStatus('Uploading…');
    const{error:upErr}=await sb.storage.from(PB_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(upErr){
      if(/bucket.*not.*found|not found/i.test(upErr.message||'')){
        pbUpStatus('⚠ Storage bucket "'+PB_BUCKET+'" not found — create it in Supabase (Storage → New bucket → name: kickoff → Public) then retry. URL-paste below still works meanwhile.');
      }else{
        pbUpStatus('⚠ Upload failed: '+upErr.message);
      }
      return;
    }
    const{data:pub}=sb.storage.from(PB_BUCKET).getPublicUrl(path);
    const url=pub?.publicUrl;
    if(!url){pbUpStatus('⚠ Uploaded but could not get a public URL — is the bucket set to Public?');return;}
    pbCloseModal();
    await pbSavePhotoUrl(pid,url);
  }catch(e){pbUpStatus('⚠ '+(e.message||'Upload failed'));}
}
// Downscale to max 1600px on the long edge and re-encode as JPEG ~0.85.
// A 12MB phone screenshot becomes ~200-400KB without visible quality loss on a card.
function pbShrinkImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1600;
      let{width:w,height:h}=img;
      if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>b?resolve(b):reject(new Error('Could not process image')),'image/jpeg',0.85);
    };
    img.onerror=()=>reject(new Error('Could not read image'));
    img.src=URL.createObjectURL(file);
  });
}

async function procLoad(){

// ── derived logic ──
function procMsOf(pid,key){return milestones.filter(m=>m.project_id===pid&&m.key===key&&m.date).sort((a,b)=>a.date.localeCompare(b.date));}
function procMoReleased(p){
  const mo=milestones.filter(m=>m.project_id===p.id&&m.key==='mo-release');
  return mo.some(m=>procMsDoneMap[m.id]||(m.date&&daysDiff(m.date)<=0));
}
function procPosFor(p){
  const sos=procSoListOf(p);
  const ids=new Set(procLinks.filter(l=>l.project_id===p.id||(l.so_number&&sos.includes(l.so_number))).map(l=>l.po_id));
  return procPos.filter(x=>ids.has(x.id)&&x.status!=='cancelled');
}
function procUncoveredSOs(p){
  const covered=new Set(procLinks.filter(l=>l.so_number).map(l=>l.so_number));
  return procSoListOf(p).filter(so=>!covered.has(so)&&procSoStatus[so]?.status!=='no-po-needed'&&!procSoClosed(so,p));
}
function procStatus(p){
  const list=procPosFor(p);
  if(!list.length){
    const sos=procSoListOf(p);
    if(sos.length&&procUncoveredSOs(p).length===0)return{key:'inventory',label:'📦 From inventory — no PO needed',bg:'var(--success-bg)',fg:'var(--success)'};
    return procMoReleased(p)?{key:'needs-po',label:'🔥 Needs POs',bg:'var(--red-light)',fg:'var(--red)'}:{key:'not-started',label:'Not started',bg:'var(--gray-100)',fg:'var(--gray-500)'};
  }
  const open=list.filter(x=>x.status!=='received');
  const late=open.filter(x=>x.eta&&daysDiff(x.eta)<0);
  if(late.length)return{key:'late',label:'🚨 Vendor late ('+late.length+')',bg:'var(--red-light)',fg:'var(--red)'};
  if(!open.length)return{key:'ready',label:'✅ Ready for Inventory',bg:'var(--success-bg)',fg:'var(--success)'};
  if(list.some(x=>x.status==='partial'))return{key:'partial',label:'Partial received',bg:'var(--warning-bg)',fg:'var(--warning)'};
  if(list.every(x=>x.odoo_status==='rfq'))return{key:'rfq',label:'RFQ — cost pending',bg:'#f3e8ff',fg:'#7c3aed'};
  return{key:'waiting',label:'Waiting vendor',bg:'var(--blue-bg)',fg:'var(--blue)'};
}
function procHealth(p){
  const list=procPosFor(p);if(!list.length)return null;
  const recv=list.filter(x=>x.status==='received').length;
  const late=list.filter(x=>x.status!=='received'&&x.eta&&daysDiff(x.eta)<0).length;
  return Math.max(0,Math.round(recv/list.length*100)-late*10);
}
function procProdStart(p){return procMsOf(p.id,'production-start')[0]?.date||null;}
function procShipDate(p){return procMsOf(p.id,'shipping')[0]?.date||null;}
// ── queue ──
function procQueue(){
  const q=(document.getElementById('proc-qsearch')?.value||'').toLowerCase();
  return projects.map(p=>({p,st:procStatus(p),ps:procProdStart(p)}))
    .filter(x=>{
      if(procQF==='mo'&&!procMoReleased(x.p))return false;
      if(procQF==='attn'&&!['needs-po','late'].includes(x.st.key)&&procReadiness[x.p.id]?.stoplight!=='red')return false;
      if(q&&!((x.p.name||'').toLowerCase().includes(q)||(x.p.so_number||'').toLowerCase().includes(q)||(x.p.pm||'').toLowerCase().includes(q)))return false;
      return true;
    })
    .sort((a,b)=>{
      const pr={critical:0,high:1,normal:2};
      const pd=(pr[a.p.priority]??2)-(pr[b.p.priority]??2);if(pd)return pd;
      // Actionable first: upcoming production (soonest first), then recently
      // overdue (most recent first), then no-date, then stale (>60d past) last.
      const rank=x=>{const d=x.ps?daysDiff(x.ps):null;
        if(d===null)return[2,0];
        if(d>=0)return[0,d];
        if(d>=-60)return[1,-d];
        return[3,-d];};
      const[ra,va]=rank(a),[rb,vb]=rank(b);
      return ra-rb||va-vb;
    });
}

// ── 🧾 SALES ORDERS VIEW — one row per SO, assign POs, mark inventory ──
// ── MILESTONE SYNC — PO reality drives the hub's procurement milestones ──
// Forward-only, exactly like production check-ins: auto-marks 'PO Release' /
// 'Parts ordering start' when POs exist, and 'Parts arrival' when everything
// is received (or fulfilled from inventory). Never un-marks anything.
async function procSyncMilestones(){
  const soPos=so=>procLinks.filter(l=>l.so_number===so).map(l=>procPos.find(x=>x.id===l.po_id)).filter(x=>x&&x.status!=='cancelled');
  const soNoPo=so=>procSoStatus[so]?.status==='no-po-needed';
  const inserts=[];
  projects.forEach(p=>{
    const allSos=procSoListOf(p);if(!allSos.length)return;
    const scopeOf=m=>m.so_tag?[m.so_tag]:allSos;
    const orderedOK=sos=>sos.length>0&&(sos.some(so=>soPos(so).length>0)||sos.every(soNoPo));
    const arrivedOK=sos=>sos.length>0&&sos.every(so=>{const ps=soPos(so);return ps.length?ps.every(x=>x.status==='received'):soNoPo(so);});
    milestones.filter(m=>m.project_id===p.id&&!procMsDoneMap[m.id]).forEach(m=>{
      const lbl=(m.label||'').toLowerCase();
      const isOrderMs=m.key==='po-release'||(m.key==='arrival'&&lbl.includes('ordering'));
      const isArriveMs=m.key==='arrival'&&lbl.includes('arrival');
      if(!isOrderMs&&!isArriveMs)return;
      const sos=scopeOf(m);
      if((isOrderMs&&orderedOK(sos))||(isArriveMs&&arrivedOK(sos))){
        inserts.push({milestone_id:m.id,project_id:p.id,marked_by:(currentUserName||'Procurement')+' · auto'});
      }
    });
  });
  if(!inserts.length)return;
  try{
    const{data,error}=await sb.from('milestone_done').insert(inserts).select();
    if(error)return;
    (data||inserts).forEach(d=>procMsDoneMap[d.milestone_id]=d);
    await procLog('auto-marked milestones from PO data',inserts.length+' milestone'+(inserts.length!==1?'s':'')+' done',null,null,String(inserts.length));
    showToast('🔗 '+inserts.length+' milestone'+(inserts.length!==1?'s':'')+' auto-marked done in the hub ✓');
  }catch(e){}
}
// Mirror the procurement readiness stoplight onto the project's open
// procurement milestone so hub health / escalation logic sees it.
async function procMirrorStoplight(pid,color,reason){
  try{
    const target=milestones
      .filter(m=>m.project_id===pid&&!procMsDoneMap[m.id]&&((m.key==='arrival'&&(m.label||'').toLowerCase().includes('arrival'))||m.key==='po-release'))
      .sort((a,b)=>((a.key==='arrival')?0:1)-((b.key==='arrival')?0:1))[0];
    if(!target)return;
    const now=new Date().toISOString();
    const payload={stoplight:color,notes:reason||null,stoplight_by:currentUserName,stoplight_at:now,dept:'Procurement',updated_at:now};
    const{data:ex}=await sb.from('checkin_status').select('id').eq('milestone_id',target.id).limit(1);
    if(ex&&ex.length)await sb.from('checkin_status').update(payload).eq('milestone_id',target.id);
    else await sb.from('checkin_status').insert({milestone_id:target.id,project_id:pid,checked:false,...payload});
  }catch(e){}
}
const PROC_CLOSED_KEYS=['production-end','quality-start','quality-end','final-qc','uat','vinyl','shipping','delivery','installation','training','uninstallation'];
function procSoClosed(so,p){
  // Procurement is over for this SO if production is done or anything after it is:
  // a post-production milestone is marked done, or delivery/installation date has passed.
  const ms=milestones.filter(m=>m.project_id===p.id&&(!m.so_tag||m.so_tag===so));
  return ms.some(m=>{
    if(!PROC_CLOSED_KEYS.includes(m.key))return false;
    if(procMsDoneMap[m.id])return true;
    if((m.key==='delivery'||m.key==='installation')&&m.date&&daysDiff(m.date)<0)return true;
    return false;
  });
}
function procAllSOs(){
  const out=[];
  projects.forEach(p=>{
    const ps=procProdStart(p);const d=ps?daysDiff(ps):null;
    procSoListOf(p).forEach(so=>{
      const links=procLinks.filter(l=>l.so_number===so);
      const poList=links.map(l=>procPos.find(x=>x.id===l.po_id)).filter(x=>x&&x.status!=='cancelled');
      const st=procSoStatus[so];
      out.push({so,p,d,pos:poList,noPo:st?.status==='no-po-needed',stRow:st,closed:procSoClosed(so,p)});
    });
  });
  return out;
}

  const el=document.getElementById('proc-view-sos');if(!el)return;
  const all=procAllSOs();
  const uncovered=all.filter(x=>!x.pos.length&&!x.noPo&&!x.closed);
  const cntEl=document.getElementById('pvt-sos-cnt');if(cntEl)cntEl.textContent=uncovered.length?'('+uncovered.length+'⚠)':'';
  const q=(document.getElementById('proc-sos-search')?.value||'').toLowerCase();
  let list=all.filter(x=>{
    if(procSoFilter==='nopo'&&(x.pos.length||x.noPo||x.closed))return false;
    if(procSoFilter==='closed'&&!x.closed)return false;
    if(procSoFilter==='covered'&&!x.pos.length)return false;
    if(procSoFilter==='inv'&&!x.noPo)return false;
    if(q&&!(x.so.toLowerCase().includes(q)||(x.p.name||'').toLowerCase().includes(q)||(x.p.pm||'').toLowerCase().includes(q)||x.pos.some(po=>(po.po_number||'').toLowerCase().includes(q)||(po.vendor||'').toLowerCase().includes(q))))return false;

// ── ODOO DROP-IMPORTER ──
function odooToIso(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const s=String(v).trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  const d=new Date(s);return isNaN(d)?null:isoD(d);
}
function odooParseRows(rows){
  const keys=Object.keys(rows[0]||{});
  const col=(...names)=>keys.find(k=>names.some(n=>k.toLowerCase().replace(/[^a-z]/g,'').includes(n)));
  const C={po:col('orderreference','ponumber'),rso:col('relatedsalesorder'),vendor:col('vendor'),buyer:col('buyer'),deadline:col('orderdeadline'),src:col('sourcedocument'),total:col('total'),status:col('status'),shipped:col('isshipped'),eta:col('expectedarrival','expectedeta','eta')};
  if(!C.po)return{error:'Could not find an "Order Reference" column — is this the Odoo PO export?'};
  const out=[],skippedNoSo=[],seen=new Set();
  rows.forEach(r=>{
    const po=String(r[C.po]??'').trim();
    if(!po||seen.has(po))return;seen.add(po);
    const sos=new Set();
    const rso=C.rso?String(r[C.rso]??'').trim():'';
    if(rso&&rso.toLowerCase()!=='nan')rso.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>sos.add(s));
    const src=C.src?String(r[C.src]??''):'';
    (src.match(/S\d{4,6}/g)||[]).forEach(s=>sos.add(s));
    if(!sos.size){skippedNoSo.push(po);return;}
    const rawStatus=String(r[C.status]??'').toLowerCase();
    const shipped=C.shipped?[true,'true','1','yes'].includes(typeof r[C.shipped]==='boolean'?r[C.shipped]:String(r[C.shipped]??'').toLowerCase()):false;
    let status='open';
    if(rawStatus.includes('cancel'))status='cancelled';else if(shipped)status='received';
    out.push({po_number:po,vendor:C.vendor?String(r[C.vendor]??'').trim()||null:null,buyer:C.buyer?String(r[C.buyer]??'').trim()||null:null,odoo_status:rawStatus==='rfq'?'rfq':'purchase-order',status,order_date:C.deadline?odooToIso(r[C.deadline]):null,eta:C.eta?odooToIso(r[C.eta]):null,total:C.total&&r[C.total]!=null&&r[C.total]!==''?Number(r[C.total])||null:null,sos:[...sos]});
  });
  return{rows:out,skippedNoSo,hasEta:!!C.eta};
}

    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="proc-btn proc-btn-g" onclick="procCloseModal()">Cancel</button>
      <button class="proc-btn proc-btn-p" id="proc-impgo" onclick="procImpCommit()">Import ${res.rows.length} POs</button>

}
async function procImpCommit(){
  const res=_procImp;if(!res)return;
  const btn=document.getElementById('proc-impgo');btn.disabled=true;btn.textContent='Importing…';
  const byNum={};procPos.forEach(p=>{if(p.po_number)byNum[p.po_number]=p;});
  const lookup=procImpLookup();
  const nowIso=new Date().toISOString();const todayIso=nowIso.split('T')[0];
  const inserts=[],updates=[];
  res.rows.forEach(r=>{
    const ex=byNum[r.po_number];
    let status=r.status;
    if(ex&&ex.status==='received'&&status==='open')status='received';
    const rec={po_number:r.po_number,vendor:r.vendor,buyer:r.buyer,odoo_status:r.odoo_status,status,order_date:r.order_date,total:r.total,updated_at:nowIso};
    if(r.eta!==null||!ex)rec.eta=r.eta;
    if(status==='received'&&(!ex||ex.status!=='received'))rec.received_at=ex?.received_at||todayIso;
    if(ex){rec.id=ex.id;updates.push(rec);}
    else{rec.created_by=(currentUserName||'Import')+' · Odoo import';inserts.push(rec);}
  });
  const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
  try{
    for(const c of chunk(updates,200)){const{error}=await sb.from('procurement_po').upsert(c);if(error)throw error;}
    const insertedByNum={};
    for(const c of chunk(inserts,200)){
      const{data,error}=await sb.from('procurement_po').insert(c).select('id,po_number');if(error)throw error;
      (data||[]).forEach(d=>insertedByNum[d.po_number]=d.id);
    }
    const haveLink=new Set(procLinks.map(l=>l.po_id+'|'+(l.so_number||'')));
    const linkRows=[];
    res.rows.forEach(r=>{
      const poId=byNum[r.po_number]?.id||insertedByNum[r.po_number];if(!poId)return;
      r.sos.forEach(so=>{
        if(haveLink.has(poId+'|'+so))return;
        const pid=lookup[so.toUpperCase()]||null;
        linkRows.push({po_id:poId,so_number:so,project_id:pid,matched:!!pid});
      });
    });
    for(const c of chunk(linkRows,400)){const{error}=await sb.from('procurement_po_projects').insert(c);if(error)throw error;}
    await procLog('imported Odoo export',inserts.length+' new / '+updates.length+' updated POs',null,null,String(res.rows.length));
    procCloseModal();showToast(`📥 Imported: ${inserts.length} new · ${updates.length} updated · ${linkRows.length} SO links ✓`);
    await procLoad();await procSyncMilestones();procRenderQueue();procRenderMain(true);
  }catch(err){alert('Import stopped: '+err.message+'\n\nAlready-committed rows are saved; re-dropping the same file is safe (it updates, never duplicates).');btn.disabled=false;btn.textContent='Retry import';}
}

// Supabase caps queries at 1000 rows — milestones/POs/links exceed that.
// sbAll pages through in 1000-row chunks so nothing silently truncates.
async function sbAll(table,orderCol,desc,tiebreak='id'){
  const PAGE=1000;let all=[],from=0;
  while(true){
    let q=sb.from(table).select('*');
    if(orderCol)q=q.order(orderCol,{ascending:!desc});
    if(tiebreak&&tiebreak!==orderCol)q=q.order(tiebreak,{ascending:true});
    q=q.range(from,from+PAGE-1);
    const{data,error}=await q;
    if(error){console.warn('sbAll',table,error.message);return{data:all.length?all:null,error};}
    all=all.concat(data||[]);
    if(!data||data.length<PAGE)break;
    from+=PAGE;
  }
  return{data:all,error:null};
}
