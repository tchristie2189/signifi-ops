// ── UTILS ──────────────────────────────────────────────────
function today(){let t=new Date();t.setHours(0,0,0,0);return t;}
function monday(dt){let r=new Date(dt);let d=r.getDay();r.setDate(r.getDate()+(d===0?-6:1-d));r.setHours(0,0,0,0);return r;}
function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function isoD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function daysDiff(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-today())/86400000);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}

function getWeekRange(){
  const offsets={'this':0,'next':1,'2':2,'3':3};
  const base=monday(addD(today(),(offsets[currentWeek]||0)*7));
  return{start:base,end:addD(base,6)};
}

function showWeekTabs(){
  const isShipping=currentDept?.passcode==='ship2026';
  document.getElementById('wt-2').style.display=isShipping?'':'none';
  document.getElementById('wt-3').style.display=isShipping?'':'none';
  // If currently on week 2/3 but switched to non-shipping dept, reset to this week
  if(!isShipping&&(currentWeek==='2'||currentWeek==='3')){
    currentWeek='this';
    document.querySelectorAll('.wtab').forEach(b=>b.classList.remove('active'));
    document.getElementById('wt-this').classList.add('active');
  }
}

// ── LOGIN ──────────────────────────────────────────────────
function doCheckinLogin(){
  const pass=document.getElementById('ci-pass').value;
  const name=document.getElementById('ci-name').value.trim();
  const dept=DEPT_CONFIG[pass];
  if(!name){document.getElementById('login-err').textContent='Please enter your name.';document.getElementById('login-err').style.display='block';return;}
  if(!dept){
    document.getElementById('login-err').textContent='Incorrect passcode — try again.';
    document.getElementById('login-err').style.display='block';
    document.getElementById('ci-pass').value='';
    return;
  }
  currentDept={...dept,passcode:pass};
  currentUserName=name;
  sessionStorage.setItem('ci_pass',pass);
  sessionStorage.setItem('ci_name',name);
  document.getElementById('login-err').style.display='none';
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('main-wrap').style.display='block';
  // Show dept badge in header
  document.getElementById('dept-badge').innerHTML=`<span class="dept-pill" style="background:\${dept.color}20;color:\${dept.color};border:1px solid \${dept.color}40">\${dept.name}</span><button onclick="signOut()" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid #333;background:transparent;color:#888;cursor:pointer;font-family:var(--font)">Sign out</button>`;
  // Header greeting
  document.getElementById('ci-header').innerHTML=`
    <div style="font-size:18px;font-weight:600;margin-bottom:2px">Good ${getGreeting()}, ${name} 👋</div>
    <div style="font-size:12px;color:var(--gray-500)">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · ${dept.name}</div>`;
  if(pass==='proc2026'){procEnter();return;}  // Procurement gets its own workspace
  if(pass==='prod2026'){prodEnter();return;}  // Production gets the board — traffic-light flow removed for Production only
  showWeekTabs();
  loadCheckinData();
}
function getGreeting(){const h=new Date().getHours();return h<12?'morning':h<17?'afternoon':'evening';}

// ── DATA ──────────────────────────────────────────────────
async function loadCheckinData(){
  const[pr,ms,ci,ah,sod,ext]=await Promise.all([
    sbAll('projects','created_at'),
    sbAll('milestones','date'),
    sbAll('checkin_status'),
    sbAll('adhoc_schedule','created_at'),
    sbAll('so_details'),
    sb.from('extension_requests').select('*').eq('status','pending'),
  ]);
  projects=pr.data||[];
  milestones=ms.data||[];
  window._soDetails=sod.data||[];
  extensionRequests=ext.data||[];
  checkins={};
  (ci.data||[]).forEach(c=>{checkins[c.milestone_id]=c;});
  // Also index by adhoc id for ad hoc stoplights
  // Ad hoc items save under string keys (e.g. 'adhoc-ship-123') directly in
  // milestone_id (a text column, verified against schema) — so the normal
  // indexing line above restores them too. No separate adhoc_id column exists.
  window._adHocShipping=(ah.data||[]).filter(r=>r.dept==='shipping');
  window._adHocInstall=(ah.data||[]).filter(r=>r.dept==='installation');
  render();
}

function setWeek(w,el){
  currentWeek=w;
  document.querySelectorAll('.wtab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ─────────────────────────────────────────────────
// Maps milestone keys/labels to human-readable bucket names
const BUCKET_CFG=[
  {id:'shipping',   label:'Pick up',      icon:'📦', color:'#059669', keys:['shipping'],    labelMatch:[]},
  {id:'delivery',   label:'Deliveries',   icon:'🚚', color:'#2563eb', keys:['delivery'],    labelMatch:[]},
  {id:'installation',label:'Installations',icon:'🔧',color:'#db2777', keys:['installation'],labelMatch:[]},
  {id:'uninstallation',label:'Uninstallations',icon:'🔩',color:'#f43f5e', keys:['uninstallation'],labelMatch:[]},
  {id:'training',   label:'Training',     icon:'🎓', color:'#f59e0b', keys:['training'],    labelMatch:[]},
  {id:'prod-start', label:'Prod Start',   icon:'🏭', color:'#7c3aed', keys:['production-start'],labelMatch:[]},
  {id:'prod-end',   label:'Prod End',     icon:'✅', color:'#7c3aed', keys:['production-end'],  labelMatch:[]},
  {id:'qa-start',   label:'QA Start',     icon:'🔍', color:'#d97706', keys:['quality-start'],   labelMatch:[]},
  {id:'qa-end',     label:'QA End',       icon:'✅', color:'#d97706', keys:['quality-end'],     labelMatch:[]},
  {id:'final-qc',   label:'Final QC',     icon:'🔎', color:'#0891b2', keys:['final-qc'],        labelMatch:[]},
  {id:'vinyl',      label:'Vinyl',        icon:'🎨', color:'#2563eb', keys:['vinyl'],           labelMatch:[]},
  {id:'uat',        label:'UAT',          icon:'🖥',  color:'#16a34a', keys:['uat'],             labelMatch:[]},
  {id:'other',      label:'Other',        icon:'📌', color:'#6b6b6b', keys:['other','po-release','mo-release','arrival'],labelMatch:[]},
];

function getBucket(m){
  for(const b of BUCKET_CFG){
    if(b.keys.includes(m.key))return b;
    if(b.labelMatch.some(l=>(m.label||'').toLowerCase().includes(l.toLowerCase())))return b;
  }
  return BUCKET_CFG[BUCKET_CFG.length-1];
}

function render(){
  if(!currentDept)return;
  const{start,end}=getWeekRange();
  const dept=currentDept;

  const deptMilestones=milestones.filter(m=>{
    if(!m.date)return false;
    // A scheduled milestone can still belong to a project marked complete/archived.
    // Keep those projects loaded so Shipping/Check-in can resolve the project name,
    // but suppress truly orphaned milestone rows instead of rendering a blank card.
    if(!m.project_id||!projects.some(p=>p.id===m.project_id))return false;
    const d=new Date(m.date+'T00:00:00');
    if(d<start||d>end)return false;
    if(dept.milestoneKeys.includes(m.key))return true;
    if(dept.labelMatch){return dept.labelMatch.some(lbl=>(m.label||'').toLowerCase().includes(lbl.toLowerCase()));}
    return false;
  });

  const adHocItems=[];
  if(dept.passcode==='ship2026'){
    (window._adHocShipping||[]).forEach(r=>{
      if(!(r.name||'').trim())return;
      const d=r.ship_date||'';if(!d)return;
      const dt=new Date(d+'T00:00:00');
      if(dt>=start&&dt<=end)adHocItems.push({_id:'adhoc-ship-'+r.id,_adhoc:true,key:'shipping',label:r.name,date:d,so:r.so||'',client:r.client||'',status:r.status||'',_ticketUrl:r.install_ticket_url||''});
    });
  }
  if(dept.passcode==='deploy2026'){
    (window._adHocInstall||[]).forEach(r=>{
      if(!(r.name||'').trim())return;
      const d=r.install_date||'';if(!d)return;
      const dt=new Date(d+'T00:00:00');
      if(dt>=start&&dt<=end)adHocItems.push({_id:'adhoc-inst-'+r.id,_adhoc:true,key:'installation',label:r.name,date:d,so:r.so||'',client:r.client||'',status:r.status||'',_ticketUrl:r.install_ticket_url||''});
    });
  }

  // Deduplicate SO-split milestones smartly:
  // — Same label + same date = collapse to one row (undifferentiated SOs, no point showing 6 identical rows)
  // — Same label + different date = keep separate (each SO ships/delivers on its own day)
  const dedupedMs=[];
  const seenByProj={};
  [...deptMilestones].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>{
    const k=m.project_id+'|'+m.label+'|'+(m.date||'');
    if(!seenByProj[k]){seenByProj[k]=true;dedupedMs.push(m);}
  });

  // All items for summary counts and all-clear
  const allItems=[...dedupedMs,...adHocItems];
  window._currentCheckinItems=allItems;
  let greens=0,yellows=0,reds=0;
  allItems.forEach(m=>{const id=m._id||m.id;const ci=checkins[id];if(ci?.stoplight==='green')greens++;else if(ci?.stoplight==='yellow')yellows++;else if(ci?.stoplight==='red')reds++;});

  document.getElementById('summary-bar').innerHTML=allItems.length?`
    <div class="summary-bar">
      <div><div class="sb-val sb-green">${greens}</div><div class="sb-label">On track</div></div>
      <div><div class="sb-val sb-yellow">${yellows}</div><div class="sb-label">In trouble</div></div>
      <div><div class="sb-val sb-red">${reds}</div><div class="sb-label">Escalation</div></div>
    </div>`:'';

  const pendingForDept=extensionRequests.filter(r=>r.dept===dept.name&&r.status==='pending').length;
  const unchecked=allItems.filter(m=>!checkins[m._id||m.id]?.checked).length;
  const attention=[];
  if(reds)attention.push(`<span style="color:#b91c1c;font-weight:700">🔴 ${reds} escalation${reds===1?'':'s'}</span>`);
  if(yellows)attention.push(`<span style="color:#a16207;font-weight:700">🟡 ${yellows} in trouble</span>`);
  if(unchecked)attention.push(`<span style="color:#374151;font-weight:600">☐ ${unchecked} not checked in</span>`);
  if(pendingForDept)attention.push(`<span style="color:#7c3aed;font-weight:700">⏳ ${pendingForDept} extension request${pendingForDept===1?'':'s'} pending</span>`);
  document.getElementById('attention-summary').innerHTML=attention.length?`<div style="background:white;border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1rem"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);margin-bottom:6px">Needs attention</div><div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">${attention.join('')}</div></div>`:'';

  const fmtRange=(s,e)=>fmt(isoD(s))+' – '+fmt(isoD(e));
  const thisBase=monday(today());
  document.getElementById('wt-this').textContent='This week  '+fmtRange(thisBase,addD(thisBase,4));
  document.getElementById('wt-next').textContent='Next week  '+fmtRange(monday(addD(today(),7)),addD(monday(addD(today(),7)),4));
  document.getElementById('wt-2').textContent='Week 3  '+fmtRange(monday(addD(today(),14)),addD(monday(addD(today(),14)),4));
  document.getElementById('wt-3').textContent='Week 4  '+fmtRange(monday(addD(today(),21)),addD(monday(addD(today(),21)),4));
  showWeekTabs();

  const ciContent=document.getElementById('ci-content');
  if(!allItems.length){ciContent.innerHTML=`<div class="empty"><div class="empty-icon">🎉</div>No ${dept.name} items this ${currentWeek==='this'?'week':'next week'}.<br>Check next week!</div>`;return;}

  // Bucket all items by type
  const buckets={};
  allItems.forEach(m=>{
    const b=getBucket(m);
    if(!buckets[b.id])buckets[b.id]={...b,items:[]};
    buckets[b.id].items.push(m);
  });
  // Sort items within each bucket by date
  Object.values(buckets).forEach(b=>b.items.sort((a,z)=>(a.date||'').localeCompare(z.date||'')));

  // Render bucketed sections
  const sectionsHtml=Object.values(buckets).map(bucket=>{
    const rowsHtml=bucket.items.map(m=>ciRow(m._id||m.id,m,dept,bucket)).join('');
    const allDone=bucket.items.every(m=>{const ci=checkins[m._id||m.id];return ci?.checked&&ci?.stoplight==='green';});
    const hasRed=bucket.items.some(m=>checkins[m._id||m.id]?.stoplight==='red');
    const hasYellow=bucket.items.some(m=>checkins[m._id||m.id]?.stoplight==='yellow');
    const sectionStatus=allDone?'✅':hasRed?'🔴':hasYellow?'🟡':'';
    return`<div style="margin-bottom:1.25rem">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:15px">${bucket.icon}</span>
        <span style="font-size:13px;font-weight:700;color:var(--black)">${bucket.label}</span>
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:${bucket.color}18;color:${bucket.color}">${bucket.items.length}</span>
        ${sectionStatus?`<span style="font-size:13px;margin-left:2px">${sectionStatus}</span>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">${rowsHtml}</div>
    </div>`;
  }).join('');

  ciContent.innerHTML=sectionsHtml;
}

function ciRow(id,m,dept,bucket){
  window._ciItemMap[id]=m;
  const ci=checkins[id]||{};
  const d=daysDiff(m.date);
  const isChecked=ci.checked||false;
  const stoplight=ci.stoplight||'';
  const safeId=id.replace(/[^a-zA-Z0-9]/g,'_');

  // Date badge
  const dateBg=d<0?'#fee2e2':d===0?'#dcfce7':d<=2?'#eff6ff':'#f1f5f9';
  const dateColor=d<0?'#991b1b':d===0?'#166534':d<=2?'#1d4ed8':'#475569';
  const dateLabel=d<0?`${Math.abs(d)}d overdue`:d===0?'Today':d===1?'Tomorrow':fmt(m.date);

  // Project info
  const proj=m._adhoc?null:projects.find(p=>p.id===m.project_id);
  const projName=proj?proj.name:(m._adhoc?m.label:'—');
  // For SO-split rows show the specific SO tag (the one this milestone belongs to),
  // not all SOs on the project — each row is now its own individual SO
  const soDisplay=m._adhoc?(m.so||''):m.so_tag||(proj?.so_number||'');
  const pmDisplay=proj?.pm||'';
  const soDetail=(!m._adhoc&&m.so_tag)?(window._soDetails||[]).find(x=>x.project_id===m.project_id&&x.so_tag===m.so_tag):null;
  const namingDisplay=soDetail?.naming_convention||proj?.naming_convention||'';

  // Stoplight border accent
  const borderColor=stoplight==='green'?'#22c55e':stoplight==='yellow'?'#eab308':stoplight==='red'?'#ef4444':'#e2e8f0';

  // Install ticket
  const isShipping=dept.passcode==='ship2026';
  const isDeployment=dept.passcode==='deploy2026';
  let _ticketUrl='';
  if(m._adhoc){_ticketUrl=m._ticketUrl||'';}
  else if(isShipping||isDeployment){
    const _soTag=m.so_tag||null;
    const _soDet=_soTag?(window._soDetails||[]).find(x=>x.project_id===m.project_id&&x.so_tag===_soTag):null;
    _ticketUrl=_soDet?.install_ticket_url||projects.find(p=>p.id===m.project_id)?.install_ticket_url||'';
  }

  // Shipping status dropdown
  const shipStatusSel=isShipping?`<select onchange="const itm=window._ciItemMap['${id}'];if(itm)saveCheckinShipStatus(itm,this.value)" style="font-size:11px;padding:2px 8px;border:1px solid #d1d5db;border-radius:20px;font-family:var(--font);font-weight:600;cursor:pointer;background:white;color:#374151">${SHIP_STATUS_OPTS.map(o=>`<option value="${o}"${o===getCheckinShippingStatus(m)?' selected':''}>${o}</option>`).join('')}</select>`:'';

  return`<div style="background:white;border:1px solid ${borderColor};border-left:4px solid ${borderColor};border-radius:var(--radius-lg);padding:12px 14px;transition:border-color 0.15s">
    <!-- Top row: project name + date badge + actions -->
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px">
          <span style="font-size:13px;font-weight:600;color:var(--black)">${projName}${m._adhoc?` <span style="font-size:10px;background:var(--blue);color:white;padding:1px 5px;border-radius:6px;font-weight:600">Ad hoc</span>`:''}</span>
          ${soDisplay?`<span style="font-family:var(--mono);font-size:10px;color:var(--red);font-weight:600">${soDisplay}</span>`:''}
          ${pmDisplay?`<span style="font-size:10px;color:var(--gray-500);font-weight:600">PM: ${pmDisplay}</span>`:`<span style="font-size:10px;color:#b91c1c;font-weight:700">PM missing</span>`}
        </div>
        ${namingDisplay?`<div style="font-family:var(--mono);font-size:9px;color:var(--gray-500);margin-bottom:4px;overflow-wrap:anywhere">${namingDisplay}</div>`:(soDisplay?`<div style="font-size:9px;color:#a16207;font-weight:700;margin-bottom:4px">Naming convention missing</div>`:'')}
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${dateBg};color:${dateColor}">${dateLabel}</span>
          ${shipStatusSel}
          ${_ticketUrl?`<a href="${_ticketUrl}" target="_blank" rel="noopener" style="font-size:11px;color:var(--blue);font-weight:500;text-decoration:none;white-space:nowrap">🎫 Ticket ↗</a>`:''}
        </div>
      </div>
      <!-- Stoplights + done -->
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        <div class="stoplight">
          <div class="sl-btn sl-green${stoplight==='green'?' active':''}" title="On track" onclick="setStoplight('${id}','green',this)"></div>
          <div class="sl-btn sl-yellow${stoplight==='yellow'?' active':''}" title="In trouble" onclick="setStoplight('${id}','yellow',this)"></div>
          <div class="sl-btn sl-red${stoplight==='red'?' active':''}" title="Escalation" onclick="setStoplight('${id}','red',this)"></div>
        </div>
        <div class="ci-done${isChecked?' checked':''}" onclick="toggleCheck('${id}',this)" title="${isChecked?'Uncheck':'Mark done'}">${isChecked?'✓':''}</div>
      </div>
    </div>
    <!-- Notes row -->
    <div style="margin-top:8px">
      <textarea id="note-${safeId}" placeholder="Notes for the dashboard..." rows="1"
        style="width:100%;font-family:var(--font);font-size:11px;padding:5px 9px;border:1px solid #e5e7eb;border-radius:6px;resize:none;color:#374151;background:#f9fafb;line-height:1.5;transition:border-color 0.15s"
        onfocus="this.style.borderColor='#6b7280';this.rows=2;this.style.background='white'"
        onblur="this.style.borderColor='#e5e7eb';if(!this.value)this.rows=1;this.style.background=this.value?'white':'#f9fafb';saveInlineNote('${id}',this.value)">${(ci.notes||'').replace(/</g,'&lt;')}</textarea>
    </div>
  </div>`;
}

// ── ACTIONS ────────────────────────────────────────────────
let _pendingStoplight=null; // {milestoneId,color}
async function setStoplight(milestoneId,color,el){
  const existing=checkins[milestoneId];
  const newColor=existing?.stoplight===color?null:color; // toggle off if same
  if(newColor==='red'){
    // Red requires a note before saving
    _pendingStoplight={milestoneId,color:newColor};
    openNoteModal(milestoneId,true,newColor);
    return;
  }
  await applyStoplight(milestoneId,newColor,existing?.notes||null);
  showToast(newColor?`Marked ${newColor==='green'?'on track':'in trouble'}!`:'Status cleared');
}

async function applyStoplight(milestoneId,newColor,note){
  const existing=checkins[milestoneId];
  const now=new Date().toISOString();
  const payload={stoplight:newColor,notes:note||null,stoplight_by:newColor?currentUserName:null,stoplight_at:newColor?now:null,dept:currentDept.name,updated_at:now};
  if(existing){
    const{error}=await sb.from('checkin_status').update(payload).eq('milestone_id',milestoneId);
    if(error){showToast('⚠ Save failed: '+error.message);return;}
    checkins[milestoneId]={...existing,...payload};
  } else {
    const{data,error}=await sb.from('checkin_status').insert({milestone_id:milestoneId,project_id:milestones.find(m=>m.id===milestoneId)?.project_id,checked:false,...payload}).select().single();
    if(error){showToast('⚠ Save failed: '+error.message);return;}
    if(data)checkins[milestoneId]=data;
  }
  render();
}

function openNoteModal(milestoneId,required,color){
  _pendingStoplight={milestoneId,color:color||checkins[milestoneId]?.stoplight||null};
  document.getElementById('note-modal-title').textContent=required?'What\'s missing?':'Add a note';
  document.getElementById('note-modal-sub').textContent=required?'Let the team know what you\'re waiting on — this is required for an escalation.':'Optional context for the team.';
  document.getElementById('note-modal-text').value=checkins[milestoneId]?.notes||'';
  document.getElementById('note-modal-required').value=required?'1':'0';
  document.getElementById('note-modal-save').disabled=required;
  document.getElementById('note-modal-backdrop').style.display='flex';
  setTimeout(()=>document.getElementById('note-modal-text').focus(),50);
}

function closeNoteModal(cancelled){
  document.getElementById('note-modal-backdrop').style.display='none';
  document.getElementById('note-modal-text').value='';
  if(cancelled)_pendingStoplight=null;
}

async function saveNoteModal(){
  if(!_pendingStoplight)return;
  const note=document.getElementById('note-modal-text').value.trim();
  const required=document.getElementById('note-modal-required').value==='1';
  if(required&&!note)return; // guard, button should already be disabled
  const{milestoneId,color}=_pendingStoplight;
  await applyStoplight(milestoneId,color,note||null);
  closeNoteModal(false);
  showToast(color==='red'?'Escalation logged ⚠️':'Note saved ✓');
}

async function toggleCheck(milestoneId,el){
  const existing=checkins[milestoneId];
  const newVal=!(existing?.checked||false);
  const now=new Date().toISOString();
  const payload={checked:newVal,checked_by:newVal?currentUserName:null,checked_at:newVal?now:null,dept:currentDept.name,updated_at:now};
  if(existing){
    const{error}=await sb.from('checkin_status').update(payload).eq('milestone_id',milestoneId);
    if(error){showToast('⚠ Save failed: '+error.message);return;}
    checkins[milestoneId]={...existing,...payload};
  } else {
    const{data,error}=await sb.from('checkin_status').insert({milestone_id:milestoneId,project_id:milestones.find(m=>m.id===milestoneId)?.project_id,stoplight:null,...payload}).select().single();
    if(error){showToast('⚠ Save failed: '+error.message);return;}
    if(data)checkins[milestoneId]=data;
  }
  render();
  showToast(newVal?'Checked ✓':'Unchecked');
}

// ── ALL CLEAR (one tap = green + done on every item currently visible) ──────
async function markAllClear(){
  const items=window._currentCheckinItems||[];
  // Only touch items that aren't already green+done, AND skip anything already
  // flagged yellow/red — All Clear should never silently overwrite an active
  // escalation. Those still need to be resolved individually.
  const flagged=items.filter(m=>{
    const id=m._id||m.id;
    const ci=checkins[id];
    return ci?.stoplight==='yellow'||ci?.stoplight==='red';
  });
  const todo=items.filter(m=>{
    const id=m._id||m.id;
    const ci=checkins[id];
    if(ci?.stoplight==='yellow'||ci?.stoplight==='red')return false; // never auto-clear these
    return!(ci?.stoplight==='green'&&ci?.checked);
  });
  if(!todo.length){
    showToast(flagged.length?`${flagged.length} flagged item(s) need individual attention`:'Already all clear ✓');
    return;
  }
  const confirmMsg=flagged.length
    ?`Mark ${todo.length} item(s) as on track and done? (${flagged.length} flagged item${flagged.length>1?'s':''} will be left as-is — resolve ${flagged.length>1?'them':'it'} individually.)`
    :`Mark all ${todo.length} item(s) as on track and done?`;
  if(!confirm(confirmMsg))return;
  const now=new Date().toISOString();
  const failed=[];let okCount=0;
  for(const m of todo){
    const id=m._id||m.id;
    const existing=checkins[id];
    // Ad hoc items aren't real milestone rows — still keyed the same way in checkin_status via milestone_id (works as a free-text key here)
    const payload={stoplight:'green',checked:true,stoplight_by:currentUserName,stoplight_at:now,checked_by:currentUserName,checked_at:now,dept:currentDept.name,updated_at:now,notes:existing?.notes||null};
    if(existing){
      const{error}=await sb.from('checkin_status').update(payload).eq('milestone_id',id);
      if(error){failed.push(m.label||id);continue;}
      checkins[id]={...existing,...payload};
    } else {
      const{data,error}=await sb.from('checkin_status').insert({milestone_id:id,project_id:m.project_id||null,...payload}).select().single();
      if(error){failed.push(m.label||id);continue;}
      if(data)checkins[id]=data;
    }
    okCount++;
  }
  render();
  showToast(failed.length?`✅ ${okCount} marked clear · ⚠ ${failed.length} failed to save (${failed.slice(0,3).join(', ')}${failed.length>3?'…':''})`:`✅ ${okCount} item(s) marked all clear`);
}

// ── EXTENSION REQUESTS ───────────────────────────────────────────────────
function openExtensionModal(){
  const items=window._currentCheckinItems||[];
  const sel=document.getElementById('ext-item');
  if(!items.length){
    sel.innerHTML='<option value="">No items in your queue this week</option>';
  } else {
    sel.innerHTML=items.map(m=>{
      const id=m._id||m.id;
      const proj=projects.find(p=>p.id===m.project_id);
      const lbl=m._adhoc?m.label:(currentDept.labels[m.key]||m.label);
      const projName=proj?proj.name:(m._adhoc?m.label:'');
      const soTag=m.so_tag||'';
      return`<option value="${id}" data-projid="${m.project_id||''}" data-sotag="${soTag}">${projName}${soTag?' ('+soTag+')':''} — ${lbl}</option>`;
    }).join('');
  }
  document.getElementById('ext-days').value='1';
  document.getElementById('ext-reason').value='';
  document.getElementById('ext-modal-backdrop').style.display='flex';
}
function closeExtensionModal(){
  document.getElementById('ext-modal-backdrop').style.display='none';
}
async function submitExtensionRequest(){
  const sel=document.getElementById('ext-item');
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value){showToast('No item selected');return;}
  const days=parseInt(document.getElementById('ext-days').value)||0;
  const reason=document.getElementById('ext-reason').value.trim();
  if(days<1){showToast('Enter at least 1 day');return;}
  if(!reason){showToast('Please explain why — this gets logged for the PM');return;}
  const milestoneId=opt.value;
  const projId=opt.dataset.projid||null;
  const soTag=opt.dataset.sotag||null;
  const btn=document.getElementById('ext-submit-btn');
  btn.disabled=true;btn.textContent='Submitting...';
  const{error}=await sb.from('extension_requests').insert({
    project_id:projId,so_tag:soTag||null,milestone_id:milestoneId,
    dept:currentDept.name,requested_by:currentUserName,
    days,reason,status:'pending'
  });
  btn.disabled=false;btn.textContent='Submit request';
  if(error){showToast('⚠ Request failed to send: '+error.message);return;}
  closeExtensionModal();
  showToast('⏳ Request sent — PM will review the new timeline');
}

// ── SHIPPING STATUS (CHECKIN) ──────────────────────────────
const SHIP_STATUS_OPTS=['Pending','Scheduled','Picked up','Shipped','Delivered'];
function shipStatusChipCls(s){return s==='Delivered'?'chip-done':s==='Shipped'?'chip-atrisk':s==='Scheduled'?'chip-active':'chip-future';}
function getCheckinShippingStatus(m){
  if(m._adhoc){
    const r=(window._adHocShipping||[]).find(x=>'adhoc-ship-'+x.id===m._id);
    return r?.status||'Pending';
  }
  const soTag=m.so_tag||null;
  const proj=projects.find(p=>p.id===m.project_id);
  if(soTag){const soDet=(window._soDetails||[]).find(d=>d.project_id===m.project_id&&d.so_tag===soTag);if(soDet?.shipping_status)return soDet.shipping_status;}
  if(proj?.shipping_status)return proj.shipping_status;
  // Auto-compute from milestone state (checkin has milestone data)
  const shipMs=milestones.find(x=>x.project_id===m.project_id&&x.key==='shipping'&&(soTag?x.so_tag===soTag:true));
  const delivMs=milestones.find(x=>x.project_id===m.project_id&&x.key==='delivery'&&(soTag?x.so_tag===soTag:true));
  const isDone=(ms)=>ms&&checkins[ms.id]?.checked&&checkins[ms.id]?.stoplight==='green';
  if(delivMs&&isDone(delivMs))return'Delivered';
  if(shipMs&&isDone(shipMs))return'Shipped';
  if(shipMs&&shipMs.date)return'Scheduled';
  return'Pending';
}
async function saveCheckinShipStatus(m,status){
  if(m._adhoc){
    const ahId=m._id.replace('adhoc-ship-','');
    await sb.from('adhoc_schedule').update({status}).eq('id',ahId);
    const r=(window._adHocShipping||[]).find(x=>x.id==ahId);if(r)r.status=status;
  } else {
    const soTag=m.so_tag||null;
    if(soTag){
      const existing=(window._soDetails||[]).find(d=>d.project_id===m.project_id&&d.so_tag===soTag);
      if(existing){await sb.from('so_details').update({shipping_status:status,updated_at:new Date().toISOString()}).eq('id',existing.id);existing.shipping_status=status;}
      else{const{data}=await sb.from('so_details').insert({project_id:m.project_id,so_tag:soTag,shipping_status:status}).select().single();if(data)(window._soDetails||[]).push(data);}
    } else {
      await sb.from('projects').update({shipping_status:status}).eq('id',m.project_id);
      const p=projects.find(x=>x.id===m.project_id);if(p)p.shipping_status=status;
    }
  }
  render();
}
// Store current items for save callbacks
window._ciItemMap={};

async function saveInlineNote(milestoneId,note){
  const existing=checkins[milestoneId];
  const now=new Date().toISOString();
  const payload={notes:note||null,updated_at:now};
  if(existing){
    const{error}=await sb.from('checkin_status').update(payload).eq('milestone_id',milestoneId);
    if(error){showToast('⚠ Note failed to save: '+error.message);return;}
    checkins[milestoneId]={...existing,...payload};
  } else {
    const m=window._ciItemMap?.[milestoneId];
    const{data,error}=await sb.from('checkin_status').insert({
      milestone_id:milestoneId,project_id:m?.project_id||null,
      stoplight:null,checked:false,dept:currentDept?.name||'',
      ...payload
    }).select().single();
    if(error){showToast('⚠ Note failed to save: '+error.message);return;}
    if(data)checkins[milestoneId]=data;
  }
  // Don't re-render on blur to avoid losing focus mid-typing
}

if(savedPass&&savedName&&DEPT_CONFIG[savedPass]){
