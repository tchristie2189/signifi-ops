<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Signifi — Quality Overview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0066FF;--accent-soft:rgba(0,102,255,.08);--accent-border:rgba(0,102,255,.2);
  --green:#059669;--green-soft:rgba(5,150,105,.08);--green-border:rgba(5,150,105,.25);
  --red:#DC2626;--red-soft:rgba(220,38,38,.08);--red-border:rgba(220,38,38,.2);
  --amber:#D97706;--amber-soft:rgba(217,119,6,.08);--amber-border:rgba(217,119,6,.2);
  --bg:#F8F9FB;--surface:#fff;--surface2:#F3F4F6;--surface3:#E9EAEC;
  --border:#E5E7EB;--border2:#D1D3D7;--text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --shadow:0 1px 3px rgba(0,0,0,.07);--shadow-md:0 4px 12px rgba(0,0,0,.07);
  --radius:10px;--radius-sm:7px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}

nav{background:#fff;border-bottom:1px solid var(--border);padding:.625rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;z-index:300;box-shadow:var(--shadow)}
.nav-left{display:flex;align-items:center;gap:.875rem}
.logo-mark{width:26px;height:26px;background:#0066FF;border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:14px;height:14px}
.logo-text{font-size:.9rem;font-weight:700;color:var(--text)}
.nav-div{width:1px;height:18px;background:var(--border2)}
.nav-title{font-size:.8125rem;font-weight:600;color:var(--text2)}
.nav-links{display:flex;align-items:center;gap:.25rem}
.nav-link{padding:.375rem .75rem;border-radius:6px;font-size:.8125rem;font-weight:500;color:var(--text2);cursor:pointer;text-decoration:none;transition:all .15s;border:none;background:transparent;font-family:'DM Sans',sans-serif}
.nav-link:hover{background:var(--surface2);color:var(--text)}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{max-width:1100px;margin:0 auto;padding:1.75rem 1.25rem 3rem}
.page-title{font-size:1.375rem;font-weight:700;color:var(--text);margin-bottom:.25rem}
.page-sub{font-size:.875rem;color:var(--text2);line-height:1.6;margin-bottom:1.5rem}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1.75rem}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.875rem 1rem;box-shadow:var(--shadow)}
.stat-val{font-size:1.75rem;font-weight:700;font-family:'DM Mono',monospace;line-height:1;margin-bottom:.2rem}
.stat-lbl{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}

.sec{font-size:.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem;margin-top:1.75rem}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

.filter-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5rem .875rem;box-shadow:var(--shadow)}
.fl{font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.fdiv{width:1px;height:14px;background:var(--border2)}
select.fsel{background:#fff;color:var(--text);border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:.8125rem;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none}
select.fsel:focus{border-color:var(--accent)}
input.fsearch{background:#fff;color:var(--text);border:1px solid var(--border2);border-radius:5px;padding:4px 8px;font-size:.8125rem;font-family:'DM Sans',sans-serif;outline:none;flex:1;min-width:140px}
input.fsearch:focus{border-color:var(--accent)}
input.fsearch::placeholder{color:var(--text3)}

/* MISSING BY ROLE */
.role-panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.875rem}
.role-panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rp-head{padding:.875rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.rp-title{font-size:.9rem;font-weight:700;color:var(--text)}
.rp-badge{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:4px}
.rp-badge-red{background:var(--red-soft);color:var(--red)}
.rp-badge-green{background:var(--green-soft);color:var(--green)}
.rp-body{padding:.375rem 0;max-height:320px;overflow-y:auto}
.miss-row{padding:.45rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);transition:background .1s}
.miss-row:last-child{border-bottom:none}
.miss-row:hover{background:var(--surface2)}
.mr-info{flex:1;min-width:0}
.mr-client{font-size:.8rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-sub{font-size:.68rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-tags{display:flex;gap:.25rem;flex-shrink:0}
.tag{font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:3px}
.t-blue{background:var(--accent-soft);color:var(--accent)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-gray{background:var(--surface2);color:var(--text3)}
.t-red{background:var(--red-soft);color:var(--red)}
.all-clear{text-align:center;padding:1.5rem;color:var(--text3)}
.ac-icon{font-size:1.5rem;margin-bottom:.35rem}
.ac-txt{font-size:.8rem;font-weight:600;color:var(--green)}

/* COMPLETION TABLE */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
table.dtbl{border-collapse:collapse;width:100%;min-width:580px}
.dtbl th{background:var(--surface2);font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:.5rem .875rem;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}
.dtbl th.col-pm{color:var(--accent)}.dtbl th.col-log{color:var(--green)}.dtbl th.col-inst{color:var(--amber)}
.dtbl td{padding:.575rem .875rem;border-bottom:1px solid var(--border);vertical-align:middle;font-size:.8125rem}
.dtbl tbody tr:last-child td{border-bottom:none}
.dtbl tbody tr:hover td{background:var(--surface2)}
.td-client{font-weight:600;color:var(--text);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-sub{color:var(--text3);font-size:.7rem}
.role-dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700}
.dot-done{background:var(--green-soft);color:var(--green);border:1px solid var(--green-border)}
.dot-miss{background:var(--red-soft);color:var(--red);border:1px solid var(--red-border)}
.score-mono{font-family:'DM Mono',monospace;font-weight:700;font-size:.8rem}

.empty{text-align:center;padding:2rem 1.5rem}
.empty-icon{font-size:1.75rem;margin-bottom:.4rem}
.empty-title{font-size:.875rem;font-weight:600;color:var(--text2);margin-bottom:.2rem}
.empty-sub{font-size:.78rem;color:var(--text3)}

@media(max-width:700px){
  nav{padding:.5rem 1rem}.nav-title,.nav-div{display:none}
  main{padding:1rem}.role-panels{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>
  <div class="nav-left">
    <div class="logo-mark"><svg viewBox="0 0 16 16" fill="none"><polygon points="2,14 8,2 14,14" fill="white" opacity=".9"/></svg></div>
    <span class="logo-text">Signifi</span>
    <div class="nav-div"></div>
    <span class="nav-title">Quality Overview</span>
  </div>
  <div class="nav-links">
    <a class="nav-link" href="signifi-quality-today.html">📅 Today</a>
    <a class="nav-link" href="signifi-quality-check.html">✓ Quality Check</a>
    <a class="nav-link active" href="signifi-quality-overview.html">👁 Overview</a>
    <a class="nav-link" href="signifi-quality-dashboard.html">📊 Dashboard</a>
  </div>
</nav>

<main>
  <div class="page-title">Quality Overview</div>
  <p class="page-sub">Who hasn't filled out their section — by role, across all imported files.</p>

  <div class="filter-bar">
    <span class="fl">Week</span>
    <select class="fsel" id="weekFil" onchange="render()"><option value="all">All weeks</option></select>
    <div class="fdiv"></div>
    <span class="fl">Track</span>
    <select class="fsel" id="trackFil" onchange="render()">
      <option value="all">All</option>
      <option value="new">New Install</option>
      <option value="revisit">Revisit / Other</option>
    </select>
    <div class="fdiv"></div>
    <span class="fl">Table</span>
    <select class="fsel" id="statusFil" onchange="render()">
      <option value="all">All deployments</option>
      <option value="incomplete">Incomplete only</option>
      <option value="complete">Fully complete</option>
    </select>
    <div class="fdiv"></div>
    <input class="fsearch" id="searchBox" placeholder="Search client or ticket…" oninput="render()">
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="sec">Who still needs to fill out</div>
  <div class="role-panels" id="rolePanels"></div>

  <div class="sec">Completion by deployment</div>
  <div class="tbl-wrap">
    <table class="dtbl">
      <thead>
        <tr>
          <th>Client</th>
          <th>Ticket / Kiosk</th>
          <th>Track</th>
          <th>Week</th>
          <th class="col-pm">PM</th>
          <th class="col-log">Logistics</th>
          <th class="col-inst">Install</th>
          <th>Avg Score</th>
        </tr>
      </thead>
      <tbody id="tblBody"></tbody>
    </table>
  </div>
</main>

<script>
const SB_URL='https://oykgpkolliqjeznblavy.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2dwa29sbGlxamV6bmJsYXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTI3ODgsImV4cCI6MjA5NTYyODc4OH0.kkOBhxyaqLG7PLPNI0SwPNwQSWmbpFjDoP2VQp33_X4';

const NEW_ACTS=['new installation','go live support','break/fix','maintenance','relocation','expansion'];
const ROLES=['pm','logistics','install'];
const ROLE_LABELS={pm:'Project Management',logistics:'Logistics',install:'Install / Tech'};

let allDeps=[];
let allScores=[];

function sbGet(path){
  return fetch(SB_URL+path,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
}
function getTrack(dep){
  const a=(dep.activity_type||'').toLowerCase();
  return NEW_ACTS.some(x=>a.includes(x))?'new':'revisit';
}
function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function isScored(depId,role){
  return allScores.some(s=>s.deployment_id===depId&&s.role===role);
}
function getScore(depId,role){
  const s=allScores.find(s=>s.deployment_id===depId&&s.role===role);
  return s?s.score:null;
}
function getSubmitter(depId,role){
  const s=allScores.find(s=>s.deployment_id===depId&&s.role===role);
  return s?s.submitted_by||'':null;
}
function scoreColor(v){
  return v>=90?'var(--green)':v>=70?'var(--amber)':'var(--red)';
}

async function init(){
  try{
    const [dr,sr]=await Promise.all([
      sbGet('/rest/v1/deployments?select=*&order=week_no.desc,client.asc'),
      sbGet('/rest/v1/quality_scores?select=*')
    ]);
    if(!dr.ok||!sr.ok) throw new Error('fetch failed');
    allDeps=await dr.json();
    allScores=await sr.json();
    buildWeekFilter();
    render();
  }catch(e){
    document.getElementById('tblBody').innerHTML=
      '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text3)">Could not load — check Supabase connection.</td></tr>';
  }
}

function buildWeekFilter(){
  const weeks=[...new Set(allDeps.map(d=>d.week_no).filter(w=>w>0))].sort((a,b)=>b-a);
  const sel=document.getElementById('weekFil');
  weeks.forEach(w=>{
    const o=document.createElement('option');
    o.value=w; o.textContent='Week '+w;
    sel.appendChild(o);
  });
  if(weeks.length) sel.value=weeks[0];
}

function getFiltered(){
  const week=document.getElementById('weekFil').value;
  const track=document.getElementById('trackFil').value;
  const status=document.getElementById('statusFil').value;
  const q=document.getElementById('searchBox').value.toLowerCase();
  return allDeps.filter(d=>{
    if(week!=='all'&&d.week_no!==parseInt(week)) return false;
    if(track!=='all'&&getTrack(d)!==track) return false;
    if(q&&!d.client.toLowerCase().includes(q)&&!(d.parent_ticket||'').includes(q)) return false;
    const allDone=ROLES.every(r=>isScored(d.id,r));
    if(status==='complete'&&!allDone) return false;
    if(status==='incomplete'&&allDone) return false;
    return true;
  });
}

function render(){
  const deps=getFiltered();
  const total=deps.length;
  const fullDone=deps.filter(d=>ROLES.every(r=>isScored(d.id,r))).length;
  const incomplete=total-fullDone;
  const totalMissing=ROLES.reduce((acc,r)=>acc+deps.filter(d=>!isScored(d.id,r)).length,0);

  // Stats
  document.getElementById('statRow').innerHTML=[
    {val:total,lbl:'Deployments',color:'var(--text)'},
    {val:fullDone,lbl:'Fully scored',color:'var(--green)'},
    {val:incomplete,lbl:'Incomplete',color:'var(--red)'},
    {val:totalMissing,lbl:'Sections missing',color:'var(--amber)'},
  ].map(s=>`<div class="stat">
    <div class="stat-val" style="color:${s.color}">${s.val}</div>
    <div class="stat-lbl">${s.lbl}</div>
  </div>`).join('');

  // Role panels — who still needs to fill out
  document.getElementById('rolePanels').innerHTML=ROLES.map(role=>{
    const missing=deps.filter(d=>!isScored(d.id,role));
    const badgeClass=missing.length?'rp-badge rp-badge-red':'rp-badge rp-badge-green';
    const badgeTxt=missing.length?missing.length+' missing':'All done';
    const body=missing.length===0
      ?`<div class="all-clear"><div class="ac-icon">✅</div><div class="ac-txt">All complete</div></div>`
      :missing.slice(0,15).map(d=>`
        <div class="miss-row">
          <div class="mr-info">
            <div class="mr-client">${escHtml(d.client)}</div>
            <div class="mr-sub">${escHtml(d.parent_ticket||'')}${d.kiosk_id?' · '+escHtml(d.kiosk_id):''}</div>
          </div>
          <div class="mr-tags">
            <span class="tag ${getTrack(d)==='new'?'t-blue':'t-amber'}">${getTrack(d)==='new'?'New':'Rev.'}</span>
            ${d.week_no?`<span class="tag t-gray">Wk ${d.week_no}</span>`:''}
          </div>
        </div>`).join('')
      +(missing.length>15?`<div style="padding:.5rem 1rem;font-size:.72rem;color:var(--text3)">+${missing.length-15} more</div>`:'');

    return `<div class="role-panel">
      <div class="rp-head">
        <div class="rp-title">${ROLE_LABELS[role]}</div>
        <div class="${badgeClass}">${badgeTxt}</div>
      </div>
      <div class="rp-body">${body}</div>
    </div>`;
  }).join('');

  // Completion table
  if(!deps.length){
    document.getElementById('tblBody').innerHTML=
      `<tr><td colspan="8"><div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No deployments found</div><div class="empty-sub">Try adjusting the filters.</div></div></td></tr>`;
    return;
  }

  document.getElementById('tblBody').innerHTML=deps.map(d=>{
    const track=getTrack(d);
    const roleScores=ROLES.map(r=>getScore(d.id,r)).filter(v=>v!==null);
    const avgScore=roleScores.length
      ? Math.round(roleScores.reduce((a,b)=>a+b,0)/roleScores.length)
      : null;
    const avgTxt=avgScore!==null?avgScore+'%':'—';
    const avgCol=avgScore!==null?scoreColor(avgScore):'var(--text3)';

    const dotCell=(role)=>{
      const done=isScored(d.id,role);
      const sc=getScore(d.id,role);
      const who=getSubmitter(d.id,role);
      const tip=done?(sc!==null?sc+'%':'✓')+(who?' · '+who:''):'Missing';
      return done
        ?`<div class="role-dot dot-done" title="${escHtml(tip)}">✓</div>`
        :`<div class="role-dot dot-miss" title="Not submitted">!</div>`;
    };

    return `<tr>
      <td class="td-client" title="${escHtml(d.client)}">${escHtml(d.client)}</td>
      <td class="td-sub">${escHtml(d.parent_ticket||'')}${d.kiosk_id?'<br>'+escHtml(d.kiosk_id):''}</td>
      <td><span class="tag ${track==='new'?'t-blue':'t-amber'}">${track==='new'?'New':'Revisit'}</span></td>
      <td style="color:var(--text3);font-size:.8rem">${d.week_no||'—'}</td>
      <td style="text-align:center">${dotCell('pm')}</td>
      <td style="text-align:center">${dotCell('logistics')}</td>
      <td style="text-align:center">${dotCell('install')}</td>
      <td class="score-mono" style="color:${avgCol}">${avgTxt}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
