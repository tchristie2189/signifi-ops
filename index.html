<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi Solutions — Ops Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--red-mid:#f5c2cb;--black:#0f0f0f;--gray-900:#1a1a1a;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-200:#e0e0e0;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#fff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--purple:#7c3aed;--purple-bg:#ede9fe;--blue:#2563eb;--blue-bg:#eff6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:6px;--radius-lg:10px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;font-size:14px;}
/* ── HEADER ── */
.page-header{background:var(--black);position:sticky;top:0;z-index:200;}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:0 auto;padding:0 1.5rem;height:52px;gap:1rem;}
.logo-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px 6px 6px;border-radius:var(--radius);transition:background 0.15s;position:relative;border:none;background:transparent;}
.logo-btn:hover{background:#1a1a1a;}
.logo-mark{width:24px;height:24px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-mark svg{width:12px;height:12px;fill:white;}
.logo-text{font-size:12px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.logo-chevron{font-size:10px;color:#555;margin-left:2px;}
/* DROPDOWN MENU */
.nav-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#111;border:1px solid #2a2a2a;border-radius:var(--radius-lg);padding:6px;min-width:200px;display:none;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.nav-dropdown.open{display:block;}
.nav-group-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#444;padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;color:#aaa;font-size:12px;font-weight:500;transition:all 0.1s;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);}
.nav-item:hover{background:#1e1e1e;color:white;}
.nav-item.active{background:#1e1e1e;color:white;}
.nav-item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nav-sep{height:1px;background:#1e1e1e;margin:4px 0;}
.header-right{display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:7px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:4px 10px 4px 6px;cursor:pointer;}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;flex-shrink:0;}
.user-name{font-size:11px;color:#aaa;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdate{font-family:var(--mono);font-size:11px;color:#444;}
.btn-signout{font-size:11px;padding:4px 10px;border-radius:var(--radius);border:1px solid #2a2a2a;background:transparent;color:#666;cursor:pointer;font-family:var(--font);}
.btn-signout:hover{background:#1a1a1a;color:#aaa;}
/* ── LOGIN SCREEN ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gray-50);}
.login-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:2.5rem;width:380px;max-width:95%;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.login-logo-mark{width:32px;height:32px;background:var(--black);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.login-logo-mark .inner{width:18px;height:18px;background:var(--red);border-radius:3px;}
.login-title{font-size:20px;font-weight:600;color:var(--black);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--gray-500);margin-bottom:1.5rem;}
.login-field{margin-bottom:12px;}
.login-field label{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:4px;}
.login-field input{width:100%;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);}
.login-field input:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.06);}
.btn-login{width:100%;font-family:var(--font);font-size:13px;font-weight:600;padding:10px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer;margin-top:4px;}
.btn-login:hover{background:var(--gray-900);}
.login-note{font-size:11px;color:var(--gray-500);text-align:center;margin-top:12px;}
.login-sent{text-align:center;padding:1.5rem 0;}
.login-sent-icon{font-size:36px;margin-bottom:12px;}
.login-sent-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.login-sent-sub{font-size:13px;color:var(--gray-500);}
/* ── PAGE ── */
.page-body{max-width:1300px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
/* ── METRICS ── */
.metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:12px 14px;}
.metric-label{font-size:10px;color:var(--gray-500);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.04em;}
.metric-val{font-size:22px;font-weight:600;color:var(--black);}
.metric-sub{font-size:10px;color:var(--gray-500);margin-top:2px;}
.metric-val.red{color:var(--red);}
.metric-val.green{color:var(--success);}
.metric-val.amber{color:var(--warning);}
/* ── HEALTH SCORE ── */
.health-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.health-ring svg{transform:rotate(-90deg);}
.health-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
/* ── AT A GLANCE ── */
.glance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-bottom:1rem;}
.glance-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;}
.glance-card-head{padding:12px 14px 10px;border-bottom:1px solid var(--gray-100);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.glance-proj-name{font-size:13px;font-weight:600;color:var(--black);}
.glance-proj-meta{display:flex;align-items:center;gap:8px;margin-top:3px;}
.glance-so{font-family:var(--mono);font-size:10px;color:var(--red);}
.glance-client{font-size:11px;color:var(--gray-500);}
.cycle-track{padding:12px 14px;}
.cycle-stages{display:flex;flex-direction:column;gap:5px;}
.cycle-stage{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:8px;}
.cycle-stage-name{font-size:11px;color:var(--gray-700);font-weight:500;}
.cycle-bar-wrap{background:var(--gray-100);border-radius:2px;height:6px;overflow:hidden;}
.cycle-bar{height:6px;border-radius:2px;}
.stage-chip{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600;display:inline-block;text-align:right;}
.chip-done{background:var(--success-bg);color:var(--success);}
.chip-active{background:var(--blue-bg);color:var(--blue);}
.chip-future{background:var(--gray-100);color:var(--gray-500);}
.chip-overdue{background:var(--red-light);color:var(--red);}
.chip-atrisk{background:var(--warning-bg);color:var(--warning);}
/* ── SECTION ── */
.section{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.section-title{font-size:13px;font-weight:600;color:var(--black);}
.section-meta{font-size:11px;color:var(--gray-500);}
.proj-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem;}
.ppill{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);transition:all 0.15s;}
.ppill:hover{border-color:var(--black);}
.ppill.active{background:var(--black);color:white;border-color:var(--black);}
.milestone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:12px 16px;}
.ms-item{border-radius:var(--radius);padding:10px 12px;border-left:3px solid var(--gray-300);background:var(--gray-50);cursor:pointer;transition:box-shadow 0.15s;}
.ms-item:hover{box-shadow:0 0 0 2px var(--gray-300);}
.ms-item.done{border-left-color:var(--success);background:#f0faf5;}
.ms-item.today{border-left-color:#059669;background:#ecfdf5;}
.ms-item.upcoming{border-left-color:var(--blue);background:var(--blue-bg);}
.ms-item.overdue{border-left-color:var(--red);background:var(--red-light);}
.ms-item.future{border-left-color:var(--gray-300);}
.ms-type{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
.ms-label{font-size:11px;font-weight:600;color:var(--black);line-height:1.3;}
.ms-date{font-size:11px;color:var(--gray-700);margin-top:2px;}
.ms-days{font-size:10px;margin-top:3px;font-weight:500;}
.ms-days.done{color:var(--success);}
.ms-days.today{color:#059669;}
.ms-days.upcoming{color:var(--blue);}
.ms-days.overdue{color:var(--red);}
.ms-days.future{color:var(--gray-500);}
.ms-edit-hint{font-size:9px;color:var(--gray-300);margin-top:2px;}
/* ── WEEK ── */
.week-nav-row{display:flex;align-items:center;gap:7px;margin-bottom:1rem;flex-wrap:wrap;}
.wnav{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:5px 10px;cursor:pointer;color:var(--gray-700);font-size:12px;font-family:var(--font);}
.wnav:hover{background:var(--gray-100);}
.wlabel{font-size:12px;color:var(--gray-700);min-width:150px;text-align:center;font-weight:500;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:1rem;}
.day-col{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);min-height:140px;overflow:hidden;}
.day-col.today-col{border:2px solid var(--black);}
.day-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--gray-100);}
.day-name{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;}
.day-num{font-size:17px;font-weight:600;color:var(--black);line-height:1.2;}
.today-pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle;}
.day-events{padding:6px;}
.ev{border-radius:var(--radius);padding:4px 7px;margin-bottom:3px;}
.ev-ship{background:#d1fae5;border-left:3px solid #059669;}
.ev-arr{background:#dbeafe;border-left:3px solid #2563eb;}
.ev-prod{background:#ede9fe;border-left:3px solid #7c3aed;}
.ev-qa{background:#fef3c7;border-left:3px solid #d97706;}
.ev-uat{background:#dcfce7;border-left:3px solid #16a34a;}
.ev-inst{background:#fce7f3;border-left:3px solid #db2777;}
.ev-other{background:var(--gray-50);border-left:3px solid var(--gray-300);}
.ev-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-500);}
.ev-name{font-size:10px;font-weight:600;color:var(--black);line-height:1.3;}
.ev-proj{font-size:9px;color:var(--gray-500);}
.empty-day{font-size:10px;color:var(--gray-300);text-align:center;padding:1.2rem 0;}
.overdue-bar{background:var(--red-light);border:1px solid var(--red-mid);border-radius:var(--radius);padding:9px 13px;margin-bottom:1rem;display:flex;gap:8px;}
.overdue-title{font-size:11px;font-weight:600;color:var(--red);margin-bottom:2px;}
.overdue-item{font-size:10px;color:var(--red);}
.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray-500);}
.leg-dot{width:7px;height:7px;border-radius:2px;}
/* ── DEPT ── */
.dept-table-wrap{overflow-x:auto;}
.dept-table{width:100%;border-collapse:collapse;min-width:600px;}
.dept-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:8px 14px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.dept-table td{font-size:12px;padding:10px 14px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.dept-table tr:hover td{background:var(--gray-50);}
.dept-table tr:last-child td{border-bottom:none;}
.date-cell{font-family:var(--mono);font-size:11px;}
.status-chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;white-space:nowrap;}
/* ── GANTT ── */
.prod-gantt{overflow-x:auto;padding:0 16px 16px;position:relative;}
.gantt-wrap{overflow-x:auto;}
.gantt-table{border-collapse:collapse;width:100%;min-width:700px;}
.gantt-table th{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:5px 4px;text-align:center;border-bottom:1px solid var(--gray-100);font-weight:600;white-space:nowrap;min-width:28px;background:var(--white);}
.gantt-table th.proj-col{text-align:left;min-width:180px;padding:5px 8px;position:sticky;left:0;z-index:3;background:var(--white);box-shadow:2px 0 4px rgba(0,0,0,0.08);}
.gantt-table td{padding:4px 3px;border-bottom:1px solid var(--gray-50);vertical-align:middle;background:var(--white);}
.gantt-table td.proj-name{font-size:12px;font-weight:500;color:var(--black);padding:4px 8px;white-space:nowrap;position:sticky;left:0;z-index:2;background:var(--white);box-shadow:2px 0 4px rgba(0,0,0,0.08);}
.gantt-cell{position:relative;text-align:center;}
.gantt-fill{height:20px;border-radius:3px;}
.gantt-today-col{background:#fff8f8;}
/* ── SCHEDULE ── */
.sched-table{width:100%;border-collapse:collapse;}
.sched-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:9px 12px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.sched-table td{font-size:12px;padding:9px 12px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.sched-table tr:hover td{background:var(--gray-50);}
.sched-table tr.dragging{opacity:0.4;}
.sched-table tr.drag-over td{border-top:2px solid var(--red);}
.drag-handle{cursor:grab;color:var(--gray-300);font-size:15px;padding:0 4px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.priority-num{font-family:var(--mono);font-size:11px;color:var(--gray-500);}
.sched-input{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.sched-input:focus{outline:none;border-color:var(--black);}
.sched-select{font-family:var(--font);font-size:11px;padding:3px 7px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer;}
/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field.full{grid-column:1/-1;}
.field label{font-size:10px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{font-family:var(--font);font-size:12px;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.05);}
.field textarea{resize:vertical;min-height:65px;}
.form-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 16px 16px;}
.btn{font-family:var(--font);font-size:12px;font-weight:500;padding:7px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--gray-700);cursor:pointer;}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--black);color:white;border-color:var(--black);}
.btn-primary:hover{background:var(--gray-900);}
.btn-red{background:var(--red);color:white;border-color:var(--red);}
.btn-red:hover{background:#a80e26;}
.btn-add{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red);color:white;cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-add:hover{background:#a80e26;}
.btn-export{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--success);background:var(--success-bg);color:var(--success);cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-export:hover{background:#d4edda;}
/* ── ACTIVITY LOG ── */
.log-item{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--gray-50);align-items:flex-start;}
.log-item:last-child{border-bottom:none;}
.log-avatar{width:28px;height:28px;border-radius:50%;background:var(--black);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;flex-shrink:0;margin-top:1px;}
.log-body{flex:1;}
.log-user{font-size:12px;font-weight:600;color:var(--black);}
.log-action{font-size:12px;color:var(--gray-700);display:inline;}
.log-entity{font-size:12px;font-weight:500;color:var(--blue);display:inline;}
.log-change{font-size:11px;color:var(--gray-500);margin-top:3px;}
.log-change .old{color:var(--red);text-decoration:line-through;}
.log-change .new{color:var(--success);}
.log-time{font-size:10px;color:var(--gray-300);font-family:var(--mono);white-space:nowrap;margin-top:2px;}
.log-proj{font-size:10px;color:var(--gray-400);margin-top:1px;}
/* ── INTAKE ── */
.intake-body{padding:16px;}
.intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.intake-section-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--gray-100);}
.intake-section-lbl:first-child{border-top:none;margin-top:0;padding-top:0;}
.ms-intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1;}
.ms-block{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius);padding:10px;}
.ms-block-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ms-block .field{margin-bottom:5px;}
.ms-block .field:last-child{margin-bottom:0;}
/* ── MODAL ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:white;padding:10px 18px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius-lg);width:480px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--gray-100);}
.modal-title{font-size:14px;font-weight:600;color:var(--black);}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-500);line-height:1;}
.modal-body{padding:16px;}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--gray-100);}
.empty-state{text-align:center;padding:2.5rem;color:var(--gray-500);font-size:12px;}
.actions-row{display:flex;align-items:center;gap:7px;padding:12px 16px;border-top:1px solid var(--gray-100);}
/* ── PRINT ── */
/* ── PROJECT PAGE ── */
.pp-header{background:var(--black);color:white;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.pp-title{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:4px;}
.pp-meta{font-size:12px;color:#888;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.pp-status{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;}
.pp-status-green{background:#1a7a4a;color:white;}.pp-status-amber{background:#8a5a00;color:white;}.pp-status-red{background:var(--red);color:white;}
.pp-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px;}
.pp-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;}
.pp-card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.pp-card-title{font-size:11px;font-weight:600;color:var(--black);text-transform:uppercase;letter-spacing:0.05em;}
.pp-card-body{padding:12px 14px;}
.pp-textarea{width:100%;font-family:var(--font);font-size:13px;border:none;resize:vertical;min-height:80px;background:transparent;outline:none;line-height:1.6;color:var(--gray-700);}
.pp-textarea:focus{background:var(--gray-50);border-radius:var(--radius);padding:6px;}
.pp-table{width:100%;border-collapse:collapse;font-size:12px;}
.pp-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:5px 8px;text-align:left;border-bottom:1px solid var(--gray-100);white-space:nowrap;background:var(--gray-50);}
.pp-table td{padding:6px 8px;border-bottom:1px solid var(--gray-50);vertical-align:middle;color:var(--black);}
.pp-table tr:last-child td{border-bottom:none;}
.pp-table tr:hover td{background:var(--gray-50);}
.pp-table input,.pp-table select{font-family:var(--font);font-size:12px;padding:3px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--black);width:100%;min-width:0;}
.pp-table input:focus,.pp-table select:focus{border-color:var(--gray-300);background:var(--white);outline:none;}
.pp-del{background:none;border:none;cursor:pointer;color:var(--gray-200);font-size:14px;padding:2px 4px;}
.pp-del:hover{color:var(--red);}
.pp-add-btn{font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;padding:7px 14px;font-family:var(--font);border-top:1px solid var(--gray-100);width:100%;text-align:left;}
.pp-add-btn:hover{background:var(--gray-50);}
.pp-link-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-50);}
.pp-link-item:last-child{border-bottom:none;}
.pp-link-label{font-size:11px;color:var(--gray-500);min-width:110px;flex-shrink:0;}
.pp-link-input{font-size:12px;flex:1;padding:3px 7px;border:1px solid var(--gray-200);border-radius:4px;font-family:var(--font);color:var(--blue);min-width:0;}
.pp-link-input:focus{outline:none;border-color:var(--blue);}
.pp-link-go{font-size:13px;flex-shrink:0;opacity:0.5;}
.pp-link-go:hover{opacity:1;}
.pp-notes-ta{width:100%;font-family:var(--font);font-size:12px;padding:8px;border:1px solid var(--gray-200);border-radius:var(--radius);resize:vertical;min-height:90px;color:var(--black);line-height:1.6;}
.pp-notes-ta:focus{outline:none;border-color:var(--black);}
.proj-sel-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:10px 14px;background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius-lg);}
.proj-sel-bar label{font-size:12px;font-weight:600;color:var(--gray-700);white-space:nowrap;}
.proj-sel-bar select{font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);flex:1;}
.pp-saved{font-size:11px;color:var(--success);margin-left:8px;display:none;}
/* ── DOC TABS ── */
.doc-tabs{display:flex;gap:4px;margin-bottom:1rem;}
.doc-tab{font-size:12px;padding:6px 16px;border-radius:var(--radius);border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);font-weight:500;}
.doc-tab:hover{background:var(--gray-100);}
.doc-tab.active{background:var(--black);color:white;border-color:var(--black);}
.doc-output{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;min-height:300px;position:relative;}
.copy-btn{position:absolute;top:10px;right:10px;font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--gray-300);background:var(--white);cursor:pointer;font-family:var(--font);}
.copy-btn:hover{background:var(--gray-100);}
.doc-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.doc-section-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;padding-top:8px;margin-top:4px;border-top:1px solid var(--gray-100);}
.doc-section-lbl:first-child{border-top:none;padding-top:0;margin-top:0;}
.proj-select-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:12px 16px;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-100);}
.proj-select-row label{font-size:12px;font-weight:600;color:var(--gray-700);white-space:nowrap;}
.proj-select-row select{font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);flex:1;}
.glance-notes-preview{font-size:11px;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;}
.glance-notes-preview:hover{color:var(--gray-700);}
.glance-notes-body{font-size:11px;color:var(--gray-700);margin-top:6px;white-space:pre-wrap;line-height:1.5;display:none;}
.glance-notes-body.open{display:block;}
.archived-banner{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--gray-500);}
.filter-toggle{display:flex;gap:4px;margin-bottom:1rem;}
.ftab{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);}
.ftab.active{background:var(--black);color:white;border-color:var(--black);}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:14px 16px;}
.template-card{border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all 0.15s;background:var(--white);}
.template-card:hover{border-color:var(--black);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.template-card-name{font-size:13px;font-weight:600;color:var(--black);margin-bottom:4px;}
.template-card-desc{font-size:11px;color:var(--gray-500);line-height:1.4;}
.template-card-stages{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.template-stage-pill{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--gray-100);color:var(--gray-600);}
.template-active{border-color:var(--blue);background:var(--blue-bg);}
.template-active .template-card-name{color:var(--blue);}
@media print{
  .page-header,.btn,.btn-primary,.btn-red,.btn-add,.btn-export,.no-print{display:none!important;}
  body{background:white;}
  .page-body{padding:0;max-width:100%;}
  .briefing-header{background:#0f0f0f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .section{break-inside:avoid;}
}
@media(max-width:800px){.metrics-row{grid-template-columns:repeat(2,1fr);}.week-grid{grid-template-columns:1fr;}.intake-grid,.form-grid,.ms-intake-grid{grid-template-columns:1fr;}.glance-grid{grid-template-columns:1fr;}.header-inner{padding:0 1rem;}.page-body{padding:1rem 1rem 3rem;}}
</style>
</head>

function today(){let t=new Date();t.setHours(0,0,0,0);return t;}

function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function isoD(dt){return dt.toISOString().split('T')[0];}
function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtFull(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtTime(s){if(!s)return'';try{return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function daysDiff(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-today())/86400000);}
function msStatus(s){let d=daysDiff(s);if(d<0)return{cls:'done',dcls:'done',txt:Math.abs(d)+'d ago'};if(d===0)return{cls:'today',dcls:'today',txt:'Today'};if(d<=7)return{cls:'upcoming',dcls:'upcoming',txt:'In '+d+'d'};return{cls:'future',dcls:'future',txt:fmtFull(s)};}
function stageStatus(start,end){
  const t=today();if(!start)return{label:'Not set',chip:'chip-future'};
  const s=new Date(start+'T00:00:00');const e=end?new Date(end+'T00:00:00'):s;

  return{label:fmt(start),chip:'chip-future'};
}

// ── HEALTH SCORE ───────────────────────────────────────────
// ── HEALTH & DONE ──────────────────────────────────────────
function isMilestoneDone(m){
  // Manually marked done via the hub
  if(milestoneDone[m.id])return true;
  // Dept check-in marked green AND checked by the dept lead
  const ci=checkinStatus[m.id];
  if(ci?.checked&&ci?.stoplight==='green')return true;
  return false;
}
function isMilestoneOverdue(m){
  if(isMilestoneDone(m))return false;
  return m.date&&daysDiff(m.date)<0;
}
function isMilestoneAtRisk(m){
  if(isMilestoneDone(m))return false;
  const ci=checkinStatus[m.id];
  return ci?.stoplight==='yellow';
}
function isMilestoneEscalation(m){
  if(isMilestoneDone(m))return false;
  const ci=checkinStatus[m.id];
  return ci?.stoplight==='red';
}

function calcHealth(pid){
  const pMs=milestones.filter(m=>m.project_id===pid&&m.date);
  if(!pMs.length)return null;
  const total=pMs.length;
  const done=pMs.filter(m=>isMilestoneDone(m)).length;
  const overdue=pMs.filter(m=>isMilestoneOverdue(m)).length;
  const atRisk=pMs.filter(m=>isMilestoneAtRisk(m)).length;
  const escalation=pMs.filter(m=>isMilestoneEscalation(m)).length;
  const remaining=total-done;
  // Score = done / total — simple and honest
  const score=Math.round((done/total)*100);
  // Color based on overdue/escalation situation
  const color=escalation>0?'#C8102E':overdue>0?'#d97706':score>=80?'#1a7a4a':score>=50?'#d97706':'#6b6b6b';
  return{score,done,total,remaining,overdue,atRisk,escalation,color};
}
function healthRing(pid){
  const h=calcHealth(pid);
  if(!h)return'';
  const r=20;const c=2*Math.PI*r;const dash=(h.score/100)*c;
  const tooltip=`${h.done} of ${h.total} milestones done · ${h.remaining} remaining${h.overdue?` · ${h.overdue} overdue`:''}${h.escalation?` · ${h.escalation} escalation`:''}`;
  return`<div class="health-ring" title="${tooltip}">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="#f2f2f2" stroke-width="5"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${h.color}" stroke-width="5" stroke-dasharray="${dash} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="health-ring-label" style="color:${h.color}">${h.score}</div>
  </div>`;
}

async function toggleMilestoneDone(mid,pid,e){

  const isDone=milestoneDone[mid];

  } else {
    const{data}=await sb.from('milestone_done').insert({milestone_id:mid,project_id:pid,marked_by:currentUserName}).select().single();
    if(data)milestoneDone[mid]=data;
  }
  showToast(isDone?'Marked as not done':'Marked as done ✓');
  await loadAll();
}

  }).sort((a,b)=>a.priority-b.priority);
  planogramSchedule=projects.map((p,i)=>{
    const ex=planogramSchedule.find(v=>v.id===p.id);
    const pm2=milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram'));
    return ex?{...ex,date:pm2?.date||ex.date}:{id:p.id,name:p.name,so:p.so_number,client:p.client,machineType:'',date:pm2?.date||'',status:'Pending',priority:i+1};

}

// ── AT A GLANCE ────────────────────────────────────────────
let glanceFilter='active'; // 'active' or 'archived'

function renderGlance(){
  const el=document.getElementById('tab-glance');
  const visibleProjects=projects.filter(p=>{
    if(glanceFilter==='archived'?p.status!=='complete':p.status==='complete')return false;
    if(pmFilter&&p.pm!==pmFilter)return false;
    return true;
  });
  const allActive=projects.filter(p=>p.status!=='complete');
  const allArchived=projects.filter(p=>p.status==='complete');
  const overdue=milestones.filter(m=>m.date&&daysDiff(m.date)<0).length;
  const thisWeek=milestones.filter(m=>m.date&&daysDiff(m.date)>=0&&daysDiff(m.date)<=6).length;
  const active=allActive.length;
  const inProd=allActive.filter(p=>{const s=getMsDate(p.id,'production-start');const e=getMsDate(p.id,'production-end');if(!s||!e)return false;const t=today();return t>=new Date(s+'T00:00:00')&&t<=new Date(e+'T00:00:00');}).length;
  const inQa=allActive.filter(p=>{const s=getMsDate(p.id,'quality-start');const e=getMsDate(p.id,'quality-end');if(!s||!e)return false;const t=today();return t>=new Date(s+'T00:00:00')&&t<=new Date(e+'T00:00:00');}).length;
  const STAGES=[
    {label:'Readiness',startKey:'po-release',endKey:'arrival',color:'#6b6b6b'},
    {label:'Production',startKey:'production-start',endKey:'production-end',color:'#7c3aed'},
    {label:'Quality / QA',startKey:'quality-start',endKey:'quality-end',color:'#d97706'},
    {label:'UAT',startKey:'uat',endKey:'uat',color:'#16a34a'},
    {label:'Shipping',startKey:'shipping',endKey:'shipping',color:'#059669'},
    {label:'Delivery',startKey:'delivery',endKey:'delivery',color:'#0891b2'},
    {label:'Installation',startKey:'installation',endKey:'installation',color:'#db2777'},
  ];
  const cards=visibleProjects.map(p=>{
    const h=calcHealth(p.id);
    const prodStart=getMsDate(p.id,'production-start');
    const installEnd=getMsDate(p.id,'installation');
    const overallStart=prodStart?new Date(prodStart+'T00:00:00'):null;
    const overallEnd=installEnd?new Date(installEnd+'T00:00:00'):null;
    const t=today();
    let overallPct=0;
    if(overallStart&&overallEnd&&t>=overallStart){
      overallPct=Math.min(100,Math.round((t-overallStart)/(overallEnd-overallStart)*100));
    }
    const stagesHtml=STAGES.map(stage=>{
      const sd=getMsDate(p.id,stage.startKey);const ed=getMsDate(p.id,stage.endKey);
      const st=stageStatus(sd,ed);
      // Find actual milestone records for this stage to check done status
      const stageMsKeys=[stage.startKey,stage.endKey].filter((v,i,a)=>a.indexOf(v)===i);
      const stageMs=milestones.filter(m=>m.project_id===p.id&&stageMsKeys.includes(m.key)&&m.date);
      const allDone=stageMs.length>0&&stageMs.every(m=>isMilestoneDone(m));
      const hasOverdue=!allDone&&stageMs.some(m=>isMilestoneOverdue(m));
      const hasEscalation=!allDone&&stageMs.some(m=>isMilestoneEscalation(m));
      const hasRisk=!allDone&&stageMs.some(m=>isMilestoneAtRisk(m));
      const chipCls=allDone?'chip-done':hasEscalation?'chip-overdue':hasOverdue?'chip-overdue':hasRisk?'chip-atrisk':st.chip;
      const chipLbl=allDone?'Done ✓':hasEscalation?'Escalation':hasOverdue?'Overdue':hasRisk?'At risk':st.label;
      let pct=0;
      if(allDone){pct=100;}
      else if(sd){const s=new Date(sd+'T00:00:00');const e=ed?new Date(ed+'T00:00:00'):s;const t=today();if(t>e)pct=100;else if(t>=s){const total=(e-s)||86400000;pct=Math.min(100,Math.round((t-s)/total*100));}}
      const barColor=allDone?'var(--success)':hasOverdue||hasEscalation?'var(--red)':hasRisk?'var(--warning)':stage.color;
      return `<div class="cycle-stage"><div class="cycle-stage-name">${stage.label}</div><div class="cycle-bar-wrap"><div class="cycle-bar" style="width:${pct}%;background:${pct>0?barColor:'var(--gray-200)'}"></div></div><div style="text-align:right"><span class="stage-chip ${chipCls}">${chipLbl}</span></div></div>`;
    }).join('');
    // Notes section
    const notes=(p.notes||'').trim();
    const notesHtml=notes?`<div class="glance-notes">
      <div class="glance-notes-preview" onclick="toggleNotes('notes-${p.id}')">
        <span>📝</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${notes.split('\n')[0].slice(0,60)}${notes.length>60?'…':''}</span>
        <span style="font-size:10px;color:var(--gray-300)">▾</span>
      </div>
      <div class="glance-notes-body" id="notes-${p.id}">${notes}</div>
    </div>`:'';
    // Archive/complete button
    const isComplete=p.status==='complete';
    return `<div class="glance-card" style="${isComplete?'opacity:0.75':''}">
      <div class="glance-card-head">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <div class="glance-proj-name">${p.name}</div>
            ${isComplete?'<span style="font-size:10px;padding:1px 7px;border-radius:10px;background:var(--gray-100);color:var(--gray-500);font-weight:600">Complete</span>':''}
          </div>
          <div class="glance-proj-meta"><span class="glance-so">${p.so_number||'No SO'}</span><span class="glance-client">${p.client||''}</span></div>
          ${overallStart&&overallEnd?`<div style="margin-top:7px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em">Overall progress</span><span style="font-size:9px;color:var(--gray-500)">${overallPct}%</span></div><div style="background:var(--gray-100);border-radius:3px;height:4px"><div style="height:4px;border-radius:3px;background:linear-gradient(90deg,#7c3aed,#e22f4a);width:${overallPct}%"></div></div></div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${h?healthRing(p.id):''}
          <button onclick="toggleArchive('${p.id}','${p.status}')" style="font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--gray-200);background:transparent;color:var(--gray-500);cursor:pointer;font-family:var(--font)" title="${isComplete?'Restore to active':'Mark complete'}">${isComplete?'↩ Restore':'✓ Complete'}</button>
        </div>
      </div>
      <div class="cycle-track"><div class="cycle-stages">${stagesHtml}</div></div>
      ${notesHtml}
    </div>`;
  }).join('');

  el.innerHTML=`
    <div class="metrics-row">
      <div class="metric"><div class="metric-label">Active projects</div><div class="metric-val">${active}</div><div class="metric-sub">in hub</div></div>
      <div class="metric"><div class="metric-label">In production</div><div class="metric-val ${inProd>0?'green':''}">${inProd}</div><div class="metric-sub">being built now</div></div>
      <div class="metric"><div class="metric-label">In QA</div><div class="metric-val ${inQa>0?'amber':''}">${inQa}</div><div class="metric-sub">being tested</div></div>
      <div class="metric"><div class="metric-label">This week</div><div class="metric-val">${thisWeek}</div><div class="metric-sub">milestones due</div></div>
      <div class="metric"><div class="metric-label">Needs attention</div><div class="metric-val ${overdue>0?'red':''}">${overdue}</div><div class="metric-sub">overdue items</div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="filter-toggle">
          <button class="ftab${glanceFilter==='active'?' active':''}" onclick="glanceFilter='active';renderGlance()">Active (${allActive.length})</button>
          <button class="ftab${glanceFilter==='archived'?' active':''}" onclick="glanceFilter='archived';renderGlance()">Completed (${allArchived.length})</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:var(--gray-500);white-space:nowrap">Filter by PM:</label>
          <select style="font-family:var(--font);font-size:12px;padding:4px 9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white)" onchange="pmFilter=this.value;renderGlance()">
            <option value="">All PMs</option>
            ${[...new Set(projects.map(p=>p.pm).filter(Boolean))].map(pm=>`<option value="${pm}"${pmFilter===pm?' selected':''}>${pm}</option>`).join('')}
          </select>
        </div>
        <span style="font-size:11px;color:var(--gray-500)">Health score top-right · ✓ Complete to archive</span>
      </div>
      <button class="btn-export" onclick="exportToExcel()">⬇ Excel</button>
    </div>
    ${visibleProjects.length?`<div class="glance-grid">${cards}</div>`:'<div class="empty-state" style="margin-top:2rem">'+(glanceFilter==='archived'?'No completed projects yet. Mark a project complete using the ✓ button on its card.':'No active projects. Check the Completed tab or add a new project.')+'</div>'}`;
}

// ── OVERVIEW ───────────────────────────────────────────────
function renderOverview(){
  const el=document.getElementById('tab-overview');
  const upcoming=milestones.filter(m=>m.date&&daysDiff(m.date)>=0&&daysDiff(m.date)<=14).length;
  const overdue=milestones.filter(m=>m.date&&daysDiff(m.date)<0).length;
  const thisWeek=milestones.filter(m=>m.date&&daysDiff(m.date)>=0&&daysDiff(m.date)<=6).length;
  const proj=projects.find(p=>p.id===selectedProjId);
  const projMs=milestones.filter(m=>m.project_id===selectedProjId);
  const msHtml=projMs.map(m=>{
    const isDone=isMilestoneDone(m);
    const isOverdue=isMilestoneOverdue(m);
    const st=isDone?{cls:'done',dcls:'done',txt:'Done ✓'}:isOverdue?{cls:'overdue',dcls:'overdue',txt:Math.abs(daysDiff(m.date))+'d overdue'}:msStatus(m.date);
    const ci=checkinStatus[m.id];
    const slDot=ci?.stoplight?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ci.stoplight==='green'?'#22c55e':ci.stoplight==='yellow'?'#eab308':'#ef4444'};margin-left:4px" title="Dept: ${ci.stoplight}"></span>`:'';
    const hist=milestoneHistory[m.id]||[];
    const origDate=m.original_date;
    const variance=origDate&&m.date?Math.round((new Date(m.date+'T00:00:00')-new Date(origDate+'T00:00:00'))/86400000):0;
    const slippageTag=hist.length&&origDate?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:${variance>0?'var(--red-light)':'var(--success-bg)'};color:${variance>0?'var(--red)':'var(--success)'};font-weight:600;margin-left:4px" title="${hist.length} change${hist.length>1?'s':''} · Original: ${fmt(origDate)}">${variance>0?'+'+variance+'d':variance===0?'on track':variance+'d'}</span>`:'';
    return`<div class="ms-item ${st.cls}" style="${isDone?'opacity:0.75':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
        <div class="ms-type">${TYPE_LBL[m.key]||m.key}</div>
        <button onclick="toggleMilestoneDone('${m.id}','${m.project_id}',event)" style="background:${isDone?'var(--success)':'transparent'};border:1px solid ${isDone?'var(--success)':'var(--gray-300)'};border-radius:10px;padding:1px 7px;font-size:10px;cursor:pointer;color:${isDone?'white':'var(--gray-500)'};font-family:var(--font);flex-shrink:0">${isDone?'✓ Done':'Mark done'}</button>
      </div>
      <div class="ms-label" onclick="openEditMs('${m.id}','${m.label}','${m.date||''}')" style="cursor:pointer">${m.label}${slDot}${slippageTag}</div>
      <div class="ms-date" onclick="openEditMs('${m.id}','${m.label}','${m.date||''}')" style="cursor:pointer">${fmtFull(m.date)}</div>
      <div class="ms-days ${st.dcls}">${st.txt}</div>
      ${hist.length&&origDate?`<div style="font-size:9px;color:var(--gray-400);margin-top:1px">Orig: ${fmt(origDate)}</div>`:''}
    </div>`;
  }).join('');
  const pillsHtml=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1rem">
    <div class="proj-pills" style="margin-bottom:0;flex:1">${projects.filter(p=>!pmFilter||(p.pm===pmFilter)).map(p=>`<button class="ppill${p.id===selectedProjId?' active':''}" onclick="selProj('${p.id}')">${p.name}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
      <label style="font-size:11px;color:var(--gray-500);white-space:nowrap">PM:</label>
      <select style="font-family:var(--font);font-size:12px;padding:4px 9px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white)" onchange="pmFilter=this.value;renderOverview()">
        <option value="">All</option>
        ${[...new Set(projects.map(p=>p.pm).filter(Boolean))].map(pm=>`<option value="${pm}"${pmFilter===pm?' selected':''}>${pm}</option>`).join('')}
      </select>
    </div>
  </div>`;
  el.innerHTML=`
    <div class="metrics-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="metric"><div class="metric-label">Total projects</div><div class="metric-val">${projects.length}</div></div>
      <div class="metric"><div class="metric-label">This week</div><div class="metric-val">${thisWeek}</div></div>
      <div class="metric"><div class="metric-label">Next 14 days</div><div class="metric-val">${upcoming}</div></div>
      <div class="metric"><div class="metric-label">Overdue</div><div class="metric-val ${overdue>0?'red':''}">${overdue}</div></div>
    </div>
    ${pillsHtml}
    ${proj?`<div class="section">
      <div class="section-head">
        <div class="section-title">${proj.name} <span style="font-size:11px;font-weight:400;color:var(--gray-500)">— ${proj.client}</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:var(--mono);color:var(--red);font-size:11px">${proj.so_number||'No SO'}</span>
          ${healthRing(proj.id)}
          <button class="btn btn-primary" style="font-size:10px;padding:4px 10px" onclick="openEditProj('${proj.id}')">✏ Edit</button>
          <button class="btn-export" onclick="exportToExcel()">⬇ Excel</button>
        </div>
      </div>
      <div class="milestone-grid">${msHtml||'<div class="empty-state">No milestones yet.</div>'}</div>
    </div>`:'<div class="empty-state">No projects yet.</div>'}`;
}
function selProj(id){selectedProjId=id;renderOverview();}

// ── WEEK ───────────────────────────────────────────────────

  const we=addD(weekStart,6);
  const allMs=milestones.map(m=>{const p=projects.find(x=>x.id===m.project_id);return{...m,projectName:p?p.name:''};});
  const overdueMs=allMs.filter(m=>m.date&&daysDiff(m.date)<0&&daysDiff(m.date)>=-14);
  const overdueHtml=overdueMs.length?`<div class="overdue-bar"><div><div class="overdue-title">⚠ Overdue</div>${overdueMs.map(m=>`<div class="overdue-item">${m.label} — ${m.projectName} (was ${fmt(m.date)})</div>`).join('')}</div></div>`:'';
  const DAY=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const t=today();
  const daysHtml=[0,1,2,3,4].map(i=>{
    const d=addD(weekStart,i);const isT=sameDay(d,t);

      <div class="leg"><div class="leg-dot" style="background:#059669"></div>Shipping</div>
      <div class="leg"><div class="leg-dot" style="background:#2563eb"></div>Arrival</div>

      <div class="leg"><div class="leg-dot" style="background:#d97706"></div>QA</div>
      <div class="leg"><div class="leg-dot" style="background:#16a34a"></div>UAT</div>
      <div class="leg"><div class="leg-dot" style="background:#db2777"></div>Installation</div>

function shiftW(n){weekStart=addD(weekStart,n*7);renderWeek();}
function goToday(){weekStart=monday(today());renderWeek();}

// ── DEPT / GANTT ───────────────────────────────────────────
function buildGantt(startKeys,endKeys,segsFn,title,legend){
  const starts=milestones.filter(m=>startKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const ends=milestones.filter(m=>endKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  if(!starts.length||!ends.length)return'';
  let rS=monday(new Date(Math.min(...starts)));let rE=addD(new Date(Math.max(...ends)),5);
  const days=[];let cur=new Date(rS);while(cur<=rE){const dow=cur.getDay();if(dow!==0&&dow!==6)days.push(new Date(cur));cur=addD(cur,1);}
  const t=today();
  const hdr=days.map(d=>`<th class="${sameDay(d,t)?'gantt-today-col':''}" style="min-width:28px">${d.getDate()===1||days.indexOf(d)===0?'<span style="font-size:8px;display:block">'+d.toLocaleDateString('en-US',{month:'short'})+'</span>'+d.getDate():d.getDate()}</th>`).join('');
  const gRows=projects.map(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);const getD=k=>pMs.find(m=>m.key===k)?.date;
    const segs=segsFn(getD).filter(x=>x.s);
    const cells=days.map(d=>{
      const isT=sameDay(d,t);let fill='';
      segs.forEach(sg=>{const sd=new Date(sg.s+'T00:00:00');const ed=sg.e?new Date(sg.e+'T00:00:00'):sd;if(d>=sd&&d<=ed)fill=`<div class="gantt-fill" style="background:${sg.bg};opacity:0.85" title="${sg.lbl}"></div>`;});
      const tl=isT?'<div style="position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(200,16,46,0.4)"></div>':'';
      return`<td class="gantt-cell ${isT?'gantt-today-col':''}" style="position:relative">${tl}${fill}</td>`;
    }).join('');
    return`<tr><td class="proj-name">${p.name}<br><span style="font-family:var(--mono);font-size:9px;color:var(--gray-500)">${p.so_number||''}</span></td>${cells}</tr>`;
  }).join('');
  const legHtml=legend.map(l=>`<div class="leg"><div class="leg-dot" style="background:${l.c}"></div>${l.l}</div>`).join('');
  return`<div class="section" style="margin-bottom:10px"><div class="section-head"><div class="section-title">${title} — Gantt</div><div class="legend-row" style="margin:0;gap:8px">${legHtml}</div></div><div class="prod-gantt"><div class="gantt-wrap"><table class="gantt-table"><thead><tr><th class="proj-col">Project</th>${hdr}</tr></thead><tbody>${gRows}</tbody></table></div></div></div>`;
}
function renderDeptView(dept){
  const el=document.getElementById('tab-'+dept);
  const cfg={
    production:{title:'Production schedule',startKey:'production-start',endKey:'production-end',color:'#7c3aed',cols:['Project','SO Number','Client','Prod start','Prod end','Duration','Status']},
    quality:{title:'Quality / QA schedule',startKey:'quality-start',endKey:'quality-end',color:'#d97706',cols:['Project','SO Number','Client','QA start','QA end','Duration','Vinyl date','UAT date','Status']},
    shipping:{title:'Shipping schedule',startKey:'shipping',endKey:'shipping',color:'#059669',cols:['Project','SO Number','Client','Pack & ship','Delivery','Status']},
    installation:{title:'Installation schedule',startKey:'installation',endKey:'installation',color:'#db2777',cols:['Project','SO Number','Client','Training date','Installation date','Status']},
  };
  const c=cfg[dept];
  let ganttHtml='';
  if(dept==='production'){ganttHtml=buildGantt(['production-start'],['production-end','quality-end'],getD=>[{s:getD('production-start'),e:getD('production-end'),bg:'#7c3aed',lbl:'Build'},{s:getD('quality-start'),e:getD('quality-end'),bg:'#d97706',lbl:'QA'},{s:getD('shipping'),e:getD('shipping'),bg:'#059669',lbl:'Ship'},{s:getD('installation'),e:getD('installation'),bg:'#db2777',lbl:'Install'}],'Production',[{c:'#7c3aed',l:'Build'},{c:'#d97706',l:'QA'},{c:'#059669',l:'Ship'},{c:'#db2777',l:'Install'}]);}
  else if(dept==='quality'){ganttHtml=buildGantt(['quality-start'],['quality-end','uat'],getD=>[{s:getD('quality-start'),e:getD('quality-end'),bg:'#d97706',lbl:'QA'},{s:getD('vinyl'),e:getD('vinyl'),bg:'#2563eb',lbl:'Vinyl'},{s:getD('uat'),e:getD('uat'),bg:'#16a34a',lbl:'UAT'}],'Quality / QA',[{c:'#d97706',l:'QA'},{c:'#2563eb',l:'Vinyl'},{c:'#16a34a',l:'UAT'}]);}
  const rows=projects.map(p=>{
    const sd=getMsDate(p.id,c.startKey);const ed=c.endKey!==c.startKey?getMsDate(p.id,c.endKey):null;const st=stageStatus(sd,ed||sd);
    let extra='';
    if(dept==='production'){const dur=sd&&ed?Math.round((new Date(ed+'T00:00:00')-new Date(sd+'T00:00:00'))/86400000)+' days':'—';extra=`<td class="date-cell">${fmt(sd)}</td><td class="date-cell">${fmt(ed)}</td><td class="date-cell">${dur}</td>`;}

// Vinyl date sync — updates both the local schedule AND the milestone in Supabase
async function vinylDateSync(i,val,type){
  vinylSchedule[i][type==='ship'?'shipDate':'date']=val;
  const proj=projects.find(p=>p.id===vinylSchedule[i].id);
  if(!proj)return;
  const msKey=type==='ship'?'shipping':'vinyl';
  const msLabel=type==='ship'?'Pack & ship':'Vinyl / branding';
  const existing=milestones.find(m=>m.project_id===proj.id&&m.key===msKey);
  if(existing){
    await sb.from('milestones').update({date:val,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',existing.id);
    await logActivity('updated date',msLabel,msLabel,proj.id,existing.date,val);
  } else {
    await sb.from('milestones').insert({project_id:proj.id,key:msKey,label:msLabel,date:val,changed_by:currentUserName});
    await logActivity('added milestone',msLabel,msLabel,proj.id,null,val);
  }
  await loadAll();
  showToast('Date synced to project overview ✓');
}
function vsDate(i,field,val,type){
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;data[i][field]=val;
  const proj=projects.find(p=>p.id===data[i].id);
  if(proj&&val){
    const key=type==='vinyl'?'vinyl':'other';const label=type==='vinyl'?'Vinyl / branding':'Planogram sign-off';
    const existing=milestones.find(m=>m.project_id===proj.id&&m.key===key);
    if(existing){sb.from('milestones').update({date:val,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',existing.id).then(()=>{logActivity('updated date',type,label,proj.id,existing.date,val);showToast('Date saved ✓');});}
    else{sb.from('milestones').insert({project_id:proj.id,key,label,date:val}).then(()=>{logActivity('added',type,label,proj.id,null,val);loadAll();showToast('Date saved ✓');});}
  }
}

// ── DEPT CHECK-IN OVERVIEW ────────────────────────────────
const DEPT_KEYS={'Production':['production-start','production-end'],'Software / UI':['other'],'Inventory':['arrival'],'Procurement':['arrival'],'MO Release':['po-release'],'Quality':['quality-start','quality-end','vinyl'],'Shipping':['shipping','delivery'],'Deployment':['installation']};
const DEPT_LABEL_MATCH={'Software / UI':['UI start','UI end'],'Inventory':['Inventory pick'],'Procurement':['Parts ordering start','Parts arrival']};
const DEPT_COLORS={'Production':'#7c3aed','Software / UI':'#2563eb','Inventory':'#0891b2','Procurement':'#d97706','MO Release':'#6b6b6b','Quality':'#d97706','Shipping':'#059669','Deployment':'#db2777'};
const SL_COLORS={green:'#22c55e',yellow:'#eab308',red:'#ef4444'};

function renderCheckinOverview(){
  const el=document.getElementById('tab-checkin');
  const base=monday(today());
  const weeks=[{label:'This week',start:base},{label:'Next week',start:addD(base,7)}];
  const depts=Object.keys(DEPT_KEYS);

  function getDeptMs(dept,wStart){
    const wEnd=addD(wStart,6);
    const keys=DEPT_KEYS[dept]||[];
    const lbls=DEPT_LABEL_MATCH[dept]||[];
    return milestones.filter(m=>{
      if(!m.date)return false;
      const d=new Date(m.date+'T00:00:00');
      if(d<wStart||d>wEnd)return false;
      if(keys.includes(m.key)){
        if(!lbls.length)return true;
        return lbls.some(l=>(m.label||'').toLowerCase().includes(l.toLowerCase()));
      }
      return false;
    });
  }

  function slDots(mId){
    const ci=checkinStatus[mId]||{};
    const sl=ci.stoplight||'';
    const chk=ci.checked||false;
    return'<div style="display:flex;align-items:center;gap:5px">'+
      ['green','yellow','red'].map(c=>'<div style="width:18px;height:18px;border-radius:50%;background:'+SL_COLORS[c]+';opacity:'+(sl===c?1:0.15)+'" title="'+(c==='green'?'On track':c==='yellow'?'In trouble':'Escalation')+'"></div>').join('')+
      (chk?'<span style="font-size:12px;color:var(--success);font-weight:600;margin-left:2px">✓</span>':'<span style="font-size:11px;color:var(--gray-300);margin-left:2px">○</span>')+
    '</div>';
  }

  const thStyle='padding:7px 12px;font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;text-align:left;border-bottom:1px solid var(--gray-100);background:var(--gray-50)';

  const weeksHtml=weeks.map(w=>{
    const allMs=depts.flatMap(d=>getDeptMs(d,w.start));
    const greens=allMs.filter(m=>checkinStatus[m.id]?.stoplight==='green').length;
    const yellows=allMs.filter(m=>checkinStatus[m.id]?.stoplight==='yellow').length;
    const reds=allMs.filter(m=>checkinStatus[m.id]?.stoplight==='red').length;
    const unchecked=allMs.filter(m=>!checkinStatus[m.id]?.stoplight).length;
    const rows=depts.map(dept=>{
      const dms=getDeptMs(dept,w.start);
      if(!dms.length)return'<tr><td style="padding:7px 12px;font-size:12px;font-weight:600;color:'+DEPT_COLORS[dept]+';white-space:nowrap">'+dept+'</td><td colspan="5" style="padding:7px 12px;font-size:11px;color:var(--gray-300)">No milestones this week</td></tr>';
      return dms.map((m,i)=>{
        const proj=projects.find(p=>p.id===m.project_id);
        const d=daysDiff(m.date);
        const dcss=d<0?'color:var(--red)':d===0?'color:var(--success);font-weight:600':d<=3?'color:var(--blue)':'color:var(--gray-500)';
        const dlbl=d<0?Math.abs(d)+'d overdue':d===0?'Today':fmt(m.date);
        return'<tr style="border-bottom:1px solid var(--gray-50)">'+
          (i===0?'<td style="padding:7px 12px;font-size:12px;font-weight:600;color:'+DEPT_COLORS[dept]+';white-space:nowrap;vertical-align:top" rowspan="'+dms.length+'">'+dept+'</td>':'')+
          '<td style="padding:6px 12px;font-size:12px;font-weight:500">'+(proj?proj.name:'—')+'</td>'+
          '<td style="padding:6px 12px;font-size:11px;color:var(--gray-500);font-family:var(--mono)">'+(proj?.so_number||'')+'</td>'+
          '<td style="padding:6px 12px;font-size:11px">'+m.label+'</td>'+
          '<td style="padding:6px 12px;font-size:11px;'+dcss+'">'+dlbl+'</td>'+
          '<td style="padding:6px 12px">'+slDots(m.id)+'</td>'+
        '</tr>';
      }).join('');
    }).join('');
    return'<div class="section" style="margin-bottom:12px">'+
      '<div class="section-head">'+
        '<div class="section-title">'+w.label+' — '+fmt(isoD(w.start))+' to '+fmt(isoD(addD(w.start,4)))+'</div>'+
        '<div style="display:flex;gap:8px;align-items:center">'+
          (reds>0?'<span style="font-size:11px;font-weight:600;color:#ef4444">🔴 '+reds+' escalation'+(reds>1?'s':'')+'</span>':'')+
          (yellows>0?'<span style="font-size:11px;font-weight:600;color:#eab308">🟡 '+yellows+' in trouble</span>':'')+
          '<span style="font-size:11px;color:var(--gray-500)">'+greens+' on track · '+unchecked+' not checked</span>'+
        '</div>'+
      '</div>'+
      (allMs.length?'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>'+
        '<th style="'+thStyle+'">Dept</th><th style="'+thStyle+'">Project</th><th style="'+thStyle+'">SO</th><th style="'+thStyle+'">Milestone</th><th style="'+thStyle+'">Date</th><th style="'+thStyle+'">Status</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty-state">No milestones this week.</div>')+
    '</div>';
  }).join('');

  el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">'+
    '<div><div style="font-size:16px;font-weight:600">🚦 Department check-in</div>'+
    '<div style="font-size:12px;color:var(--gray-500);margin-top:2px">Dept leads update via <strong>signifi-ops.vercel.app/checkin</strong></div></div>'+
    '<button class="btn-export" onclick="loadAll()">↻ Refresh</button></div>'+
    '<div style="background:var(--blue-bg);border:1px solid #bfdbfe;border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:11px;color:var(--blue)">'+
    '<strong>Dept passcodes:</strong> Production: <code>prod2026</code> · UI: <code>ui2026</code> · Inventory: <code>inv2026</code> · Procurement: <code>proc2026</code> · MO: <code>mo2026</code> · QA: <code>qa2026</code> · Shipping: <code>ship2026</code> · Deployment: <code>deploy2026</code></div>'+
    weeksHtml;
}

async function saveIntake(){
  const name=document.getElementById('i-name').value.trim();const so=document.getElementById('i-so').value.trim();const client=document.getElementById('i-client').value.trim();
  if(!name||!so||!client){alert('Please fill in project name, SO number, and client.');return;}
  // Combine all section notes into the main notes field
  const sectionNotes=[
    document.getElementById('i-notes-readiness').value.trim(),
    document.getElementById('i-notes-production').value.trim(),
    document.getElementById('i-notes-ui').value.trim(),
    document.getElementById('i-notes-quality').value.trim(),
    document.getElementById('i-notes-shipping').value.trim(),
    document.getElementById('i-notes-install').value.trim(),
    document.getElementById('i-notes').value.trim(),
  ].filter(Boolean).join('\n\n');
  const pm=document.getElementById('i-pm').value.trim();
  const vinylType=document.getElementById('i-vinyl-type').value;
  const formFactor=document.getElementById('i-form-factor').value.trim();
  const{data:proj,error}=await sb.from('projects').insert({name,so_number:so,client,product_type:document.getElementById('i-type').value,quantity:parseInt(document.getElementById('i-qty').value)||null,location:document.getElementById('i-loc').value,notes:sectionNotes,status:'active',changed_by:currentUserName,pm,vinyl_type:vinylType,form_factor:formFactor}).select().single();
  if(error){alert('Error: '+error.message);return;}
  const msFields=[
    {id:'i-po',key:'po-release',label:'MO / PO Release'},
    {id:'i-parts-start',key:'arrival',label:'Parts ordering start'},
    {id:'i-parts-end',key:'arrival',label:'Parts arrival'},
    {id:'i-inv',key:'arrival',label:'Inventory pick'},
    {id:'i-ps',key:'production-start',label:'Production start'},
    {id:'i-pe',key:'production-end',label:'Production end'},
    {id:'i-plan',key:'other',label:'Planogram sign-off'},
    {id:'i-ui-s',key:'other',label:'UI start'},
    {id:'i-ui-e',key:'other',label:'UI end'},
    {id:'i-qs',key:'quality-start',label:'Quality start'},
    {id:'i-qe',key:'quality-end',label:'Quality end'},
    {id:'i-vinyl',key:'vinyl',label:'Vinyl / branding'},
    {id:'i-uat',key:'uat',label:'UAT'},
    {id:'i-ship',key:'shipping',label:'Pack & ship'},
    {id:'i-del',key:'delivery',label:'Delivery'},
    {id:'i-train',key:'training',label:'Training'},
    {id:'i-inst',key:'installation',label:'Installation'},
    {id:'i-care',key:'other',label:'Customer care start'},
  ];
  const ins=msFields.map(f=>{const v=document.getElementById(f.id).value;return v?{project_id:proj.id,key:f.key,label:f.label,date:v,changed_by:currentUserName}:null;}).filter(Boolean);
  if(ins.length)await sb.from('milestones').insert(ins);
  await logActivity('created project',name,so,proj.id,null,client);
  selectedProjId=proj.id;showToast('"'+name+'" added ✓');await loadAll();setTab('glance');

async function saveEditMs(id,oldLabel,oldDate){
  const newDate=document.getElementById('em-dt').value;
  const newLabel=document.getElementById('em-lbl').value.trim();
  const reason=document.getElementById('em-reason')?.value.trim()||'';
  const ms=milestones.find(m=>m.id===id);
  const proj=ms?projects.find(p=>p.id===ms.project_id):null;

  // Build update payload
  const update={label:newLabel,date:newDate,changed_by:currentUserName,changed_at:new Date().toISOString()};

  // Set original_date if this is the first time a date is being set
  if(!ms?.original_date&&newDate){
    update.original_date=newDate;
  }

  const{error}=await sb.from('milestones').update(update).eq('id',id);
  if(error){alert('Error: '+error.message);return;}

  // Record history if date actually changed
  if(oldDate&&newDate&&oldDate!==newDate){
    await sb.from('milestone_history').insert({
      milestone_id:id,
      project_id:proj?.id||null,
      old_date:oldDate,
      new_date:newDate,
      changed_by:currentUserName,
      reason:reason||null,
    });
    await logActivity('updated date',newLabel,newLabel,proj?.id||null,oldDate,newDate);
  }

  closeModal();showToast('Updated ✓');await loadAll();
}

  milestones.forEach(m=>{

// ── PP SAVE HELPERS ────────────────────────────────────────
function showPPSaved(){
  const el=document.getElementById('pp-saved');
  if(!el)return;
  el.style.display='inline';
  clearTimeout(ppSaveTimer);
  ppSaveTimer=setTimeout(()=>{el.style.display='none';},2000);
}

async function savePPSection(key,value){
  const existing=ppData.sections[key];
  if(existing){
    await sb.from('project_sections').update({content:value,updated_by:currentUserName,updated_at:new Date().toISOString()}).eq('id',existing.id);
    ppData.sections[key]={...existing,content:value};
  } else {
    const{data}=await sb.from('project_sections').insert({project_id:ppProjId,section_key:key,content:value,updated_by:currentUserName}).select().single();
    if(data)ppData.sections[key]=data;
  }
  showPPSaved();
}

async function savePPLink(label,url){
  // Map from quick link labels to project record columns
  const HUB_FIELD_MAP={
    'Odoo Task':'odoo_url',
    'Jira / UI Task':'ui_task_url',
    'QA Task':'qa_task_url',
    'Product Template':'product_template_url',
    'Badge Reader':'badge_reader_url',
    'Employee List':'employee_list_url',
  };
  // If this label maps to a hub field, write back to the projects table too
  const hubField=HUB_FIELD_MAP[label];
  if(hubField){
    await sb.from('projects').update({[hubField]:url,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',ppProjId);
    // Update local projects array so Generate Docs picks it up immediately
    const proj=projects.find(p=>p.id===ppProjId);
    if(proj)proj[hubField]=url;
    await logActivity('updated link',label,label,ppProjId,null,url);
  }
  // Also save to project_links for the quick links display
  const existing=ppData.links.find(l=>l.label===label);
  if(existing){
    await sb.from('project_links').update({url}).eq('id',existing.id);
    existing.url=url;
  } else {
    const{data}=await sb.from('project_links').insert({project_id:ppProjId,label,url,category:'',sort_order:ppData.links.length}).select().single();
    if(data)ppData.links.push(data);
  }
  showPPSaved();
}

// Team CRUD
const ppTeamSaveTimer={};
async function ppTeamChange(id,field,val){
  // Update local data immediately
  let item=ppData.team.find(t=>t.id===id);
  if(!item){
    // Create a new local item if not found
    item={id,project_id:ppProjId,role:'',name:'',organization:'',email:''};
    ppData.team.push(item);
  }
  item[field]=val;

  // Debounce the Supabase save by 600ms
  clearTimeout(ppTeamSaveTimer[id]);
  ppTeamSaveTimer[id]=setTimeout(async()=>{
    if(id.startsWith('new-')){
      // New row — insert and swap ID
      const{data,error}=await sb.from('project_team').insert({
        project_id:ppProjId,
        role:item.role||'',name:item.name||'',
        organization:item.organization||'',email:item.email||'',
        sort_order:ppData.team.indexOf(item)
      }).select().single();
      if(data){
        // Swap the temp ID for the real one in DOM and data
        const row=document.querySelector('#pp-team tr[data-id="'+id+'"]');
        if(row){
          row.dataset.id=data.id;
          row.querySelectorAll('[data-rowid]').forEach(el=>el.dataset.rowid=data.id);
          // Update onchange handlers
          row.querySelectorAll('input').forEach(inp=>{
            const oc=inp.getAttribute('onchange');
            if(oc)inp.setAttribute('onchange',oc.replace(id,data.id));
          });
          const delBtn=row.querySelector('.pp-del');
          if(delBtn)delBtn.setAttribute('onclick',"ppDelTeam('"+data.id+"')");
        }
        item.id=data.id;
      }
    } else {
      // Existing row — update
      await sb.from('project_team').update({
        role:item.role||'',name:item.name||'',
        organization:item.organization||'',email:item.email||''
      }).eq('id',id);
    }
    showPPSaved();
  },600);
}

let activeDocTab='install';
let selectedDocProjId=null;
// docFormState keyed by projectId so switching projects preserves each project's data
let docFormState={};

function getDocState(){
  const pid=selectedDocProjId||'__none';
  if(!docFormState[pid])docFormState[pid]={install:{},ui:{},qa:{}};
  return docFormState[pid];
}
// Fields auto-filled from project record — never restore these from state (they should always reflect the selected project)
const AUTO_FILL_FIELDS=new Set(['if-so','if-client','if-ship','if-del','if-inst','if-vinyl','if-odoo','if-ui-task','if-qa-task','if-template','if-badge','if-employee','qf-ship','qf-vinyl','qf-jira-task','qf-jira-product','qf-jira-badge','qf-employee','uf-client']);

function saveDocFormState(){
  const state={};
  document.querySelectorAll('#tab-gendocs input,#tab-gendocs select,#tab-gendocs textarea').forEach(el=>{
    if(el.id&&!AUTO_FILL_FIELDS.has(el.id))state[el.id]=el.value;
  });
  getDocState()[activeDocTab]=state;
}
function restoreDocFormState(){
  const state=getDocState()[activeDocTab]||{};
  Object.entries(state).forEach(([id,val])=>{
    if(AUTO_FILL_FIELDS.has(id))return; // never overwrite auto-filled fields
    const el=document.getElementById(id);
    if(el)el.value=val;
  });
  // Restore generated output if any
  const out=getDocState()[activeDocTab]?.__output;
  if(out){
    const outEl=document.getElementById('doc-output-'+activeDocTab);
    const contEl=document.getElementById('doc-content-'+activeDocTab);
    if(outEl&&contEl){outEl.style.display='block';contEl.textContent=out;}
  }
}

  saveDocFormState();
  const el=document.getElementById('tab-gendocs');
  const projOpts=projects.map(p=>`<option value="${p.id}"${p.id===selectedDocProjId?' selected':''}>${p.name} — ${p.so_number||'No SO'}</option>`).join('');
  el.innerHTML=`
    <div class="section">
      <div class="section-head"><div class="section-title">📄 Generate documents</div><div class="section-meta">Fill in once → get all three docs instantly</div></div>
      <div style="padding:16px">
        <div class="proj-select-row">
          <label>Project</label>
          <select onchange="selectedDocProjId=this.value;renderGenDocs()"><option value="">Select project...</option>${projOpts}</select>
          ${selectedDocProjId?`<span style="font-size:11px;color:var(--gray-500)">Dates and client info auto-pulled ✓</span>`:''}
        </div>
        <div class="doc-tabs" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">

function getDocDate(key){if(!selectedDocProjId)return'';const m=milestones.find(m=>m.project_id===selectedDocProjId&&m.key===key);return m?fmtFull(m.date):'';}
// Gets a link for Generate Docs — checks project record first, then project_links table
function getDocLink(label){
  const p=getDocProj();
  // Check direct project record fields first
  const DIRECT={'Odoo Task':p.odoo_url,'Jira / UI Task':p.ui_task_url,'QA Task':p.qa_task_url,'Product Template':p.product_template_url,'Badge Reader':p.badge_reader_url,'Employee List':p.employee_list_url};
  if(DIRECT[label])return DIRECT[label]||'';
  // Fall back to project_links table (set via project page)
  // ppData may have the right project loaded — check if it matches
  if(ppProjId===selectedDocProjId&&ppData.links.length){
    const found=ppData.links.find(l=>l.label===label);
    if(found?.url)return found.url;
  }
  return'';
}

function copyDocText(elId){
  const el=document.getElementById(elId);
  if(!el)return;
  const text=el.textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('Copied ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied ✓');
  });
}
function copyDoc(type){
  const text=getDocState()[type]?.__output||document.getElementById('doc-content-'+type)?.textContent||'';

}

async function toggleArchive(id,currentStatus){
  const newStatus=currentStatus==='complete'?'active':'complete';
  if(!confirm(`${newStatus==='complete'?'Mark this project complete':'Restore this project to active'}?`))return;
  const{error}=await sb.from('projects').update({status:newStatus,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Error: '+error.message);return;}
  const proj=projects.find(p=>p.id===id);
  await logActivity(newStatus==='complete'?'marked complete':'restored to active',proj?.name||'',proj?.so_number||'',id,currentStatus,newStatus);
  showToast(newStatus==='complete'?'Project marked complete ✓':'Project restored ✓');
  await loadAll();
}

  const poEl=document.getElementById('i-po');if(!poEl||!poEl.value){alert('Please enter the MO/PO release date first.');return;}
  const base=new Date(poEl.value+'T00:00:00');
  const KEY_MAP={'po-release':'i-po','arrival':'i-parts-end','production-start':'i-ps','production-end':'i-pe','quality-start':'i-qs','quality-end':'i-qe','vinyl':'i-vinyl','uat':'i-uat','ui-start':'i-ui-s','ui-end':'i-ui-e','shipping':'i-ship','delivery':'i-del','installation':'i-inst'};
  Object.entries(t.offsets).forEach(([key,days])=>{
    const inputId=KEY_MAP[key];if(!inputId)return;
    const el=document.getElementById(inputId);if(!el||el.id==='i-po')return;
    const d=new Date(base);d.setDate(d.getDate()+days);
    el.value=isoD(d);
  });
  showToast('Dates filled from template — adjust as needed ✓');
}

// ── EXPORT PROJECT PAGE ────────────────────────────────────
function exportProjPageExcel(){
  const proj=projects.find(p=>p.id===ppProjId);
  if(!proj){showToast('No project selected');return;}
  const pMs=milestones.filter(m=>m.project_id===ppProjId);
  const wb=XLSX.utils.book_new();
  const dateStr=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const statusVal=getSection('status')||'on-track';
  const statusLbl=statusVal==='on-track'?'On Track':statusVal==='at-risk'?'At Risk':'Off Track';
  // Sheet 1: Overview
  const r1=[
    ['PROJECT PAGE EXPORT',''],['Generated',dateStr],['',''],
    ['PROJECT INFORMATION',''],['Project Name',proj.name||''],['Sales Order (SO)',proj.so_number||''],
    ['Client',proj.client||''],['Project Manager',proj.pm||''],['Status',statusLbl],
    ['Current Phase',getSection('phase')||''],['Product Type',proj.product_type||''],['Location',proj.location||''],
    ['',''],['PROJECT SUMMARY',''],[(getSection('summary')||''),''],
    ['',''],['KEY LINKS',''],
    ['Odoo Task',proj.odoo_url||''],['Jira / UI Task',proj.ui_task_url||''],
    ['QA Task',proj.qa_task_url||''],['Product Template',proj.product_template_url||''],
    ['Badge Reader',proj.badge_reader_url||''],['Employee List',proj.employee_list_url||''],
    ...ppData.links.filter(l=>!['Odoo Task','Jira / UI Task','QA Task','Product Template','Badge Reader','Employee List'].includes(l.label)).map(l=>[l.label,l.url||'']),
    ['',''],['INTERNAL NOTES',''],[(getSection('notes')||''),''],
  ];
  const ws1=XLSX.utils.aoa_to_sheet(r1);ws1['!cols']=[{wch:22},{wch:55}];
  XLSX.utils.book_append_sheet(wb,ws1,'Overview');
  // Sheet 2: Milestones
  const r2=[['MILESTONE TRACKER','','',''],['Milestone','Date','Days from today','Status']];
  [...pMs].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>{
    const d=daysDiff(m.date);
    r2.push([m.label,m.date||'',m.date?d:'',d<0?'Done':d===0?'Today':d<=7?'In '+d+'d':'In '+d+'d']);
  });
  const ws2=XLSX.utils.aoa_to_sheet(r2);ws2['!cols']=[{wch:28},{wch:14},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Milestones');
  // Sheet 3: Team
  const r3=[['PROJECT TEAM','','',''],['Role','Name','Organization','Email']];
  ppData.team.forEach(m=>r3.push([m.role||'',m.name||'',m.organization||'',m.email||'']));
  const ws3=XLSX.utils.aoa_to_sheet(r3);ws3['!cols']=[{wch:22},{wch:22},{wch:22},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws3,'Project Team');
  // Sheet 4: Action items
  const r4=[['ACTION ITEMS','','',''],['Owner','Action Item','Due Date','Status']];
  ppData.actions.forEach(a=>r4.push([a.owner||'',a.description||'',a.due_date||'',a.status||'']));
  const ws4=XLSX.utils.aoa_to_sheet(r4);ws4['!cols']=[{wch:16},{wch:45},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws4,'Action Items');
  // Sheet 5: Risks & Issues
  const r5=[['RISKS & ISSUES','','','',''],['Type','Description','Impact / Resolution','Owner','Status']];
  ppData.risks.forEach(r=>r5.push([r.type||'Risk',r.description||'',r.type==='Risk'?r.impact||'':r.mitigation||'',r.owner||'',r.status||'']));
  const ws5=XLSX.utils.aoa_to_sheet(r5);ws5['!cols']=[{wch:8},{wch:40},{wch:30},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws5,'Risks & Issues');
  // Sheet 6: Decisions
  const r6=[['DECISION LOG','',''],['Date','Decision','Approved By']];
  ppData.decisions.forEach(d=>r6.push([d.decision_date||'',d.description||'',d.approved_by||'']));
  const ws6=XLSX.utils.aoa_to_sheet(r6);ws6['!cols']=[{wch:14},{wch:50},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws6,'Decision Log');
  const fname=(proj.so_number||proj.name).replace(/[^a-zA-Z0-9]/g,'_')+'_ProjectPage_'+new Date().toISOString().split('T')[0]+'.xlsx';
  XLSX.writeFile(wb,fname);
  showToast('Project page exported ✓');
}


loadAll();
