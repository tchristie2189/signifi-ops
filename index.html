}

function onProjPageSearch(val){
  if(!val||val.length<2)return;
  // Match by full display string or partial name — handles projects with dashes in names
  const vl=val.toLowerCase();
  const match=projects.find(p=>{
    const display=p.name+(p.so_number?' — '+p.so_number:'');
    if(display.toLowerCase()===vl)return true;
    if(p.name.toLowerCase()===vl)return true;
    if(p.so_number&&val.includes(p.so_number))return true;
    return false;
  })||projects.find(p=>{ // fallback: starts-with match
    const display=p.name+(p.so_number?' — '+p.so_number:'');
    return display.toLowerCase().startsWith(vl)||p.name.toLowerCase().startsWith(vl);
  });
  if(match&&match.id!==ppProjId){
    switchProjPage(match.id);
    document.getElementById('pp-proj-search').blur();
  }
}
function toggleAllSOView(){
  const modal=document.getElementById('modal-root');
  const proj=projects.find(p=>p.id===ppProjId);
  if(!proj)return;
  if(window._allSOSourceProjId!==ppProjId){window._allSOSourceOverride=null;window._allSOSourceProjId=ppProjId;}

  // Support both SO-split (so_tag on milestones) and campaign children (separate projects per SO)
  const soListFromField=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const children=getChildren(ppProjId); // campaign children

  // Determine mode: so_tag split or campaign children
  const pMs=milestones.filter(m=>m.project_id===ppProjId&&m.so_tag);
  const isSoSplit=pMs.length>0;
  const isCampaign=children.length>0;

  if(!isSoSplit&&!isCampaign){
    modal.innerHTML='<div class="modal-backdrop" onclick="closeModal()"><div class="modal" style="width:420px" onclick="event.stopPropagation()">'
      +'<div class="modal-head"><span class="modal-title">📊 All SO Milestones</span><button class="modal-close" onclick="closeModal()">×</button></div>'
      +'<div style="padding:20px;font-size:13px;color:var(--gray-600);line-height:1.6">'
      +'<strong>'+proj.name+'</strong> has '+soListFromField.length+' SOs but milestones haven\'t been split yet.<br><br>'
      +'Split milestones by SO to manage and compare each independently.'
      +'</div>'
      +'<div class="modal-actions">'
      +'<button class="btn" onclick="closeModal()">Cancel</button>'
      +'<button class="btn btn-primary" onclick="closeModal();splitMilestonesBySO(\''+ppProjId+'\')">⚡ Split by SO now</button>'
      +'</div>'
      +'</div></div>';
    return;
  }

  let soHeaders=[];
  let getMsForSO;

  if(isSoSplit){
    // CRITICAL: derive SO list from BOTH the so_number field AND actual so_tag values present
    // This catches drift (e.g. so_number says S17843 but milestones tagged S17842)
    const tagsPresent=[...new Set(pMs.map(m=>m.so_tag))];
    const merged=[...new Set([...soListFromField,...tagsPresent])];
    soHeaders=merged;
    const msMap={};
    pMs.forEach(m=>{if(!msMap[m.key])msMap[m.key]={};msMap[m.key][m.so_tag]=m;});
    getMsForSO=(key)=>msMap[key]||{};
  } else {
    soHeaders=children.map(c=>c.so_number||c.name);
    const msMap={};
    children.forEach(c=>{
      const so=c.so_number||c.name;
      milestones.filter(m=>m.project_id===c.id).forEach(m=>{
        if(!msMap[m.key])msMap[m.key]={};
        msMap[m.key][so]={...m,_childId:c.id};
      });
    });
    getMsForSO=(key)=>msMap[key]||{};
  }

  // Collect all unique milestone keys+labels in order (use key+label combo to avoid dupes mismatching)
  const allMs=isSoSplit?pMs:milestones.filter(m=>children.some(c=>c.id===m.project_id));
  const seen=new Set();
  const rowDefs=[];
  allMs.forEach(m=>{const k=m.key+'|'+m.label;if(!seen.has(k)){seen.add(k);rowDefs.push({key:m.key,label:m.label});}});

  // Detect SOs missing entirely from milestones (so_number has them but no milestones exist)
  const missingSOs=isSoSplit?soListFromField.filter(so=>!pMs.some(m=>m.so_tag===so)):[];
  const mismatchBanner=missingSOs.length?'<div style="font-size:11px;color:#92400e;background:#fffbeb;border-bottom:1px solid #d97706;padding:8px 16px">⚠️ '+missingSOs.length+' SO'+(missingSOs.length>1?'s':'')+' ('+missingSOs.join(', ')+') '+(missingSOs.length>1?'have':'has')+' no milestones yet. <button onclick="addMissingSOMilestones(\''+ppProjId+'\',\''+missingSOs.join(',')+'\')" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid #d97706;background:white;color:#92400e;cursor:pointer;font-family:var(--font);margin-left:6px;font-weight:600">+ Add milestones for these SOs</button></div>':'';

  const thead='<tr>'
    +'<th style="text-align:left;padding:8px 10px;font-size:11px;color:var(--gray-500);background:var(--gray-50)">Milestone</th>'
    +soHeaders.map(so=>'<th style="padding:8px 10px;font-size:11px;color:var(--red);font-weight:700;background:var(--gray-50);text-align:center">'+so+(missingSOs.includes(so)?' ⚠️':'')+'</th>').join('')
    +'<th style="padding:8px 10px;font-size:11px;color:var(--gray-500);background:var(--gray-50);text-align:center">Match all</th>'
    +'</tr>';

  // Source SO defaults to whichever has data, but the person can override via dropdown below
  const defaultSourceSO=soHeaders.find(so=>pMs.some(m=>m.so_tag===so))||soHeaders[0];
  const activeSourceSO=window._allSOSourceOverride||defaultSourceSO;

  const sourceSelector='<div style="padding:8px 16px;background:#fff7ed;border-bottom:1px solid #fed7aa;display:flex;align-items:center;gap:8px">'
    +'<span style="font-size:11px;color:#92400e;font-weight:600">📌 Source SO (used by Match all buttons):</span>'
    +'<select onchange="window._allSOSourceOverride=this.value;toggleAllSOView()" style="font-size:12px;padding:3px 10px;border:1px solid #d97706;border-radius:6px;background:white;color:#92400e;font-weight:600">'
    +soHeaders.map(so=>'<option value="'+so+'"'+(so===activeSourceSO?' selected':'')+'>'+so+'</option>').join('')
    +'</select>'
    +'</div>';

  const tbody=rowDefs.map(({key,label})=>{
    const row=getMsForSO(key);
    // Source date comes from the selected source SO (same SO for every row, person-controlled)
    const sourceM=Object.values(row).find(m=>m.key===key&&m.label===label&&m.so_tag===activeSourceSO)||row[activeSourceSO];
    const firstDate=sourceM?.date||'';
    return'<tr style="border-bottom:1px solid var(--gray-100)">'
      +'<td style="padding:6px 10px;font-size:12px;font-weight:500;white-space:nowrap">'+label+'</td>'
      +soHeaders.map(so=>{
        const m=row[so];
        const d=m?.date?daysDiff(m.date):null;
        const clr=!m?'color:var(--gray-300)':isMilestoneEffectivelyDone(m)?'color:var(--success);font-weight:600':d!==null&&d<0?'color:var(--red);font-weight:600':d!==null&&d<=7?'color:#d97706':'color:var(--gray-700)';
        const dateStr=m?.date?'<div style="font-size:12px">'+fmt(m.date)+'</div><div style="font-size:10px;opacity:0.7">'+(isMilestoneEffectivelyDone(m)?'Done ✓':d===0?'Today':d!==null?(d<0?Math.abs(d)+'d ago':'in '+d+'d'):'')+'</div>':'<span style="color:var(--gray-300)">—</span>';
        return'<td style="padding:6px 10px;text-align:center;'+clr+(so===activeSourceSO?';background:#fff7ed':'')+'">'+dateStr+'</td>';
      }).join('')
      +'<td style="padding:4px 8px;text-align:center">'+(firstDate?'<button onclick="pushMsKeyToAllSOs(\''+key+'\',\''+firstDate+'\',\''+ppProjId+'\',\''+label.replace(/'/g,"\\'")+'\')" style="font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--gray-200);background:white;color:var(--blue);cursor:pointer;font-family:var(--font)" title="Push '+activeSourceSO+' date to all other SOs">Match all</button>':'')+'</td>'
      +'</tr>';
  }).join('');

  modal.innerHTML='<div class="modal-backdrop" onclick="closeModal()"><div class="modal" style="width:min(95vw,1000px);max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">'
    +'<div class="modal-head"><span class="modal-title">📊 All SO Milestones — '+proj.name+'</span><button class="modal-close" onclick="closeModal()">×</button></div>'
    +mismatchBanner
    +sourceSelector
    +'<div style="font-size:11px;color:var(--blue);background:var(--blue-bg);border-bottom:1px solid #bfdbfe;padding:8px 16px">💡 Click <strong>Match all</strong> on any row to push <strong>'+activeSourceSO+'</strong>\'s date for that milestone to all other SOs</div>'
    +'<div style="overflow-x:auto;padding:0"><table style="width:100%;border-collapse:collapse"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>'
    +'<div class="modal-actions"><button onclick="pushAllMilestoneKeysToAllSOs(\''+ppProjId+'\',\''+activeSourceSO+'\')" style="font-size:12px;padding:6px 14px;border-radius:var(--radius);border:none;background:var(--red);color:white;cursor:pointer;font-family:var(--font);font-weight:600">⚡ Match ALL milestones from '+activeSourceSO+'</button><button class="btn" onclick="closeModal()">Close</button></div>'
    +'</div></div>';
}

async function pushMsKeyToAllSOs(key,date,projId,label){
  const proj=projects.find(p=>p.id===projId);
  if(!proj)return;
  const soListFromField=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const tagsPresent=[...new Set(milestones.filter(m=>m.project_id===projId&&m.so_tag).map(m=>m.so_tag))];
  const soList=[...new Set([...soListFromField,...tagsPresent])];
  const children=getChildren(projId);
  let updated=0;
  if(milestones.some(m=>m.project_id===projId&&m.so_tag)){
    // SO split — update all so_tag variants, match by key AND label
    for(const so of soList){
      const m=milestones.find(x=>x.project_id===projId&&x.key===key&&x.so_tag===so&&(!label||x.label===label));
      if(m){
        const{error}=await sb.from('milestones').update({date,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',m.id);
        if(!error){m.date=date;updated++;}
      }
    }
  } else {
    // Campaign children
    for(const c of children){
      const m=milestones.find(x=>x.project_id===c.id&&x.key===key&&(!label||x.label===label));
      if(m){
        const{error}=await sb.from('milestones').update({date,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',m.id);
        if(!error){m.date=date;updated++;}
      }
    }
  }
  if(updated===0){showToast('No milestones updated — check SO tags');return;}
  showToast('Pushed to '+updated+' SOs ✓');
  await loadAll();
  toggleAllSOView();
}

async function pushAllMilestoneKeysToAllSOs(projId,explicitSourceSO){
  const proj=projects.find(p=>p.id===projId);
  const soListFromField=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const tagsPresent=[...new Set(milestones.filter(m=>m.project_id===projId&&m.so_tag).map(m=>m.so_tag))];
  const soList=[...new Set([...soListFromField,...tagsPresent])];
  const firstSO=explicitSourceSO||soList.find(so=>milestones.some(m=>m.project_id===projId&&m.so_tag===so))||soList[0];
  if(!confirm('Match ALL milestones across all SOs to '+firstSO+'\'s dates?\n\nThis overwrites dates on all other SOs.'))return;
  const sourceMilestones=milestones.filter(m=>m.project_id===projId&&m.so_tag===firstSO);
  let updated=0;
  for(const src of sourceMilestones){
    if(!src.date)continue;
    for(const so of soList.filter(s=>s!==firstSO)){
      const tgt=milestones.find(m=>m.project_id===projId&&m.so_tag===so&&m.key===src.key&&m.label===src.label)
               ||milestones.find(m=>m.project_id===projId&&m.so_tag===so&&m.label===src.label);
      if(tgt){await sb.from('milestones').update({date:src.date,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',tgt.id);tgt.date=src.date;updated++;}
    }
  }
  showToast('Matched '+updated+' milestones from '+firstSO+' to other SOs ✓');
  closeModal();
  await loadAll();
}

async function addMissingSOMilestones(projId,missingSOsStr){
  const proj=projects.find(p=>p.id===projId);
  if(!proj)return;
  const missingSOs=missingSOsStr.split(/[\s,;]+/).filter(Boolean);
  if(!missingSOs.length)return;
  // Use the SO with the most complete milestone set as the template
  const allTags=[...new Set(milestones.filter(m=>m.project_id===projId&&m.so_tag).map(m=>m.so_tag))];
  const templateSO=allTags.find(so=>!missingSOs.includes(so))||allTags[0];
  if(!templateSO){showToast('No template SO found to copy from');return;}
  const templateMs=milestones.filter(m=>m.project_id===projId&&m.so_tag===templateSO);
  if(!templateMs.length){showToast('Template SO has no milestones');return;}
  if(!confirm('Add '+templateMs.length+' milestones to '+missingSOs.length+' SO'+(missingSOs.length>1?'s':'')+' ('+missingSOs.join(', ')+')?\n\nDates will be blank — set them after.'))return;
  const newRows=[];
  for(const so of missingSOs){
    for(const m of templateMs){
      newRows.push({project_id:projId,key:m.key,label:m.label,date:null,so_tag:so,changed_by:currentUserName});
    }
  }
  const{error}=await sb.from('milestones').insert(newRows);
  if(error){alert('Error: '+error.message);return;}
  showToast('Added milestones for '+missingSOs.length+' SO(s) ✓');
  await loadAll();
  toggleAllSOView();
}

function switchProjPageBySO(so){
  // For SO-split projects: scroll to that SO's group in the milestone tracker
  // Only navigate away if it's a campaign child project with its own page
  const child=projects.find(p=>p.id!==ppProjId&&p.parent_project_id===ppProjId&&p.so_number&&p.so_number.split(/[\s,;]+/).map(s=>s.trim()).includes(so));
  if(child){switchProjPage(child.id);return;}
  // Same project — find the SO header span in the milestone table and scroll to it
  const spans=[...document.querySelectorAll('span')];
  const soSpan=spans.find(s=>s.textContent.trim()==='SO: '+so&&s.style.color&&s.style.color.includes('rgb'));
  if(soSpan){
    soSpan.closest('tr')?.scrollIntoView({behavior:'smooth',block:'center'});
    soSpan.closest('td').style.background='#fff0f0';
    setTimeout(()=>{if(soSpan.closest('td'))soSpan.closest('td').style.background='';},1500);
  } else {
    // Fall back to project page tab
    setTab('projpage');
    showToast('SO '+so+' — milestones in tracker below');
  }
}

function renderProjPageBody(){

  const pMs=milestones.filter(m=>m.project_id===ppProjId);

  const statusLbl=statusVal==='on-track'?'🟢 On Track':statusVal==='at-risk'?'🟡 At Risk':'🔴 Off Track';
  const goLive=pMs.find(m=>m.key==='installation')?.date||'';
  const phase=getSection('phase')||'Execution';

  // Quick links — merge saved project_links table + project record fields (source of truth)
  const LINK_CATS=[
    {cat:'Meetings',items:[{label:'Kickoff deck',key:'kickoff_deck'},{label:'Kickoff recording',key:'kickoff_rec'},{label:'Meeting minutes',key:'meeting_min'}]},
    {cat:'Project Documents',items:[{label:'Statement of Work',key:'sow'},{label:'Installation Ticket',key:'install_ticket'},{label:'Vision Training',key:'vision_training'}]},
    {cat:'Custom',items:[{label:'Custom link 1',key:'custom_1'},{label:'Custom link 2',key:'custom_2'},{label:'Custom link 3',key:'custom_3'},{label:'Custom link 4',key:'custom_4'},{label:'Custom link 5',key:'custom_5'}]},
    {cat:'Systems & Tools',items:[{label:'Teams Channel',key:'teams'},{label:'SharePoint Site',key:'sharepoint'},{label:'Jira / UI Task',key:'jira'},{label:'QA Task',key:'qa_task'},{label:'Product Template',key:'product_template'},{label:'Badge Reader',key:'badge_reader'},{label:'Employee List',key:'employee_list'},{label:'Facility Site Survey',key:'facility_survey'},{label:'IT Site Survey',key:'it_survey'},{label:'Odoo Task',key:'odoo'},{label:'Vinyl Render Odoo',key:'vinyl_odoo'},{label:'Client Portal',key:'client_portal'}]},
  ];
  // Start with anything saved in project_links table
  // Build multi-link map: {label: [url, url2, ...]}
  const linkMap={};
  ppData.links.forEach(l=>{if(!linkMap[l.label])linkMap[l.label]=[];if(l.url)linkMap[l.label].push({url:l.url,id:l.id});});
  // Override with project record fields (authoritative single-value sources)
  const projLinkOverrides={'Odoo Task':proj.odoo_url,'Jira / UI Task':proj.ui_task_url,'QA Task':proj.qa_task_url,'Product Template':proj.product_template_url,'Badge Reader':proj.badge_reader_url,'Employee List':proj.employee_list_url,'Facility Site Survey':proj.facility_survey_url,'IT Site Survey':proj.it_survey_url,'Vision Training':proj.vision_training_url,'Vinyl Render Odoo':proj.vinyl_odoo_url,'Installation Ticket':proj.install_ticket_url,'Kickoff deck':proj.kickoff_deck_url};
  Object.entries(projLinkOverrides).forEach(([label,url])=>{if(url){if(!linkMap[label])linkMap[label]=[];if(!linkMap[label].find(x=>x.url===url))linkMap[label].unshift({url,id:'proj-'+label});}});
  // Keep backward compat for things that still use linkVals
  const linkVals=Object.fromEntries(Object.entries(linkMap).map(([k,v])=>[k,v[0]?.url||'']));

  const linksHtml=LINK_CATS.map(cat=>`
    <div style="margin-bottom:10px">
      <div style="font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px">${cat.cat}</div>
      ${cat.items.map(item=>{
        const isCustomCat=cat.cat==='Custom';
        if(isCustomCat){
          const savedRow=ppData.links.find(l=>l.category===item.key);
          const savedName=savedRow?(savedRow.label||item.label):item.label;
          const savedUrl=savedRow?(savedRow.url||''):'';
          const nameInput='<input class="pp-link-label" value="'+savedName.replace(/"/g,'&quot;')+'" placeholder="Name this link..." style="cursor:text;border:none;border-bottom:1px dashed var(--gray-300);background:transparent;font-size:11px;color:var(--gray-600);width:105px;font-family:var(--font)" onblur="saveCustomLink(\''+item.key+'\',this.value,null)">';
          const urlInput='<input class="pp-link-input" value="'+savedUrl.replace(/"/g,'&quot;')+'" placeholder="https://..." onchange="saveCustomLink(\''+item.key+'\',null,this.value)" onblur="saveCustomLink(\''+item.key+'\',null,this.value)">'+(savedUrl?'<a href="'+savedUrl+'" target="_blank" class="pp-link-go">↗</a>':'<span class="pp-link-go"> </span>');
          return '<div class="pp-link-item">'+nameInput+urlInput+'</div>';
        }
        const entries=linkMap[item.label]||[];
        const labelHtml='<span class="pp-link-label">'+item.label+'</span>';
        const rows=entries.length?entries.map((e,i)=>
          '<div class="pp-link-item" style="padding-left:'+(i>0?'110px':'0')+'">'
          +(i===0?labelHtml:'<span class="pp-link-label" style="opacity:0"> </span>')
          +'<input class="pp-link-input" id="ppl-new-'+e.id+'" value="'+e.url.replace(/"/g,'&quot;')+'" placeholder="https://..." onchange="updatePPLink(\''+item.label+'\','+i+',this.value)" onblur="updatePPLink(\''+item.label+'\','+i+',this.value)">'
          +(e.url?'<a href="'+e.url+'" target="_blank" class="pp-link-go">↗</a>':'<span class="pp-link-go"> </span>')
          +'<button onclick="removePPLink(\''+item.label+'\','+i+')" style="background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:13px;padding:0 2px">✕</button>'
          +'</div>').join('')
        :'<div class="pp-link-item">'+labelHtml+'<input class="pp-link-input" value="" placeholder="https://..." onchange="savePPLink(\''+item.label+'\',this.value)" onblur="if(this.value)savePPLink(\''+item.label+'\',this.value)"><span class="pp-link-go"> </span></div>';
        return rows+'<div style="padding-left:110px;margin-top:2px"><button onclick="addPPLink(\''+item.label+'\')" style="font-size:10px;color:var(--blue);background:none;border:none;cursor:pointer;padding:0;font-family:var(--font)">+ Add link</button></div>';
      }).join('')}
    </div>`).join('');

  // Team table
  const DEFAULT_ROLES=['Executive Sponsor','Client Lead','Project Manager','Technical Lead','Operations Lead','Logistics Lead','QA Lead'];
  const teamRows=ppData.team.length?ppData.team:DEFAULT_ROLES.map((r,i)=>({id:'new-'+i,role:r,name:'',organization:'',email:'',_new:true}));
  const teamHtml=teamRows.map(m=>`<tr data-id="${m.id}">
    <td><input value="${m.role||''}" placeholder="Role" oninput="ppTeamChange('${m.id}','role',this.value)"></td>
    <td><input value="${m.name||''}" placeholder="Name" oninput="ppTeamChange('${m.id}','name',this.value)"></td>
    <td><input value="${m.organization||''}" placeholder="Org" oninput="ppTeamChange('${m.id}','organization',this.value)"></td>
    <td><input value="${m.email||''}" placeholder="Email" oninput="ppTeamChange('${m.id}','email',this.value)"></td>
    <td class="pp-actions"><button class="pp-del" onclick="ppDelTeam('${m.id}')">✕</button></td>
  </tr>`).join('');

  // Milestones from hub — group by SO if split
  const ppProj=projects.find(p=>p.id===ppProjId);
  const ppHasSoTags=pMs.some(m=>m.so_tag);
  const ppSoList=(ppProj?.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);

  const buildPPMsRow=(m)=>{
    const isDone=isMilestoneEffectivelyDone(m);
    const isManualDone=isMilestoneDone(m);
    const isOverdue=isMilestoneOverdue(m);
    const isEscalation=isMilestoneEscalation(m);
    const isAtRisk=isMilestoneAtRisk(m);
    const ci=checkinStatus[m.id];
    const d=daysDiff(m.date);
    let chip,lbl;
    if(isDone){chip='chip-done';lbl='Done ✓';}
    else if(isEscalation){chip='chip-overdue';lbl='Escalation';}
    else if(isOverdue){chip='chip-overdue';lbl=Math.abs(d)+'d overdue';}
    else if(isAtRisk){chip='chip-atrisk';lbl='At risk';}
    else if(d===0){chip='chip-active';lbl='Today';}
    else if(d<=7){chip='chip-atrisk';lbl='In '+d+'d';}
    else{chip='chip-future';lbl=fmt(m.date);}
    if(!m.date){chip='chip-atrisk';lbl='⚠ no date — set one';}
    const slDot=ci?.stoplight?`<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${ci.stoplight==='green'?'#22c55e':ci.stoplight==='yellow'?'#eab308':'#ef4444'};margin-left:4px" title="Dept: ${ci.stoplight}"></span>`:'';
    const dev=ppProj?.parent_project_id?milestoneDeviations[ppProjId]?.[m.key]:null;
    const devTag=dev?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#ede9fe;color:#7c3aed;font-weight:600;margin-left:4px" title="Deviated from master">🔀 deviated</span>`:'';
    return`<tr>
      <td style="font-weight:500">${m.label}${slDot}${devTag}</td>
      <td class="date-cell">${fmt(m.date)}</td>
      <td><span class="status-chip ${chip}">${lbl}</span></td>
      <td style="display:flex;gap:4px;align-items:center">
        <button class="pp-del" style="color:var(--blue);font-size:11px" onclick="openEditMs('${m.id}','${m.label}','${m.date||''}','${m.so_tag||''}','${ppProjId}')">edit</button>
        <button onclick="toggleMilestoneDone('${m.id}','${ppProjId}',event)" style="background:${isManualDone?'var(--success)':'transparent'};border:1px solid ${isManualDone?'var(--success)':'var(--gray-300)'};border-radius:10px;padding:1px 6px;font-size:10px;cursor:pointer;color:${isManualDone?'white':'var(--gray-500)'};font-family:var(--font)">${isManualDone?'✓':'done'}</button>
      </td>
    </tr>`;
  };

  let msHtml='';
  if(ppHasSoTags&&ppSoList.length>1){
    // Group by SO. Union field-SOs with any tag actually present (orphan tags still
    // render), and always show untagged milestones as a project-wide group so nothing
    // can silently disappear from the tracker.
    const ppTags=[...new Set(pMs.filter(m=>m.so_tag).map(m=>m.so_tag))];
    const ppAllSOs=[...new Set([...ppSoList,...ppTags])];
    const ppUntagged=pMs.filter(m=>!m.so_tag).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const ppUntaggedHtml=ppUntagged.length?`<tr><td colspan="4" style="padding:6px 8px 2px;background:var(--gray-50)"><span style="font-size:10px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:0.06em;border-left:3px solid var(--gray-400);padding-left:6px">Project-wide (no SO tag)</span></td></tr>`+ppUntagged.map(buildPPMsRow).join(''):'';
    msHtml=ppUntaggedHtml+ppAllSOs.map(so=>{
      const soMs=pMs.filter(m=>m.so_tag===so).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      if(!soMs.length)return'';
      return`<tr><td colspan="4" style="padding:6px 8px 2px;background:var(--gray-50)">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.06em;border-left:3px solid var(--red);padding-left:6px">SO: ${so}</span>
          <button onclick="pushSODatesToAll('${ppProjId}','${so}')" style="font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid var(--gray-200);background:white;color:var(--gray-600);cursor:pointer;font-family:var(--font)">📅 Push to all</button>
        </div>
      </td></tr>`+soMs.map(buildPPMsRow).join('');
    }).join('');
  } else {
    // Non-grouped: show ALL milestones (no date filter) so blank-date ones remain visible & fixable
    msHtml=pMs.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(buildPPMsRow).join('');
  }

  // Action items
  const aiHtml=ppData.actions.map(a=>`<tr data-id="${a.id}">
    <td><input value="${a.owner||''}" placeholder="Owner" style="width:90px" oninput="ppAIChange('${a.id}','owner',this.value)"></td>
    <td><input value="${a.description||''}" placeholder="Action item" oninput="ppAIChange('${a.id}','description',this.value)"></td>
    <td><input type="date" value="${a.due_date||''}" oninput="ppAIChange('${a.id}','due_date',this.value)"></td>
    <td><select class="pp-status-sel ${a.status==='Done'?'status-done':a.status==='At Risk'?'status-risk':a.status==='On Hold'?'status-hold':'status-open'}" oninput="ppAIChange('${a.id}','status',this.value);this.className='pp-status-sel '+(this.value==='Done'?'status-done':this.value==='At Risk'?'status-risk':this.value==='On Hold'?'status-hold':'status-open')">
      <option${a.status==='Open'?' selected':''}>Open</option>
      <option${a.status==='Done'?' selected':''}>Done</option>
      <option${a.status==='At Risk'?' selected':''}>At Risk</option>
      <option${a.status==='On Hold'?' selected':''}>On Hold</option>
    </select></td>
    <td class="pp-actions"><button class="pp-del" onclick="ppDelAI('${a.id}')">✕</button></td>
  </tr>`).join('');

  // Risks
  const riskHtml=ppData.risks.filter(r=>r.type==='Risk').map(r=>`<tr data-id="${r.id}">
    <td><input value="${r.description||''}" placeholder="Risk" oninput="ppRiskChange('${r.id}','description',this.value)"></td>
    <td><input value="${r.impact||''}" placeholder="Impact" style="width:80px" oninput="ppRiskChange('${r.id}','impact',this.value)"></td>
    <td><input value="${r.mitigation||''}" placeholder="Mitigation" oninput="ppRiskChange('${r.id}','mitigation',this.value)"></td>
    <td><input value="${r.owner||''}" placeholder="Owner" style="width:80px" oninput="ppRiskChange('${r.id}','owner',this.value)"></td>
    <td><select class="pp-status-sel ${r.status==='Closed'?'status-done':r.status==='Active'?'status-risk':'status-open'}" oninput="ppRiskChange('${r.id}','status',this.value)">
      <option${r.status==='Open'?' selected':''}>Open</option><option${r.status==='Active'?' selected':''}>Active</option><option${r.status==='Closed'?' selected':''}>Closed</option>
    </select></td>
    <td class="pp-actions"><button class="pp-del" onclick="ppDelRisk('${r.id}')">✕</button></td>
  </tr>`).join('');

  const issueHtml=ppData.risks.filter(r=>r.type==='Issue').map(r=>`<tr data-id="${r.id}">
    <td><input value="${r.description||''}" placeholder="Issue" oninput="ppRiskChange('${r.id}','description',this.value)"></td>
    <td><input value="${r.owner||''}" placeholder="Owner" style="width:80px" oninput="ppRiskChange('${r.id}','owner',this.value)"></td>
    <td><input value="${r.mitigation||''}" placeholder="Target resolution" oninput="ppRiskChange('${r.id}','mitigation',this.value)"></td>
    <td><select class="pp-status-sel ${r.status==='Closed'?'status-done':'status-open'}" oninput="ppRiskChange('${r.id}','status',this.value)">
      <option${r.status==='Open'?' selected':''}>Open</option><option${r.status==='Closed'?' selected':''}>Closed</option>
    </select></td>
    <td class="pp-actions"><button class="pp-del" onclick="ppDelRisk('${r.id}')">✕</button></td>
  </tr>`).join('');

  // Decision / Approval Log
  const decHtml=ppData.decisions.map(d=>`<tr data-id="${d.id}">
    <td><input type="date" value="${d.decision_date||''}" style="width:120px" oninput="ppDecChange('${d.id}','decision_date',this.value)"></td>
    <td><input value="${d.description||''}" placeholder="Decision / Approval" oninput="ppDecChange('${d.id}','description',this.value)"></td>
    <td><input value="${d.approved_by||''}" placeholder="Approved by" style="width:110px" oninput="ppDecChange('${d.id}','approved_by',this.value)"></td>
    <td style="min-width:140px"><div style="display:flex;align-items:center;gap:4px">
      <input value="${d.link_url||''}" placeholder="https://..." style="font-family:var(--mono);font-size:11px;flex:1;min-width:0" oninput="ppDecChange('${d.id}','link_url',this.value)">
      ${d.link_url?`<a href="${d.link_url}" target="_blank" style="font-size:12px;color:var(--blue);text-decoration:none;flex-shrink:0">↗</a>`:''}
    </div></td>
    <td class="pp-actions"><button class="pp-del" onclick="ppDelDec('${d.id}')">✕</button></td>
  </tr>`).join('');

  document.getElementById('pp-body').innerHTML=`
    <!-- HEADER -->
    <div class="pp-header">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
          <div class="pp-title" style="margin:0">${proj.name}</div>
          ${isMaster(proj)?`<div style="display:flex;gap:4px;flex-wrap:wrap">
            ${getChildren(proj.id).map(c=>`<button onclick="switchProjPage('${c.id}')" style="font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid #7c3aed;background:${ppProjId===c.id?'#7c3aed':'rgba(124,58,237,0.15)'};color:${ppProjId===c.id?'white':'#c4b5fd'};cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">⬡ ${c.so_number||c.name}</button>`).join('')}
          </div>`:''}
          ${isChild(proj)?`<button onclick="switchProjPage('${proj.parent_project_id}')" style="font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid #e879f9;background:rgba(232,121,249,0.15);color:#e879f9;cursor:pointer;font-family:var(--font)">🏛 Back to master</button>`:''}
        </div>
        <div class="pp-meta">
          <span>📋 SO: ${(proj.so_number||'').split(/[\s,;]+/).map(s=>{const so=s.trim();return so?'<strong style="cursor:pointer;text-decoration:underline;color:#93c5fd" onclick="switchProjPageBySO(\''+so+'\')" title="Go to '+so+'">'+so+'</strong>':''}).join(', ')||'—'}</span>
          <span>👤 PM: <strong>${proj.pm||'—'}</strong></span>
          <span>🏢 ${proj.client||'—'}</span>
          ${proj.product_type?`<span>📦 ${proj.product_type}</span>`:''}
          ${proj.naming_convention?`<span>🏷 ${proj.naming_convention}</span>`:''}
          ${proj.address?`<span>📍 ${proj.address}</span>`:''}
          ${goLive?`<span>🎯 Go-live: <strong>${fmt(goLive)}</strong></span>`:''}
          ${(()=>{const b=getProjectBlocker(proj);if(!b)return'';return`<span style="color:${b.overdue?'#fca5a5':'#93c5fd'}">🔗 ${b.blockedStage.label} blocked by ${b.blockingStage.label} · ${b.estimate}</span>`;})()}
        </div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <select class="pp-status ${statusCls}" style="border:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px" onchange="savePPSection('status',this.value);this.className='pp-status '+(this.value==='on-track'?'pp-status-green':this.value==='at-risk'?'pp-status-amber':'pp-status-red')">
            <option value="on-track"${statusVal==='on-track'?' selected':''}>🟢 On Track</option>
            <option value="at-risk"${statusVal==='at-risk'?' selected':''}>🟡 At Risk</option>
            <option value="off-track"${statusVal==='off-track'?' selected':''}>🔴 Off Track</option>
          </select>
          <span style="font-size:12px;color:#888">Phase:</span>
          <input value="${phase}" style="font-size:12px;background:rgba(255,255,255,0.1);border:none;border-bottom:1px solid #444;color:white;padding:2px 6px;font-family:var(--font);width:120px" onchange="savePPSection('phase',this.value)" placeholder="Current phase">
          <span style="font-size:11px;color:#555">Last updated: ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
        </div>

      </div>
      <div style="display:flex;flex-direction:column;gap:7px;align-items:flex-end;flex-shrink:0" class="no-print">
        <button onclick="openLinksPopout()" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #3b82f6;background:#1e3a5f;color:#93c5fd;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">🔗 Quick links</button>
        ${(ppHasSoTags||isMaster(proj)||(proj.so_number||"").split(",").filter(s=>s.trim()).length>1)?`<button onclick="toggleAllSOView()" id="btn-show-all-so" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #16a34a;background:#14532d;color:#86efac;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">📊 All SO milestones</button>`:''}
        ${isChild(proj)?`<button onclick="unlinkFromMaster('${proj.id}')" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #dc2626;background:#450a0a;color:#fca5a5;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">🔗 Unlink from master</button>`:''}
        <button onclick="exportProjPageExcel()" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #2d6a4f;background:#1a4a35;color:#4ade80;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">⬇ Excel</button>
        <button onclick="openClientExport()" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #1d4ed8;background:#1e3a5f;color:#93c5fd;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">📤 Client export</button>
        <button onclick="openClientDeliverables()" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #d97706;background:#3f2200;color:#fbbf24;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">📋 Edit deliverables</button>

        <button onclick="window.print()" style="font-size:11px;padding:6px 14px;border-radius:var(--radius);border:1px solid #555;background:#1a1a1a;color:#aaa;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap">🖨 Print / PDF</button>
      </div>
    </div>

    <!-- ROW 1: Summary + Quick Links -->
    <div class="pp-grid">
      <div>
        <div class="pp-card" style="margin-bottom:12px">
          <div class="pp-card-head"><span class="pp-card-title">Project summary</span><span style="font-size:10px;color:var(--gray-400)">Internal only · Click to edit</span></div>
          <div class="pp-card-body">
            <textarea class="pp-textarea" placeholder="Brief 3-5 sentence summary of current project status, major accomplishments, upcoming milestones, and any concerns requiring attention..." onchange="savePPSection('summary',this.value)" style="min-height:80px">${getSection('summary')}</textarea>
          </div>
        </div>
        <div class="pp-card" style="margin-bottom:12px">
          <div class="pp-card-head"><span class="pp-card-title">Client updates</span><span style="font-size:10px;color:var(--success)">Appears on client export</span></div>
          <div class="pp-card-body">
            <textarea class="pp-textarea" placeholder="Updates, status, and notes for the client..." onchange="savePPSection('client_updates',this.value)" style="min-height:80px">${getSection('client_updates')}</textarea>
          </div>
        </div>
        ${(()=>{
          const NOTE_SECTIONS=[
            {key:'notes_readiness',label:'Readiness / Procurement notes'},
            {key:'notes_production',label:'Production / Products notes'},
            {key:'notes_ui',label:'UI notes'},
            {key:'notes_quality',label:'Quality & testing notes'},
            {key:'notes_shipping',label:'Shipping notes'},
            {key:'notes_install',label:'Installation notes'},
          ];
          const populated=NOTE_SECTIONS.filter(s=>getSection(s.key));
          const empty=NOTE_SECTIONS.filter(s=>!getSection(s.key));
          if(!populated.length&&!proj.notes)return'';
          return `<div class="pp-card" style="margin-bottom:12px">
            <div class="pp-card-head"><span class="pp-card-title">Intake notes</span><span style="font-size:10px;color:var(--gray-400)">From project intake</span></div>

function showPPSaved(){
  const el=document.getElementById('pp-saved');
  if(!el)return;
  el.style.display='inline';
  clearTimeout(ppSaveTimer);
  ppSaveTimer=setTimeout(()=>{el.style.display='none';},2000);
}

async function saveSODetail(projId,so,field,val){
  const existing=soDetails.find(d=>d.project_id===projId&&d.so_tag===so);
  if(existing){
    await sb.from('so_details').update({[field]:val,updated_at:new Date().toISOString()}).eq('id',existing.id);
    existing[field]=val;
  } else {
    const proj=projects.find(p=>p.id===projId);
    const{data}=await sb.from('so_details').insert({
      project_id:projId,so_tag:so,
      address:field==='address'?val:(proj?.address||''),
      naming_convention:field==='naming_convention'?val:(proj?.naming_convention||''),
      form_factor:field==='form_factor'?val:(proj?.form_factor||''),
      qa_task_url:field==='qa_task_url'?val:(proj?.qa_task_url||''),
      odoo_url:field==='odoo_url'?val:(proj?.odoo_url||''),
      install_ticket_url:field==='install_ticket_url'?val:(proj?.install_ticket_url||''),
      ui_task_url:field==='ui_task_url'?val:(proj?.ui_task_url||''),
    }).select().single();
    if(data)soDetails.push(data);
  }
  await syncSingleSOFieldsToProject(projId,so,{[field]:val});
  showPPSaved();
  if(currentTab==='overview')renderOverview();
  if(currentTab==='gendocs')renderGenDocs();
}

async function saveSOConfig(projId,so){
  const formFactor=[...document.getElementById('soc-formfactor').selectedOptions].map(o=>o.value).join(', ');
  const qaUrl=document.getElementById('soc-qa').value.trim();
  const odooUrl=document.getElementById('soc-odoo').value.trim();
  const installUrl=document.getElementById('soc-install').value.trim();
  const uiUrl=document.getElementById('soc-ui').value.trim();
  const existing=soDetails.find(d=>d.project_id===projId&&d.so_tag===so);
  const updates={form_factor:formFactor,qa_task_url:qaUrl,odoo_url:odooUrl,install_ticket_url:installUrl,ui_task_url:uiUrl};
  if(existing){
    await sb.from('so_details').update({...updates,updated_at:new Date().toISOString()}).eq('id',existing.id);
    Object.assign(existing,updates);
  } else {
    const proj=projects.find(p=>p.id===projId);
    const{data}=await sb.from('so_details').insert({
      project_id:projId,so_tag:so,
      address:proj?.address||'',naming_convention:proj?.naming_convention||'',
      ...updates,
    }).select().single();
    if(data)soDetails.push(data);
  }
  await syncSingleSOFieldsToProject(projId,so,updates);
  closeModal();showToast('SO '+so+' config saved ✓');
  if(currentTab==='projpage')renderProjPageBody(projId);
  if(currentTab==='overview')renderOverview();
  if(currentTab==='gendocs')renderGenDocs();
}

async function saveProjField(projId,field,val){

  const p=projects.find(x=>x.id===projId);if(p)p[field]=val||null;

async function syncQuickLinkToHub(label,url){
  const HUB_FIELD_MAP={'Odoo Task':'odoo_url','Jira / UI Task':'ui_task_url','QA Task':'qa_task_url','Product Template':'product_template_url','Badge Reader':'badge_reader_url','Employee List':'employee_list_url','Facility Site Survey':'facility_survey_url','IT Site Survey':'it_survey_url','Vision Training':'vision_training_url','Vinyl Render Odoo':'vinyl_odoo_url','Installation Ticket':'install_ticket_url','Kickoff deck':'kickoff_deck_url'};
  const hubField=HUB_FIELD_MAP[label];
  if(!hubField||!ppProjId)return;
  const cleanUrl=(url||'').trim();
  await sb.from('projects').update({[hubField]:cleanUrl,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',ppProjId);
  const proj=projects.find(p=>p.id===ppProjId);
  if(proj)proj[hubField]=cleanUrl;
  const singleSO=singleProjectSO(proj);
  if(singleSO&&SHARED_CONFIG_FIELDS.includes(hubField)){
    const existingSO=soDetails.find(d=>d.project_id===ppProjId&&d.so_tag===singleSO);
    if(existingSO){
      await sb.from('so_details').update({[hubField]:cleanUrl,updated_at:new Date().toISOString()}).eq('id',existingSO.id);
      existingSO[hubField]=cleanUrl;
    } else {
      const{data}=await sb.from('so_details').insert({project_id:ppProjId,so_tag:singleSO,address:proj?.address||'',naming_convention:proj?.naming_convention||'',form_factor:proj?.form_factor||'',qa_task_url:hubField==='qa_task_url'?cleanUrl:(proj?.qa_task_url||''),odoo_url:hubField==='odoo_url'?cleanUrl:(proj?.odoo_url||''),install_ticket_url:hubField==='install_ticket_url'?cleanUrl:(proj?.install_ticket_url||''),ui_task_url:hubField==='ui_task_url'?cleanUrl:(proj?.ui_task_url||'')}).select().single();
      if(data)soDetails.push(data);
    }
  }
  await logActivity('updated link',label,label,ppProjId,null,cleanUrl);
}

async function savePMTask(pid,taskId,field,val){
  if(taskId.startsWith('new-')){
    // Brand new user-added row — insert with label from input
    const label=document.getElementById('pmt-label-'+taskId)?.value.trim()||'Task';
    if(!label||label==='Task')return;
    const{data}=await sb.from('pm_tasks').insert({project_id:pid,label,due_date:field==='due_date'?val||null:null,status:field==='status'?val:'Pending',sort_order:ppData.pmtasks.length}).select().single();
    if(data){
      ppData.pmtasks.push(data);
      const el=document.getElementById('pmt-row-'+taskId);
      if(el){el.id='pmt-row-'+data.id;}
      // Update all onclick handlers in this row to use real ID
      el?.querySelectorAll('[onchange],[onblur]').forEach(inp=>{
        if(inp.getAttribute('onchange'))inp.setAttribute('onchange',inp.getAttribute('onchange').replace(taskId,data.id));
        if(inp.getAttribute('onblur'))inp.setAttribute('onblur',inp.getAttribute('onblur').replace(taskId,data.id));
      });
    }
  } else if(taskId.startsWith('def-')){
    // Default task — insert into DB first
    const label=document.getElementById('pmt-row-'+taskId)?.querySelector('span')?.textContent||taskId.replace('def-','').replace(/-/g,' ');
    const{data}=await sb.from('pm_tasks').insert({project_id:pid,label,due_date:field==='due_date'?val||null:null,status:field==='status'?val:'Pending',sort_order:ppData.pmtasks.length}).select().single();
    if(data){
      ppData.pmtasks.push(data);
      // Update row ID and all event handlers to use real DB id
      const row=document.getElementById('pmt-row-'+taskId);
      if(row){
        row.id='pmt-row-'+data.id;
        row.querySelectorAll('[onchange],[onblur]').forEach(el=>{
          if(el.getAttribute('onchange'))el.setAttribute('onchange',el.getAttribute('onchange').replace(new RegExp(taskId.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),data.id));
          if(el.getAttribute('onblur'))el.setAttribute('onblur',el.getAttribute('onblur').replace(new RegExp(taskId.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),data.id));
        });
        row.querySelectorAll('[onclick]').forEach(el=>{
          if(el.getAttribute('onclick'))el.setAttribute('onclick',el.getAttribute('onclick').replace(new RegExp(taskId.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),data.id));
        });
      }
    }
  } else {
    // Existing DB row — just update
    await sb.from('pm_tasks').update({[field]:val||null}).eq('id',taskId);
    // Update local ppData
    const t=ppData.pmtasks.find(x=>x.id===taskId);
    if(t)t[field]=val||null;
  }
}

let activeDocTab='install';
let selectedDocProjId=null;
let selectedDocSO='';
// docFormState keyed by projectId so switching projects preserves each project's data
let docFormState={};

function getDocState(){
  const pid=selectedDocProjId||'__none';
  if(!docFormState[pid])docFormState[pid]={shared:{},install:{},ui:{},qa:{}};
  const s=docFormState[pid];
  if(!s.install)s.install={};
  if(!s.ui)s.ui={};
  if(!s.qa)s.qa={};
  if(!s.shared)s.shared={};
  return s;
}
// Fields auto-filled from project record — never restore these from state
const AUTO_FILL_FIELDS=new Set(['qf-address','qf-naming','qf-so','uf-kiosk','qf-kiosk','if-ship','if-del','if-vinyl','if-odoo','if-template','if-badge','if-employee','qf-ship','qf-vinyl','qf-jira-task','qf-jira-product','qf-jira-badge','qf-employee','uf-client']);

let _docSaveTimer=null;
function saveDocFormState(immediate=false){
  const state=getDocState();
  if(!state.shared)state.shared={};
  document.querySelectorAll('#tab-gendocs input,#tab-gendocs select,#tab-gendocs textarea').forEach(el=>{
    if(el.id&&!AUTO_FILL_FIELDS.has(el.id)){
      if(!state[activeDocTab])state[activeDocTab]={};
      state[activeDocTab][el.id]=el.value;
      state.shared[el.id]=el.value;
    }
  });
  if(selectedDocProjId){
    clearTimeout(_docSaveTimer);
    if(immediate){
      persistDocState(selectedDocProjId);
    } else {
      _docSaveTimer=setTimeout(()=>persistDocState(selectedDocProjId),1500);
    }
  }
}
async function persistDocState(pid){
  if(!pid)return;
  const state=getDocState();
  const val=JSON.stringify(state);
  try{
    const{data:existing}=await sb.from('project_sections').select('id').eq('project_id',pid).eq('section_key','gendoc_state').maybeSingle();
    if(existing){
      await sb.from('project_sections').update({content:val}).eq('id',existing.id);
    } else {
      await sb.from('project_sections').insert({project_id:pid,section_key:'gendoc_state',content:val});
    }
  }catch(e){
    console.warn('persistDocState failed',e);
  }
}
async function loadDocState(pid){
  if(!pid)return;
  try{
    const{data,error}=await sb.from('project_sections').select('*').eq('project_id',pid).eq('section_key','gendoc_state').maybeSingle();
    if(error){console.warn('loadDocState error',error);return;}
    if(data?.content){
      try{
        const parsed=JSON.parse(data.content);
        docFormState[pid]=parsed;
      }catch(e){console.warn('loadDocState parse error',e);}
    }
  }catch(e){
    console.warn('loadDocState failed',e);
  }
}
function restoreDocFormState(){
  const state=getDocState();
  const merged=Object.assign({},state.shared||{},state[activeDocTab]||{});
  Object.entries(merged).forEach(([id,val])=>{
    if(AUTO_FILL_FIELDS.has(id))return;
    const el=document.getElementById(id);
    if(el)el.value=val;
  });
  const out=getDocState()[activeDocTab]?.__output;
  if(out){
    const outEl=document.getElementById('doc-output-'+activeDocTab);
    const contEl=document.getElementById('doc-content-'+activeDocTab);
    if(outEl&&contEl){outEl.style.display='block';contEl.textContent=out;}
  }
  const subj=getDocState()[activeDocTab]?.__subject;
  if(subj){
    const subjEl=document.getElementById('doc-subject-'+activeDocTab);
    if(subjEl)subjEl.textContent=subj;
  }
}

  saveDocFormState();

  const projOpts=projects.map(p=>`<option value="${p.id}"${p.id===selectedDocProjId?' selected':''}>${p.name} — ${p.so_number||'No SO'}</option>`).join('');
  el.innerHTML=`

      <div style="padding:16px">

function getDocProj(){return projects.find(p=>p.id===selectedDocProjId)||{};}
function getDocDate(key){if(!selectedDocProjId)return'';const m=milestones.find(m=>m.project_id===selectedDocProjId&&m.key===key);return m?fmtFull(m.date):'';}
// Gets a link for Generate Docs — checks project record first, then project_links table
function getDocLink(label){
  const p=getDocProj();
  // If a specific SO is selected, check that SO's overrides first
  {
    const soDet=getEffectiveSODetail(p,selectedDocSO);
    const SO_MAP={'Odoo Task':soDet?.odoo_url,'Jira / UI Task':soDet?.ui_task_url,'QA Task':soDet?.qa_task_url,'Installation Ticket':soDet?.install_ticket_url};
    if(soDet&&SO_MAP[label])return SO_MAP[label];
  }
  // Check direct project record fields next
  const DIRECT={'Odoo Task':p.odoo_url,'Jira / UI Task':p.ui_task_url,'QA Task':p.qa_task_url,'Product Template':p.product_template_url,'Badge Reader':p.badge_reader_url,'Employee List':p.employee_list_url,'Facility Site Survey':p.facility_survey_url,'IT Site Survey':p.it_survey_url};
  if(DIRECT[label])return DIRECT[label]||'';
  // Fall back to project_links table (set via project page)
  // ppData may have the right project loaded — check if it matches
  if(ppProjId===selectedDocProjId&&ppData.links.length){
    const found=ppData.links.find(l=>l.label===label);
    if(found?.url)return found.url;
  }
  return'';
}

function onDocProjSearch(val){
  if(!val||val.length<2)return;
  const vl=val.toLowerCase();
  const match=projects.find(p=>{
    const display=p.name+(p.so_number?' — '+p.so_number:'');
    return display.toLowerCase()===vl||p.name.toLowerCase()===vl||(p.so_number&&val.includes(p.so_number));
  })||projects.find(p=>{
    const display=p.name+(p.so_number?' — '+p.so_number:'');
    return display.toLowerCase().startsWith(vl)||p.name.toLowerCase().startsWith(vl);
  });
  if(match&&match.id!==selectedDocProjId){
    selectedDocProjId=match.id;
    loadDocState(match.id).then(()=>renderGenDocs());
  }
}

  return'';
}

function copyDocHTML(type){
  const html=getDocState()[type]?.__outputHtml;
  if(!html){showToast('Generate the ticket first');return;}
  const blob=new Blob([html],{type:'text/html'});
  const item=new ClipboardItem({'text/html':blob});
  navigator.clipboard.write([item]).then(()=>showToast('Copied formatted ✓ — paste into your email')).catch(()=>{
    // Fallback: render into a temp contenteditable, select it, and copy
    const tmp=document.createElement('div');
    tmp.contentEditable='true';
    tmp.style.position='fixed';tmp.style.left='-9999px';
    tmp.innerHTML=html;
    document.body.appendChild(tmp);
    const range=document.createRange();range.selectNodeContents(tmp);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    document.body.removeChild(tmp);
    showToast('Copied formatted ✓ — paste into your email');
  });
}
function copySubject(type){
  const subject=getDocState()[type]?.__subject||document.getElementById('doc-subject-'+type)?.textContent||'';
  if(!subject){showToast('Generate the ticket first');return;}
  navigator.clipboard.writeText(subject).then(()=>showToast('Subject copied ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=subject;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Subject copied ✓');
  });
}
function copyDocText(elId){
  const el=document.getElementById(elId);
  if(!el)return;
  const text=el.textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('Copied ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied ✓');
  });
}
function copyDoc(type){
  const text=getDocState()[type]?.__output||document.getElementById('doc-content-'+type)?.textContent||'';
  navigator.clipboard.writeText(text).then(()=>showToast('Copied ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Copied ✓');
  });
}

  const cur=getPlWorking(key).map((t,j)=>{const inp=document.getElementById('pl-'+key+'-'+j);return inp?inp.value.trim():t;}).filter(Boolean);
  cur.splice(i,1);

  const inp=document.getElementById('pl-'+key+'-new');

  const cur=getPlWorking(key).map((t,j)=>{const el=document.getElementById('pl-'+key+'-'+j);return el?el.value.trim():t;}).filter(Boolean);
  cur.push(val);
  _peopleLists[key]=cur;
  if(inp)inp.value='';
  renderSettings();
}

function getChildren(masterId){return projects.filter(p=>p.parent_project_id===masterId);}
function getMaster(childId){const p=projects.find(x=>x.id===childId);return p?.parent_project_id?projects.find(x=>x.id===p.parent_project_id):null;}
function isMaster(p){return p.is_master||projects.some(x=>x.parent_project_id===p.id);}
function isChild(p){return !!p.parent_project_id;}

async function addChildProject(masterId){
  const master=projects.find(p=>p.id===masterId);
  if(!master){showToast('Master not found');return;}
  const so=document.getElementById('camp-so')?.value.trim();
  const name=document.getElementById('camp-name')?.value.trim()||master.name+' — Child';
  const addr=document.getElementById('camp-addr')?.value.trim()||null;
  const naming=document.getElementById('camp-naming')?.value.trim()||null;
  // Create child project inheriting master's fields
  const{data:child,error}=await sb.from('projects').insert({
    name,so_number:so||master.so_number,client:master.client,pm:master.pm,
    sdm:master.sdm,solutions:master.solutions,sales:master.sales,
    account_manager:master.account_manager,channel_partner:master.channel_partner,
    product_type:master.product_type,form_factor:master.form_factor,
    vinyl_type:master.vinyl_type,naming_convention:naming,address:addr,
    parent_project_id:masterId,status:'active',
    changed_by:currentUserName,changed_at:new Date().toISOString(),
  }).select().single();
  if(error){showToast('Error: '+error.message);return;}
  // Clone milestones from master
  const masterMs=milestones.filter(m=>m.project_id===masterId);
  if(masterMs.length){
    const newMs=masterMs.map(m=>({
      project_id:child.id,label:m.label,key:m.key,date:m.date,
      so_number:so||m.so_number||null,created_by:currentUserName,
    }));
    const{data:createdMs}=await sb.from('milestones').insert(newMs).select();
    if(createdMs)milestones.push(...createdMs);
  }
  // Mark master as campaign master
  await sb.from('projects').update({is_master:true}).eq('id',masterId);
  master.is_master=true;
  projects.push(child);
  await loadAll();
  showToast('Child project created ✓');
  openCampaignModal(masterId);
}

async function linkToMaster(childId){
  const masterId=document.getElementById('camp-master-sel')?.value;
  if(!masterId){showToast('Select a master project');return;}
  await sb.from('projects').update({parent_project_id:masterId}).eq('id',childId);
  await sb.from('projects').update({is_master:true}).eq('id',masterId);
  const child=projects.find(p=>p.id===childId);if(child)child.parent_project_id=masterId;
  const master=projects.find(p=>p.id===masterId);if(master)master.is_master=true;
  closeModal();showToast('Linked to master ✓');renderTab();
}

async function pushDatesToAll(masterId){
  const children=getChildren(masterId);
  const masterMs=milestones.filter(m=>m.project_id===masterId);
  const checkedKeys=masterMs.filter(m=>document.getElementById('push-ms-'+m.id)?.checked).map(m=>m.key);
  let pushed=0;
  for(const child of children){
    const childMs=milestones.filter(m=>m.project_id===child.id);
    for(const key of checkedKeys){
      const masterM=masterMs.find(m=>m.key===key);
      if(!masterM?.date)continue;
      const childM=childMs.find(m=>m.key===key);
      if(childM){
        await sb.from('milestones').update({date:masterM.date}).eq('id',childM.id);
        childM.date=masterM.date;
        // Clear deviation for this key
        await sb.from('milestone_deviations').delete().eq('project_id',child.id).eq('milestone_key',key);
        if(milestoneDeviations[child.id])delete milestoneDeviations[child.id][key];
      } else {
        const{data}=await sb.from('milestones').insert({project_id:child.id,label:masterM.label,key,date:masterM.date,created_by:currentUserName}).select().single();
        if(data)milestones.push(data);
      }
      pushed++;
    }
  }
  closeModal();showToast(`Pushed ${pushed} dates to ${children.length} children ✓`);renderTab();
}

async function markMilestoneDeviated(projId,msKey,masterDate,childDate){
  await sb.from('milestone_deviations').upsert({

    master_date:masterDate,child_date:childDate,
    deviated_by:currentUserName,deviated_at:new Date().toISOString()
  },{onConflict:'project_id,milestone_key'});
  if(!milestoneDeviations[projId])milestoneDeviations[projId]={};
  milestoneDeviations[projId][msKey]={master_date:masterDate,child_date:childDate};
}

async function migrateCampaignToSO(masterId){
  const master=projects.find(p=>p.id===masterId);
  if(!master)return;
  const children=getChildren(masterId);
  if(!children.length){showToast('No children found');return;}
  if(!confirm('Migrate "'+master.name+'" ('+children.length+' children) to SO split?\n\n'
    +'This will:\n• Copy each child\'s milestones to the master with SO tags\n• Delete all child projects and their data\n\nThis cannot be undone.'))return;

  showToast('Migrating...');
  let inserted=0;

  // Delete any existing so_tag milestones on master to avoid dupes
  const existingSoMs=milestones.filter(m=>m.project_id===masterId&&m.so_tag);
  for(const m of existingSoMs) await sb.from('milestones').delete().eq('id',m.id);

  // Copy each child's milestones onto master with so_tag, then delete child
  for(const child of children){
    const childMs=milestones.filter(m=>m.project_id===child.id);
    const so=child.so_number||child.name;
    for(const m of childMs){
      const{data}=await sb.from('milestones').insert({
        project_id:masterId,key:m.key,label:m.label,date:m.date,
        original_date:m.original_date||m.date,so_tag:so,changed_by:currentUserName
      }).select().single();
      if(data)inserted++;
    }
    // Delete all child data
    const cid=child.id;
    await sb.from('milestones').delete().eq('project_id',cid);
    await sb.from('project_links').delete().eq('project_id',cid);
    await sb.from('project_team').delete().eq('project_id',cid);
    await sb.from('action_items').delete().eq('project_id',cid);
    await sb.from('risks').delete().eq('project_id',cid);
    await sb.from('decisions').delete().eq('project_id',cid);
    await sb.from('project_sections').delete().eq('project_id',cid);
    await sb.from('checkin_status').delete().eq('project_id',cid);
    await sb.from('milestone_done').delete().eq('project_id',cid);
    await sb.from('vinyl_schedule').delete().eq('project_id',cid).eq('is_standalone',false);
    await sb.from('planogram_schedule').delete().eq('project_id',cid).eq('is_standalone',false);
    await sb.from('adhoc_schedule').delete().eq('project_id',cid);
    await sb.from('pm_tasks').delete().eq('project_id',cid);
    // Delete the child project itself
    await sb.from('projects').delete().eq('id',cid);
    const idx=projects.findIndex(p=>p.id===cid);
    if(idx>=0)projects.splice(idx,1);
  }

  // Mark master as no longer a master
  await sb.from('projects').update({is_master:false}).eq('id',masterId);
  const mp=projects.find(p=>p.id===masterId);
  if(mp)mp.is_master=false;

  showToast('Migrated '+inserted+' milestones, deleted '+children.length+' child projects ✓');
  await loadAll();
  renderSettings();
}

async function migrateAllCampaigns(){
  const masters=projects.filter(p=>isMaster(p)&&getChildren(p.id).length>0);
  if(!masters.length){showToast('Nothing to migrate');return;}
  if(!confirm('Migrate ALL '+masters.length+' campaign project(s) to SO split?\n\n'+masters.map(p=>p.name).join('\n')))return;
  for(const m of masters){
    await migrateCampaignToSO(m.id);
  }
  showToast('All campaigns migrated ✓');
  renderSettings();
}

async function addFinalQCToAllProjects(){
  const logEl=document.getElementById('fqc-migration-log');
  if(logEl)logEl.textContent='Running...';
  const activeProjs=projects.filter(p=>p.status!=='complete'&&p.status!=='archived'&&!p.parent_project_id);
  let added=0,skipped=0;
  const inserts=[];
  for(const proj of activeProjs){
    const projMs=milestones.filter(m=>m.project_id===proj.id);
    const hasSoTags=projMs.some(m=>m.so_tag);
    if(hasSoTags){
      // SO-split — handle per SO
      const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
      const tagsSeen=[...new Set(projMs.map(m=>m.so_tag).filter(Boolean))];
      const allSOs=[...new Set([...soList,...tagsSeen])];
      for(const so of allSOs){
        const soMs=projMs.filter(m=>m.so_tag===so);
        const shipMs=soMs.find(m=>m.key==='shipping'&&m.date);
        if(!shipMs){skipped++;continue;}
        const alreadyHas=soMs.some(m=>m.key==='final-qc');
        if(alreadyHas){skipped++;continue;}
        const qcDate=isoD(addD(new Date(shipMs.date+'T00:00:00'),-1));
        inserts.push({project_id:proj.id,so_tag:so,key:'final-qc',label:'Final QC',date:qcDate,original_date:qcDate,changed_by:currentUserName});
        added++;
      }
    } else {
      // Non-split
      const shipMs=projMs.find(m=>m.key==='shipping'&&m.date);
      if(!shipMs){skipped++;continue;}
      const alreadyHas=projMs.some(m=>m.key==='final-qc');
      if(alreadyHas){skipped++;continue;}
      const qcDate=isoD(addD(new Date(shipMs.date+'T00:00:00'),-1));
      inserts.push({project_id:proj.id,so_tag:null,key:'final-qc',label:'Final QC',date:qcDate,original_date:qcDate,changed_by:currentUserName});
      added++;
    }
  }
  if(!inserts.length){
    if(logEl)logEl.textContent=`Nothing to add — ${skipped} project/SO(s) already have Final QC or have no shipping date.`;
    showToast('Nothing to add');return;
  }
  if(!confirm(`Add Final QC (1 day before shipping) to ${added} project/SO(s)?\n\n${inserts.map(r=>{const p=projects.find(x=>x.id===r.project_id);return(p?.name||r.project_id)+(r.so_tag?' ('+r.so_tag+')':'')+' → '+fmt(r.date);}).join('\n')}`))return;
  const{error}=await sb.from('milestones').insert(inserts);
  if(error){alert('Error: '+error.message);return;}
  if(logEl)logEl.textContent=`✓ Added ${added} Final QC milestone(s). Skipped ${skipped} (already had one or no shipping date).`;
  showToast(`Added Final QC to ${added} project/SO(s) ✓`);
  await loadAll();
}

async function doCloneProject(id, origAnchorDate){
  const newName=document.getElementById('clone-name')?.value.trim();
  const newSO=document.getElementById('clone-so')?.value.trim();
  const newAnchorDate=document.getElementById('clone-anchor')?.value;
  if(!newName){alert('Please enter a project name.');return;}
  if(!newSO){alert('Please enter an SO number.');return;}
  if(!newAnchorDate){alert('Please enter a PO Release date.');return;}

  // Calculate day shift
  const origAnchor=new Date(origAnchorDate+'T00:00:00');
  const newAnchor=new Date(newAnchorDate+'T00:00:00');
  const shiftDays=Math.round((newAnchor-origAnchor)/86400000);

  const orig=projects.find(p=>p.id===id);
  const{data:newProj,error}=await sb.from('projects').insert({
    ...orig,id:undefined,created_at:undefined,updated_at:undefined,
    name:newName,so_number:newSO||null,
    status:'active',changed_by:currentUserName,changed_at:new Date().toISOString()
  }).select().single();
  if(error){alert('Error cloning: '+error.message);return;}

  // Clone milestones with shifted dates — explicit fields only to avoid DB errors
  const origMs=milestones.filter(m=>m.project_id===id);
  if(origMs.length){
    const newMs=origMs.map(m=>{
      let newDate=m.date;
      if(m.date&&shiftDays!==0){
        const d=new Date(m.date+'T00:00:00');
        d.setDate(d.getDate()+shiftDays);
        newDate=isoD(d);
      }
      return{
        project_id:newProj.id,
        key:m.key,
        label:m.label,
        date:newDate||null,
        original_date:newDate||null,
        changed_by:currentUserName,
        changed_at:new Date().toISOString()
      };
    });
    const{error:msErr}=await sb.from('milestones').insert(newMs);
    if(msErr){alert('Milestones error: '+msErr.message);return;}
  }

  // Set IDs BEFORE loadAll so renderProjPage doesn't lose them
  selectedProjId=newProj.id;
  ppProjId=newProj.id;
  closeModal();
  await loadAll();
  showToast('"'+newName+'" cloned — '+Math.abs(shiftDays)+'d '+(shiftDays>=0?'forward':'back')+' ✓');
  setTab('projpage');
}

function fireConfetti(){
  const colors=['#C8102E','#7c3aed','#059669','#d97706','#2563eb','#db2777','#0891b2'];
  const count=180;
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  const pieces=Array.from({length:count},()=>({
    x:Math.random()*canvas.width,
    y:-20,
    w:Math.random()*10+4,
    h:Math.random()*6+3,
    color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*360,
    rotV:(Math.random()-0.5)*8,
    vx:(Math.random()-0.5)*6,
    vy:Math.random()*5+3,
    opacity:1
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;p.vy+=0.12;
      if(frame>90)p.opacity=Math.max(0,p.opacity-0.015);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.opacity;ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(frame<150)requestAnimationFrame(draw);
    else canvas.remove();
  }
  draw();
}

function openClientDeliverables(){
  const proj=projects.find(p=>p.id===ppProjId);
  if(!proj){showToast('No project selected');return;}
  const pMs=milestones.filter(m=>m.project_id===ppProjId);
  const msKeyMap={};pMs.forEach(m=>{msKeyMap[m.key]=m;});
  const DEFAULT_DELIVS=[
    {label:'Training',key:'training'},{label:'IT Site Survey',key:'it_survey'},
    {label:'Facility Site Survey',key:'facility_survey'},{label:'Branding / Vinyl',key:'vinyl'},
    {label:'Products / Hardware',key:'arrival'},{label:'Badge Reader Setup',key:'badge'},
    {label:'Employee List',key:'employee'},{label:'UAT Sign-off',key:'uat'},
    {label:'Installation',key:'installation'},
  ];
  const getDelivDate=(key)=>{const km={training:'training',vinyl:'vinyl',arrival:'arrival',uat:'uat',installation:'installation'};const mk=km[key];return mk&&msKeyMap[mk]?msKeyMap[mk].date:'';};
  const saved=proj.client_deliverables||[];
  const rows=DEFAULT_DELIVS.map(d=>{const s=saved.find(x=>x.key===d.key)||{};return{...d,date:s.date||getDelivDate(d.key)||'',status:s.status||'Pending',notes:s.notes||''};});
  saved.filter(s=>!DEFAULT_DELIVS.find(d=>d.key===s.key)).forEach(s=>rows.push(s));

  const rowsHtml=rows.map((d,i)=>`
    <tr style="border-bottom:1px solid var(--gray-50)" id="cd-row-${i}">
      <td style="padding:6px 8px;font-size:12px;white-space:nowrap">
        <input type="text" value="${d.label.replace(/"/g,'&quot;')}" id="cd-label-${i}" style="font-family:var(--font);font-size:12px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:140px">
      </td>
      <td style="padding:4px 8px"><input type="date" value="${d.date||''}" id="cd-date-${i}" style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:120px"></td>
      <td style="padding:4px 8px">
        <select id="cd-status-${i}" style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px">
          ${['Pending','In Progress','Complete','N/A'].map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td style="padding:4px 8px"><input type="text" value="${(d.notes||'').replace(/"/g,'&quot;')}" id="cd-notes-${i}" placeholder="Notes..." style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:100%"></td>
      <td style="padding:4px 8px;text-align:center"><button onclick="document.getElementById('cd-row-${i}').remove();window._cdDeleted.add(${i})" style="background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:16px;line-height:1" title="Remove">✕</button></td>
    </tr>`).join('');

  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" style="width:700px;max-height:85vh;display:flex;flex-direction:column" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">📋 Client Deliverables — ${proj.name}</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div style="overflow-y:auto;flex:1;padding:12px 16px">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="border-bottom:2px solid var(--gray-200)">
            <th style="padding:6px 8px;font-size:10px;font-weight:700;color:var(--gray-500);text-align:left;text-transform:uppercase">Deliverable</th>
            <th style="padding:6px 8px;font-size:10px;font-weight:700;color:var(--gray-500);text-align:left;text-transform:uppercase">Due Date</th>
            <th style="padding:6px 8px;font-size:10px;font-weight:700;color:var(--gray-500);text-align:left;text-transform:uppercase">Status</th>
            <th style="padding:6px 8px;font-size:10px;font-weight:700;color:var(--gray-500);text-align:left;text-transform:uppercase">Notes</th>
            <th style="width:30px"></th>
          </tr></thead>
          <tbody id="cd-rows">${rowsHtml}</tbody>
        </table>
        <div style="margin-top:10px;display:flex;gap:8px">
          <input id="cd-new-label" placeholder="Add custom deliverable..." style="font-family:var(--font);font-size:12px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);flex:1">
          <button class="btn btn-primary" onclick="cdAddRow()" style="font-size:12px">+ Add</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>

      </div>
    </div>

  window._cdRowCount=rows.length;
  window._cdDeleted=new Set();
}

function cdAddRow(){
  const labelVal=document.getElementById('cd-new-label')?.value.trim();
  if(!labelVal)return;
  const i=window._cdRowCount++;
  const key=labelVal.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  const tbody=document.getElementById('cd-rows');
  if(!tbody)return;
  const tr=document.createElement('tr');
  tr.id='cd-row-'+i;
  tr.style.borderBottom='1px solid var(--gray-50)';
  tr.innerHTML=`
    <td style="padding:6px 8px"><input type="text" value="${labelVal}" id="cd-label-${i}" style="font-family:var(--font);font-size:12px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:140px"><input type="hidden" id="cd-key-${i}" value="${key}"></td>
    <td style="padding:4px 8px"><input type="date" id="cd-date-${i}" style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:120px"></td>
    <td style="padding:4px 8px"><select id="cd-status-${i}" style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px"><option>Pending</option><option>In Progress</option><option>Complete</option><option>N/A</option></select></td>
    <td style="padding:4px 8px"><input type="text" id="cd-notes-${i}" placeholder="Notes..." style="font-family:var(--font);font-size:11px;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;width:100%"></td>
    <td style="padding:4px 8px;text-align:center"><button onclick="this.closest('tr').remove();window._cdDeleted.add(${i})" style="background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:16px;line-height:1" title="Remove">✕</button></td>`;
  tbody.appendChild(tr);
  document.getElementById('cd-new-label').value='';
}

async function saveClientDeliverables(projId,count){
  const rows=[];
  const DEFAULT_KEYS=['training','it_survey','facility_survey','vinyl','arrival','badge','employee','uat','installation'];
  for(let i=0;i<window._cdRowCount;i++){
    if(window._cdDeleted&&window._cdDeleted.has(i))continue;
    const rowEl=document.getElementById('cd-row-'+i);
    if(!rowEl)continue; // row was deleted from DOM
    const labelEl=document.getElementById('cd-label-'+i);
    const dateEl=document.getElementById('cd-date-'+i);
    const statusEl=document.getElementById('cd-status-'+i);
    const notesEl=document.getElementById('cd-notes-'+i);
    const keyEl=document.getElementById('cd-key-'+i);
    const label=labelEl?labelEl.value.trim():(i<DEFAULT_KEYS.length?DEFAULT_KEYS[i]:'Custom');
    const key=keyEl?keyEl.value:(i<DEFAULT_KEYS.length?DEFAULT_KEYS[i]:('custom-'+i));
    if(!label)continue;
    rows.push({key,label,date:dateEl?.value||'',status:statusEl?.value||'Pending',notes:notesEl?.value||''});
  }
  const{error}=await sb.from('projects').update({client_deliverables:rows}).eq('id',projId);
  if(error){
    alert('Error saving deliverables: '+error.message+'\n\nThe column may not exist yet — run this in Supabase:\nalter table projects add column if not exists client_deliverables jsonb default \'[]\'::jsonb;');
    return;
  }
  const p=projects.find(x=>x.id===projId);if(p)p.client_deliverables=rows;
  closeModal();showToast('Deliverables saved ✓');
}
