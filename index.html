  </div>

  <!-- GANTT TIMELINE -->
  ${(()=>{
    const msDated=pMs.filter(m=>m.date);
    if(!msDated.length)return'';
    // Build date range
    const allDates=msDated.map(m=>new Date(m.date+'T00:00:00'));
    const minD=new Date(Math.min(...allDates));const maxD=new Date(Math.max(...allDates));
    minD.setDate(minD.getDate()-3);maxD.setDate(maxD.getDate()+7);
    // Build weekday columns
    const cols=[];let cur=new Date(minD);
    while(cur<=maxD){if(cur.getDay()!==0&&cur.getDay()!==6)cols.push(new Date(cur));cur.setDate(cur.getDate()+1);}
    const t=today();
    // Month headers
    const monthCells=[];let lastMonth=-1,monthSpan=0,monthStart=0;
    cols.forEach((d,i)=>{
      if(d.getMonth()!==lastMonth){
        if(lastMonth>=0)monthCells.push({label:new Date(2026,lastMonth,1).toLocaleDateString('en-US',{month:'short'}),span:monthSpan,start:monthStart});
        lastMonth=d.getMonth();monthSpan=1;monthStart=i;
      } else monthSpan++;
    });
    if(lastMonth>=0)monthCells.push({label:new Date(cols[cols.length-1].getFullYear(),lastMonth,1).toLocaleDateString('en-US',{month:'short'}),span:monthSpan,start:monthStart});
    // Colour per milestone key
    const COL={'po-release':'#8b5cf6','arrival':'#8b5cf6','production-start':'#7c3aed','production-end':'#7c3aed','other':'#0891b2','quality-start':'#d97706','quality-end':'#d97706','final-qc':'#0891b2','vinyl':'#db2777','uat':'#16a34a','shipping':'#059669','delivery':'#059669','training':'#f59e0b','installation':'#e11d48'};
    const monthRow='<tr><td class="label-col"></td><td class="date-col"></td><td class="status-col"></td>'+monthCells.map(mc=>`<th colspan="${mc.span}" style="text-align:left;font-size:9px;font-weight:700;color:#64748b;padding:2px 0 4px 3px;letter-spacing:0.06em;text-transform:uppercase">${mc.label}</th>`).join('')+'</tr>';
    const dayRow='<tr style="border-bottom:1px solid #f1f5f9"><td class="label-col"></td><td class="date-col"></td><td class="status-col"></td>'+cols.map(d=>{const isT=sameDay(d,t);return`<th style="${isT?'color:#C8102E;font-weight:700':''}">${d.getDate()}</th>`;}).join('')+'</tr>';
    const msGanttRows=msDated.map(m=>{
      const isDone=isMilestoneEffectivelyDone(m);
      const d=daysDiff(m.date);
      const chipBg=isDone?'#dcfce7':d<0?'#fef3c7':d===0?'#fee2e2':d<=7?'#eff6ff':'#f1f5f9';
      const chipColor=isDone?'#166534':d<0?'#92400e':d===0?'#991b1b':d<=7?'#1d4ed8':'#64748b';
      const chipLbl=isDone?'Done':d<0?Math.abs(d)+'d ago':d===0?'Today':d+'d';
      const barColor=COL[m.key]||'#8b5cf6';
      const mDate=new Date(m.date+'T00:00:00');
      const cells=cols.map(cd=>{
        const isT=sameDay(cd,t);
        const onMs=sameDay(cd,mDate);
        const bg=onMs?barColor:isT?'#fff0f0':'transparent';
        const border=isT?'border-left:1.5px solid rgba(200,16,46,0.3)':'';
        return`<td class="cell" style="background:${bg};${border};border-radius:${onMs?'3px':'0'}">${onMs?`<div style="height:16px;width:100%;border-radius:3px"></div>`:isT?`<div style="height:16px;border-left:1.5px solid rgba(200,16,46,0.25)"></div>`:''}</td>`;
      }).join('');
      return`<tr style="border-bottom:1px solid #f8fafc">
        <td class="label-col"><span class="dot" style="background:${isDone?'#22c55e':d<0?'#f59e0b':barColor}"></span>${m.label}</td>
        <td class="date-col">${fmt(m.date)}</td>
        <td class="status-col"><span class="chip" style="background:${chipBg};color:${chipColor}">${chipLbl}</span></td>
        ${cells}
      </tr>`;
    }).join('');
    return`<div class="gantt-section"><div class="card-label">Project Timeline</div><div class="gantt-wrap"><table class="gantt-table"><thead>${monthRow}${dayRow}</thead><tbody>${msGanttRows}</tbody></table></div></div>`;
  })()}

  <!-- BOTTOM ROW -->
  <div class="bottom-row">
    ${(()=>{
    try{
    const DEFAULT_DELIVS=[
      {label:'Training',key:'training'},{label:'IT Site Survey',key:'it_survey'},
      {label:'Facility Site Survey',key:'facility_survey'},{label:'Branding / Vinyl',key:'vinyl'},
      {label:'Products / Hardware',key:'arrival'},{label:'Badge Reader Setup',key:'badge'},
      {label:'Employee List',key:'employee'},{label:'UAT Sign-off',key:'uat'},
      {label:'Installation',key:'installation'},
    ];
    const msKeyMap2={};pMs.forEach(m=>{msKeyMap2[m.key]=m;});
    const getDD=(key)=>{const km={training:'training',vinyl:'vinyl',arrival:'arrival',uat:'uat',installation:'installation'};const mk=km[key];return mk&&msKeyMap2[mk]?msKeyMap2[mk].date:'';};
    const savedDelivs=proj.client_deliverables||[];
    const delivRows=DEFAULT_DELIVS.map(d=>{const s=savedDelivs.find(x=>x.key===d.key)||{};return{...d,date:s.date||getDD(d.key)||'',status:s.status||'Pending',notes:s.notes||''};});
    savedDelivs.filter(s=>!DEFAULT_DELIVS.find(d=>d.key===s.key)).forEach(s=>delivRows.push(s));
    const delivHtml=delivRows.map(function(d){
      const isDone=d.status==='Complete';
      const bg=isDone?'#dcfce7':d.status==='In Progress'?'#eff6ff':'#f1f5f9';
      const fc=isDone?'#166534':d.status==='In Progress'?'#1d4ed8':'#64748b';
      return'<tr><td>'+d.label+'</td><td style="font-family:monospace;white-space:nowrap">'+(d.date?fmt(d.date):'')+'</td><td><span class="chip" style="background:'+bg+';color:'+fc+'">'+d.status+'</span></td><td style="color:#94a3b8">'+(d.notes||'')+'</td></tr>';
    }).join('');
    return'<div class="card"><div class="card-label" style="margin-bottom:10px">Client Deliverables</div><table class="deliv-table"><thead><tr><th>Deliverable</th><th>Due Date</th><th>Status</th><th>Notes</th></tr></thead><tbody>'+delivHtml+'</tbody></table></div>';
    }catch(e){return'<div class="card"><b>Deliverables error:</b> '+e.message+'</div>';}
    })()}

    <!-- TEAM + LINKS -->
    <div>
      ${teamRows.length?'<div class="card" style="margin-bottom:1.25rem"><div class="card-label" style="margin-bottom:10px">Project Team</div>'+teamRows.map(t=>'<div class="team-row"><div class="team-avatar">'+(t.name||'?')[0].toUpperCase()+'</div><div><div class="team-role">'+(t.role||'')+'</div><div class="team-name">'+t.name+'</div></div></div>').join('')+'</div>':''}
      ${clientLinks.length?'<div class="card"><div class="card-label" style="margin-bottom:10px">Key Resources</div>'+clientLinks.map(l=>'<div class="link-row"><span style="font-size:12px;font-weight:500">'+l.label+'</span><a href="'+l.url+'" target="_blank" style="font-size:11px;color:#3b82f6;font-weight:600;text-decoration:none">Open ↗</a></div>').join('')+'</div>':''}
    </div>
  </div>


  <div class="footer">Signifi Solutions · Confidential · ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
</div>
</body>
</html>`;

  // Write into a full-screen overlay in the current page
  // Remove any existing overlay first
  const existing=document.getElementById('client-export-overlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='client-export-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:white;overflow-y:auto;padding:0';
  overlay.innerHTML=html+`<div class="no-print" style="position:fixed;bottom:20px;right:20px;display:flex;gap:8px;z-index:100000">
    <button onclick="ceprint()" style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:600;padding:10px 20px;background:#0f172a;color:white;border:none;border-radius:8px;cursor:pointer">🖨 Print / Save PDF</button>
    <button onclick="document.getElementById('client-export-overlay').remove();document.body.style.overflow=''" style="font-family:DM Sans,sans-serif;font-size:13px;font-weight:600;padding:10px 20px;background:#e2e8f0;color:#0f172a;border:none;border-radius:8px;cursor:pointer">✕ Close</button>
  </div>`;
  document.body.appendChild(overlay);
  document.body.style.overflow='hidden';
  } catch(e){alert('Export error: '+e.message+'\n'+e.stack?.split('\n')[1]);}
}
// Print only the client export overlay — hides the hub behind it
function ceprint(){
  const overlay=document.getElementById('client-export-overlay');
  if(!overlay)return;
  // Clone overlay content into a print window
  const win=window.open('','_blank','width=1200,height=800');
  if(!win){
    // Fallback: inject print-only style
    const s=document.createElement('style');
    s.id='ce-print-style';
    s.textContent='@media print{body>*:not(#client-export-overlay){display:none!important;}#client-export-overlay .no-print{display:none!important;}}';
    document.head.appendChild(s);
    window.print();
    setTimeout(()=>{const el=document.getElementById('ce-print-style');if(el)el.remove();},1000);
    return;
  }
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Project Export</title>');
  // Copy all styles
  Array.from(document.styleSheets).forEach(ss=>{try{Array.from(ss.cssRules).forEach(r=>{try{win.document.write('<style>'+r.cssText+'</style>');}catch(e){}});}catch(e){}});
  win.document.write('</head><body style="margin:0;padding:0">');
  // Write the overlay content (without the button bar)
  const clone=overlay.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el=>el.remove());
  clone.style.cssText='position:static;overflow:visible;';
  win.document.write(clone.innerHTML);
  win.document.write('</body></html>');
  win.document.close();
  win.focus();
  setTimeout(()=>{win.print();win.close();},500);
}
function exportProjPageExcel(){
  const proj=projects.find(p=>p.id===ppProjId);
  if(!proj){showToast('No project selected');return;}
  const pMs=milestones.filter(m=>m.project_id===ppProjId);
  const wb=XLSX.utils.book_new();
  const dateStr=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const statusVal=getSection('status')||'on-track';
  const statusLbl=statusVal==='on-track'?'On Track':statusVal==='at-risk'?'At Risk':'Off Track';
  // Sheet 1: Overview
  const r1=[
    ['PROJECT PAGE EXPORT',''],['Generated',dateStr],['',''],
    ['PROJECT INFORMATION',''],['Project Name',proj.name||''],['Sales Order (SO)',proj.so_number||''],
    ['Client',proj.client||''],['Project Manager',proj.pm||''],['Status',statusLbl],
    ['Current Phase',getSection('phase')||''],['Product Type',proj.product_type||''],['Location',proj.location||''],
    ['',''],['PROJECT SUMMARY',''],[(getSection('summary')||''),''],
    ['',''],['KEY LINKS',''],
    ['Odoo Task',proj.odoo_url||''],['Jira / UI Task',proj.ui_task_url||''],
    ['QA Task',proj.qa_task_url||''],['Product Template',proj.product_template_url||''],
    ['Badge Reader',proj.badge_reader_url||''],['Employee List',proj.employee_list_url||''],
    ...ppData.links.filter(l=>!['Odoo Task','Jira / UI Task','QA Task','Product Template','Badge Reader','Employee List'].includes(l.label)).map(l=>[l.label,l.url||'']),
    ['',''],['INTERNAL NOTES',''],[(getSection('notes')||''),''],
  ];
  const ws1=XLSX.utils.aoa_to_sheet(r1);
  ws1['!cols']=[{wch:26},{wch:60}];
  // Make all link cells actual hyperlinks
  const linkRows=[
    ['Odoo Task',proj.odoo_url],['Jira / UI Task',proj.ui_task_url],
    ['QA Task',proj.qa_task_url],['Product Template',proj.product_template_url],
    ['Badge Reader',proj.badge_reader_url],['Employee List',proj.employee_list_url],
    ['Facility Site Survey',proj.facility_survey_url],['IT Site Survey',proj.it_survey_url],
    ['Vinyl Render Odoo',proj.vinyl_odoo_url],
    ...ppData.links.filter(l=>l.url).map(l=>[l.label,l.url]),
  ];
  // Find the row index of KEY LINKS header in r1 and apply hyperlinks from there
  const keyLinksIdx=r1.findIndex(row=>row[0]==='KEY LINKS');
  linkRows.forEach((lr,i)=>{
    const url=lr[1];
    if(!url||!url.startsWith('http'))return;
    const rowIdx=keyLinksIdx+1+i;
    const cellRef='B'+(rowIdx+1);
    if(ws1[cellRef]){
      ws1[cellRef].l={Target:url,Tooltip:lr[0]};
    }
  });
  XLSX.utils.book_append_sheet(wb,ws1,'Overview');
  // Sheet 2: Milestones
  const r2=[['MILESTONE TRACKER','','',''],['Milestone','Date','Days from today','Status']];
  [...pMs].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>{
    const d=daysDiff(m.date);
    r2.push([m.label,m.date||'',m.date?d:'',d<0?'Done':d===0?'Today':d<=7?'In '+d+'d':'In '+d+'d']);
  });
  const ws2=XLSX.utils.aoa_to_sheet(r2);ws2['!cols']=[{wch:28},{wch:14},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Milestones');
  // Sheet 3: Team
  const r3=[['PROJECT TEAM','','',''],['Role','Name','Organization','Email']];
  ppData.team.forEach(m=>r3.push([m.role||'',m.name||'',m.organization||'',m.email||'']));
  const ws3=XLSX.utils.aoa_to_sheet(r3);ws3['!cols']=[{wch:22},{wch:22},{wch:22},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws3,'Project Team');
  // Sheet 4: Action items
  const r4=[['ACTION ITEMS','','',''],['Owner','Action Item','Due Date','Status']];
  ppData.actions.forEach(a=>r4.push([a.owner||'',a.description||'',a.due_date||'',a.status||'']));
  const ws4=XLSX.utils.aoa_to_sheet(r4);ws4['!cols']=[{wch:16},{wch:45},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws4,'Action Items');
  // Sheet 5: Risks & Issues
  const r5=[['RISKS & ISSUES','','','',''],['Type','Description','Impact / Resolution','Owner','Status']];
  ppData.risks.forEach(r=>r5.push([r.type||'Risk',r.description||'',r.type==='Risk'?r.impact||'':r.mitigation||'',r.owner||'',r.status||'']));
  const ws5=XLSX.utils.aoa_to_sheet(r5);ws5['!cols']=[{wch:8},{wch:40},{wch:30},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws5,'Risks & Issues');
  // Sheet 6: Decisions
  const r6=[['DECISION LOG','',''],['Date','Decision','Approved By']];
  ppData.decisions.forEach(d=>r6.push([d.decision_date||'',d.description||'',d.approved_by||'']));
  const ws6=XLSX.utils.aoa_to_sheet(r6);ws6['!cols']=[{wch:14},{wch:50},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws6,'Decision Log');
  const fname=(proj.so_number||proj.name).replace(/[^a-zA-Z0-9]/g,'_')+'_ProjectPage_'+new Date().toISOString().split('T')[0]+'.xlsx';
  XLSX.writeFile(wb,fname);
  showToast('Project page exported ✓');
}

    <div class="mc-col"><div class="mc-col-h" style="color:#ef8a8a">Needs attention <span class="cnt" id="mc-cnt-attn"></span></div><div class="mc-scroll" id="mc-attn"></div></div>

<script>
// ── MISSION CONTROL ────────────────────────────────────────
let mcOpen=false,mcClockTimer=null,mcDataTimer=null,mcCountdown=60;
function mcEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function openMissionControl(){
  mcOpen=true;
  document.getElementById('mc-overlay').classList.add('open');
  document.getElementById('nav-dropdown')?.classList.remove('open');
  mcRender();mcTickClock();
  mcClockTimer=setInterval(mcTickClock,1000);
  mcCountdown=60;
  mcDataTimer=setInterval(async()=>{
    mcCountdown--;
    document.getElementById('mc-refresh-in').textContent='refresh in '+mcCountdown+'s';
    if(mcCountdown<=0){mcCountdown=60;try{await loadAll();}catch(e){}if(mcOpen)mcRender();}
  },1000);
}
function closeMissionControl(){
  mcOpen=false;
  document.getElementById('mc-overlay').classList.remove('open');
  clearInterval(mcClockTimer);clearInterval(mcDataTimer);
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
function mcFullscreen(){const el=document.getElementById('mc-overlay');if(!document.fullscreenElement)el.requestFullscreen?.().catch(()=>{});else document.exitFullscreen().catch(()=>{});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mcOpen)closeMissionControl();});
function mcTickClock(){
  const n=new Date();
  document.getElementById('mc-clock').textContent=n.toLocaleTimeString('en-US',{hour12:false});
  document.getElementById('mc-date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function mcCountUp(el,target){
  const dur=800,start=performance.now();
  function step(t){const p=Math.min((t-start)/dur,1);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function mcRender(){
  const act=projects.filter(p=>p.status!=='complete');
  const healths=act.map(p=>({p,h:calcHealth(p.id)})).filter(x=>x.h);
  const onTrack=healths.filter(x=>!x.h.overdue&&!x.h.escalation).length;
  const atRisk=healths.filter(x=>x.h.overdue>0&&!x.h.escalation).length;
  const critical=healths.filter(x=>x.h.escalation>0).length;
  const allEv=[...milestones.filter(m=>m.date&&act.some(p=>p.id===m.project_id)).map(m=>{
      const p=act.find(x=>x.id===m.project_id);
      return{...m,projectName:p?.name||'',_pm:p?.pm||'',_so:m.so_tag||p?.so_number||''};
    }),...getAdHocAsMilestones()];
  const wk=(d,a,b)=>{const dd=daysDiff(d);return dd>=a&&dd<=b;};
  const notDone=allEv.filter(e=>e._adhoc?!/complete|delivered/i.test(e._status||''):!isMilestoneDone(e));
  const todayEv=notDone.filter(e=>daysDiff(e.date)===0);
  const weekEv=notDone.filter(e=>wk(e.date,1,7)).sort((a,b)=>a.date.localeCompare(b.date));
  const deliveriesWk=notDone.filter(e=>(e.key==='delivery'||e.key==='shipping')&&wk(e.date,0,6)).length;
  const installsWk=notDone.filter(e=>e.key==='installation'&&wk(e.date,0,6)).length;
  const attn=notDone.filter(e=>!e._adhoc&&daysDiff(e.date)<0).sort((a,b)=>daysDiff(a.date)-daysDiff(b.date));
  // KPIs
  const kpis=[
    {v:act.length,l:'Active projects',c:'#eee'},
    {v:onTrack,l:'On track',c:'#22c55e'},
    {v:atRisk,l:'At risk',c:'#eab308'},
    {v:critical,l:'Critical',c:'#ef4444'},
    {v:deliveriesWk,l:'Ship / deliver · 7d',c:'#2563eb'},
    {v:installsWk,l:'Installs · 7d',c:'#db2777'},
  ];
  document.getElementById('mc-kpis').innerHTML=kpis.map((k,i)=>`<div class="mc-kpi" style="--kc:${k.c}"><div class="mc-kpi-val" id="mc-kv-${i}">0</div><div class="mc-kpi-lbl">${k.l}</div></div>`).join('');
  kpis.forEach((k,i)=>mcCountUp(document.getElementById('mc-kv-'+i),k.v));
  // Columns
  const evRow=(e,crit)=>{
    const lbl=(typeof TYPE_LBL!=='undefined'&&TYPE_LBL[e.key])||e.key||'—';
    const dd=daysDiff(e.date);
    const dTxt=dd===0?'TODAY':dd<0?Math.abs(dd)+'d overdue':fmt(e.date);
    return`<div class="mc-ev${crit?' mc-crit':''}">
      <span class="mc-ev-type">${e._adhoc?'Ad hoc':mcEsc(lbl)}</span>
      <span class="mc-ev-name">${mcEsc(e.projectName||e.label)}<small>${mcEsc(e._so?'SO '+e._so:'')}${e._pm?' · PM '+mcEsc(e._pm):''}</small></span>
      <span class="mc-ev-date">${dTxt}</span></div>`;
  };
  const fill=(id,list,crit)=>{document.getElementById(id).innerHTML=list.length?list.map(e=>evRow(e,crit)).join(''):'<div class="mc-empty">Nothing here — all clear ✓</div>';};
  fill('mc-today',todayEv,false);fill('mc-week',weekEv,false);fill('mc-attn',attn.slice(0,30),true);
  document.getElementById('mc-cnt-today').textContent=todayEv.length;
  document.getElementById('mc-cnt-week').textContent=weekEv.length;
  document.getElementById('mc-cnt-attn').textContent=attn.length;
  // Health board — worst first
  const board=healths.sort((a,b)=>(b.h.escalation-a.h.escalation)||(b.h.overdue-a.h.overdue)||(a.h.score-b.h.score)).slice(0,12);
  document.getElementById('mc-board').innerHTML=board.map(x=>`
    <div class="mc-proj">
      <div class="mc-proj-name" title="${mcEsc(x.p.name)}">${mcEsc(x.p.name)}</div>
      <div class="mc-proj-meta">${mcEsc(x.p.so_number||'')}${x.p.pm?' · '+mcEsc(x.p.pm):''} · ${x.h.done}/${x.h.total} done${x.h.overdue?' · <span style="color:#ef4444">'+x.h.overdue+' overdue</span>':''}</div>
      <div class="mc-bar"><i style="width:${x.h.score}%;background:${x.h.color}"></i></div>
    </div>`).join('')||'<div class="mc-empty">No active projects</div>';
  // Ticker
  const tickSrc=attn.length?attn:weekEv;
  const tick=tickSrc.slice(0,20).map(e=>{
    const dd=daysDiff(e.date);
    const lbl=(typeof TYPE_LBL!=='undefined'&&TYPE_LBL[e.key])||e.key;
    return`<span class="mc-tick-item${dd>=0?' ok':''}">▪ ${mcEsc(e.projectName||e.label)} — ${mcEsc(lbl)} <b>${dd<0?Math.abs(dd)+'D OVERDUE':dd===0?'TODAY':fmt(e.date)}</b></span>`;
  }).join('');
  document.getElementById('mc-ticker').innerHTML=tick?tick+tick:'<span class="mc-tick-item ok">▪ All milestones on schedule <b>✓</b></span>';
}
</script>

<script>
// ── LIVE SYNC (multiplayer) ────────────────────────────────
let _lastLogSeen=null,_liveBusy=false;
async function livePoll(){
  if(_liveBusy)return;_liveBusy=true;
  try{
    const{data}=await sb.from('activity_log').select('id,created_at,user_name,action,entity_name').order('created_at',{ascending:false}).limit(1);
    const latest=data?.[0];
    if(latest){
      if(_lastLogSeen&&latest.created_at>_lastLogSeen&&latest.user_name!==currentUserName){
        // Don't clobber someone mid-edit
        const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||document.getElementById('modal-root')?.innerHTML;
        if(!typing){
          await loadAll();renderTab();if(typeof mcOpen!=='undefined'&&mcOpen)mcRender();
          showToast(`🔄 Live update — ${latest.user_name||'Someone'} ${latest.action||'made a change'}${latest.entity_name?' · '+latest.entity_name:''}`,3500);
        }
      }
      _lastLogSeen=latest.created_at;
    }
  }catch(e){}
  _liveBusy=false;
}
setInterval(livePoll,45000);setTimeout(livePoll,8000);
// Realtime channel too (works instantly if replication is enabled on the Supabase project; polling covers it otherwise)
try{sb.channel('ops-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(window._rtDeb);window._rtDeb=setTimeout(livePoll,1200);}).subscribe();}catch(e){}

// ── 📊 INSIGHTS TAB ────────────────────────────────────────
function insEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderInsights(){
  const el=document.getElementById('tab-insights');if(!el)return;
  const act=projects.filter(p=>p.status!=='complete');
  const actMs=milestones.filter(m=>act.some(p=>p.id===m.project_id));
  // Flat history
  const histFlat=Object.values(milestoneHistory||{}).flat();
  // Slip per project: current date vs original_date + reschedule count
  const slip=act.map(p=>{
    const pms=milestones.filter(m=>m.project_id===p.id&&m.date&&m.original_date);
    const days=pms.reduce((s,m)=>s+Math.max(0,Math.round((new Date(m.date)-new Date(m.original_date))/86400000)),0);
    const resched=histFlat.filter(h=>h.project_id===p.id).length;
    const h=calcHealth(p.id);
    return{p,days,resched,h};
  }).filter(x=>x.days>0||x.resched>0).sort((a,b)=>b.days-a.days);
  const totalSlip=slip.reduce((s,x)=>s+x.days,0);
  const overdueCt=actMs.filter(isMilestoneOverdue).length;
  const escCt=actMs.filter(isMilestoneEscalation).length;
  const doneCt=actMs.filter(isMilestoneDone).length;
  const dated=actMs.filter(m=>m.date).length;
  // KPIs
  const kpi=(v,l,c)=>`<div class="ins-kpi" style="--kc:${c}"><div class="ins-kpi-v">${v}</div><div class="ins-kpi-l">${l}</div></div>`;
  // ── Workload heatmap: 8 weeks × dept ──
  const DEPTS=[['Production',['production-start','production-end'],'#7c3aed'],['Quality / QA',['quality-start','quality-end','final-qc','uat'],'#d97706'],['Vinyl',['vinyl'],'#2563eb'],['Ship / Deliver',['shipping','delivery'],'#059669'],['Install',['installation','uninstallation','training'],'#db2777']];
  const mon0=monday(today());
  const weeks=[...Array(8)].map((_,i)=>({start:addD(mon0,i*7),end:addD(mon0,i*7+6)}));
  const adhoc=getAdHocAsMilestones();
  const allEv=[...actMs,...adhoc].filter(m=>m.date);
  const cellCounts=DEPTS.map(([name,keys])=>weeks.map(w=>allEv.filter(m=>keys.includes(m.key)&&new Date(m.date+'T00:00:00')>=w.start&&new Date(m.date+'T00:00:00')<=w.end).length));
  const maxCell=Math.max(1,...cellCounts.flat());
  const hm=`<table class="hm-table"><tr><th style="text-align:left">Dept</th>${weeks.map((w,i)=>`<th>${i===0?'This wk':fmt(isoD(w.start))}</th>`).join('')}</tr>
    ${DEPTS.map(([name,keys,color],di)=>`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${color};margin-right:6px"></span>${name}</td>
      ${cellCounts[di].map(c=>{const a=c/maxCell;return`<td><span class="hm-cell" style="background:${c?`${color}${Math.round(15+a*70).toString(16).padStart(2,'0')}`:'transparent'};color:${a>0.55?'#fff':c?'#333':'#ccc'}">${c||'·'}</span></td>`;}).join('')}</tr>`).join('')}</table>`;
  // ── Data health audit ──
  const audits=[];
  act.forEach(p=>{
    if(!p.pm)audits.push({sev:'med',msg:`<b>${insEsc(p.name)}</b> has no PM assigned`,pid:p.id});
    if(!p.so_number)audits.push({sev:'lo',msg:`<b>${insEsc(p.name)}</b> missing SO number`,pid:p.id});
    const g=k=>getMsDate(p.id,k);
    const seq=[['production-end','quality-start','QA starts before production ends'],['quality-end','shipping','Ships before QA ends'],['shipping','delivery','Delivery before ship date'],['delivery','installation','Install before delivery']];
    seq.forEach(([a,b,msg])=>{const da=g(a),db=g(b);if(da&&db&&db<da)audits.push({sev:'hi',msg:`<b>${insEsc(p.name)}</b> — ${msg} (${fmt(db)} vs ${fmt(da)})`,pid:p.id});});
    const pms=milestones.filter(m=>m.project_id===p.id);
    const noDate=pms.filter(m=>!m.date).length;
    if(noDate>=3)audits.push({sev:'lo',msg:`<b>${insEsc(p.name)}</b> — ${noDate} milestones missing dates`,pid:p.id});
  });
  // Red check-ins stale > 3 days
  Object.values(checkinStatus).forEach(ci=>{
    if(ci.stoplight==='red'&&ci.updated_at&&(Date.now()-new Date(ci.updated_at))/86400000>3){
      const m=milestones.find(x=>x.id===ci.milestone_id);const p=m&&projects.find(x=>x.id===m.project_id);
      if(p&&p.status!=='complete')audits.push({sev:'hi',msg:`<b>${insEsc(p.name)}</b> — 🔴 red check-in unresolved for ${Math.floor((Date.now()-new Date(ci.updated_at))/86400000)} days (${insEsc(m.label||m.key)})`,pid:p.id});
    }
  });
  // Install crunch days (3+ installs same day)
  const instByDay={};allEv.filter(m=>m.key==='installation').forEach(m=>{instByDay[m.date]=(instByDay[m.date]||0)+1;});
  Object.entries(instByDay).filter(([,c])=>c>=3).forEach(([d,c])=>audits.push({sev:'med',msg:`<b>${c} installations</b> scheduled on ${fmtFull(d)} — crew capacity check`,pid:null}));
  const sevRank={hi:0,med:1,lo:2};audits.sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]);
  // ── Recent reschedules w/ reasons ──
  const recentHist=[...histFlat].sort((a,b)=>(b.changed_at||'').localeCompare(a.changed_at||'')).slice(0,8);
  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:16px;font-weight:600">📊 Insights <span style="font-size:11px;color:var(--gray-500);font-weight:400;margin-left:8px"><span id="live-dot"></span>live · refreshes with data</span></div>
      <div style="font-size:11px;color:var(--gray-500)">Press <b>Ctrl/⌘ K</b> to jump anywhere</div>
    </div>
    <div class="ins-kpis">
      ${kpi(act.length,'Active projects','#0f0f0f')}
      ${kpi(dated?Math.round(doneCt/dated*100)+'%':'—','Milestones complete','#1a7a4a')}
      ${kpi(overdueCt,'Overdue now',overdueCt?'#C8102E':'#1a7a4a')}
      ${kpi(escCt,'🔴 Escalations',escCt?'#C8102E':'#1a7a4a')}
      ${kpi(totalSlip+'d','Total schedule slip',totalSlip>30?'#d97706':'#6b6b6b')}
    </div>
    <div class="ins-card"><div class="ins-card-h">Dept workload — next 8 weeks <small>milestones per week · darker = busier</small></div><div style="padding:8px 10px;overflow-x:auto">${hm}</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="ins-card"><div class="ins-card-h">Slip leaderboard <small>days lost vs original plan</small></div>
        ${slip.slice(0,10).map(x=>{const w=Math.min(100,x.days/Math.max(1,slip[0]?.days)*100);return`<div class="slip-row" style="cursor:pointer" onclick="selectedProjId='${x.p.id}';ppProjId='${x.p.id}';setTab('projpage')">
          <span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${insEsc(x.p.name)}</span>
          <span style="font-family:var(--mono);color:${x.days>10?'#C8102E':'#d97706'};font-weight:600">+${x.days}d</span>
          <span style="font-size:10px;color:var(--gray-500)">${x.resched} reschedule${x.resched!==1?'s':''}</span>
          <span class="slip-bar"><i style="width:${w}%"></i></span></div>`;}).join('')||'<div style="padding:1.5rem;text-align:center;color:var(--gray-500);font-size:12px">No slippage — everything on original dates ✓</div>'}
      </div>
      <div class="ins-card"><div class="ins-card-h">🩺 Data health audit <small>${audits.length} finding${audits.length!==1?'s':''} · click to open</small></div>
        <div style="max-height:340px;overflow-y:auto">
        ${audits.slice(0,25).map(a=>`<div class="audit-row" ${a.pid?`onclick="selectedProjId='${a.pid}';ppProjId='${a.pid}';setTab('projpage')"`:''}>
          <span class="audit-sev sev-${a.sev}">${a.sev==='hi'?'High':a.sev==='med'?'Med':'Low'}</span><span>${a.msg}</span></div>`).join('')||'<div style="padding:1.5rem;text-align:center;color:var(--gray-500);font-size:12px">Clean bill of health ✓</div>'}
        </div>
      </div>
    </div>
    <div class="ins-card"><div class="ins-card-h">Recent reschedules <small>from milestone history</small></div>
      ${recentHist.map(h=>{const p=projects.find(x=>x.id===h.project_id);return`<div class="slip-row" style="grid-template-columns:1fr auto auto">
        <span><b>${insEsc(p?.name||'—')}</b>${h.reason?` <span style="color:var(--gray-500);font-style:italic">— ${insEsc(h.reason)}</span>`:''}</span>
        <span style="font-family:var(--mono);font-size:11px"><span style="color:var(--red);text-decoration:line-through">${fmt(h.old_date)}</span> → <b>${fmt(h.new_date)}</b></span>
        <span style="font-size:10px;color:var(--gray-500)">${insEsc(h.changed_by||'')}</span></div>`;}).join('')||'<div style="padding:1.5rem;text-align:center;color:var(--gray-500);font-size:12px">No reschedules recorded yet</div>'}
    </div>`;
}
</script>

@keyframes cfFall{to{transform:translate(var(--cx),105vh) rotate(720deg);opacity:1}}
.cf{position:fixed;top:-12px;width:9px;height:9px;z-index:999999;pointer-events:none;animation:cfFall 1.6s ease-in forwards;border-radius:2px;}
</style>
<script>
// ── VERSION BADGE ──────────────────────────────────────────
const OPS_VERSION='v1.9.6';
try{const hd=document.getElementById('hdate');if(hd)hd.insertAdjacentHTML('beforebegin','<span style="font-family:var(--mono);font-size:9px;color:#555;border:1px solid #2a2a2a;border-radius:10px;padding:2px 8px" title="Mission Control · ⌘K palette · Live sync · Insights · Calendar">'+OPS_VERSION+'</span>');}catch(e){}
// ── CONFETTI on milestone done ─────────────────────────────
function opsConfetti(){const C=['#C8102E','#22c55e','#2563eb','#eab308','#db2777','#7c3aed'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=C[i%C.length];d.style.setProperty('--cx',(Math.random()*160-80)+'px');d.style.animationDelay=(Math.random()*0.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2300);}}
try{const _tmd=toggleMilestoneDone;toggleMilestoneDone=async function(mid,pid,e){const was=!!milestoneDone[mid];await _tmd.apply(this,arguments);if(!was&&milestoneDone[mid])opsConfetti();};}catch(e){}
// ── 📆 MONTH CALENDAR ──────────────────────────────────────
let calRef=new Date();
const CAL_COLOR={'production-start':'#7c3aed','production-end':'#7c3aed','quality-start':'#d97706','quality-end':'#d97706','final-qc':'#0891b2',uat:'#16a34a',vinyl:'#2563eb',shipping:'#059669',delivery:'#2563eb',installation:'#db2777',uninstallation:'#f43f5e',training:'#f59e0b','po-release':'#6b6b6b','mo-release':'#6b6b6b',arrival:'#0891b2',other:'#6b6b6b'};
function renderCalendar(){
  const el=document.getElementById('tab-calendar');if(!el)return;
  const y=calRef.getFullYear(),mo=calRef.getMonth();
  const first=new Date(y,mo,1),start=monday(first);
  const act=activeProjects('week');
  const evs=[...milestones.filter(m=>m.date&&act.some(p=>p.id===m.project_id)).map(m=>{const p=act.find(x=>x.id===m.project_id);return{...m,projectName:p?.name||'',_pid:p?.id};}),...getAdHocAsMilestones()];
  const byDay={};evs.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  let cells='';
  for(let i=0;i<42;i++){
    const d=addD(start,i);if(i>=35&&d.getMonth()!==mo)break;
    const iso=isoD(d),list=(byDay[iso]||[]);
    const pills=list.slice(0,3).map(e=>{
      const done=!e._adhoc&&isMilestoneDone(e);
      const lbl=(TYPE_LBL[e.key]||e.key);
      return `<span class="cal-pill${done?' pdone':''}" style="background:${CAL_COLOR[e.key]||'#6b6b6b'}" title="${(lbl+' — '+(e.projectName||e.label)).replace(/"/g,'&quot;')}" onclick="${e._pid?`selectedProjId='${e._pid}';ppProjId='${e._pid}';setTab('projpage')`:''}">${(e.projectName||e.label||'').replace(/</g,'&lt;')}</span>`;}).join('');
    const more=list.length>3?`<span class="cal-more" title="${list.slice(3).map(e=>(TYPE_LBL[e.key]||e.key)+' — '+(e.projectName||e.label)).join('\n').replace(/"/g,'&quot;')}">+${list.length-3} more</span>`:'';
    cells+=`<div class="cal-day${d.getMonth()!==mo?' dim':''}${sameDay(d,today())?' today':''}"><div class="cal-dnum">${d.getDate()}</div>${pills}${more}</div>`;
  }
  const legend=[['Production','#7c3aed'],['QA','#d97706'],['Vinyl / Delivery','#2563eb'],['Shipping','#059669'],['Install','#db2777'],['Training','#f59e0b']].map(([l,c])=>`<span><i style="background:${c}"></i>${l}</span>`).join('');
  el.innerHTML=`<div class="cal-head"><div class="cal-title">📆 ${calRef.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div>
    <div style="display:flex;align-items:center;gap:8px">${pmDropdown('renderCalendar')}<span class="cal-nav">
    <button onclick="calRef=new Date(calRef.getFullYear(),calRef.getMonth()-1,1);renderCalendar()">← Prev</button>
    <button onclick="calRef=new Date();renderCalendar()">Today</button>
    <button onclick="calRef=new Date(calRef.getFullYear(),calRef.getMonth()+1,1);renderCalendar()">Next →</button></span></div></div>
    <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">${legend}</div>`;
}
</script>

<style>
#pc-banner{position:fixed;inset:0;z-index:999998;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0.55),rgba(0,0,0,0.75));animation:pcBg .4s ease;}
@keyframes pcBg{from{opacity:0}to{opacity:1}}
#pc-banner.out{animation:pcOut .5s ease forwards;}
@keyframes pcOut{to{opacity:0}}
.pc-card{text-align:center;animation:pcPop .6s cubic-bezier(.18,1.4,.4,1);}
@keyframes pcPop{0%{transform:scale(.3) rotate(-4deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.pc-trophy{font-size:88px;line-height:1;animation:pcBounce 1.1s ease .3s infinite alternate;filter:drop-shadow(0 8px 30px rgba(255,200,0,.45));}
@keyframes pcBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-14px) scale(1.06)}}
.pc-title{font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:#ffd042;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.6);}
.pc-name{font-family:var(--font);font-size:40px;font-weight:600;color:#fff;margin-top:6px;text-shadow:0 4px 24px rgba(0,0,0,.7);max-width:80vw;}
.pc-sub{font-family:var(--mono);font-size:12px;color:#ffffffb0;margin-top:12px;letter-spacing:.1em;}
@media(prefers-reduced-motion:reduce){.pc-trophy,.pc-card{animation:none!important;}}
</style>
<script>
// ── MEGA CELEBRATION — overrides the stock fireConfetti ────
try{
  const _origTA=toggleArchive;
  toggleArchive=async function(id,cur){window._pcName=(projects.find(p=>p.id===id)||{}).name||'';return _origTA.apply(this,arguments);};
}catch(e){}
function pcFanfare(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const notes=[[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.38],[1318.5,.52],[1046.5,.72]];
    notes.forEach(([f,t])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,ac.currentTime+t);g.gain.linearRampToValueAtTime(.14,ac.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.5);
      o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.55);});
    setTimeout(()=>ac.close(),2500);
  }catch(e){}
}
fireConfetti=function(){
  const name=window._pcName||'';
  // Banner
  const b=document.createElement('div');b.id='pc-banner';
  b.innerHTML=`<div class="pc-card"><div class="pc-trophy">🏆</div><div class="pc-title">Project Complete</div>${name?`<div class="pc-name">${String(name).replace(/</g,'&lt;')}</div>`:''}<div class="pc-sub">SHIPPED · DELIVERED · DONE ✓</div></div>`;
  document.body.appendChild(b);
  setTimeout(()=>b.classList.add('out'),4200);setTimeout(()=>b.remove(),4800);
  pcFanfare();
  // Canvas — cannons + fireworks + gold rain, 3 waves
  const colors=['#ffd042','#ffb300','#C8102E','#fff','#7c3aed','#059669','#2563eb','#db2777'];
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999999';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  const ctx=cv.getContext('2d');let pieces=[];
  const mk=o=>({w:Math.random()*10+4,h:Math.random()*7+3,color:colors[Math.random()*colors.length|0],rot:Math.random()*360,rotV:(Math.random()-.5)*14,opacity:1,shape:Math.random()<.25?'circle':'rect',...o});
  const cannon=(x,dir)=>{for(let i=0;i<90;i++)pieces.push(mk({x,y:cv.height*.75,vx:dir*(Math.random()*11+5),vy:-(Math.random()*13+7)}));};
  const firework=(x,y)=>{for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,s=Math.random()*7+2;pieces.push(mk({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,w:5,h:5,shape:'circle'}));}};
  const rain=n=>{for(let i=0;i<n;i++)pieces.push(mk({x:Math.random()*cv.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:Math.random()*4+2}));};
  cannon(0,1);cannon(cv.width,-1);rain(120);
  setTimeout(()=>{firework(cv.width*.3,cv.height*.3);firework(cv.width*.7,cv.height*.25);},700);
  setTimeout(()=>{cannon(0,1);cannon(cv.width,-1);firework(cv.width*.5,cv.height*.2);},1500);
  setTimeout(()=>{rain(100);firework(cv.width*.2,cv.height*.35);firework(cv.width*.8,cv.height*.3);},2500);
  let frame=0;
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.16;p.vx*=0.995;p.rot+=p.rotV;
      if(frame>200)p.opacity=Math.max(0,p.opacity-0.02);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.globalAlpha=p.opacity;ctx.fillStyle=p.color;
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,7);ctx.fill();}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();});
    pieces=pieces.filter(p=>p.y<cv.height+40&&p.opacity>0);
    frame++;
    if(frame<300&&(pieces.length||frame<170))requestAnimationFrame(draw);else cv.remove();
  })();
};
</script>

<script>
// Navigate to a project reliably, clearing any filter that would hide it
function gsGo(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  try{if(pmFilter&&p.pm!==pmFilter){pmFilter='';showToast('PM filter cleared to show this project');}}catch(e){}
  try{if(salesFilter&&p.sales!==salesFilter)salesFilter='';}catch(e){}
  selectedProjId=id;ppProjId=id;setTab('projpage');
}
// FIX 1+3: header global search — results now navigate via gsGo (filter-proof) + names HTML-escaped
globalSearch=function(q){
  const el=document.getElementById('gs-results');
  if(!q||q.length<2){el.style.display='none';return;}
  const ql=q.toLowerCase(),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const matches=projects.filter(p=>(p.name||'').toLowerCase().includes(ql)||(p.so_number||'').toLowerCase().includes(ql)||(p.client||'').toLowerCase().includes(ql)||(p.pm||'').toLowerCase().includes(ql)).slice(0,8);
  if(!matches.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=matches.map(p=>{
    const next=milestones.filter(m=>m.project_id===p.id&&m.date&&daysDiff(m.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
    return`<div onclick="document.getElementById('global-search').value='';document.getElementById('gs-results').style.display='none';gsGo('${p.id}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between"
      onmouseover="this.style.background='#252525'" onmouseout="this.style.background='transparent'">
      <div><div style="font-size:12px;font-weight:600;color:#e5e7eb">${esc(p.name)}</div>
      <div style="font-size:10px;color:#6b7280;margin-top:2px">${esc(p.so_number||'')} · ${esc(p.client||'')} · ${esc(p.pm||'No PM')}</div></div>
      <div style="text-align:right;flex-shrink:0;margin-left:10px">${next?`<div style="font-size:10px;color:#60a5fa">${esc(next.label)}</div><div style="font-size:9px;color:#6b7280">${fmt(next.date)}</div>`:'<div style="font-size:10px;color:#4b5563">No upcoming</div>'}</div></div>`;
  }).join('');
};
// FIX 2: project-page picker — exact match first, longest-SO wins (child beats master), commit-only
onProjPageSearch=function(val){
  if(!val||val.trim().length<2)return;
  const vl=val.trim().toLowerCase();
  const disp=p=>(p.name+(p.so_number?' — '+p.so_number:'')).toLowerCase();
  const match=projects.find(p=>disp(p)===vl)
    ||projects.find(p=>(p.name||'').toLowerCase()===vl)
    ||projects.filter(p=>p.so_number&&vl.includes(p.so_number.toLowerCase())).sort((a,b)=>(b.so_number||'').length-(a.so_number||'').length)[0]
    ||projects.find(p=>disp(p).startsWith(vl)||(p.name||'').toLowerCase().startsWith(vl));
  const inp=document.getElementById('pp-proj-search');
  if(!match){if(inp)inp.style.borderColor='var(--red)';return;}
  if(inp){inp.value='';inp.style.borderColor='';inp.blur();}
  if(match.id!==ppProjId)switchProjPage(match.id);
};
</script>

<script>
// ── BACKFILL MISSING MILESTONES (repair tool for projects created before the fix) ──
const FULL_MS_SET=[
  ['po-release','PO Release'],['mo-release','MO Release'],
  ['arrival','Parts ordering start'],['arrival','Parts arrival'],['arrival','Inventory pick'],
  ['production-start','Production start'],['production-end','Production end'],
  ['other','Planogram sign-off'],['other','Planogram start'],['other','Planogram end'],
  ['other','UI start'],['other','UI end'],
  ['quality-start','Quality start'],['quality-end','Quality end'],['final-qc','Final QC'],
  ['vinyl','Vinyl / branding'],['uat','UAT'],
  ['shipping','Pack & ship'],['delivery','Delivery'],
  ['training','Training'],['installation','Installation'],
  ['other','Customer care start'],
];
async function backfillMilestones(projId){
  const proj=projects.find(p=>p.id===projId);
  if(!proj){alert('Could not find this project — refresh and try again.');return;}
  const projMs=milestones.filter(m=>m.project_id===projId);
  const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const hasSoTags=projMs.some(m=>m.so_tag);
  const targets=(hasSoTags&&soList.length>1)?soList:[null];
  const ins=[];
  targets.forEach(tag=>{
    const existing=new Set(projMs.filter(m=>!tag||m.so_tag===tag||!m.so_tag).map(m=>(m.label||'').toLowerCase().trim()));
    FULL_MS_SET.forEach(([key,label])=>{
      if(!existing.has(label.toLowerCase()))ins.push(Object.assign({project_id:projId,key,label,date:null,changed_by:currentUserName},tag?{so_tag:tag}:{}));
    });
  });
  if(!ins.length){
    alert('✓ All '+FULL_MS_SET.length+' standard milestones already exist on this project.\n\nNeed something extra (e.g. "Parts arrive — batch 2")? Use the ＋ Add custom button instead.');
    return;
  }
  if(!confirm('Generate '+ins.length+' missing milestone'+(ins.length!==1?'s':'')+' (undated) for "'+proj.name+'"?'))return;
  const{error}=await sb.from('milestones').insert(ins);
  if(error){alert('Error: '+error.message);return;}
  await logActivity('generated missing milestones',proj.name||'',proj.so_number||'',projId,null,String(ins.length));
  closeModal();await loadAll();
  showToast(ins.length+' milestones generated ✓ — undated, at the top of the list');
  openEditProj(projId); // reopen so the new rows are immediately visible with empty date inputs
}
</script>
<script>
// ═══ PROCUREMENT PANEL (hub side) — reads the shared procurement tables ═══
function hubProcPosFor(p){
  const sos=(p.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const ids=new Set((procLinkData||[]).filter(l=>l.project_id===p.id||(l.so_number&&sos.includes(l.so_number))).map(l=>l.po_id));
  return (procPoData||[]).filter(x=>ids.has(x.id)&&x.status!=='cancelled');
}
function hubProcStatus(p){
  const list=hubProcPosFor(p);
  if(!list.length)return{label:'No POs yet',bg:'var(--gray-100)',fg:'var(--gray-500)'};
  const open=list.filter(x=>x.status!=='received');
  const late=open.filter(x=>x.eta&&daysDiff(x.eta)<0);
  if(late.length)return{label:'🚨 Vendor late ('+late.length+')',bg:'var(--red-light)',fg:'var(--red)'};
  if(!open.length)return{label:'✅ Ready for Inventory',bg:'var(--success-bg)',fg:'var(--success)'};
  if(list.some(x=>x.status==='partial'))return{label:'Partial received',bg:'var(--warning-bg)',fg:'var(--warning)'};
  if(list.every(x=>x.odoo_status==='rfq'))return{label:'RFQ — cost pending',bg:'#f3e8ff',fg:'#7c3aed'};
  return{label:'Waiting vendor',bg:'var(--blue-bg)',fg:'var(--blue)'};
}
function renderProcPanel(pid){
  const p=projects.find(x=>x.id===pid);if(!p)return'';
  if(typeof procPoData==='undefined'||procPoData===null)return'';
  const e=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const list=hubProcPosFor(p).sort((a,b)=>(a.eta||'9999').localeCompare(b.eta||'9999'));
  const st=hubProcStatus(p);
  const recv=list.filter(x=>x.status==='received').length;
  const rd=(procReadyData||{})[pid];
  const stopHtml=rd?.stoplight?`<span style="font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px;${rd.stoplight==='green'?'background:var(--success-bg);color:var(--success)':rd.stoplight==='yellow'?'background:var(--warning-bg);color:var(--warning)':'background:var(--red-light);color:var(--red)'}">${rd.stoplight==='green'?'🟢 Can meet date':rd.stoplight==='yellow'?'🟡 At risk':'🔴 Cannot meet date'}</span>${rd.reason?`<span style="font-size:10.5px;color:var(--gray-500)"> — ${e(rd.reason)} <span style="color:var(--gray-300)">(${e(rd.updated_by||'')})</span></span>`:''}`:'<span style="font-size:10.5px;color:var(--gray-400)">No readiness check-in yet</span>';
  const prio=p.priority==='critical'?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--red-light);color:var(--red)">🔴 CRITICAL</span>':p.priority==='high'?'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--warning-bg);color:var(--warning)">🟡 HIGH</span>':'';
  const rows=list.slice(0,12).map(po=>{
    const late=po.status!=='received'&&po.eta&&daysDiff(po.eta)<0;
    const pill=po.odoo_status==='rfq'?'<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;background:#f3e8ff;color:#7c3aed">RFQ</span>':po.status==='received'?'<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--success-bg);color:var(--success)">Received</span>':po.status==='partial'?'<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--warning-bg);color:var(--warning)">Partial</span>':'<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--blue-bg);color:var(--blue)">Open</span>';
    return`<tr>
      <td style="font-family:var(--mono);font-size:11px">${e(po.po_number||'—')}</td>
      <td style="font-size:11.5px;font-weight:500">${e(po.vendor||'—')}</td>
      <td>${pill}</td>
      <td style="font-family:var(--mono);font-size:10.5px;${late?'color:var(--red);font-weight:700':''}">${po.status==='received'?'✓ '+fmt(po.received_at):fmt(po.eta)}${late?' · '+Math.abs(daysDiff(po.eta))+'d late':''}</td>
      <td>${po.tracking?`<a href="${e(po.tracking.startsWith('http')?po.tracking:'https://'+po.tracking)}" target="_blank" style="font-size:10px;color:var(--blue)">Track ↗</a>`:''}</td>
    </tr>`;
  }).join('');
  return`
  <div class="pp-card">
    <div class="pp-card-head">
      <span class="pp-card-title">🛒 Procurement ${prio}</span>
      <span style="display:flex;gap:8px;align-items:center">
        <span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:14px;background:${st.bg};color:${st.fg}">${st.label}</span>
        ${list.length?`<span style="font-size:10px;color:var(--gray-500);font-family:var(--mono)">${recv}/${list.length} received</span>`:''}
      </span>
    </div>
    <div style="padding:9px 14px;border-bottom:1px solid var(--gray-50);display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stopHtml}</div>
    ${list.length?`<div style="overflow-x:auto"><table class="pp-table" style="min-width:460px">
      <thead><tr><th style="text-align:left">PO #</th><th style="text-align:left">Vendor</th><th>Status</th><th>ETA</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${list.length>12?`<div style="font-size:10px;color:var(--gray-500);padding:6px 14px">+ ${list.length-12} more in the Check-in portal</div>`:''}`
      :`<div style="padding:1.1rem;text-align:center;font-size:11.5px;color:var(--gray-500)">No purchase orders yet — Procurement adds them in the Check-in portal (proc2026)</div>`}
  </div>`;
}
</script>
