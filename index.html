<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi Solutions — Ops Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--red-mid:#f5c2cb;--black:#0f0f0f;--gray-900:#1a1a1a;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-200:#e0e0e0;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#fff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--purple:#7c3aed;--purple-bg:#ede9fe;--blue:#2563eb;--blue-bg:#eff6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:6px;--radius-lg:10px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;font-size:14px;}
/* ── HEADER ── */
.page-header{background:var(--black);position:sticky;top:0;z-index:200;}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:0 auto;padding:0 1.5rem;height:52px;gap:1rem;}
.logo-btn{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px 6px 6px;border-radius:var(--radius);transition:background 0.15s;position:relative;border:none;background:transparent;}
.logo-btn:hover{background:#1a1a1a;}
.logo-mark{width:24px;height:24px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-mark svg{width:12px;height:12px;fill:white;}
.logo-text{font-size:12px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.logo-chevron{font-size:10px;color:#555;margin-left:2px;}
/* DROPDOWN MENU */
.nav-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:#111;border:1px solid #2a2a2a;border-radius:var(--radius-lg);padding:6px;min-width:200px;display:none;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-height:calc(100vh - 70px);overflow-y:auto;}
.nav-dropdown.open{display:block;}
.nav-group-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#444;padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;color:#aaa;font-size:12px;font-weight:500;transition:all 0.1s;border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);}
.nav-item:hover{background:#1e1e1e;color:white;}
.nav-item.active{background:#1e1e1e;color:white;}
.nav-item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nav-sep{height:1px;background:#1e1e1e;margin:4px 0;}
.header-right{display:flex;align-items:center;gap:10px;}
.user-chip{display:flex;align-items:center;gap:7px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:4px 10px 4px 6px;cursor:pointer;}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;flex-shrink:0;}
.user-name{font-size:11px;color:#aaa;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdate{font-family:var(--mono);font-size:11px;color:#444;}
.btn-signout{font-size:11px;padding:4px 10px;border-radius:var(--radius);border:1px solid #2a2a2a;background:transparent;color:#666;cursor:pointer;font-family:var(--font);}
.btn-signout:hover{background:#1a1a1a;color:#aaa;}
/* ── LOGIN SCREEN ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gray-50);}
.login-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:2.5rem;width:380px;max-width:95%;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.login-logo-mark{width:32px;height:32px;background:var(--black);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.login-logo-mark .inner{width:18px;height:18px;background:var(--red);border-radius:3px;}
.login-title{font-size:20px;font-weight:600;color:var(--black);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--gray-500);margin-bottom:1.5rem;}
.login-field{margin-bottom:12px;}
.login-field label{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:4px;}
.login-field input{width:100%;font-family:var(--font);font-size:13px;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);}
.login-field input:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.06);}
.btn-login{width:100%;font-family:var(--font);font-size:13px;font-weight:600;padding:10px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer;margin-top:4px;}
.btn-login:hover{background:var(--gray-900);}
.login-note{font-size:11px;color:var(--gray-500);text-align:center;margin-top:12px;}
.login-sent{text-align:center;padding:1.5rem 0;}
.login-sent-icon{font-size:36px;margin-bottom:12px;}
.login-sent-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.login-sent-sub{font-size:13px;color:var(--gray-500);}
/* ── PAGE ── */
.page-body{max-width:1300px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
/* ── METRICS ── */
.metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:12px 14px;}
.metric-label{font-size:10px;color:var(--gray-500);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.04em;}
.metric-val{font-size:22px;font-weight:600;color:var(--black);}
.metric-sub{font-size:10px;color:var(--gray-500);margin-top:2px;}
.metric-val.red{color:var(--red);}
.metric-val.green{color:var(--success);}
.metric-val.amber{color:var(--warning);}
/* ── HEALTH SCORE ── */
.health-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.health-ring svg{transform:rotate(-90deg);}
.health-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
/* ── AT A GLANCE ── */
.glance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-bottom:1rem;}
.glance-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;}
.glance-card-head{padding:12px 14px 10px;border-bottom:1px solid var(--gray-100);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.glance-proj-name{font-size:13px;font-weight:600;color:var(--black);}
.glance-proj-meta{display:flex;align-items:center;gap:8px;margin-top:3px;}
.glance-so{font-family:var(--mono);font-size:10px;color:var(--red);}
.glance-client{font-size:11px;color:var(--gray-500);}
.cycle-track{padding:12px 14px;}
.cycle-stages{display:flex;flex-direction:column;gap:5px;}
.cycle-stage{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:8px;}
.cycle-stage-name{font-size:11px;color:var(--gray-700);font-weight:500;}
.cycle-bar-wrap{background:var(--gray-100);border-radius:2px;height:6px;overflow:hidden;}
.cycle-bar{height:6px;border-radius:2px;}
.stage-chip{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600;display:inline-block;text-align:right;}
.chip-done{background:var(--success-bg);color:var(--success);}
.chip-active{background:var(--blue-bg);color:var(--blue);}
.chip-future{background:var(--gray-100);color:var(--gray-500);}
.chip-overdue{background:var(--red-light);color:var(--red);}
.chip-atrisk{background:var(--warning-bg);color:var(--warning);}
/* ── SECTION ── */
.section{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.section-title{font-size:13px;font-weight:600;color:var(--black);}
.section-meta{font-size:11px;color:var(--gray-500);}
.proj-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem;}
.ppill{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);transition:all 0.15s;}
.ppill:hover{border-color:var(--black);}
.ppill.active{background:var(--black);color:white;border-color:var(--black);}
.milestone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:12px 16px;}
.ms-item{border-radius:var(--radius);padding:10px 12px;border-left:3px solid var(--gray-300);background:var(--gray-50);cursor:pointer;transition:box-shadow 0.15s;}
.ms-item:hover{box-shadow:0 0 0 2px var(--gray-300);}
.ms-item.done{border-left-color:var(--success);background:#f0faf5;}
.ms-item.today{border-left-color:#059669;background:#ecfdf5;}
.ms-item.upcoming{border-left-color:var(--blue);background:var(--blue-bg);}
.ms-item.overdue{border-left-color:var(--red);background:var(--red-light);}
.ms-item.future{border-left-color:var(--gray-300);}
.ms-type{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
.ms-label{font-size:11px;font-weight:600;color:var(--black);line-height:1.3;}
.ms-date{font-size:11px;color:var(--gray-700);margin-top:2px;}
.ms-days{font-size:10px;margin-top:3px;font-weight:500;}
.ms-days.done{color:var(--success);}
.ms-days.today{color:#059669;}
.ms-days.upcoming{color:var(--blue);}
.ms-days.overdue{color:var(--red);}
.ms-days.future{color:var(--gray-500);}
.ms-edit-hint{font-size:9px;color:var(--gray-300);margin-top:2px;}
/* ── WEEK ── */
.week-nav-row{display:flex;align-items:center;gap:7px;margin-bottom:1rem;flex-wrap:wrap;}
.wnav{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:5px 10px;cursor:pointer;color:var(--gray-700);font-size:12px;font-family:var(--font);}
.wnav:hover{background:var(--gray-100);}
.wlabel{font-size:12px;color:var(--gray-700);min-width:150px;text-align:center;font-weight:500;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:1rem;}
.day-col{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);min-height:140px;overflow:hidden;}
.day-col.today-col{border:2px solid var(--black);}
.day-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--gray-100);}
.day-name{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;}
.day-num{font-size:17px;font-weight:600;color:var(--black);line-height:1.2;}
.today-pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle;}
.day-events{padding:6px;}
.ev{border-radius:var(--radius);padding:4px 7px;margin-bottom:3px;}
.ev-done{opacity:0.5;border-left-color:var(--gray-300)!important;}
.ev-ship{background:#d1fae5;border-left:3px solid #059669;}
.ev-arr{background:#dbeafe;border-left:3px solid #2563eb;}
.ev-prod{background:#ede9fe;border-left:3px solid #7c3aed;}
.ev-qa{background:#fef3c7;border-left:3px solid #d97706;}
.ev-fqc{background:#e0f7fa;border-left:3px solid #0891b2;}
.ev-uat{background:#dcfce7;border-left:3px solid #16a34a;}
.ev-inst{background:#fce7f3;border-left:3px solid #db2777;}
.ev-other{background:var(--gray-50);border-left:3px solid var(--gray-300);}
.ev-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-500);}
.ev-name{font-size:10px;font-weight:600;color:var(--black);line-height:1.3;}
.ev-proj{font-size:9px;color:var(--gray-500);}
.empty-day{font-size:10px;color:var(--gray-300);text-align:center;padding:1.2rem 0;}
.overdue-bar{background:var(--red-light);border:1px solid var(--red-mid);border-radius:var(--radius);padding:9px 13px;margin-bottom:1rem;display:flex;gap:8px;}
.overdue-title{font-size:11px;font-weight:600;color:var(--red);margin-bottom:2px;}
.overdue-item{font-size:10px;color:var(--red);}
.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray-500);}
.leg-dot{width:7px;height:7px;border-radius:2px;}
/* ── DEPT ── */
.dept-table-wrap{overflow-x:auto;}
.dept-table{width:100%;border-collapse:collapse;min-width:600px;}
.dept-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:8px 14px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.dept-table td{font-size:12px;padding:10px 14px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.dept-table tr:hover td{background:var(--gray-50);}
.dept-table tr:last-child td{border-bottom:none;}
.date-cell{font-family:var(--mono);font-size:11px;}
.status-chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;white-space:nowrap;}
/* ── GANTT ── */
.prod-gantt{padding:0 16px 16px;}
.gantt-wrap{overflow-x:auto;overflow-y:auto;max-height:600px;width:100%;}
.gantt-table{border-collapse:separate;border-spacing:0;width:100%;min-width:700px;}
.gantt-table th{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:5px 4px;text-align:center;border-bottom:2px solid var(--gray-200);font-weight:600;white-space:nowrap;min-width:28px;background:var(--white);position:sticky;top:0;z-index:2;}
.gantt-table th.proj-col{text-align:left;min-width:180px;padding:5px 8px;position:sticky;left:0;top:0;z-index:5;background:var(--white);border-right:2px solid var(--gray-200);}
.gantt-table td{padding:3px;border-bottom:1px solid var(--gray-50);vertical-align:middle;background:var(--white);}
.gantt-table td.proj-name{font-size:12px;font-weight:500;color:var(--black);padding:4px 8px;white-space:nowrap;position:sticky;left:0;z-index:2;background:var(--white);border-right:2px solid var(--gray-200);min-width:180px;}
.gantt-cell{position:relative;text-align:center;height:26px;}
.gantt-fill{height:20px;border-radius:3px;width:100%;}
.gantt-today-col td,.gantt-today-col th{background:#fff5f5!important;}
/* ── SCHEDULE ── */
.sched-table{width:100%;border-collapse:collapse;}
.sched-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:9px 12px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.sched-table td{font-size:12px;padding:9px 12px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.sched-table tr:hover td{background:var(--gray-50);}
.sched-table tr.dragging{opacity:0.4;}
.plan-card.dragging{opacity:0.35;}
.plan-col.drag-over{background:var(--blue-bg)!important;border-color:var(--blue)!important;}
.q-card.dragging{opacity:0.35;}
.q-zone.drag-over{background:var(--blue-bg)!important;outline:2px dashed var(--blue);}
.sched-table tr.drag-over td{border-top:2px solid var(--red);}
.drag-handle{cursor:grab;color:var(--gray-300);font-size:15px;padding:0 4px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.priority-num{font-family:var(--mono);font-size:11px;color:var(--gray-500);}
.sched-input{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.sched-input:focus{outline:none;border-color:var(--black);}
.sched-select{font-family:var(--font);font-size:11px;padding:3px 7px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer;}
/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field.full{grid-column:1/-1;}
.field label{font-size:10px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{font-family:var(--font);font-size:12px;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.05);}
.field textarea{resize:vertical;min-height:65px;}
.form-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 16px 16px;}
.btn{font-family:var(--font);font-size:12px;font-weight:500;padding:7px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--gray-700);cursor:pointer;}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--black);color:white;border-color:var(--black);}
.btn-primary:hover{background:var(--gray-900);}
.btn-red{background:var(--red);color:white;border-color:var(--red);}
.btn-red:hover{background:#a80e26;}
.btn-add{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red);color:white;cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-add:hover{background:#a80e26;}
.btn-export{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--success);background:var(--success-bg);color:var(--success);cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-export:hover{background:#d4edda;}
/* ── ACTIVITY LOG ── */
.log-item{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--gray-50);align-items:flex-start;}
.log-item:last-child{border-bottom:none;}
.log-avatar{width:28px;height:28px;border-radius:50%;background:var(--black);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:white;flex-shrink:0;margin-top:1px;}
.log-body{flex:1;}
.log-user{font-size:12px;font-weight:600;color:var(--black);}
.log-action{font-size:12px;color:var(--gray-700);display:inline;}
.log-entity{font-size:12px;font-weight:500;color:var(--blue);display:inline;}
.log-change{font-size:11px;color:var(--gray-500);margin-top:3px;}
.log-change .old{color:var(--red);text-decoration:line-through;}
.log-change .new{color:var(--success);}
.log-time{font-size:10px;color:var(--gray-300);font-family:var(--mono);white-space:nowrap;margin-top:2px;}
.log-proj{font-size:10px;color:var(--gray-400);margin-top:1px;}
/* ── INTAKE ── */
.intake-body{padding:16px;}
.intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.intake-section-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--gray-100);}
.intake-section-lbl:first-child{border-top:none;margin-top:0;padding-top:0;}
.ms-intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1;}
.ms-block{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius);padding:10px;}
.ms-block-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ms-block .field{margin-bottom:5px;}
.ms-block .field:last-child{margin-bottom:0;}
/* ── MODAL ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:white;padding:10px 18px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;animation:slideUp 0.2s ease;}
.toast-undo{position:fixed;bottom:70px;right:22px;background:var(--black);color:white;padding:9px 12px 9px 16px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;align-items:center;gap:12px;animation:slideUp 0.2s ease;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
@keyframes slideUp{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius-lg);width:480px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--gray-100);}
.modal-title{font-size:14px;font-weight:600;color:var(--black);}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-500);line-height:1;}
.modal-body{padding:16px;}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--gray-100);}
.empty-state{text-align:center;padding:2.5rem;color:var(--gray-500);font-size:12px;}
.actions-row{display:flex;align-items:center;gap:7px;padding:12px 16px;border-top:1px solid var(--gray-100);}
/* ── PRINT ── */
/* ── PROJECT PAGE ── */
.pp-header{background:var(--black);color:white;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.pp-title{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:4px;}
.pp-meta{font-size:12px;color:#888;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.pp-status{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;}
.pp-status-green{background:#1a7a4a;color:white;}.pp-status-amber{background:#8a5a00;color:white;}.pp-status-red{background:var(--red);color:white;}
.pp-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px;}
.pp-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;}
.pp-card-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.pp-card-title{font-size:11px;font-weight:600;color:var(--black);text-transform:uppercase;letter-spacing:0.05em;}
.pp-card-body{padding:12px 14px;}
.pp-textarea{width:100%;font-family:var(--font);font-size:13px;border:none;resize:vertical;min-height:80px;background:transparent;outline:none;line-height:1.6;color:var(--gray-700);}
.pp-textarea:focus{background:var(--gray-50);border-radius:var(--radius);padding:6px;}
.pp-table{width:100%;border-collapse:collapse;font-size:12px;}
.pp-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:5px 8px;text-align:left;border-bottom:1px solid var(--gray-100);white-space:nowrap;background:var(--gray-50);}
.pp-table td{padding:6px 8px;border-bottom:1px solid var(--gray-50);vertical-align:middle;color:var(--black);}
.pp-table tr:last-child td{border-bottom:none;}
.pp-table tr:hover td{background:var(--gray-50);}
.pp-table input,.pp-table select{font-family:var(--font);font-size:12px;padding:3px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--black);width:100%;min-width:0;}
.pp-table input:focus,.pp-table select:focus{border-color:var(--gray-300);background:var(--white);outline:none;}
.pp-del{background:none;border:none;cursor:pointer;color:var(--gray-200);font-size:14px;padding:2px 4px;}
.pp-del:hover{color:var(--red);}
.pp-add-btn{font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;padding:7px 14px;font-family:var(--font);border-top:1px solid var(--gray-100);width:100%;text-align:left;}
.pp-add-btn:hover{background:var(--gray-50);}
.pp-link-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-50);}
.pp-link-item:last-child{border-bottom:none;}
.pp-link-label{font-size:11px;color:var(--gray-500);min-width:110px;flex-shrink:0;}
.pp-link-input{font-size:12px;flex:1;padding:3px 7px;border:1px solid var(--gray-200);border-radius:4px;font-family:var(--font);color:var(--blue);min-width:0;}
.pp-link-input:focus{outline:none;border-color:var(--blue);}
.pp-link-go{font-size:13px;flex-shrink:0;opacity:0.5;}
.pp-link-go:hover{opacity:1;}
.pp-notes-ta{width:100%;font-family:var(--font);font-size:12px;padding:8px;border:1px solid var(--gray-200);border-radius:var(--radius);resize:vertical;min-height:90px;color:var(--black);line-height:1.6;}
.pp-notes-ta:focus{outline:none;border-color:var(--black);}
.proj-sel-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:10px 14px;background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius-lg);}
.proj-sel-bar label{font-size:12px;font-weight:600;color:var(--gray-700);white-space:nowrap;}
.proj-sel-bar select{font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);flex:1;}
.pp-saved{font-size:11px;color:var(--success);margin-left:8px;display:none;}
/* ── DOC TABS ── */
.doc-tabs{display:flex;gap:4px;margin-bottom:1rem;}
.doc-tab{font-size:12px;padding:6px 16px;border-radius:var(--radius);border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);font-weight:500;}
.doc-tab:hover{background:var(--gray-100);}
.doc-tab.active{background:var(--black);color:white;border-color:var(--black);}
.doc-output{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;min-height:300px;position:relative;}
.copy-btn{position:absolute;top:10px;right:10px;font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--gray-300);background:var(--white);cursor:pointer;font-family:var(--font);}
.copy-btn:hover{background:var(--gray-100);}
.doc-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.doc-section-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;padding-top:8px;margin-top:4px;border-top:1px solid var(--gray-100);}
.doc-section-lbl:first-child{border-top:none;padding-top:0;margin-top:0;}
.proj-select-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:12px 16px;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-100);}
.proj-select-row label{font-size:12px;font-weight:600;color:var(--gray-700);white-space:nowrap;}
.proj-select-row select{font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);flex:1;}
.glance-notes-preview{font-size:11px;color:var(--gray-500);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;}
.glance-notes-preview:hover{color:var(--gray-700);}
.glance-notes-body{font-size:11px;color:var(--gray-700);margin-top:6px;white-space:pre-wrap;line-height:1.5;display:none;}
.glance-notes-body.open{display:block;}
.archived-banner{background:var(--gray-100);border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--gray-500);}
.filter-toggle{display:flex;gap:4px;margin-bottom:1rem;}
.ftab{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);}
.ftab.active{background:var(--black);color:white;border-color:var(--black);}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:14px 16px;}
.template-card{border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all 0.15s;background:var(--white);}
.template-card:hover{border-color:var(--black);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.template-card-name{font-size:13px;font-weight:600;color:var(--black);margin-bottom:4px;}
.template-card-desc{font-size:11px;color:var(--gray-500);line-height:1.4;}
.template-card-stages{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.template-stage-pill{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--gray-100);color:var(--gray-600);}
.template-active{border-color:var(--blue);background:var(--blue-bg);}
.template-active .template-card-name{color:var(--blue);}
@media print{
  .page-header,.btn,.btn-primary,.btn-red,.btn-add,.btn-export,.no-print{display:none!important;}
  body{background:white;}
  .page-body{padding:0;max-width:100%;}
  .briefing-header{background:#0f0f0f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .section{break-inside:avoid;}
}
@media(max-width:800px){.metrics-row{grid-template-columns:repeat(2,1fr);}.week-grid{grid-template-columns:1fr;}.intake-grid,.form-grid,.ms-intake-grid{grid-template-columns:1fr;}.glance-grid{grid-template-columns:1fr;}.header-inner{padding:0 1rem;}.page-body{padding:1rem 1rem 3rem;}}
</style>

function truncateSO(so,max=2){
  if(!so)return'No SO';
  const parts=so.split(/[,\/\s]+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=max)return so;
  return parts.slice(0,max).join(', ')+'…';
}
function truncateSOTitle(so){return so||'';}

// Returns the SO-specific record that should drive shared views. For a single-SO
// project, use that SO automatically; for multi-SO projects, use the explicitly
// selected SO when one is supplied.
function getEffectiveSODetail(proj,soTag=''){
  if(!proj)return null;
  const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const effectiveSO=soTag||(soList.length===1?soList[0]:'');
  return effectiveSO?soDetails.find(d=>d.project_id===proj.id&&d.so_tag===effectiveSO)||null:null;
}
function getSOConfigSummary(proj,soTag=''){
  const d=getEffectiveSODetail(proj,soTag);

    so:soTag||((proj?.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean).length===1?(proj.so_number||'').trim():''),

}

function today(){let t=new Date();t.setHours(0,0,0,0);return t;}
function monday(dt){let r=new Date(dt);let d=r.getDay();r.setDate(r.getDate()+(d===0?-6:1-d));r.setHours(0,0,0,0);return r;}
function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function isoD(dt){return dt.toISOString().split('T')[0];}
function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtFull(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtTime(s){if(!s)return'';try{return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function daysDiff(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-today())/86400000);}
function msStatus(s){let d=daysDiff(s);if(d<0)return{cls:'done',dcls:'done',txt:Math.abs(d)+'d ago'};if(d===0)return{cls:'today',dcls:'today',txt:'Today'};if(d<=7)return{cls:'upcoming',dcls:'upcoming',txt:'In '+d+'d'};return{cls:'future',dcls:'future',txt:fmtFull(s)};}
function stageStatus(start,end){
  const t=today();if(!start)return{label:'Not set',chip:'chip-future'};
  const s=new Date(start+'T00:00:00');const e=end?new Date(end+'T00:00:00'):s;
  if(t>e)return{label:'Done',chip:'chip-done'};
  if(t>=s)return{label:'In progress',chip:'chip-active'};
  const d=daysDiff(start);if(d<=7)return{label:'In '+d+'d',chip:'chip-atrisk'};
  return{label:fmt(start),chip:'chip-future'};
}
function getMsDate(pid,key){return milestones.find(m=>m.project_id===pid&&m.key===key)?.date||null;}
function showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},dur);}

// Generic "X changed — Undo (15s)" utility. One pending undo at a time — a new
// one replaces whatever was there before, same as most apps do this.
let _undoTimer=null,_undoCountdown=null,_pendingUndo=null;
function showUndoToast(message,undoFn,duration=15000){
  clearTimeout(_undoTimer);clearInterval(_undoCountdown);
  const el=document.getElementById('undo-toast');
  _pendingUndo=undoFn;
  let secondsLeft=Math.round(duration/1000);
  const paint=()=>{el.innerHTML=`<span>${message}</span><button onclick="runUndo()" style="background:white;color:black;border:none;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font)">Undo</button><span style="opacity:0.5;font-size:10px;min-width:18px;text-align:right">${secondsLeft}s</span>`;};
  paint();
  el.style.display='flex';
  _undoCountdown=setInterval(()=>{secondsLeft--;if(secondsLeft>0)paint();},1000);
  _undoTimer=setTimeout(()=>{el.style.display='none';clearInterval(_undoCountdown);_pendingUndo=null;},duration);
}
async function runUndo(){
  const fn=_pendingUndo;if(!fn)return;
  _pendingUndo=null;
  document.getElementById('undo-toast').style.display='none';
  clearTimeout(_undoTimer);clearInterval(_undoCountdown);
  await fn();
}

// Auto-computes from milestone state; stored override takes priority when saved manually
function getShippingStatusAuto(projId,soTag){
  const shipMs=milestones.find(m=>m.project_id===projId&&m.key==='shipping'&&(soTag?m.so_tag===soTag:true));
  const delivMs=milestones.find(m=>m.project_id===projId&&m.key==='delivery'&&(soTag?m.so_tag===soTag:true));
  if(delivMs&&isMilestoneDone(delivMs))return'Delivered';
  if(shipMs&&isMilestoneDone(shipMs))return'Shipped';
  if(shipMs&&shipMs.date)return'Scheduled';
  return'Pending';
}
function getShippingStatus(proj,soTag){
  if(soTag){const soDet=soDetails.find(d=>d.project_id===proj.id&&d.so_tag===soTag);if(soDet?.shipping_status)return soDet.shipping_status;}
  else{if(proj.shipping_status)return proj.shipping_status;}
  return getShippingStatusAuto(proj.id,soTag);
}

// ── HEALTH SCORE ───────────────────────────────────────────
// ── HEALTH & DONE ──────────────────────────────────────────
function isMilestoneDone(m){
  // 1. Manually marked done via Mark done button — most reliable
  if(milestoneDone[m.id])return true;
  // 2. Dept check-in green + checked — secondary confirmation
  const ci=checkinStatus[m.id];
  if(ci?.checked&&ci?.stoplight==='green')return true;
  return false;
}
function isMilestoneEffectivelyDone(m){
  // For display purposes — same as isMilestoneDone
  // Past date alone does NOT count as done; must be explicitly marked
  return isMilestoneDone(m);
}
function isMilestoneOverdue(m){
  // Not overdue if explicitly marked done
  if(isMilestoneDone(m))return false;
  // Not overdue if date is today or future
  if(!m.date||daysDiff(m.date)>=0)return false;
  // Past date — check if dept flagged green (confirmed done)
  const ci=checkinStatus[m.id];
  if(ci?.stoplight==='green')return false;
  // Past date + red or yellow = definitely overdue, surface it
  if(ci?.stoplight==='red'||ci?.stoplight==='yellow')return true;
  // Past date + no stoplight at all = treat as done (assume completed)
  // Only show as overdue if within the last 3 days (very recently missed)
  // This prevents old completed milestones from polluting the overdue list
  return false;
}
function isMilestoneAtRisk(m){
  if(isMilestoneDone(m))return false;
  const ci=checkinStatus[m.id];
  return ci?.stoplight==='yellow';
}
function isMilestoneEscalation(m){
  if(isMilestoneDone(m))return false;
  const ci=checkinStatus[m.id];
  return ci?.stoplight==='red';
}

function calcHealth(pid){
  const pMs=milestones.filter(m=>m.project_id===pid&&m.date);
  if(!pMs.length)return null;
  const total=pMs.length;
  const done=pMs.filter(m=>isMilestoneDone(m)).length;
  const overdue=pMs.filter(m=>isMilestoneOverdue(m)).length;
  const atRisk=pMs.filter(m=>isMilestoneAtRisk(m)).length;
  const escalation=pMs.filter(m=>isMilestoneEscalation(m)).length;
  const remaining=total-done;
  // Score = done / total — simple and honest
  const score=Math.round((done/total)*100);
  // Color based on overdue/escalation situation
  const color=escalation>0?'#C8102E':overdue>0?'#d97706':score>=80?'#1a7a4a':score>=50?'#d97706':'#6b6b6b';
  return{score,done,total,remaining,overdue,atRisk,escalation,color};
}
function healthRing(pid){
  const h=calcHealth(pid);
  if(!h)return'';
  const r=20;const c=2*Math.PI*r;const dash=(h.score/100)*c;
  const tooltip=`${h.done} of ${h.total} milestones done · ${h.remaining} remaining${h.overdue?` · ${h.overdue} overdue`:''}${h.escalation?` · ${h.escalation} escalation`:''}`;
  return`<div class="health-ring" title="${tooltip}">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="#f2f2f2" stroke-width="5"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${h.color}" stroke-width="5" stroke-dasharray="${dash} ${c}" stroke-linecap="round"/>
    </svg>
    <div class="health-ring-label" style="color:${h.color}">${h.score}</div>
  </div>`;
}

async function markAllMsDone(pid){
  const pMs=milestones.filter(m=>m.project_id===pid&&m.date&&!isMilestoneDone(m));
  if(!pMs.length){showToast('All milestones already done ✓');return;}
  // Only mark past milestones
  const pastMs=pMs.filter(m=>daysDiff(m.date)<0);
  if(!pastMs.length){showToast('No past milestones to mark');return;}
  const inserts=pastMs.filter(m=>!milestoneDone[m.id]).map(m=>({milestone_id:m.id,project_id:pid,marked_done:true,marked_by:currentUserName}));
  if(inserts.length){
    await sb.from('milestone_done').insert(inserts);
  }
  showToast(`Marked ${inserts.length} milestone${inserts.length!==1?'s':''} as done ✓`);
  await loadAll();
}
async function toggleMilestoneDone(mid,pid,e){
  e.stopPropagation();
  const isDone=milestoneDone[mid];
  if(isDone){
    await sb.from('milestone_done').delete().eq('milestone_id',mid);
    delete milestoneDone[mid];
  } else {
    const{data}=await sb.from('milestone_done').insert({milestone_id:mid,project_id:pid,marked_by:currentUserName}).select().single();
    if(data)milestoneDone[mid]=data;
  }
  showToast(isDone?'Marked as not done':'Marked as done ✓');
  // Auto-update shipping status when a shipping or delivery milestone changes done state
  const _toggledMs=milestones.find(m=>m.id===mid);
  if(_toggledMs&&(_toggledMs.key==='shipping'||_toggledMs.key==='delivery')){
    const _proj=projects.find(p=>p.id===_toggledMs.project_id);
    if(_proj){await saveShippingStatus(_toggledMs.project_id,_toggledMs.so_tag||null,getShippingStatusAuto(_toggledMs.project_id,_toggledMs.so_tag||null));}
  }
  // Partial re-render — don't reload entire page, just refresh milestones display
  if(currentTab==='projpage'){renderProjPageBody(pid);}
  else if(currentTab==='overview'){renderOverview();}
  else{await loadAll();}
}

// SO lists are split tolerantly (comma / space / semicolon) hub-wide — so_number data uses mixed separators
let procPoData=[],procLinkData=[],procReadyData={};
async function loadAll(){
  const[pr,ms,lg,ci,md,mh,ah,as_,pl,dev,sod,ext,ppo,ppl,prd]=await Promise.all([
    sb.from('projects').select('*').order('created_at'),
    sb.from('milestones').select('*').order('date'),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('checkin_status').select('*').order('updated_at',{ascending:false}),
    sb.from('milestone_done').select('*'),
    sb.from('milestone_history').select('*').order('changed_at',{ascending:true}),
    sb.from('adhoc_schedule').select('*').order('created_at'),
    sb.from('app_settings').select('*'),
    sb.from('project_links').select('project_id,label,url,category,id,sort_order'),
    sb.from('milestone_deviations').select('*'),
    sb.from('so_details').select('*'),
    sb.from('extension_requests').select('*').order('created_at',{ascending:false}),
    sb.from('procurement_po').select('*'),
    sb.from('procurement_po_projects').select('*'),
    sb.from('procurement_readiness').select('*'),
  ]);
  projects=pr.data||[];activityLog=lg.data||[];
  // Guard: never let a failed/empty milestones fetch wipe what's already loaded.
  // Previously `milestones=ms.data||[]` unconditionally overwrote the array, so
  // any transient error on this one query (RLS hiccup, rate limit, network blip)
  // silently blanked the milestone tracker everywhere (Glance/Overview/Project page)
  // right after a save, looking exactly like the milestones had been deleted.
  if(ms.error){
    console.error('milestones load error — keeping previous data',ms.error);
    showToast('⚠ Milestones failed to refresh: '+ms.error.message);
  } else if(ms.data){
    milestones=ms.data;
  }
  // else: no error and no data (shouldn't normally happen) — keep previous data rather than blanking
  // Procurement tables (empty until the migration is run — panel hides gracefully)
  procPoData=ppo.data||[];procLinkData=ppl.data||[];
  procReadyData={};(prd.data||[]).forEach(r=>{procReadyData[r.project_id]=r;});
  checkinStatus={};(ci.data||[]).forEach(c=>{checkinStatus[c.milestone_id]=c;});
  milestoneDone={};(md.data||[]).forEach(d=>{milestoneDone[d.milestone_id]=d;});
  soDetails=sod.data||[];
  extensionRequests=ext.data||[];
  milestoneHistory={};
  (mh.data||[]).forEach(h=>{
    if(!milestoneHistory[h.milestone_id])milestoneHistory[h.milestone_id]=[];
    milestoneHistory[h.milestone_id].push(h);
  });
  // Load ad hoc rows grouped by dept, sorted by date (missing dates at bottom)
  adHocRows={shipping:[],installation:[]};
  (ah.data||[]).forEach(r=>{
    if(r.dept==='shipping')adHocRows.shipping.push({...r,shipDate:r.ship_date,deliveryDate:r.delivery_date});
    else if(r.dept==='installation')adHocRows.installation.push({...r,trainingDate:r.training_date,installDate:r.install_date});
  });
  // Sort each dept by primary date, missing dates at bottom
  const sortByDate=(arr,dateKey)=>arr.sort((a,b)=>{
    const da=a[dateKey]||'';const db=b[dateKey]||'';
    if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;
    return da.localeCompare(db);
  });
  sortByDate(adHocRows.shipping,'shipDate');
  sortByDate(adHocRows.installation,'installDate');
  appSettings={};(as_.data||[]).forEach(s=>{appSettings[s.key]=s.value;});
  // Build deviation map: {project_id: {milestone_key: row}}
  milestoneDeviations={};
  (dev.data||[]).forEach(d=>{
    if(!milestoneDeviations[d.project_id])milestoneDeviations[d.project_id]={};
    milestoneDeviations[d.project_id][d.milestone_key]=d;
  });
  // Backfill install_ticket_url from project_links for projects missing it
  const allProjLinks=pl.data||[];
  projects.forEach(p=>{
    if(!p.install_ticket_url){
      const lnk=allProjLinks.find(l=>l.project_id===p.id&&l.label==='Installation Ticket'&&l.url);
      if(lnk)p.install_ticket_url=lnk.url;
    }
    if(!p.kickoff_deck_url){
      const lnk2=allProjLinks.find(l=>l.project_id===p.id&&l.label==='Kickoff deck'&&l.url);
      if(lnk2)p.kickoff_deck_url=lnk2.url;
    }
  });
  if(projects.length&&!selectedProjId)selectedProjId=projects[0].id;

  // Load vinyl schedule from Supabase, then merge with project data
  const[vsRes,psRes]=await Promise.all([
    sb.from('vinyl_schedule').select('*').order('priority'),
    sb.from('planogram_schedule').select('*').order('priority'),
  ]);
  const savedVinyl=vsRes.data||[];
  const savedPlan=psRes.data||[];

  // Build vinyl schedule: saved rows + any projects not yet in the table
  const vinylProjectIds=new Set(savedVinyl.map(v=>v.project_id).filter(Boolean));
  const newVinylRows=projects.filter(p=>!vinylProjectIds.has(p.id)).flatMap((p,i)=>{
    const vm=milestones.find(m=>m.project_id===p.id&&m.key==='vinyl');
    const sh=milestones.find(m=>m.project_id===p.id&&m.key==='shipping');
    const soList=(p.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    // One row per SO if multiple, otherwise one row with full SO string
    const entries=soList.length>1?soList:[p.so_number||''];
    return entries.map((so,j)=>({id:null,project_id:p.id,name:p.name+(soList.length>1?' ('+so+')':''),so,client:p.client,vinyl_type:p.vinyl_type||'',date:vm?.date||'',ship_date:sh?.date||'',pm:p.pm||'',form_factor:p.form_factor||'',status:'Scheduled',priority:savedVinyl.length+i+j+1,is_standalone:false}));
  });
  // Merge saved rows with fresh project data — saved row dates take priority over milestone dates
  vinylSchedule=savedVinyl.map(v=>{
    if(v.is_standalone)return{...v,id:v.id,vinylType:v.vinyl_type,shipDate:v.ship_date,formFactor:v.form_factor};
    const p=projects.find(x=>x.id===v.project_id);
    // Find milestone matching this SO (so_tag) if split, otherwise untagged
    const vm=p?milestones.find(m=>m.project_id===p.id&&m.key==='vinyl'&&(v.so?m.so_tag===v.so:!m.so_tag)):null;
    const sh=p?milestones.find(m=>m.project_id===p.id&&m.key==='shipping'&&(v.so?m.so_tag===v.so:!m.so_tag)):null;
    // Saved vinyl row date takes priority — only fall back to milestone if vinyl row has no date
    return{...v,
      vinylType:p?.vinyl_type||v.vinyl_type||'',
      date:v.date||vm?.date||'',
      shipDate:v.ship_date||sh?.date||'',
      pm:p?.pm||v.pm||'',
      formFactor:v.form_factor||p?.form_factor||'',
      name:v.name||p?.name||'',
      so:v.so||p?.so_number||'',
      client:v.client||p?.client||''
    };
  }).concat(newVinylRows)
  // Sort: rows with dates first (by date asc), missing dates at bottom
  .sort((a,b)=>{
    const da=a.date||'';const db=b.date||'';
    if(!da&&!db)return 0;
    if(!da)return 1;
    if(!db)return -1;
    return da.localeCompare(db);
  });

  // Build planogram schedule similarly
  const planProjectIds=new Set(savedPlan.map(v=>v.project_id).filter(Boolean));
  const newPlanRows=projects.filter(p=>!planProjectIds.has(p.id)).map((p,i)=>{
    const pm2=milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram sign'));
    const pmStart=milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram start'));
    const pmEnd=milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram end'));
    return{id:null,project_id:p.id,name:p.name,so:p.so_number,client:p.client,machine_type:'',date:pm2?.date||'',planStart:pmStart?.date||'',planEnd:pmEnd?.date||'',status:'Pending',priority:savedPlan.length+i+1,is_standalone:false};
  });
  planogramSchedule=savedPlan.map(v=>{
    if(v.is_standalone)return{...v,machineType:v.machine_type,planStart:v.plan_start||'',planEnd:v.plan_end||''};
    const p=projects.find(x=>x.id===v.project_id);
    const pm2=p?milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram sign')):null;
    const pmStart=p?milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram start')):null;
    const pmEnd=p?milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram end')):null;
    return{...v,machineType:v.machine_type||'',date:pm2?.date||v.date||'',planStart:pmStart?.date||v.plan_start||'',planEnd:pmEnd?.date||v.plan_end||'',name:p?.name||v.name,so:p?.so_number||v.so,client:p?.client||v.client};
  }).concat(newPlanRows)
  // Sort: rows with dates first (by date asc), missing dates at bottom
  .sort((a,b)=>{
    const da=a.date||'';const db=b.date||'';
    if(!da&&!db)return 0;
    if(!da)return 1;
    if(!db)return -1;
    return da.localeCompare(db);
  });

  document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  // If the project page is currently open, refresh ppData before renderTab so
  // renderProjPageBody() has fresh team/links/sections without doing a second
  // async loadProjPage() call that would race and cause duplicate rows.
  if(currentTab==='projpage'&&ppProjId){
    await loadProjPage(ppProjId);
    window._skipProjPageReload=true;
  }
  renderTab();
}

// ── PIPELINE BOARD ─────────────────────────────────────────
const PIPELINE_STAGES=[
  {id:'mo-release',  label:'MO / PO Release', color:'#6b6b6b', icon:'📋', key:'mo-release',   doneKey:null},
  {id:'parts-order', label:'Parts Ordered',    color:'#d97706', icon:'🛒', key:'po-release',   doneKey:'po-release'},
  {id:'parts-arrive',label:'Parts Arrived',    color:'#0891b2', icon:'📦', key:'arrival',      doneKey:'arrival'},
  {id:'production',  label:'In Production',    color:'#7c3aed', icon:'🏭', key:'production-start', endKey:'production-end', doneKey:'production-end'},
  {id:'qa',          label:'Quality / QA',     color:'#d97706', icon:'🔍', key:'quality-start',endKey:'quality-end',  doneKey:'quality-end'},
  {id:'shipping',    label:'Shipping',         color:'#059669', icon:'🚚', key:'shipping',     doneKey:'shipping'},
  {id:'delivered',   label:'Delivered',        color:'#16a34a', icon:'📦', key:'delivery',     doneKey:'delivery'},
  {id:'installation',label:'Installation',     color:'#db2777', icon:'🔧', key:'installation', doneKey:'installation'},
  {id:'complete',    label:'Complete',         color:'#1a7a4a', icon:'✅', key:'installation', doneKey:'installation'},
];

function getProjectStage(proj){
  const pMs=milestones.filter(m=>m.project_id===proj.id);
  const getDate=key=>pMs.find(m=>m.key===key)?.date||null;
  const isDoneMs=key=>{const m=pMs.find(x=>x.key===key);return m?isMilestoneDone(m):false;};
  const t=today();
  const crossed=key=>{const d=getDate(key);return d&&new Date(d+'T00:00:00')<=t;};
  const projectStatus=String(proj.status||'').trim().toLowerCase();
  const projectComplete=['complete','completed','installed','closed'].includes(projectStatus);

  // Installation is the true end of the workflow. A completed installation (or
  // explicit completed project status) always wins over older shipping/delivery data.
  if(projectComplete||isDoneMs('installation'))return'complete';
  if(crossed('installation'))return'installation';
  if(isDoneMs('delivery')||crossed('delivery'))return'delivered';
  if(isDoneMs('shipping')||crossed('shipping'))return'shipping';
  if(isDoneMs('quality-end')||crossed('quality-end'))return'shipping';
  if(crossed('quality-start'))return'qa';
  if(isDoneMs('production-end')||crossed('production-end'))return'qa';
  if(crossed('production-start'))return'production';
  if(crossed('arrival')||isDoneMs('arrival'))return'parts-arrive';
  if(crossed('po-release'))return'parts-order';
  if(crossed('mo-release'))return'mo-release';
  return'mo-release';
}

function getProjectCompletion(proj){
  if(getProjectStage(proj)!=='complete')return null;
  const install=milestones.find(m=>m.project_id===proj.id&&m.key==='installation');
  return{date:install?.date||null};
}

// Dependencies, honestly derived: whatever stage a project is CURRENTLY in is,
// by definition, what every later stage is waiting on. This doesn't invent a
// new signal — it just puts a name on what getProjectStage() already knows,
// answering "why isn't this moving" instead of just "where is it."
function getProjectBlocker(proj){
  const stage=getProjectStage(proj);
  const idx=PIPELINE_STAGES.findIndex(s=>s.id===stage);
  if(idx===-1||stage==='complete'||idx===PIPELINE_STAGES.length-1)return null; // complete — nothing downstream waiting
  const curStage=PIPELINE_STAGES[idx],nextStage=PIPELINE_STAGES[idx+1];
  const doneMs=curStage.doneKey?milestones.find(m=>m.project_id===proj.id&&m.key===curStage.doneKey):null;
  let estimate='No date set yet',overdue=false;
  if(doneMs?.date){
    const d=daysDiff(doneMs.date);
    if(d<0){estimate=`Overdue by ${Math.abs(d)}d`;overdue=true;}
    else if(d===0)estimate='Today';
    else if(d===1)estimate='Tomorrow';
    else estimate=`In ${d}d`;
  }
  return{blockingStage:curStage,blockedStage:nextStage,estimate,overdue};
}

function getDaysInStage(proj,stageId){
  const pMs=milestones.filter(m=>m.project_id===proj.id);
  const getDate=key=>pMs.find(m=>m.key===key)?.date||null;
  const stage=PIPELINE_STAGES.find(s=>s.id===stageId);
  if(!stage)return 0;
  const startDate=getDate(stage.key);
  if(!startDate)return 0;
  const start=new Date(startDate+'T00:00:00');
  const t=today();
  return Math.max(0,Math.round((t-start)/86400000));
}

function getStageHealth(proj,stageId){
  const pMs=milestones.filter(m=>m.project_id===proj.id);
  const stage=PIPELINE_STAGES.find(s=>s.id===stageId);
  if(!stage)return'neutral';
  const endKey=stage.endKey||stage.doneKey||stage.key;
  const endDate=pMs.find(m=>m.key===endKey)?.date;
  if(!endDate)return'neutral';
  const d=daysDiff(endDate);
  if(d<0)return'red';
  if(d<=3)return'amber';
  return'green';
}

// ── CAPACITY ───────────────────────────────────────────────
let capacityWeeksCount=8;

function ymd(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;}

// A project "occupies" the week(s) its production window overlaps.
// Falls back gracefully: start-only or end-only milestones still count as a 1-day window.
function getProdRange(p){
  const pMs=milestones.filter(m=>m.project_id===p.id);
  const s=pMs.find(m=>m.key==='production-start')?.date;
  const e=pMs.find(m=>m.key==='production-end')?.date;
  if(!s&&!e)return null;
  return{start:s||e,end:e||s};
}

// Five departments, one limit each — replaces the old single production-only
// number. Reads the legacy key once so nobody's existing setting gets lost.
const CAP_DEPTS=[
  {key:'procurement',label:'Procurement',icon:'📋',msKey:'mo-release'},
  {key:'production',label:'Production',icon:'🧱',msKey:'production-start'},
  {key:'qa',label:'QA',icon:'🔬',msKey:'quality-start'},
  {key:'shipping',label:'Shipping',icon:'🚚',msKey:'shipping'},
  {key:'installation',label:'Installation',icon:'🔧',msKey:'installation'},
];
function getCapacityLimits(){
  if(appSettings['capacity_limits'])return appSettings['capacity_limits'];
  const legacy=Number(appSettings['capacity_weekly_limit'])||10;
  return{procurement:10,production:legacy,qa:10,shipping:10,installation:10};
}
async function saveCapacityLimit(dept,val){
  const n=Math.max(1,parseInt(val)||10);
  const limits=getCapacityLimits();
  limits[dept]=n;
  appSettings['capacity_limits']=limits;
  await sb.from('app_settings').upsert({key:'capacity_limits',value:limits,updated_by:currentUserName,updated_at:new Date().toISOString()},{onConflict:'key'});
  renderCapacity();
}
// Back-compat shim — the old Production board's input used the one-arg form.
function capacityLimit(){return getCapacityLimits().production;}

function capacityStatus(count,limit){
  const pct=limit?count/limit:0;
  if(pct>1)return{color:'#ef4444',bg:'#fef2f2',label:'🔴 Over capacity'};
  if(pct>=0.85)return{color:'#d97706',bg:'#fffbeb',label:'🟡 Near capacity'};
  return{color:'#16a34a',bg:'#f0fdf4',label:'🟢 Healthy'};
}

function capacityWeekLabel(i,w){return i===0?'This week':i===1?'Next week':`Week of ${fmt(ymd(w.start))}`;}

// What each project in a week is actually doing right now — pulled from its production
// check-in (the same stoplight + note your dept check-in already collects), not a new field.
function getProjectRiskStatus(p){
  const pMs=milestones.filter(m=>m.project_id===p.id);
  const anchor=pMs.find(m=>m.key==='production-start')||pMs.find(m=>m.key==='production-end');
  const ci=anchor?checkinStatus[anchor.id]:null;
  const sl=ci?.stoplight||'';
  const risk=sl==='red'?'🔴':sl==='yellow'?'🟡':sl==='green'?'🟢':'⚪';
  const status=ci?.notes?ci.notes:(sl==='red'?'Flagged red':sl==='yellow'?'At risk':sl==='green'?'On track':'Not checked in');
  return{risk,status};
}

// Reuses the same stage/lateness logic as the Pipeline page — whichever stage currently
// has the most "red" (past-due) projects is the one most likely to cause the next delay.
function getMostLikelyDelayDept(){
  const active=projects.filter(p=>p.status!=='complete');
  const counts={};
  PIPELINE_STAGES.forEach(s=>counts[s.id]=0);
  active.forEach(p=>{
    const stage=getProjectStage(p);
    if(getStageHealth(p,stage)==='red')counts[stage]=(counts[stage]||0)+1;
  });
  let best=null,bestN=0;
  PIPELINE_STAGES.forEach(s=>{if(counts[s.id]>bestN){best=s;bestN=counts[s.id];}});
  return best?{label:best.label,count:bestN}:null;
}

// The cross-department matrix: for each of the next N weeks, which projects
// are ENTERING each of the five departments that week. Same "entering" logic
// already proven out on the Production Queue board, just applied to all five
// department-entry milestones instead of one.
function computeCapacityMatrix(count){
  const start0=monday(today());
  const weeks=[];
  for(let i=0;i<count;i++){
    const ws=addD(start0,i*7),we=addD(ws,6);
    const dept={};CAP_DEPTS.forEach(d=>dept[d.key]=[]);
    weeks.push({start:ws,end:we,dept});
  }
  projects.filter(p=>p.status!=='complete').forEach(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);
    CAP_DEPTS.forEach(d=>{
      const m=pMs.find(x=>x.key===d.msKey);
      if(!m?.date)return;
      const dt=new Date(m.date+'T00:00:00');
      const idx=weeks.findIndex(w=>dt>=w.start&&dt<=w.end);
      if(idx!==-1)weeks[idx].dept[d.key].push(p);
    });
  });
  return weeks;
}
let matrixSelectedWeek=0;
function toggleMatrixWeek(i){matrixSelectedWeek=matrixSelectedWeek===i?null:i;renderCapacity();}

let planDragProjId=null;

// Which bucket a project belongs in, reusing the exact same stage/health logic
// as the Pipeline board — so "Waiting on Procurement" here means the same thing
// it means there: parts haven't arrived yet, regardless of what date is on the card.
function getProjectBucket(p){
  const stage=getProjectStage(p);
  if(stage==='mo-release'||stage==='parts-order'||stage==='parts-arrive'){
    return{key:'waiting',label:'Waiting on Procurement',icon:'🟡',color:'#d97706',bg:'#fffbeb'};
  }
  const pMs=milestones.filter(m=>m.project_id===p.id);
  const startMs=pMs.find(m=>m.key==='production-start');
  const ciRed=startMs&&checkinStatus[startMs.id]?.stoplight==='red';
  if(getStageHealth(p,'production')==='red'||ciRed){
    return{key:'risk',label:'At Risk',icon:'🔴',color:'#ef4444',bg:'#fef2f2'};
  }
  return{key:'ready',label:'Scheduled',icon:'🟢',color:'#16a34a',bg:'#f0fdf4'};
}

// The board is organized by what ENTERS production each week (production-start date),
// not by everything overlapping it — that's the number that actually creates new work.
function computeBoardWeeks(count){
  const start0=monday(today());
  const weeks=[];
  for(let i=0;i<count;i++){const ws=addD(start0,i*7),we=addD(ws,6);weeks.push({start:ws,end:we,ready:[],waiting:[],risk:[]});}
  projects.filter(p=>p.status!=='complete').forEach(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);
    const s=pMs.find(m=>m.key==='production-start')?.date||pMs.find(m=>m.key==='production-end')?.date;
    if(!s)return;
    const sd=new Date(s+'T00:00:00');
    const idx=weeks.findIndex(w=>sd>=w.start&&sd<=w.end);
    if(idx===-1)return; // outside the visible horizon — not this board's job
    const b=getProjectBucket(p);
    weeks[idx][b.key].push(p);
  });
  return weeks;
}
function boardWeekCount(w){return w.ready.length+w.waiting.length+w.risk.length;}
function boardWeekProjects(w){return[...w.ready,...w.waiting,...w.risk];}

function getBoardRecommendation(weeks,limit){
  const overIdx=weeks.findIndex(w=>boardWeekCount(w)>limit);
  if(overIdx===-1)return null;
  const week=weeks[overIdx];
  const all=boardWeekProjects(week);
  // easiest to move: not yet at risk, still waiting or ready — moving something already
  // at-risk further out just compounds the problem
  const candidates=[...week.ready,...week.waiting];
  const target=candidates[0]||all[0];
  if(!target)return null;
  let destIdx=-1;
  for(let j=overIdx+1;j<weeks.length;j++){if(boardWeekCount(weeks[j])+1<=limit){destIdx=j;break;}}
  const overBy=boardWeekCount(week)-limit;
  if(destIdx===-1){
    return{text:`${capacityWeekLabel(overIdx,week)} has ${overBy} more project${overBy===1?'':'s'} entering production than capacity allows, and nothing downstream has room in the next ${weeks.length} weeks. Capacity may need to increase.`};
  }
  return{text:`Move ${target.name}${target.pm?' ('+target.pm+')':''} from ${capacityWeekLabel(overIdx,week)} to ${capacityWeekLabel(destIdx,weeks[destIdx])} → ${boardWeekCount(week)-1}/${limit} and ${boardWeekCount(weeks[destIdx])+1}/${limit}. Drag its card to make it real.`};
}

function planDragStart(e,pid){planDragProjId=pid;e.currentTarget.classList.add('dragging');}
function planDragEnd(e){e.currentTarget.classList.remove('dragging');}
function planDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function planDragLeaveCol(e){e.currentTarget.classList.remove('drag-over');}

// Milestones downstream of production — these are NOT moved automatically when
// production reschedules. They just get flagged so a human decides what to do.
const DOWNSTREAM_MS_KEYS=['quality-start','quality-end','final-qc','uat','shipping','delivery','installation','uninstallation','training'];

function getScheduleFlags(){return appSettings['schedule_flags']||{};}

async function saveScheduleFlags(flags){
  appSettings['schedule_flags']=flags;
  await sb.from('app_settings').upsert({key:'schedule_flags',value:flags,updated_by:currentUserName,updated_at:new Date().toISOString()},{onConflict:'key'});
}

// Flags every downstream milestone on this project as needing review — doesn't touch
// their dates. Returns how many got flagged so the caller can tell the user.
async function flagDownstreamAsInconsistent(projId,deltaDays){
  const downstream=milestones.filter(m=>m.project_id===projId&&DOWNSTREAM_MS_KEYS.includes(m.key)&&m.date);
  if(!downstream.length)return 0;
  const flags=getScheduleFlags();
  downstream.forEach(m=>{
    flags[m.id]={project_id:projId,reason:`Production moved ${deltaDays>0?'+':''}${deltaDays}d — this date wasn't updated, verify it`,flagged_at:new Date().toISOString(),flagged_by:currentUserName};
  });
  await saveScheduleFlags(flags);
  return downstream.length;
}

async function clearScheduleFlag(msId){
  const flags=getScheduleFlags();
  delete flags[msId];
  await saveScheduleFlags(flags);
  renderTab();
}

// Dragging a card is a REAL reschedule, not a preview: you're asked exactly how many
// days to move it (pre-filled with the gap to the week you dropped it on, but you can
// type any number). Production's own dates move; everything downstream just gets
// flagged as needing a second look — nothing downstream is silently shifted.
async function planDrop(e,weekIdx){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  const pid=planDragProjId;planDragProjId=null;
  if(!pid)return;
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const pMs=milestones.filter(m=>m.project_id===p.id);
  const startMs=pMs.find(m=>m.key==='production-start');
  const endMs=pMs.find(m=>m.key==='production-end');
  const anchor=startMs||endMs;
  if(!anchor){showToast('No production date to move');return;}
  const targetMonday=addD(monday(today()),weekIdx*7);
  const anchorDate=new Date(anchor.date+'T00:00:00');
  const suggestedDelta=Math.round((targetMonday-monday(anchorDate))/86400000);

  const input=prompt(`Move ${p.name} by how many days? (positive = later, negative = earlier)`,String(suggestedDelta));
  if(input===null)return; // cancelled
  const deltaDays=parseInt(input,10);
  if(isNaN(deltaDays)){showToast('Enter a number of days');return;}
  if(deltaDays===0)return;

  const updates=[startMs,endMs].filter(Boolean).map(ms=>({ms,oldDate:ms.date,newDate:ymd(addD(new Date(ms.date+'T00:00:00'),deltaDays))}));
  for(const u of updates){
    await sb.from('milestones').update({date:u.newDate,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',u.ms.id);
    await sb.from('milestone_history').insert({milestone_id:u.ms.id,project_id:p.id,old_date:u.oldDate,new_date:u.newDate,changed_by:currentUserName,reason:'Rescheduled via Capacity & Planning board'});
    u.ms.date=u.newDate;
  }
  const flaggedCount=await flagDownstreamAsInconsistent(p.id,deltaDays);
  await logActivity('rescheduled production',p.name,p.name,p.id,updates[0]?.oldDate,updates[0]?.newDate);
  showToast(`${p.name} moved ${deltaDays>0?'forward '+deltaDays:'back '+Math.abs(deltaDays)} day${Math.abs(deltaDays)===1?'':'s'}${flaggedCount?' · '+flaggedCount+' downstream date'+(flaggedCount===1?'':'s')+' flagged for review':''}`,3500);
  renderCapacity();
}

function planCard(p){

      <span style="font-size:10px;color:var(--gray-500)">${p.pm||'—'}</span>
      <span style="font-size:9px;color:var(--gray-400)">${rs.status}</span>

}

function renderCapacity(){
  const el=document.getElementById('tab-capacity');if(!el)return;
  const limits=getCapacityLimits();
  const limit=limits.production;
  const weeks=computeBoardWeeks(capacityWeeksCount);
  const matrix=computeCapacityMatrix(capacityWeeksCount);
  const backlogCount=projects.filter(p=>p.status!=='complete'&&!getProdRange(p)).length;

  // Decision bar is now bottleneck-aware across all five departments, not just Production.
  const thisWeekMatrix=matrix[0];
  const thisWeekDeptLoads=CAP_DEPTS.map(d=>({...d,count:thisWeekMatrix.dept[d.key].length,limit:limits[d.key],remaining:limits[d.key]-thisWeekMatrix.dept[d.key].length}));
  const bottleneck=thisWeekDeptLoads.reduce((a,b)=>a.remaining<b.remaining?a:b);
  const canAccept=bottleneck.remaining>0;

  let biggestRiskIdx=-1,biggestRiskDept=null,biggestRiskVal=-Infinity;
  matrix.forEach((w,i)=>CAP_DEPTS.forEach(d=>{

  // ── Cross-department matrix ──
  const matrixDot=(count,limitN)=>{
    const st=capacityStatus(count,limitN);
    return`<div style="text-align:center"><div style="width:9px;height:9px;border-radius:50%;background:${st.color};margin:0 auto 3px"></div><div style="font-size:10.5px;font-weight:700;color:${st.color}">${count}/${limitN}</div></div>`;
  };
  const matrixRows=matrix.map((w,i)=>{
    const isSel=matrixSelectedWeek===i;
    return`<tr onclick="toggleMatrixWeek(${i})" style="cursor:pointer;background:${isSel?'var(--gray-50)':'transparent'}">
      <td style="padding:8px 10px;font-size:11.5px;font-weight:600;white-space:nowrap">${capacityWeekLabel(i,w)}<div style="font-size:9.5px;font-weight:400;color:var(--gray-400)">${fmt(ymd(w.start))}</div></td>
      ${CAP_DEPTS.map(d=>`<td style="padding:8px 10px">${matrixDot(w.dept[d.key].length,limits[d.key])}</td>`).join('')}
    </tr>`;
  }).join('');
  const selWeek=matrixSelectedWeek!==null?matrix[matrixSelectedWeek]:null;
  const matrixDetail=selWeek?`<div style="padding:12px 14px;background:var(--gray-50);border-top:1px solid var(--gray-100);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
    ${CAP_DEPTS.map(d=>{
      const list=selWeek.dept[d.key];
      return`<div>
        <div style="font-size:10.5px;font-weight:700;margin-bottom:4px">${d.icon} ${d.label} <span style="color:var(--gray-400);font-weight:500">(${list.length}/${limits[d.key]})</span></div>

  const matrixSection=`<div class="section" style="margin-bottom:14px">

  const bucketBlock=(w,key,label,icon,color)=>{
    const list=w[key];
    if(!list.length)return'';
    return`<div style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:${color};margin-bottom:4px">${icon} ${label} <span style="color:var(--gray-400);font-weight:500">(${list.length})</span></div>

  const columns=weeks.map((w,i)=>{

    return`<div class="plan-col" ondragover="planDragOver(event)" ondragleave="planDragLeaveCol(event)" ondrop="planDrop(event,${i})" style="min-width:220px;max-width:240px;flex-shrink:0;background:var(--gray-50);border:1px dashed var(--gray-200);border-radius:8px;padding:10px;transition:background 0.1s">

        <div style="font-size:10px;color:var(--gray-500)">${fmt(ymd(w.start))} – ${fmt(ymd(w.end))}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
          <span style="font-size:12px;font-weight:700;color:${st.color}">${count} / ${limit}</span>
          <span style="font-size:10px;color:var(--gray-500)">${Math.max(0,limit-count)} open</span>
        </div>
      </div>
      ${bucketBlock(w,'ready','Scheduled','🟢','#16a34a')}
      ${bucketBlock(w,'waiting','Waiting on Procurement','🟡','#d97706')}
      ${bucketBlock(w,'risk','At Risk','🔴','#ef4444')}
      ${!count?`<div style="font-size:11px;color:var(--gray-400);text-align:center;padding:10px 0">Nothing entering production</div>`:''}
    </div>`;
  }).join('');

  const flags=getScheduleFlags();
  const flagEntries=Object.entries(flags).map(([msId,f])=>{
    const m=milestones.find(x=>x.id===msId);
    const proj=projects.find(x=>x.id===f.project_id);
    return m&&proj?{msId,m,proj,f}:null;
  }).filter(Boolean).sort((a,b)=>(a.f.flagged_at||'').localeCompare(b.f.flagged_at||''));

  const flagsPanel=flagEntries.length?`<div class="section" style="margin-bottom:14px">
    <div class="section-head"><div class="section-title">⚠ Needs review — ${flagEntries.length} downstream date${flagEntries.length===1?'':'s'}</div><div class="section-meta">Left as-is after a production reschedule · not moved automatically</div></div>
    <div style="padding:4px 14px 12px">
      ${flagEntries.map(e=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--gray-100)">
        <div style="min-width:0">
          <span onclick="goToProjPage('${e.proj.id}')" style="font-size:12px;font-weight:600;cursor:pointer">${e.proj.name}</span>
          <span style="font-size:11px;color:var(--gray-500)"> · ${TYPE_LBL[e.m.key]||e.m.key} · ${fmt(e.m.date)}</span>
          <div style="font-size:10px;color:#92400e;margin-top:1px">${e.f.reason}</div>
        </div>
        <button onclick="clearScheduleFlag('${e.msId}')" style="font-size:10px;padding:3px 10px;border-radius:10px;border:1px solid var(--gray-300);background:white;color:var(--gray-700);cursor:pointer;font-family:var(--font);flex-shrink:0">✓ Reviewed</button>
      </div>`).join('')}
    </div>
  </div>`:'';

  el.innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap">
      <div><div style="font-size:21px;font-weight:700">📊 Capacity &amp; Planning</div><div style="font-size:12px;color:var(--gray-500);margin-top:3px">Operations capacity across all five departments — not just Production</div></div>
    </div>
    ${decisionBar}
    ${matrixSection}
    ${recommendation?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:18px">💡</span>
      <div><div style="font-size:11px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:2px">Production recommendation</div><div style="font-size:12px;color:#78350f">${recommendation.text}</div></div>
    </div>`:''}
    ${flagsPanel}
    <div class="section-head" style="padding:0 0 8px"><div class="section-title" style="font-size:14px">🧱 Production — detail &amp; rescheduling</div><div class="section-meta">What's entering production each week · drag a card to reschedule it for real</div></div>
    ${backlogCount?`<div style="font-size:11px;color:var(--gray-500);margin-bottom:10px">${backlogCount} active project${backlogCount===1?'':'s'} ${backlogCount===1?'has':'have'} no production dates yet, so ${backlogCount===1?'it isn\u2019t':'they aren\u2019t'} on this board.</div>`:''}
    <div style="overflow-x:auto;padding-bottom:10px">
      <div style="display:flex;gap:10px;min-width:max-content">${columns}</div>
    </div>`;
}

// ── QUEUE BOARDS (Production / QA / future depts) ─────────────
// Same visual language as Pipeline: a bottleneck bar up top, columns by stage
// (not by group), cards colored by health. Family (Lockers/Vending/TED) shows
// as a badge on the card and an optional filter, same pattern as Pipeline's
// PM filter. Dragging a card forward is REAL: it closes the milestone that
// stage represents, which is what actually moves it — nothing here is a
// separate "status" field pretending to track reality. One engine, multiple
// board configs, so adding Shipping/Installation later is just a new config.
const PROD_FAMILIES=[
  {key:'lockers',label:'Lockers',icon:'🔒',color:'#7c3aed'},
  {key:'vending',label:'Vending',icon:'🥤',color:'#2563eb'},
  {key:'ted',label:'TED',icon:'🖥️',color:'#059669'},
];
function classifyFamily(p){
  const t=(p.product_type||'').toLowerCase();
  if(t.includes('locker'))return'lockers';
  if(t.includes('ted'))return'ted';
  return'vending';
}
function msCrossedOrDone(pMs,key){
  const m=pMs.find(x=>x.key===key);if(!m)return false;
  if(isMilestoneDone(m))return true;
  if(!m.date)return false;
  return new Date(m.date+'T00:00:00')<=today();
}

const QUEUE_BOARDS={
  production:{
    tabId:'prodqueue',title:'🧱 Production Queue',
    subtitle:"on the floor · drag a card forward to close its milestone · click a card to open the project",
    zones:[
      {key:'hold',label:'On Hold',icon:'⏸',color:'#6b6b6b'},
      {key:'waiting',label:'Waiting on Parts',icon:'⏳',color:'#b45309'},
      {key:'ready',label:'Ready',icon:'✅',color:'#16a34a'},
      {key:'wip',label:'W.I.P',icon:'⚙',color:'#d97706'},
      {key:'qc',label:'Moved to QA',icon:'📤',color:'#0891b2'},
    ],
    flow:['waiting','ready','wip','qc'],
    zoneOf(p){
      if(p.status==='on-hold')return'hold';
      const stage=getProjectStage(p);
      if(stage==='mo-release'||stage==='parts-order')return'waiting';
      if(stage==='parts-arrive')return'ready';
      if(stage==='production')return'wip';
      if(stage==='qa')return'qc';
      return null;
    },
    advanceKey(p,zoneKey){return{waiting:'arrival',ready:'production-start',wip:'production-end',qc:'quality-end'}[zoneKey];},
  },
  qa:{
    tabId:'qaqueue',title:'🔬 QA Queue',
    subtitle:"in QA right now · drag a card forward to close its milestone · click a card to open the project",
    zones:[
      {key:'hold',label:'On Hold',icon:'⏸',color:'#6b6b6b'},
      {key:'preqa',label:'Pre-QA',icon:'🕓',color:'#b45309'},
      {key:'integrated',label:'Integrated QA',icon:'🧪',color:'#0891b2'},
      {key:'uat',label:'UAT',icon:'🧍',color:'#7c3aed'},
      {key:'qc',label:'QC',icon:'🔍',color:'#d97706'},
      {key:'packed',label:'Packed',icon:'📦',color:'#16a34a'},
    ],
    flow:['preqa','integrated','uat','qc','packed'],
    // Falls back gracefully when a project has no dedicated UAT milestone — it
    // just never lands in that zone rather than getting stuck.
    zoneOf(p){
      if(p.status==='on-hold')return'hold';
      const pMs=milestones.filter(m=>m.project_id===p.id);
      const has=k=>pMs.some(m=>m.key===k);
      const prodDone=msCrossedOrDone(pMs,'production-end');
      const qaStarted=has('quality-start')?msCrossedOrDone(pMs,'quality-start'):prodDone;
      if(!prodDone&&!qaStarted)return null; // hasn't reached QA yet — not this board's concern
      if(has('shipping')&&msCrossedOrDone(pMs,'shipping'))return null; // already shipped, off this board
      if(has('quality-end')&&msCrossedOrDone(pMs,'quality-end'))return'packed';
      if(has('final-qc')&&msCrossedOrDone(pMs,'final-qc'))return'qc';
      if(has('uat')&&msCrossedOrDone(pMs,'uat'))return'uat';
      if(qaStarted)return'integrated';
      return'preqa';
    },
    advanceKey(p,zoneKey){
      const pMs=milestones.filter(m=>m.project_id===p.id);
      const has=k=>pMs.some(m=>m.key===k);
      if(zoneKey==='preqa')return'quality-start';
      if(zoneKey==='integrated')return has('uat')?'uat':'final-qc';
      if(zoneKey==='uat')return'final-qc';
      if(zoneKey==='qc')return'quality-end';
      return null;
    },
  },
};

let queueFamilyFilter={};
function computeQueueBoard(boardKey){
  const cfg=QUEUE_BOARDS[boardKey];
  const zones={};
  cfg.zones.forEach(z=>zones[z.key]=[]);
  const fam=queueFamilyFilter[boardKey]||'';
  projects.filter(p=>p.status!=='complete').forEach(p=>{
    if(fam&&classifyFamily(p)!==fam)return;
    const zone=cfg.zoneOf(p);
    if(zone)zones[zone].push(p);
  });
  return zones;
}
