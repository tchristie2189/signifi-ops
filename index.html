// Marks/unmarks a milestone done using the same insert/delete pattern as the
// manual "Mark done" button everywhere else, so it shows up identically on
// the project page, Pipeline, and Readiness — this isn't a parallel status.
async function setMilestoneDoneState(mid,pid,wantDone){
  const isDone=!!milestoneDone[mid];
  if(wantDone===isDone)return;
  if(wantDone){
    const{data}=await sb.from('milestone_done').insert({milestone_id:mid,project_id:pid,marked_by:currentUserName}).select().single();
    if(data)milestoneDone[mid]=data;
  } else {
    await sb.from('milestone_done').delete().eq('milestone_id',mid);
    delete milestoneDone[mid];
  }
  const ms=milestones.find(m=>m.id===mid);
  if(ms&&(ms.key==='shipping'||ms.key==='delivery')){
    const proj=projects.find(p=>p.id===ms.project_id);
    if(proj)await saveShippingStatus(ms.project_id,ms.so_tag||null,getShippingStatusAuto(ms.project_id,ms.so_tag||null));
  }
}

async function queueDrop(e,boardKey,targetZone){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  const pid=queueDragProjId;queueDragProjId=null;queueDragBoard=null;
  if(!pid)return;
  const cfg=QUEUE_BOARDS[boardKey];
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const currentZone=cfg.zoneOf(p);
  if(!currentZone||currentZone===targetZone)return;

  if(targetZone==='hold'){
    await sb.from('projects').update({status:'on-hold'}).eq('id',pid);
    p.status='on-hold';
    await logActivity('put on hold',p.name,p.name,pid,null,null);
    showUndoToast(`${p.name} put on hold`,async()=>{
      await sb.from('projects').update({status:'active'}).eq('id',pid);
      p.status='active';
      renderQueueBoard(boardKey);
      showToast('Undone ✓');
    });
    renderQueueBoard(boardKey);
    return;
  }
  if(currentZone==='hold'){
    await sb.from('projects').update({status:'active'}).eq('id',pid);
    p.status='active';
    await logActivity('resumed from hold',p.name,p.name,pid,null,null);
    showUndoToast(`${p.name} resumed`,async()=>{
      await sb.from('projects').update({status:'on-hold'}).eq('id',pid);
      p.status='on-hold';
      renderQueueBoard(boardKey);
      showToast('Undone ✓');
    });
    renderQueueBoard(boardKey);
    return;
  }

  const fromIdx=cfg.flow.indexOf(currentZone),toIdx=cfg.flow.indexOf(targetZone);
  if(fromIdx===-1||toIdx===-1)return;

  if(toIdx>fromIdx){
    let closed=0;
    const touched=[]; // {ms, oldDate, wasDone} — exactly what we need to put back
    for(let i=fromIdx;i<toIdx;i++){
      // Re-fetch each pass — closing one milestone can change what the next zone's key resolves to (e.g. skipping UAT)
      const key=cfg.advanceKey(p,cfg.flow[i]);
      if(!key)continue;
      const pMs=milestones.filter(m=>m.project_id===pid);
      const ms=pMs.find(m=>m.key===key);
      if(!ms)continue;
      const wasDone=!!milestoneDone[ms.id];
      const oldDate=ms.date;
      let dateChanged=false;
      if(!ms.date||ms.date>ymd(today())){
        const newDate=ymd(today());
        await sb.from('milestones').update({date:newDate,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',ms.id);
        if(oldDate)await sb.from('milestone_history').insert({milestone_id:ms.id,project_id:pid,old_date:oldDate,new_date:newDate,changed_by:currentUserName,reason:`Closed via ${cfg.title} drag`});
        ms.date=newDate;
        dateChanged=true;
      }
      await setMilestoneDoneState(ms.id,pid,true);
      touched.push({ms,oldDate,wasDone,dateChanged});
      closed++;
    }
    showUndoToast(`${p.name} moved forward — ${closed} milestone${closed===1?'':'s'} closed`,async()=>{
      for(const t of touched){
        if(t.dateChanged){
          await sb.from('milestones').update({date:t.oldDate,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',t.ms.id);
          t.ms.date=t.oldDate;
        }
        await setMilestoneDoneState(t.ms.id,pid,t.wasDone);
      }
      renderQueueBoard(boardKey);
      showToast('Undone ✓');
    });
  } else {
    showToast(`Can't drag backward — edit the milestone date on ${p.name}'s project page to move it back a stage`);
    renderQueueBoard(boardKey);
    return;
  }
  renderQueueBoard(boardKey);
}

// ── PROCUREMENT COMMAND CENTER ────────────────────────────────
// Every number here is computed from real project/milestone/history data.
// The two places real data doesn't exist yet (root cause, supplier) are
// manual tag scaffolds using the same app_settings pattern as schedule
// flags/photos — they start empty and fill in as people tag things, rather
// than showing fabricated categories or supplier names.
const ROOT_CAUSE_CATEGORIES=['Supplier Delay','Purchase Order Delay','Engineering Delay','Inventory Shortage','Customer Approval','Long Lead Item','Vendor Issue','Shipping Delay','Other'];

function getProcMs(p){
  const pMs=milestones.filter(m=>m.project_id===p.id);
  return{
    mo:pMs.find(m=>m.key==='mo-release'),
    po:pMs.find(m=>m.key==='po-release'),
    arrival:pMs.find(m=>m.key==='arrival'),
    prodStart:pMs.find(m=>m.key==='production-start'),
  };
}
function msDone(m){return m&&(milestoneDone[m.id]||( m.date&&new Date(m.date+'T00:00:00')<=today()));}

// 'mo-release' | 'parts-order' | 'parts-arrive' | 'done' — mirrors the same
// crossed/done logic getProjectStage uses, scoped to just procurement's slice.
function getProcStage(p){
  const{mo,po,arrival}=getProcMs(p);
  if(msDone(arrival))return'done';
  if(msDone(po))return'parts-arrive'; // waiting on arrival
  if(msDone(mo))return'parts-order';  // waiting on PO
  return'mo-release';                 // waiting on MO
}
function getDaysUntilProduction(p){
  const{prodStart}=getProcMs(p);
  if(!prodStart?.date)return null;
  return daysDiff(prodStart.date); // negative = overdue, existing helper
}
// Risk purely from real signals: how close production is vs. how much
// procurement work is still open. No fabricated inputs.
function getProcRisk(p){
  const stage=getProcStage(p);
  if(stage==='done')return{level:'green',label:'Clear'};
  const days=getDaysUntilProduction(p);
  if(days===null)return{level:'grey',label:'No production date'};
  if(days<=3)return{level:'red',label:'Critical'};
  if(days<=7)return{level:'amber',label:'At risk'};
  return{level:'green',label:'On track'};
}
// The one recommendation that's honestly derivable from milestone state alone.
// MO Release sits with Engineering, not Procurement — Procurement can't order
// until it's released, so it's shown here, but the action and blame point at
// the right team instead of asking Procurement to fix something they don't own.
function getRecommendedAction(p){
  const stage=getProcStage(p);
  const days=getDaysUntilProduction(p);
  if(stage==='mo-release')return'Escalate Engineering';
  if(stage==='parts-order')return'Release PO';
  if(stage==='parts-arrive')return(days!==null&&days<=3)?'Expedite Shipment':'Contact Supplier';
  return null;
}
function getBlockingDept(p){
  const stage=getProcStage(p);
  return{'mo-release':'Engineering (MO Release)','parts-order':'Procurement (PO)','parts-arrive':'Supplier','done':null}[stage];
}
function procurementActiveProjects(){return projects.filter(p=>p.status!=='complete'&&getProcStage(p)!=='done');}

// Real average delay, pulled from actual milestone_history entries. MO Release
// is deliberately excluded — it's an Engineering handoff, not something
// Procurement's own performance should be measured against.
function getAvgProcurementDelay(){
  const keys=['po-release','arrival'];
  const relevantMsIds=new Set(milestones.filter(m=>keys.includes(m.key)).map(m=>m.id));
  const delays=[];
  relevantMsIds.forEach(mid=>{
    (milestoneHistory[mid]||[]).forEach(h=>{
      if(!h.old_date||!h.new_date)return;
      const d=Math.round((new Date(h.new_date+'T00:00:00')-new Date(h.old_date+'T00:00:00'))/86400000);
      if(d>0)delays.push(d);
    });
  });
  if(!delays.length)return null;
  return Math.round((delays.reduce((a,b)=>a+b,0)/delays.length)*10)/10;
}

    </div>
    <div class="section" style="margin-bottom:0">
      <div class="section-head"><div class="section-title">⚠ Risks — ${atRisk.length}</div><div class="section-meta">Will become fires without action</div></div>
      <div style="padding:10px 12px">${atRisk.length?atRisk.map(riskRow).join(''):'<div class="empty-state">Nothing brewing 🎉</div>'}</div>
    </div>
  </div>`;

  // ── Upcoming Production Impact (next 14 days) ──
  const upcoming=projects.filter(p=>{
    if(p.status==='complete')return false;
    const d=getDaysUntilProduction(p);
    return d!==null&&d>=0&&d<=14;
  }).sort((a,b)=>getDaysUntilProduction(a)-getDaysUntilProduction(b));
  const impactCard=p=>{
    const stage=getProcStage(p);
    const days=getDaysUntilProduction(p);
    const status=stage==='done'?{label:'✅ Ready',color:'var(--success)',bg:'var(--success-bg)'}:days<=3?{label:'🔴 Blocked',color:'var(--red)',bg:'var(--red-light)'}:{label:'🟡 At Risk',color:'var(--warning)',bg:'var(--warning-bg)'};
    return`<div onclick="goToProjPage('${p.id}')" style="background:${status.bg};border-left:3px solid ${status.color};border-radius:8px;padding:10px 12px;cursor:pointer">
      <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:12px;font-weight:700">${p.name}</span><span style="font-size:10px;font-weight:700;color:${status.color}">${status.label}</span></div>
      <div style="font-size:10.5px;color:var(--gray-500);margin-top:2px">${days}d to production · ${p.pm||'—'}</div>

    <div class="section-head"><div class="section-title">📅 Upcoming Production Impact (14 days)</div><div class="section-meta">${upcoming.length} project${upcoming.length===1?'':'s'} entering production soon</div></div>

  // ── Root Cause Analysis → click a category to drill into Supplier Performance below ──
  const rcCounts={};
  ROOT_CAUSE_CATEGORIES.forEach(c=>rcCounts[c]=0);
  Object.values(tags).forEach(c=>{if(rcCounts[c]!==undefined)rcCounts[c]++;});
  const rcTotal=Object.values(rcCounts).reduce((a,b)=>a+b,0);
  const s4=`<div class="section" style="margin-bottom:14px">
    <div class="section-head"><div class="section-title">🔎 Root Cause Analysis</div><div class="section-meta">${rcTotal?`${rcTotal} project${rcTotal===1?'':'s'} tagged · click a category to see which suppliers`:'No projects tagged yet — tag root causes on the Fires/Risks cards above'}</div></div>
    <div style="padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">
      ${ROOT_CAUSE_CATEGORIES.map(c=>`<div onclick="pccSetRootCauseFilter('${c}')" style="cursor:pointer;background:${pccRootCauseFilter===c?'var(--black)':'var(--gray-50)'};border-radius:8px;padding:10px 12px">
        <div style="font-size:18px;font-weight:700;color:${pccRootCauseFilter===c?'white':'inherit'}">${rcCounts[c]}</div>
        <div style="font-size:10.5px;color:${pccRootCauseFilter===c?'rgba(255,255,255,0.8)':'var(--gray-500)'}">${c}</div>
      </div>`).join('')}
    </div>
  </div>`;

  // ── Supplier Performance — filtered by Root Cause selection if one's active ──
  const supTags=getSupplierTags();
  let supNames=[...new Set(Object.values(supTags))].sort();
  if(pccRootCauseFilter){
    const taggedPids=new Set(Object.keys(tags).filter(pid=>tags[pid]===pccRootCauseFilter));
    supNames=supNames.filter(name=>Object.keys(supTags).some(pid=>supTags[pid]===name&&taggedPids.has(pid)));
  }
  const keys=['po-release','arrival']; // MO Release excluded — it's Engineering, not a supplier
  const supRows=supNames.map(name=>{
    const pids=Object.keys(supTags).filter(pid=>supTags[pid]===name&&(!pccRootCauseFilter||tags[pid]===pccRootCauseFilter));
    const msIds=milestones.filter(m=>pids.includes(m.project_id)&&keys.includes(m.key)).map(m=>m.id);
    const hist=[];
    msIds.forEach(mid=>(milestoneHistory[mid]||[]).forEach(h=>{if(h.old_date&&h.new_date&&h.new_date>h.old_date)hist.push(h);}));
    const avg=hist.length?Math.round((hist.reduce((s,h)=>s+(new Date(h.new_date+'T00:00:00')-new Date(h.old_date+'T00:00:00'))/86400000,0)/hist.length)*10)/10:null;
    const impacted=pids.filter(pid=>{const p=projects.find(x=>x.id===pid);return p&&getProcRisk(p).level!=='green';}).length;
    return`<tr><td style="font-weight:600">${name}</td><td>${pids.length}</td><td>${hist.length}</td><td>${avg!==null?avg+'d':'—'}</td><td>${impacted}</td></tr>`;
  }).join('');
  const s5=`<div class="section" style="margin-bottom:14px">
    <div class="section-head"><div class="section-title">🏭 Supplier Performance${pccRootCauseFilter?` — ${pccRootCauseFilter}`:''}</div><div class="section-meta">${pccRootCauseFilter?`Filtered by root cause · click the category again above to clear`:supNames.length?`${supNames.length} supplier${supNames.length===1?'':'s'} tagged`:'No suppliers tagged yet'}</div></div>
    ${supNames.length?`<div class="dept-table-wrap"><table class="dept-table"><thead><tr><th>Supplier</th><th>Projects supplied</th><th>Late deliveries</th><th>Avg delay</th><th>Projects impacted</th></tr></thead><tbody>${supRows}</tbody></table></div>`
      :`<div style="padding:12px 14px">
          <div class="empty-state" style="margin-bottom:10px">${pccRootCauseFilter?'No suppliers tagged for this root cause yet.':'No supplier data yet — tag a project below to start tracking.'}</div>
          ${pccRootCauseFilter?'':`<div style="display:flex;gap:8px;align-items:center;max-width:420px">
            <select id="pcc-sup-proj" style="flex:1;font-family:var(--font);font-size:12px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius)">
              <option value="">Choose a project…</option>
              ${active.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
            <input id="pcc-sup-name" placeholder="Supplier name" style="flex:1;font-family:var(--font);font-size:12px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius)">
            <button onclick="setSupplierTag(document.getElementById('pcc-sup-proj').value,document.getElementById('pcc-sup-name').value)" style="font-size:12px;font-weight:600;padding:6px 14px;border:none;border-radius:var(--radius);background:var(--black);color:white;cursor:pointer;font-family:var(--font)">Tag</button>
          </div>`}
        </div>`}
  </div>`;

  // ── Operational Impact (visual chain, informational only) ──
  const chainCounts=PIPELINE_STAGES.map(s=>({...s,count:projects.filter(p=>p.status!=='complete'&&getProjectStage(p)===s.id).length}));
  const s6=`<div class="section">
    <div class="section-head"><div class="section-title">🔗 Operational Impact</div><div class="section-meta">Where active projects sit right now — informational only, nothing here moves a date</div></div>
    <div style="padding:16px 14px;display:flex;align-items:center;gap:6px;overflow-x:auto">
      ${chainCounts.map((s,i)=>`${i>0?'<span style="color:var(--gray-300);font-size:16px;flex-shrink:0">→</span>':''}
        <div style="flex-shrink:0;text-align:center;min-width:90px;background:var(--gray-50);border-top:3px solid ${s.color};border-radius:8px;padding:10px 8px">
          <div style="font-size:18px">${s.icon}</div>
          <div style="font-size:16px;font-weight:700;margin-top:2px">${s.count}</div>
          <div style="font-size:9.5px;color:var(--gray-500)">${s.label}</div>
        </div>`).join('')}
    </div>
  </div>`;

  el.innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:21px;font-weight:700">🔧 Procurement Command Center</div>
      <div style="font-size:12px;color:var(--gray-500);margin-top:3px">What's on fire, what's next, who owns it, what to do today</div>
    </div>
    ${s1}<div style="margin-bottom:14px"></div>${s1b}${warRoom}${s3}${s4}${s5}${s6}`;
}

];
let cpSelectedIdx=0,cpResults=[];
function cpEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function openCommandPalette(){
  const root=document.getElementById('modal-root');if(!root)return;
  root.innerHTML=`
    <div id="cp-overlay" onclick="if(event.target.id==='cp-overlay')closeCommandPalette()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh">
      <div style="background:#1a1a1a;border:1px solid #333;border-radius:12px;width:560px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden">
        <input id="cp-input" placeholder="Search projects or jump anywhere…" autocomplete="off"
          style="width:100%;font-family:var(--font);font-size:15px;padding:16px 18px;border:none;background:transparent;color:white;outline:none;border-bottom:1px solid #2a2a2a;box-sizing:border-box"
          oninput="cpRender(this.value)" onkeydown="cpKeydown(event)">
        <div id="cp-results" style="max-height:360px;overflow-y:auto"></div>
        <div style="padding:8px 18px;font-size:10px;color:#666;border-top:1px solid #2a2a2a;display:flex;gap:14px">
          <span>↑↓ navigate</span><span>↵ select</span><span>esc close</span>
        </div>
      </div>
    </div>`;
  document.getElementById('cp-input').focus();
  cpRender('');
}
function closeCommandPalette(){const root=document.getElementById('modal-root');if(root)root.innerHTML='';}

function cpRender(q){
  const ql=q.trim().toLowerCase();
  let results=[];
  if(ql){
    const projMatches=projects.filter(p=>
      (p.name||'').toLowerCase().includes(ql)||
      (p.so_number||'').toLowerCase().includes(ql)||
      (p.client||'').toLowerCase().includes(ql)||
      (p.pm||'').toLowerCase().includes(ql)
    ).slice(0,6).map(p=>({type:'project',icon:'📁',label:p.name,sub:[p.so_number,p.client,p.pm].filter(Boolean).join(' · '),run:()=>gsGo(p.id)}));
    const cmdMatches=CP_COMMANDS.filter(c=>c.label.toLowerCase().includes(ql)).slice(0,6).map(c=>({type:'command',icon:c.icon,label:c.label,sub:'Go to page',run:c.run}));
    results=[...projMatches,...cmdMatches];
  } else {
    results=CP_COMMANDS.slice(0,8).map(c=>({type:'command',icon:c.icon,label:c.label,sub:'Go to page',run:c.run}));
  }
  cpResults=results;cpSelectedIdx=0;cpPaint();
}
function cpPaint(){
  const el=document.getElementById('cp-results');if(!el)return;
  if(!cpResults.length){el.innerHTML='<div style="padding:24px;text-align:center;color:#666;font-size:12px">No matches</div>';return;}
  el.innerHTML=cpResults.map((r,i)=>`
    <div onclick="cpRunIdx(${i})" onmouseover="cpSelectedIdx=${i};cpPaint()" style="padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;background:${i===cpSelectedIdx?'#252525':'transparent'};border-left:2px solid ${i===cpSelectedIdx?'#e22f4a':'transparent'}">
      <span style="font-size:14px;width:20px;text-align:center;flex-shrink:0">${r.icon}</span>
      <div style="min-width:0;flex:1">
        <div style="font-size:12.5px;font-weight:600;color:#e5e7eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cpEsc(r.label)}</div>
        ${r.sub?`<div style="font-size:10.5px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cpEsc(r.sub)}</div>`:''}
      </div>
      <span style="font-size:9px;color:#555;flex-shrink:0">${r.type==='project'?'PROJECT':'GO'}</span>
    </div>`).join('');
}
function cpRunIdx(i){const r=cpResults[i];if(!r)return;closeCommandPalette();r.run();}
function cpKeydown(e){
  if(e.key==='ArrowDown'){e.preventDefault();cpSelectedIdx=Math.min(cpResults.length-1,cpSelectedIdx+1);cpPaint();}
  else if(e.key==='ArrowUp'){e.preventDefault();cpSelectedIdx=Math.max(0,cpSelectedIdx-1);cpPaint();}
  else if(e.key==='Enter'){e.preventDefault();cpRunIdx(cpSelectedIdx);}
  else if(e.key==='Escape'){closeCommandPalette();}
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(document.getElementById('cp-overlay'))closeCommandPalette();else openCommandPalette();
  } else if(e.key==='Escape'&&document.getElementById('cp-overlay')){
    closeCommandPalette();
  }
});

function salesDropdown(renderFn){

  </select>`;
}
function filterBySales(list){return salesFilter?list.filter(p=>p.sales===salesFilter):list;}

// Helper — filters out completed projects based on per-page toggle
function activeProjects(page){
  const hide=page?hideCompleted[page]:false;
  let list=projects.filter(p=>p.status!=='complete'||!hide);
  if(!hide)return projects;
  // For dept pages also filter out projects where the key milestone is done
  const stageKeyMap={
    production:'production-end',
    quality:'quality-end',
    shipping:'shipping',
    installation:'installation',
  };
  const stageKey=stageKeyMap[page];
  if(stageKey){
    list=list.filter(p=>{
      const m=milestones.find(ms=>ms.project_id===p.id&&ms.key===stageKey);
      if(!m)return true; // no milestone = not done, show it
      return !isMilestoneDone(m);
    });
  }
  // For dept/schedule views: if master has active children, show children not master
  const schedPages=['production','quality','shipping','installation'];
  if(schedPages.includes(page)){
    list=list.filter(p=>{
      if(isMaster(p)){
        const activeKids=getChildren(p.id).filter(c=>c.status!=='complete');
        if(activeKids.length)return false; // hide master, children show instead
      }
      return true;
    });
  }
  return list;
}
function hideCompletedBtn(page){
  const active=hideCompleted[page];
  return`<button onclick="hideCompleted['${page}']=!hideCompleted['${page}'];renderTab()" style="font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid ${active?'var(--black)':'var(--gray-300)'};background:${active?'var(--black)':'var(--white)'};color:${active?'white':'var(--gray-500)'};cursor:pointer;font-family:var(--font);font-weight:500">${active?'✓ ':''} Hide completed</button>`;
}

}

function renderGlance(){
  const el=document.getElementById('tab-glance');
  const visibleProjects=projects.filter(p=>{
    if(glanceFilter==='archived'?p.status!=='complete':p.status==='complete')return false;
    if(isChild(p))return false; // hide child projects — they show under their master
    if(pmFilter&&p.pm!==pmFilter)return false;
    if(salesFilter&&p.sales!==salesFilter)return false;
    return true;
  });
  const allActive=projects.filter(p=>p.status!=='complete');
  const allArchived=projects.filter(p=>p.status==='complete');
  const overdue=milestones.filter(m=>isMilestoneOverdue(m)).length;
  const adHocMs=getAdHocAsMilestones().filter(m=>!pmFilter||m._raw?.pm===pmFilter);
  const adHocOverdue=adHocMs.filter(m=>daysDiff(m.date)<0&&m._status!=='Complete').length;
  const thisWeek=milestones.filter(m=>m.date&&daysDiff(m.date)>=0&&daysDiff(m.date)<=6).length;
  const adHocThisWeek=adHocMs.filter(m=>daysDiff(m.date)>=0&&daysDiff(m.date)<=6&&m._status!=='Complete').length;
  const active=allActive.length;
  const inProd=allActive.filter(p=>{const s=getMsDate(p.id,'production-start');const e=getMsDate(p.id,'production-end');if(!s||!e)return false;const t=today();return t>=new Date(s+'T00:00:00')&&t<=new Date(e+'T00:00:00');}).length;
  const inQa=allActive.filter(p=>{const s=getMsDate(p.id,'quality-start');const e=getMsDate(p.id,'quality-end');if(!s||!e)return false;const t=today();return t>=new Date(s+'T00:00:00')&&t<=new Date(e+'T00:00:00');}).length;
  const STAGES=[
    {label:'Readiness',startKey:'po-release',endKey:'arrival',color:'#6b6b6b'},
    {label:'Production',startKey:'production-start',endKey:'production-end',color:'#7c3aed'},
    {label:'Planogram',startKey:'other',endKey:'other',color:'#0891b2',labelMatch:'planogram'},
    {label:'Quality / QA',startKey:'quality-start',endKey:'quality-end',color:'#d97706'},
    {label:'UAT',startKey:'uat',endKey:'uat',color:'#16a34a'},
    {label:'Shipping',startKey:'shipping',endKey:'shipping',color:'#059669'},
    {label:'Delivery',startKey:'delivery',endKey:'delivery',color:'#0891b2'},
    {label:'Installation',startKey:'installation',endKey:'installation',color:'#db2777'},
  ];
  const cards=visibleProjects.map(p=>{
    const h=calcHealth(p.id);
    const prodStart=getMsDate(p.id,'production-start');
    const installEnd=getMsDate(p.id,'installation');
    const overallStart=prodStart?new Date(prodStart+'T00:00:00'):null;
    const overallEnd=installEnd?new Date(installEnd+'T00:00:00'):null;
    const t=today();
    let overallPct=0;
    if(overallStart&&overallEnd&&t>=overallStart){
      overallPct=Math.min(100,Math.round((t-overallStart)/(overallEnd-overallStart)*100));
    }
    const stagesHtml=STAGES.map(stage=>{
      let sd,ed,stageMs;
      if(stage.labelMatch){
        // Planogram — find by label
        const planMs=milestones.filter(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes(stage.labelMatch));
        const ps=planMs.find(m=>(m.label||'').toLowerCase().includes('start'));
        const pe=planMs.find(m=>(m.label||'').toLowerCase().includes('end'));
        sd=ps?.date||planMs[0]?.date||null;
        ed=pe?.date||planMs[planMs.length-1]?.date||null;
        stageMs=planMs;
      } else {
        sd=getMsDate(p.id,stage.startKey);ed=getMsDate(p.id,stage.endKey);
        const stageMsKeys=[stage.startKey,stage.endKey].filter((v,i,a)=>a.indexOf(v)===i);
        stageMs=milestones.filter(m=>m.project_id===p.id&&stageMsKeys.includes(m.key)&&m.date);
      }
      const st=stageStatus(sd,ed);
      const allDone=stageMs.length>0&&stageMs.every(m=>isMilestoneEffectivelyDone(m));
      const hasOverdue=!allDone&&stageMs.some(m=>isMilestoneOverdue(m));
      const hasEscalation=!allDone&&stageMs.some(m=>isMilestoneEscalation(m));
      const hasRisk=!allDone&&stageMs.some(m=>isMilestoneAtRisk(m));
      const noMs=stageMs.length===0;
      // If no milestones exist for this stage, skip it entirely
      if(noMs)return null;
      const chipCls=allDone?'chip-done':hasEscalation?'chip-overdue':hasOverdue?'chip-overdue':hasRisk?'chip-atrisk':st.chip;
      const chipLbl=allDone?'Done ✓':hasEscalation?'Escalation':hasOverdue?'Overdue':hasRisk?'At risk':st.label;
      let pct=0;
      if(allDone){pct=100;}
      else if(sd){const s=new Date(sd+'T00:00:00');const e=ed?new Date(ed+'T00:00:00'):s;const t=today();if(t>e)pct=100;else if(t>=s){const total=(e-s)||86400000;pct=Math.min(100,Math.round((t-s)/total*100));}}
      const barColor=allDone?'var(--success)':hasOverdue||hasEscalation?'var(--red)':hasRisk?'var(--warning)':stage.color;
      return `<div class="cycle-stage"><div class="cycle-stage-name">${stage.label}</div><div class="cycle-bar-wrap"><div class="cycle-bar" style="width:${pct}%;background:${pct>0?barColor:'var(--gray-200)'}"></div></div><div style="text-align:right"><span class="stage-chip ${chipCls}">${chipLbl}</span></div></div>`;
    }).filter(Boolean).join('');

          </div>

          ${overallStart&&overallEnd?`<div style="margin-top:7px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em">Overall progress</span><span style="font-size:9px;color:var(--gray-500)">${overallPct}%</span></div><div style="background:var(--gray-100);border-radius:3px;height:4px"><div style="height:4px;border-radius:3px;background:linear-gradient(90deg,#7c3aed,#e22f4a);width:${overallPct}%"></div></div></div>`:''}

// ── READINESS CENTER ─────────────────────────────────────────
function getReadinessData(){
  const active=projects.filter(p=>p.status!=='complete');
  const issues=[];
  const add=(id,label,severity,group,items,why)=>{
    const unique=[];const seen=new Set();
    (items||[]).forEach(item=>{const key=item.project_id||item.id||item.name;if(!seen.has(key)){seen.add(key);unique.push(item);}});
    issues.push({id,label,severity,group,items:unique,why});
  };
  const projectItem=(p,detail='')=>({project_id:p.id,name:p.name,so:p.so_number||'',pm:p.pm||'',sales:p.sales||'',detail});

  add('missing-pm','Missing PM','critical','pm',active.filter(p=>!(p.pm||'').trim()).map(p=>projectItem(p)),
    'Every active project should have a clear PM owner.');
  add('missing-sales','Missing salesperson','critical','sales',active.filter(p=>!(p.sales||'').trim()).map(p=>projectItem(p)),
    'Sales ownership is required for Sales reporting and follow-up.');
  add('missing-so','Missing Sales Order','critical','sales',active.filter(p=>!(p.so_number||'').trim()).map(p=>projectItem(p)),
    'Active projects should be tied to a Sales Order.');

  const missingNaming=[];
  active.forEach(p=>{
    const sos=(p.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    if(!sos.length)return;
    if(sos.length===1){
      const d=soDetails.find(x=>x.project_id===p.id&&x.so_tag===sos[0]);
      if(!((d?.naming_convention||p.naming_convention||'').trim()))missingNaming.push(projectItem(p,sos[0]));
    }else{
      sos.forEach(so=>{const d=soDetails.find(x=>x.project_id===p.id&&x.so_tag===so);if(!(d?.naming_convention||'').trim())missingNaming.push(projectItem(p,so));});
    }
  });
  add('missing-naming','Missing naming convention','warning','sales',missingNaming,
    'Naming is checked per Sales Order. Multi-SO projects require naming for each SO.');

  const duplicateMap={};
  active.forEach(p=>(p.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean).forEach(so=>{(duplicateMap[so]??=[]).push(p);}));
  const duplicates=[];
  Object.entries(duplicateMap).filter(([,ps])=>ps.length>1).forEach(([so,ps])=>ps.forEach(p=>duplicates.push(projectItem(p,so))));
  add('duplicate-so','Duplicate Sales Orders','critical','sales',duplicates,
    'The same Sales Order appears on more than one active project.');

  const pending=extensionRequests.filter(r=>r.status==='pending').map(r=>{
    const p=projects.find(x=>x.id===r.project_id);
    return {project_id:r.project_id||r.id,name:p?.name||r.so_tag||'Unlinked request',so:r.so_tag||p?.so_number||'',pm:p?.pm||'',sales:p?.sales||'',detail:`${r.dept||''} · +${r.days||0}d · ${r.requested_by||''}`};
  });
  add('pending-extensions','Pending extension requests','critical','operations',pending,
    'These requests are waiting for PM review.');

  const red=[],yellow=[];
  Object.values(checkinStatus).forEach(c=>{
    if(c.stoplight!=='red'&&c.stoplight!=='yellow')return;
    const m=milestones.find(x=>x.id===c.milestone_id);const p=projects.find(x=>x.id===(m?.project_id||c.project_id));
    const item={project_id:p?.id||c.project_id||c.id,name:p?.name||'Unlinked check-in',so:m?.so_tag||p?.so_number||'',pm:p?.pm||'',sales:p?.sales||'',detail:`${c.dept||''}${c.notes?' · '+c.notes:''}`};
    (c.stoplight==='red'?red:yellow).push(item);
  });
  add('red-checkins','Red check-ins','critical','operations',red,'Department escalations requiring immediate attention.');
  add('yellow-checkins','Yellow check-ins','warning','operations',yellow,'Department items marked in trouble.');

  const overdue=milestones.filter(m=>isMilestoneOverdue(m)).map(m=>{const p=projects.find(x=>x.id===m.project_id);return{project_id:m.project_id,name:p?.name||'Unknown project',so:m.so_tag||p?.so_number||'',pm:p?.pm||'',sales:p?.sales||'',detail:`${m.label} · ${fmtFull(m.date)}`};});
  add('overdue-milestones','Overdue milestones','critical','operations',overdue,'Milestones past due and not completed.');

  const missingInstall=[],missingDelivery=[],badSequence=[];
  active.forEach(p=>{
    const pms=milestones.filter(m=>m.project_id===p.id);
    pms.filter(m=>m.key==='installation'&&!m.date).forEach(m=>missingInstall.push(projectItem(p,m.so_tag||m.label)));
    pms.filter(m=>m.key==='delivery'&&!m.date).forEach(m=>missingDelivery.push(projectItem(p,m.so_tag||m.label)));
    const tags=[...new Set(pms.map(m=>m.so_tag||'__project'))];
    tags.forEach(tag=>{
      const find=k=>pms.find(m=>m.key===k&&(m.so_tag||'__project')===tag)?.date;
      const ship=find('shipping'),del=find('delivery'),inst=find('installation');
      if(ship&&del&&ship>del)badSequence.push(projectItem(p,`${tag==='__project'?'Project':tag}: shipping after delivery`));
      if(del&&inst&&del>inst)badSequence.push(projectItem(p,`${tag==='__project'?'Project':tag}: delivery after installation`));
    });
  });
  add('missing-install-date','Installation milestone missing date','warning','operations',missingInstall,'Only flags projects that already have an installation milestone with no date.');
  add('missing-delivery-date','Delivery milestone missing date','warning','operations',missingDelivery,'Only flags projects that already have a delivery milestone with no date.');
  add('invalid-sequence','Invalid milestone order','critical','operations',badSequence,'Shipping must precede delivery, and delivery must precede installation.');

  const staleFlags=[],freshFlags=[];
  Object.entries(getScheduleFlags()).forEach(([msId,f])=>{
    const m=milestones.find(x=>x.id===msId);
    const p=projects.find(x=>x.id===f.project_id);
    if(!m||!p)return;
    const daysFlagged=f.flagged_at?Math.floor((Date.now()-new Date(f.flagged_at).getTime())/86400000):0;
    const item=projectItem(p,`${TYPE_LBL[m.key]||m.key} · ${fmt(m.date)} · flagged ${daysFlagged}d ago`);
    (daysFlagged>=7?staleFlags:freshFlags).push(item);
  });
  add('stale-schedule-flags','Unreviewed schedule change (7+ days)','critical','operations',staleFlags,'Production moved on the Capacity board over a week ago and this downstream date still hasn\'t been checked.');
  add('schedule-flags','Unreviewed schedule change','warning','operations',freshFlags,'Production moved on the Capacity board; this downstream date hasn\'t been reviewed yet.');
  return issues;
}

// Readiness quick actions — fix the field right on the row, no navigation, no
// save button. Same Undo pattern as the queue boards.
async function rqaSetPM(pid,val){
  if(!val)return;
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const old=p.pm;
  await sb.from('projects').update({pm:val}).eq('id',pid);
  p.pm=val;
  await logActivity('assigned PM',p.name,val,pid,old,val);
  renderReadiness();
  showUndoToast(`${p.name} — PM set to ${val}`,async()=>{
    await sb.from('projects').update({pm:old||null}).eq('id',pid);
    p.pm=old||'';
    renderReadiness();
    showToast('Undone ✓');
  });
}
async function rqaSetSales(pid,val){
  if(!val)return;
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const old=p.sales;
  await sb.from('projects').update({sales:val}).eq('id',pid);
  p.sales=val;
  await logActivity('assigned salesperson',p.name,val,pid,old,val);
  renderReadiness();
  showUndoToast(`${p.name} — Sales set to ${val}`,async()=>{
    await sb.from('projects').update({sales:old||null}).eq('id',pid);
    p.sales=old||'';
    renderReadiness();
    showToast('Undone ✓');

}
async function rqaSetSO(pid,val){
  const v=(val||'').trim();
  if(!v)return;
  const p=projects.find(x=>x.id===pid);if(!p)return;
  if(v===p.so_number)return;
  const old=p.so_number;
  await sb.from('projects').update({so_number:v}).eq('id',pid);
  p.so_number=v;
  await logActivity('assigned SO',p.name,v,pid,old,v);
  renderReadiness();
  showUndoToast(`${p.name} — SO set to ${v}`,async()=>{
    await sb.from('projects').update({so_number:old||null}).eq('id',pid);
    p.so_number=old||'';
    renderReadiness();
    showToast('Undone ✓');
  });
}

// ── SHARED PROJECT / SO CONFIG SYNC ─────────────────────────
const SHARED_CONFIG_FIELDS=['address','naming_convention','form_factor','qa_task_url','odoo_url','install_ticket_url','ui_task_url'];
function projectSOList(proj){return (proj?.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);}
function singleProjectSO(proj){const list=projectSOList(proj);return list.length===1?list[0]:'';}
function effectiveProjectConfig(proj){
  const so=singleProjectSO(proj);
  const d=so?soDetails.find(x=>x.project_id===proj.id&&x.so_tag===so):null;
  const merged={...proj};
  if(d)SHARED_CONFIG_FIELDS.forEach(f=>{if(d[f]!==undefined&&d[f]!==null)merged[f]=d[f];});
  return merged;
}
async function syncProjectFieldsToSingleSO(projId,updates){
  const proj=projects.find(p=>p.id===projId);if(!proj)return;
  const so=singleProjectSO(proj);if(!so)return;
  const clean={};SHARED_CONFIG_FIELDS.forEach(f=>{if(Object.prototype.hasOwnProperty.call(updates,f))clean[f]=updates[f]??'';});
  if(!Object.keys(clean).length)return;
  const existing=soDetails.find(d=>d.project_id===projId&&d.so_tag===so);
  if(existing){
    await sb.from('so_details').update({...clean,updated_at:new Date().toISOString()}).eq('id',existing.id);
    Object.assign(existing,clean);
  }else{
    const row={project_id:projId,so_tag:so};
    SHARED_CONFIG_FIELDS.forEach(f=>row[f]=Object.prototype.hasOwnProperty.call(clean,f)?clean[f]:(proj[f]||''));
    const{data}=await sb.from('so_details').insert(row).select().single();
    if(data)soDetails.push(data);
  }
}
async function syncSingleSOFieldsToProject(projId,so,updates){
  const proj=projects.find(p=>p.id===projId);if(!proj||singleProjectSO(proj)!==so)return;
  const clean={};SHARED_CONFIG_FIELDS.forEach(f=>{if(Object.prototype.hasOwnProperty.call(updates,f))clean[f]=updates[f]||null;});
  if(!Object.keys(clean).length)return;
  await sb.from('projects').update({...clean,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',projId);
  Object.assign(proj,clean);
}

async function quickUpdateMs(msId,newDate){

  if(oldDate&&!newDate){

  m.date=newDate;

  } else {
    showToast('Date updated ✓');

  await loadAll();
}

// Syncs a changed milestone date back to the matching vinyl_schedule row so
// the vinyl schedule never shows a stale date after a milestone edit.
async function syncMsDateToVinyl(ms,newDate){
  if(ms.key!=='vinyl'&&ms.key!=='shipping')return;
  const dbField=ms.key==='vinyl'?'date':'ship_date';
  const inMemField=ms.key==='vinyl'?'date':'shipDate';
  // Find matching vinyl schedule rows for this project/SO
  const rows=vinylSchedule.filter(v=>
    v.project_id===ms.project_id&&
    (ms.so_tag?v.so===ms.so_tag:true)&&
    v.id // only saved rows
  );
  if(!rows.length)return;
  await Promise.all(rows.map(v=>
    sb.from('vinyl_schedule').update({[dbField]:newDate,updated_at:new Date().toISOString()}).eq('id',v.id)
  ));
  rows.forEach(v=>{v[inMemField]=newDate;if(ms.key==='vinyl')v.date=newDate;else v.shipDate=newDate;});
}

  </details>`:'';
  const DAY=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const t=today();

  const filteredMsWithAdhoc=weekDeptFilter?allMsWithAdhoc.filter(m=>{
    if(weekDeptFilter==='adhoc')return m._adhoc;

// Converts ad hoc rows into milestone-like objects so they surface in all views
function getAdHocAsMilestones(){
  const ship=(adHocRows.shipping||[]).map(r=>({
    id:'adhoc-ship-'+r.id,project_id:null,key:'shipping',
    label:r.name,date:r.shipDate||r.ship_date||'',

  }));
  const inst=(adHocRows.installation||[]).map(r=>({

// ── DEPT / GANTT ───────────────────────────────────────────
function buildGantt(startKeys,endKeys,segsFn,title,legend){
  const starts=milestones.filter(m=>startKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const ends=milestones.filter(m=>endKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  if(!starts.length||!ends.length)return'';
  let rS=monday(new Date(Math.min(...starts)));let rE=addD(new Date(Math.max(...ends)),5);
  const days=[];let cur=new Date(rS);while(cur<=rE){const dow=cur.getDay();if(dow!==0&&dow!==6)days.push(new Date(cur));cur=addD(cur,1);}
  const t=today();
  const hdr=days.map(d=>{
    const isT=sameDay(d,t);
    const monthLabel=d.getDate()===1||days.indexOf(d)===0?'<span style="font-size:8px;display:block">'+d.toLocaleDateString('en-US',{month:'short'})+'</span>':'';
    return`<th style="min-width:28px${isT?';background:#fff0f0':''}">${monthLabel}${d.getDate()}</th>`;
  }).join('');

  // Sort: active now → upcoming → past (no dates last)
  const deptKey=title.toLowerCase().includes('prod')?'production':'quality';
  const allGanttProjs=filterBySales(filterByPM(activeProjects(deptKey)));
  const sortedGanttProjs=[...allGanttProjs].sort((a,b)=>{
    const getRange=(p)=>{
      const pMs=milestones.filter(m=>m.project_id===p.id);
      const s=startKeys.map(k=>pMs.find(m=>m.key===k)?.date).find(Boolean);
      const e=endKeys.map(k=>pMs.find(m=>m.key===k)?.date).find(Boolean);
      return{s,e};
    };
    const ra=getRange(a),rb=getRange(b);
    const activeA=ra.s&&ra.e&&t>=new Date(ra.s+'T00:00:00')&&t<=new Date(ra.e+'T00:00:00');
    const activeB=rb.s&&rb.e&&t>=new Date(rb.s+'T00:00:00')&&t<=new Date(rb.e+'T00:00:00');
    if(activeA&&!activeB)return-1;
    if(!activeA&&activeB)return 1;
    // Both upcoming or both past — sort by start date
    if(!ra.s&&rb.s)return 1;if(ra.s&&!rb.s)return-1;
    return(ra.s||'').localeCompare(rb.s||'');
  });

  const ganttId='gantt-'+title.replace(/\s+/g,'-').toLowerCase();
  const gRows=sortedGanttProjs.map(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);const getD=k=>pMs.find(m=>m.key===k)?.date;
    const segs=segsFn(getD).filter(x=>x.s);
    // Is this project active right now?
    const startD=startKeys.map(k=>getD(k)).find(Boolean);
    const endD=endKeys.map(k=>getD(k)).find(Boolean);
    const isActive=startD&&endD&&t>=new Date(startD+'T00:00:00')&&t<=new Date(endD+'T00:00:00');
    const cells=days.map(d=>{
      const isT=sameDay(d,t);let fill='';
      segs.forEach(sg=>{const sd=new Date(sg.s+'T00:00:00');const ed=sg.e?new Date(sg.e+'T00:00:00'):sd;if(d>=sd&&d<=ed)fill=`<div class="gantt-fill" style="background:${sg.bg};opacity:0.85" title="${sg.lbl}"></div>`;});
      const tl=isT?'<div style="position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(200,16,46,0.35);transform:translateX(-50%)"></div>':'';
      return`<td class="gantt-cell" style="${isT?'background:#fff0f0;':''}">${tl}${fill}</td>`;
    }).join('');
    const activePip=isActive?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-left:4px;vertical-align:middle" title="Active now"></span>':'';
    return`<tr${isActive?' style="background:#f8fff8"':''}><td class="proj-name">${p.name}${activePip}<br><span style="font-family:var(--mono);font-size:9px;color:var(--gray-500)" title="${p.so_number||''}">${truncateSO(p.so_number,2)}</span></td>${cells}</tr>`;
  }).join('');

  const legHtml=legend.map(l=>`<div class="leg"><div class="leg-dot" style="background:${l.c}"></div>${l.l}</div>`).join('');
  // Queue scroll to today after DOM renders
  setTimeout(function(){
    const w=document.getElementById(ganttId);
    if(!w)return;
    const ths=w.querySelectorAll('th');
    let todayIdx=-1;
    ths.forEach(function(th,i){if(th.style.background&&th.style.background.includes('fff0f0'))todayIdx=i;});
    if(todayIdx>0)w.scrollLeft=Math.max(0,(todayIdx-3)*28);
  },150);
  return`<div class="section" style="margin-bottom:10px"><div class="section-head"><div class="section-title">${title} — Gantt</div><div style="display:flex;align-items:center;gap:8px"><div class="legend-row" style="margin:0;gap:8px">${legHtml}</div>${hideCompletedBtn(deptKey)}</div></div><div class="prod-gantt"><div class="gantt-wrap" id="${ganttId}"><table class="gantt-table"><thead><tr><th class="proj-col">Project</th>${hdr}</tr></thead><tbody>${gRows}</tbody></table></div></div></div>`;
}

async function syncVinylFromProjects(){
  // SAFE: this function ONLY inserts — it never deletes, updates, or touches
  // standalone/ad hoc rows (is_standalone:true). Ad hoc entries are always preserved.
  const today_str=isoD(today());
  const toAdd=[];
  for(const p of projects.filter(p=>p.status!=='complete')){
    const vm=milestones.find(m=>m.project_id===p.id&&m.key==='vinyl'&&m.date&&m.date>=today_str);
    const sh=milestones.find(m=>m.project_id===p.id&&m.key==='shipping');
    if(!vm)continue;
    const soList=(p.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    const entries=soList.length>1?soList:[p.so_number||''];
    for(const so of entries){
      // Only check project-linked rows (never standalone/ad hoc)
      const alreadyExists=vinylSchedule.filter(v=>!v.is_standalone).some(v=>v.project_id===p.id&&(v.so===so||soList.length===1));
      if(!alreadyExists){
        toAdd.push({
          project_id:p.id,name:p.name+(soList.length>1?' ('+so+')':''),
          so,client:p.client||'',vinyl_type:p.vinyl_type||'',
          date:vm.date,ship_date:sh?.date||null,
          pm:p.pm||'',form_factor:p.form_factor||'',
          status:'Scheduled',priority:vinylSchedule.length+toAdd.length+1,
          is_standalone:false,updated_at:new Date().toISOString()
        });
      }
    }
  }
  if(!toAdd.length){showToast('All projects already in schedule ✓');return;}
  if(!confirm('Add '+toAdd.length+' missing project'+(toAdd.length>1?'s':'')+' back to vinyl schedule?\n\nAd hoc rows are not affected.\n\n'+toAdd.map(r=>r.name+' ('+r.so+') — '+fmt(r.date)).join('\n')))return;
  const{error}=await sb.from('vinyl_schedule').insert(toAdd);
  if(error){alert('Error: '+error.message);return;}
  showToast('Restored '+toAdd.length+' row'+(toAdd.length>1?'s':'')+' — ad hoc rows untouched ✓');
  await loadAll();
}

async function vinylDateSync(idOrIdx,val,type){
  // Accept either a DB id (string UUID) or 'idx:N' for virtual rows
  let item;
  if(typeof idOrIdx==='string'&&idOrIdx.startsWith('idx:')){
    item=vinylSchedule[parseInt(idOrIdx.slice(4))];

  }

  const field=type==='ship'?'shipDate':'date';
  const dbField=type==='ship'?'ship_date':'date';
  item[field]=val;
  // If no DB row exists yet, insert one first
  if(!item.id){
    const{data}=await sb.from('vinyl_schedule').insert({
      project_id:item.project_id||null,
      name:item.name||'',so:item.so||'',client:item.client||'',
      vinyl_type:item.vinylType||'',pm:item.pm||'',
      form_factor:item.formFactor||'',status:item.status||'Scheduled',
      [dbField]:val||null,priority:item.priority||99,
      is_standalone:item.is_standalone||false,updated_at:new Date().toISOString()
    }).select().single();
    if(data){item.id=data.id;}
  } else {
    // Always update by row ID
    const{error}=await sb.from('vinyl_schedule').update({[dbField]:val||null,updated_at:new Date().toISOString()}).eq('id',item.id);
    if(error){console.warn('vinyl save error',error);showToast('Save error: '+error.message);return;}
  }
  // Sync back to the matching project milestone
  const proj=projects.find(p=>p.id===item.project_id);
  if(proj&&val){
    const msKey=type==='ship'?'shipping':'vinyl';
    const msLabel=type==='ship'?'Pack & ship':'Vinyl / branding';
    const existing=milestones.find(m=>m.project_id===proj.id&&m.key===msKey&&(item.so?m.so_tag===item.so:!m.so_tag));

    showToast('Date saved ✓');
    await loadAll();
  } else {
    showToast('Date saved ✓');
  }
}

async function syncPlanToProject(idx){

    {field:'planStart',label:'Planogram start',key:'other'},
    {field:'planEnd',label:'Planogram end',key:'other'},
    {field:'date',label:'Planogram sign-off',key:'other'},
  ];

  let synced=0;
  for(const s of toSync){
    const val=item[s.field];
    if(!val)continue;
    const existing=milestones.find(m=>m.project_id===proj.id&&(m.label||'').toLowerCase()===s.label.toLowerCase());

}

// ── DEPT CHECK-IN OVERVIEW ────────────────────────────────
const DEPT_KEYS={'Production':['production-start','production-end'],'Software / UI':['other'],'Inventory':['arrival'],'Procurement':['po-release'],'MO Release':['mo-release'],'Quality':['quality-start','quality-end','final-qc','vinyl'],'Shipping':['shipping','delivery'],'Deployment':['installation','uninstallation']};
const DEPT_LABEL_MATCH={'Software / UI':['UI start','UI end'],'Inventory':['Inventory pick'],'Procurement':['Parts ordering start','Parts arrival']};
const DEPT_COLORS={'Production':'#7c3aed','Software / UI':'#2563eb','Inventory':'#0891b2','Procurement':'#d97706','MO Release':'#6b6b6b','Quality':'#d97706','Shipping':'#059669','Deployment':'#db2777'};
const SL_COLORS={green:'#22c55e',yellow:'#eab308',red:'#ef4444'};

let checkinDeptFilter=''; // dept filter for check-in overview

function renderCheckinOverview(){
  const el=document.getElementById('tab-checkin');
  const base=monday(today());
  const weeks=[{label:'This week',start:base},{label:'Next week',start:addD(base,7)}];
  const apci=filterByPM(activeProjects('checkin'));
  const depts=Object.keys(DEPT_KEYS);

  function getDeptMs(dept,wStart){
    const wEnd=addD(wStart,6);
    const keys=DEPT_KEYS[dept]||[];
    const lbls=DEPT_LABEL_MATCH[dept]||[];
    const projectMs=milestones.filter(m=>{
      if(!apci.some(p=>p.id===m.project_id))return false;
      if(!m.date)return false;
      const d=new Date(m.date+'T00:00:00');
      if(d<wStart||d>wEnd)return false;
      if(keys.includes(m.key)){if(!lbls.length)return true;return lbls.some(l=>(m.label||'').toLowerCase().includes(l.toLowerCase()));}
      return false;
    });
    // Deduplicate SO-split: same label + same date = one row; same label + different date = individual rows
    const seen={};const deduped=[];
    [...projectMs].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>{
      const k=m.project_id+'|'+m.label+'|'+(m.date||'');if(!seen[k]){seen[k]=true;deduped.push(m);}
    });
    const adHocForDept=[];
    if(dept==='Shipping'){(adHocRows.shipping||[]).forEach(r=>{const d=r.shipDate||r.ship_date||'';if(!d)return;const dt=new Date(d+'T00:00:00');if(dt>=wStart&&dt<=wEnd)adHocForDept.push({id:'adhoc-ship-'+r.id,label:r.name,date:d,key:'shipping',project_id:null,_adhoc:true,_raw:r});});}
    if(dept==='Deployment'){(adHocRows.installation||[]).forEach(r=>{const d=r.installDate||r.install_date||'';if(!d)return;const dt=new Date(d+'T00:00:00');if(dt>=wStart&&dt<=wEnd)adHocForDept.push({id:'adhoc-inst-'+r.id,label:r.name,date:d,key:'installation',project_id:null,_adhoc:true,_raw:r});});}
    return[...deduped,...adHocForDept];
  }

  function ageLabel(iso){
    if(!iso)return'';
    const mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(mins<60)return mins+'m ago';
    const hrs=Math.round(mins/60);
    if(hrs<24)return hrs+'h ago';
    return Math.round(hrs/24)+'d ago';
  }

  function slDots(mId){
    const ci=checkinStatus[mId]||{};
    const sl=ci.stoplight||'';
    const chk=ci.checked||false;
    const dots='<div style="display:flex;align-items:center;gap:4px">'+
      ['green','yellow','red'].map(c=>'<div style="width:16px;height:16px;border-radius:50%;background:'+SL_COLORS[c]+';opacity:'+(sl===c?1:0.15)+'"></div>').join('')+
      (chk?'<span style="font-size:11px;color:var(--success);font-weight:700;margin-left:3px">✓</span>':'<span style="font-size:11px;color:var(--gray-300);margin-left:3px">○</span>')+
    '</div>';
    const who=(sl&&ci.stoplight_by)?'<div style="font-size:9px;color:var(--gray-400);margin-top:2px">'+ci.stoplight_by+' · '+ageLabel(ci.stoplight_at)+'</div>':'';
    return dots+who;

function computeExtensionPreview(req){
  const proj=projects.find(p=>p.id===req.project_id);
  const trigger=milestones.find(m=>m.id===req.milestone_id);
  if(!proj||!trigger)return null;
  // Scope to the SAME so_tag as the triggering milestone itself (not just whether the
  // request happens to have one recorded) — this protects against partially-migrated
  // projects where some milestones have a so_tag and others don't, which would otherwise
  // let a no-so_tag request silently match and shift every SO's chain at once.
  const triggerSoTag=trigger.so_tag||null;
  const chain=milestones.filter(m=>m.project_id===req.project_id&&(m.so_tag||null)===triggerSoTag&&m.date);
  const sorted=[...chain].sort((a,b)=>a.date.localeCompare(b.date));
  const triggerDate=trigger.date;
  const rows=sorted.map(m=>{
    const shifts=m.date>=triggerDate; // on/after the trigger date moves with it
    const oldDate=m.date;
    const newDate=shifts?isoD(addD(new Date(oldDate+'T00:00:00'),req.days)):oldDate;
    const alreadyDone=isMilestoneDone(m);
    const violation=shifts&&alreadyDone?'This milestone is already marked done — shifting it may not make sense.':null;
    return{milestoneId:m.id,label:m.label,oldDate,newDate,shifts,violation};
  });
  return{proj,trigger,rows};
}

async function resolveExtensionRequest(reqId,decision){
  const req=extensionRequests.find(r=>r.id===reqId);
  if(!req)return;
  let datesWereUpdated=false;
  if(decision==='approved'){
    const preview=computeExtensionPreview(req);
    if(preview){
      // Read back any edits the PM made in the preview inputs before committing
      const updates=preview.rows.filter(r=>r.shifts).map(r=>{
        const el=document.getElementById('extprev-'+r.milestoneId);
        const finalDate=el?el.value:r.newDate;
        return{milestoneId:r.milestoneId,oldDate:r.oldDate,newDate:finalDate,label:r.label};
      }).filter(u=>u.newDate&&u.newDate!==u.oldDate);
      for(const u of updates){
        await sb.from('milestones').update({date:u.newDate}).eq('id',u.milestoneId);
        const m=milestones.find(x=>x.id===u.milestoneId);if(m)m.date=u.newDate;
        await sb.from('milestone_history').insert({milestone_id:u.milestoneId,project_id:req.project_id,old_date:u.oldDate,new_date:u.newDate,changed_by:currentUserName,reason:'Extension request: '+req.reason+' (approved, +'+req.days+'d requested by '+(req.requested_by||req.dept)+')'});
      }
      datesWereUpdated=updates.length>0;
      await logActivity('approved extension',preview.proj.name,preview.proj.so_number,req.project_id,null,null);
    }
  }
  await sb.from('extension_requests').update({status:decision,resolved_by:currentUserName,resolved_at:new Date().toISOString()}).eq('id',reqId);
  req.status=decision;
  closeModal();
  showToast(decision==='approved'?(datesWereUpdated?'✓ Approved — dates updated':'✓ Approved'):'Request rejected');
  await loadAll();
}

async function snapshotCheckin(){
  if(!confirm('Save this week\'s stoplights to history?'))return;
  const wStart=isoD(monday(today()));
  const rows=Object.entries(checkinStatus).map(([msId,ci])=>{
    const m=milestones.find(x=>x.id===msId);
    if(!m||!ci.stoplight)return null;
    return{milestone_id:msId,project_id:m.project_id,dept:ci.dept||'',stoplight:ci.stoplight,checked:ci.checked||false,week_start:wStart};
  }).filter(Boolean);
  if(!rows.length){showToast('No stoplights set this week to snapshot');return;}
  // Delete existing snapshot for this week first
  await sb.from('checkin_history').delete().eq('week_start',wStart);
  await sb.from('checkin_history').insert(rows);
  showToast(`Saved ${rows.length} stoplights to history ✓`);
}

async function saveIntake(){
  const name=document.getElementById('i-name').value.trim();const so=document.getElementById('i-so').value.trim();const client=document.getElementById('i-client').value.trim();
  if(!name||!so||!client){alert('Please fill in project name, SO number, and client.');return;}
  // Keep each section's notes separate (so they can be shown individually on the Project Page)
  const isIMACTemplate=selectedTemplate==='imac';
  // For IMAC: combine from/to addresses and naming into the standard fields
  const addrFrom=document.getElementById('i-addr-from')?.value.trim()||'';
  const addrTo=document.getElementById('i-addr-to')?.value.trim()||'';
  const namingFrom=document.getElementById('i-naming-from')?.value.trim()||'';
  const namingTo=document.getElementById('i-naming-to')?.value.trim()||'';
  const imacAddress=isIMACTemplate&&(addrFrom||addrTo)?`From: ${addrFrom||'—'} → To: ${addrTo||'—'}`:document.getElementById('i-loc')?.value||'';
  const imacNaming=isIMACTemplate&&(namingFrom||namingTo)?`${namingFrom||'—'} → ${namingTo||'—'}`:document.getElementById('i-naming')?.value.trim()||null;
  const noteSections={
    readiness:document.getElementById('i-notes-readiness')?.value.trim()||'',
    production:document.getElementById('i-notes-production')?.value.trim()||'',
    ui:document.getElementById('i-notes-ui')?.value.trim()||'',
    quality:document.getElementById('i-notes-quality')?.value.trim()||'',
    shipping:document.getElementById('i-notes-shipping')?.value.trim()||'',
    install:document.getElementById('i-notes-install')?.value.trim()||'',
  };
  const generalNotes=document.getElementById('i-notes')?.value.trim()||'';
  const pm=document.getElementById('i-pm').value.trim();
  const sdm=document.getElementById('i-sdm')?.value.trim()||'';
  const solutions=document.getElementById('i-solutions')?.value.trim()||'';
  const sales=document.getElementById('i-sales')?.value.trim()||'';
  const accountManager=document.getElementById('i-am')?.value.trim()||'';
  const channelPartner=document.getElementById('i-cp')?.value.trim()||'';
  const vinylType=document.getElementById('i-vinyl-type').value;
  const formFactor='';
  const productType=[...document.getElementById('i-type').selectedOptions].map(o=>o.value).join(', ');
  const{data:proj,error}=await sb.from('projects').insert({name,so_number:so,client,channel_partner:channelPartner,product_type:productType,quantity:parseInt(document.getElementById('i-qty').value)||null,location:imacAddress||document.getElementById('i-loc')?.value||'',notes:generalNotes,naming_convention:imacNaming||document.getElementById('i-naming')?.value.trim()||null,status:'active',changed_by:currentUserName,pm,sdm,solutions,sales,account_manager:accountManager,vinyl_type:vinylType,form_factor:formFactor}).select().single();
  if(error){alert('Error: '+error.message);return;}
  // Save each section's notes individually into project_sections so they can be shown
  // separately on the Project Page (instead of being merged into one untraceable blob)
  const sectionKeyMap={readiness:'notes_readiness',production:'notes_production',ui:'notes_ui',quality:'notes_quality',shipping:'notes_shipping',install:'notes_install'};
  const sectionInserts=Object.entries(noteSections).filter(([k,v])=>v).map(([k,v])=>({project_id:proj.id,section_key:sectionKeyMap[k],content:v,updated_by:currentUserName}));
  if(sectionInserts.length)await sb.from('project_sections').insert(sectionInserts);
  const msFields=[
    {id:'i-po',key:'po-release',label:'PO Release'},
    {id:'i-mo',key:'mo-release',label:'MO Release'},
    {id:'i-parts-start',key:'arrival',label:'Parts ordering start'},
    {id:'i-parts-end',key:'arrival',label:'Parts arrival'},
    {id:'i-inv',key:'arrival',label:'Inventory pick'},
    {id:'i-ps',key:'production-start',label:'Production start'},
    {id:'i-pe',key:'production-end',label:'Production end'},
    {id:'i-plan',key:'other',label:'Planogram sign-off'},
    {id:'i-plan-start',key:'other',label:'Planogram start'},
    {id:'i-plan-end',key:'other',label:'Planogram end'},
    {id:'i-ui-s',key:'other',label:'UI start'},
    {id:'i-ui-e',key:'other',label:'UI end'},
    {id:'i-qs',key:'quality-start',label:'Quality start'},
    {id:'i-qe',key:'quality-end',label:'Quality end'},
    {id:'i-fqa',key:'final-qc',label:'Final QC'},
    {id:'i-vinyl',key:'vinyl',label:'Vinyl / branding'},
    {id:'i-uat',key:'uat',label:'UAT'},
    {id:'i-ship',key:'shipping',label:isIMACTemplate?'Pick-up date':'Pack & ship'},
    {id:'i-del',key:'delivery',label:'Delivery'},
    {id:'i-train',key:isIMACTemplate?'uninstallation':'training',label:isIMACTemplate?'Uninstallation date':'Training'},
    {id:'i-inst',key:'installation',label:'Installation'},
    {id:'i-care',key:'other',label:'Customer care start'},
  ];
  // FIX: ALWAYS generate the complete milestone skeleton — dated where provided,
  // undated (null) otherwise — so every milestone exists in the tracker from day one
  // for Standard, Fast track, AND no-template/blank projects alike.
  // IMAC and Software-only templates keep their intentionally trimmed sets.
  const TEMPLATE_FIELD_SETS={
    'imac':['i-po','i-train','i-ship','i-del','i-inst'],
    'software-only':['i-po','i-ui-s','i-ui-e','i-qs','i-qe','i-fqa','i-uat','i-del','i-inst']
  };
  const _allowedIds=TEMPLATE_FIELD_SETS[selectedTemplate]||null;
  const ins=msFields
    .filter(f=>!_allowedIds||_allowedIds.includes(f.id))
    .map(f=>({project_id:proj.id,key:f.key,label:f.label,date:document.getElementById(f.id)?.value||null,changed_by:currentUserName}));

  // Auto-split milestones by SO if multiple SOs entered
  const soList=so.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);

  // The database creates starter PO / MO / Parts milestones when a project is inserted.
  // Remove those trigger-created rows before saving the complete intake timeline;
  // otherwise the duplicate keys cause the entire milestone batch to fail silently.
  if(ins.length){
    const{error:clearMsError}=await sb.from('milestones').delete().eq('project_id',proj.id);
    if(clearMsError){
      alert('Project created, but the starter milestones could not be replaced: '+clearMsError.message);
      return;
    }
  }

  if(soList.length>1&&ins.length){
    // Create one complete set of milestones per SO, each tagged with so_tag
    const splitIns=[];
    for(const soTag of soList){
      for(const m of ins){
        splitIns.push({...m,so_tag:soTag});
      }
    }
    const{error:msError}=await sb.from('milestones').insert(splitIns);
    if(msError){
      alert('Project created, but milestones could not be saved: '+msError.message);
      return;
    }
    showToast('"'+name+'" added with milestones split across '+soList.length+' SOs ✓');
  } else if(ins.length){
    const{error:msError}=await sb.from('milestones').insert(ins);
    if(msError){
      alert('Project created, but milestones could not be saved: '+msError.message);
      return;
    }
  }

  await logActivity('created project',name,so,proj.id,null,client);
  // Auto-create vinyl_schedule row — one per SO if multiple
  const vinylDate=document.getElementById('i-vinyl')?.value;
  if(vinylDate||vinylType){
    const vinylRows=soList.length>1
      ?soList.map((soTag,i)=>({project_id:proj.id,name:name+' ('+soTag+')',so:soTag,client,date:vinylDate||null,vinyl_type:vinylType||null,pm:pm||null,status:'Scheduled',priority:i,is_standalone:false}))
      :[{project_id:proj.id,name,so,client,date:vinylDate||null,vinyl_type:vinylType||null,pm:pm||null,status:'Scheduled',priority:0,is_standalone:false}];
    await sb.from('vinyl_schedule').insert(vinylRows);
  }
  // Auto-create planogram_schedule row if planogram dates were entered
  const planStartDate=document.getElementById('i-plan-start')?.value;
  const planEndDate=document.getElementById('i-plan-end')?.value;
  const planSignDate=document.getElementById('i-plan')?.value;
  if(planStartDate||planEndDate||planSignDate){
    await sb.from('planogram_schedule').insert({
      project_id:proj.id,name,so,client,
      date:planSignDate||null,plan_start:planStartDate||null,plan_end:planEndDate||null,
      status:'Scheduled',priority:0,is_standalone:false
    });
  }
  selectedProjId=proj.id;
  const toastMsg=soList.length>1?'"'+name+'" added · milestones auto-split across '+soList.length+' SOs ✓':'"'+name+'" added ✓';
  showToast(toastMsg);
  await loadAll();setTab('glance');
}

async function saveEditProj(id){

    name:document.getElementById('ep-name').value.trim(),

      if(m.date&&!el.value)continue;
      await sb.from('milestones').update({date:el.value,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',m.id);
      await logActivity('updated date',m.label,m.label,id,m.date,el.value);
    }
  }
  await logActivity('edited project',proj?.name||'',proj?.so_number||'',id,null,null);
  // Sync PM change to vinyl_schedule rows linked to this project
  const newPm=document.getElementById('ep-pm')?.value;
  if(newPm)await sb.from('vinyl_schedule').update({pm:newPm}).eq('project_id',id).eq('is_standalone',false);

  // AUTO-ADD MILESTONES FOR NEWLY ADDED SOs
  // If this project is already SO-split and the SO field gained new SOs, clone milestones for them
  const newSoNumber=document.getElementById('ep-so').value.trim();
  const newSoList=newSoNumber.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const projMsForSoCheck=milestones.filter(m=>m.project_id===id);
  const existingTags=[...new Set(projMsForSoCheck.filter(m=>m.so_tag).map(m=>m.so_tag))];
  // Guard: only treat this project as "fully SO-split" if EVERY milestone is tagged.
  // Previously this only checked existingTags.length>0 (i.e. any single milestone with
  // a so_tag), so a project with 18 untagged milestones + 1 stray tagged row (left over
  // from an old partial split, a bug, or a manual fix) would be wrongly treated as split,
  // and saving the project would clone a whole new tagged milestone set on top of the
  // untagged ones — creating exactly-this-kind-of duplicate ("Pack & ship" showing twice
  // with different dates/so_tags) without ever touching or removing the originals.
  const untaggedCount=projMsForSoCheck.filter(m=>!m.so_tag).length;
  const isFullySplit=existingTags.length>0&&untaggedCount===0;
  const brandNewSOs=newSoList.filter(so=>!existingTags.includes(so));
  if(isFullySplit&&brandNewSOs.length>0){
    // This project is already SO-split and has new SOs added — auto-clone milestones
    const templateSO=existingTags[0];
    const templateMs=projMsForSoCheck.filter(m=>m.so_tag===templateSO);
    if(templateMs.length){
      const newRows=[];
      for(const so of brandNewSOs){
        for(const m of templateMs){
          newRows.push({project_id:id,key:m.key,label:m.label,date:null,so_tag:so,changed_by:currentUserName});
        }
      }
      await sb.from('milestones').insert(newRows);
      showToast('Saved ✓ · Auto-added '+templateMs.length+' milestones for new SO'+(brandNewSOs.length>1?'s':'')+' ('+brandNewSOs.join(', ')+')');
      closeModal();await loadAll();
      return;
    }
  } else if(existingTags.length>0&&untaggedCount>0&&brandNewSOs.length>0){
    // Mixed state detected (some tagged, some not) — this is the exact condition that used
    // to silently create duplicates. Surface it instead of guessing.
    console.warn('Project '+id+' has a mix of tagged and untagged milestones — skipping auto-clone to avoid creating duplicates.',{existingTags,untaggedCount});
  }

  await syncProjectFieldsToSingleSO(id,{
    address:document.getElementById('ep-address')?.value.trim()||'',
    naming_convention:document.getElementById('ep-naming')?.value.trim()||'',
    form_factor:document.getElementById('ep-form-factor')?.value.trim()||'',
    odoo_url:document.getElementById('ep-odoo')?.value.trim()||'',
    ui_task_url:document.getElementById('ep-jira')?.value.trim()||'',
    qa_task_url:document.getElementById('ep-qa')?.value.trim()||'',
    install_ticket_url:document.getElementById('ep-install-ticket')?.value.trim()||''
  });
  closeModal();showToast('Saved ✓');await loadAll();
}

async function splitMilestonesBySO(projId){
  const proj=projects.find(p=>p.id===projId);
  if(!proj)return;
  const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  if(soList.length<2){showToast('Project needs multiple SOs to split');return;}
  if(!confirm('Split milestones into '+soList.length+' groups ('+soList.join(', ')+')? This will create a copy of all milestones for each SO.'))return;
  const existingMs=milestones.filter(m=>m.project_id===projId);
  const newMs=[];
  for(const so of soList){
    for(const m of existingMs){
      newMs.push({project_id:projId,key:m.key,label:m.label,date:m.date,
        original_date:m.original_date||m.date,so_tag:so,changed_by:currentUserName});
    }
  }
  await sb.from('milestones').delete().eq('project_id',projId);
  if(newMs.length){
    const{error}=await sb.from('milestones').insert(newMs);
    if(error){alert('Error splitting: '+error.message);return;}
  }
  showToast('Split into '+soList.length+' SO groups ✓');
  await loadAll();
}
async function pushSODatesToAll(projId,fromSO){
  const proj=projects.find(p=>p.id===projId);
  if(!proj)return;
  const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
  const otherSOs=soList.filter(s=>s!==fromSO);
  if(!otherSOs.length)return;
  if(!confirm('Push all dates from SO '+fromSO+' to '+otherSOs.join(', ')+'?\n\nThis overwrites their dates.'))return;
  const sourceMs=milestones.filter(m=>m.project_id===projId&&m.so_tag===fromSO);
  let updated=0;
  for(const so of otherSOs){
    const targetMs=milestones.filter(m=>m.project_id===projId&&m.so_tag===so);
    for(const src of sourceMs){
      if(!src.date)continue;
      // Match by BOTH key and label to handle duplicate keys (e.g. multiple 'arrival' milestones)
      const tgt=targetMs.find(m=>m.key===src.key&&m.label===src.label)
               ||targetMs.find(m=>m.label===src.label)
               ||targetMs.find(m=>m.key===src.key);
      if(tgt){
        const{error}=await sb.from('milestones').update({date:src.date,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',tgt.id);
        if(!error){tgt.date=src.date;updated++;}
      }
    }
  }
  showToast('Pushed '+updated+' dates to '+otherSOs.length+' other SOs ✓');
  await loadAll();
}

async function saveEditMs(id,oldLabel,oldDate){
  const newDate=document.getElementById('em-dt').value;
  const newLabel=document.getElementById('em-lbl').value.trim();
  // GUARD: a milestone that HAD a date must never be saved blank — that would
  // drop it from every dated view (schedules, week, dept tables). If the picker
  // came back empty but there was a date before, keep the old one unless the
  // user explicitly confirms clearing it.
  if(oldDate&&!newDate){
    if(!confirm('Clear the date for "'+(newLabel||oldLabel)+'"?\n\nIt will disappear from all schedules until a new date is set. Cancel to keep '+fmt(oldDate)+'.')){
      return;
    }
  }
  const reason=document.getElementById('em-reason')?.value.trim()||'';
  const ms=milestones.find(m=>m.id===id);
  const proj=ms?projects.find(p=>p.id===ms.project_id):null;

  const update={label:newLabel,date:newDate,changed_by:currentUserName,changed_at:new Date().toISOString()};
  if(!ms?.original_date&&newDate)update.original_date=newDate;

  const{error}=await sb.from('milestones').update(update).eq('id',id);
  if(error){alert('Error: '+error.message);return;}

  // Update local state
  if(ms){ms.date=newDate;ms.label=newLabel;}

  // Record history if date changed
  if(oldDate&&newDate&&oldDate!==newDate){
    await sb.from('milestone_history').insert({milestone_id:id,project_id:proj?.id||null,old_date:oldDate,new_date:newDate,changed_by:currentUserName,reason:reason||null});
    await logActivity('updated date',newLabel,newLabel,proj?.id||null,oldDate,newDate);
    // Keep vinyl schedule in sync when vinyl or shipping milestone date changes
    if(ms)await syncMsDateToVinyl(ms,newDate);
  }

  // If this milestone has a so_tag and date changed, offer to push to all SOs
  if(ms?.so_tag&&newDate&&oldDate!==newDate&&proj){
    const soList=(proj.so_number||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
    const otherSOs=soList.filter(s=>s!==ms.so_tag);
    if(otherSOs.length){
      closeModal();
      // Show push prompt
      document.getElementById('modal-root').innerHTML=`
      <div class="modal-backdrop">
        <div class="modal" style="width:420px" onclick="event.stopPropagation()">
          <div class="modal-head"><span class="modal-title">📅 Push to other SOs?</span><button class="modal-close" onclick="closeModal();loadAll()">×</button></div>
          <div style="padding:16px;font-size:13px;color:var(--gray-600)">
            <strong>${newLabel}</strong> changed to <strong>${fmt(newDate)}</strong> on <strong>SO ${ms.so_tag}</strong>.<br><br>
            Push this date to the other ${otherSOs.length} SO${otherSOs.length>1?'s':''}: <strong>${otherSOs.join(', ')}</strong>?
          </div>
          <div class="modal-actions">
            <button class="btn" onclick="closeModal();loadAll()">Just this SO</button>
            <button class="btn btn-primary" onclick="pushSODateToOthers('${proj.id}','${ms.so_tag}','${ms.key}','${newDate}','${newLabel}')">Push to all SOs →</button>
          </div>
        </div>
      </div>`;
      return;
    }
  }

  closeModal();
  showUndoToast(`${newLabel} updated to ${newDate?fmt(newDate):'no date'}`,async()=>{
    await sb.from('milestones').update({label:oldLabel,date:oldDate||null,changed_by:currentUserName,changed_at:new Date().toISOString()}).eq('id',id);
    if(oldDate!==newDate){
      await sb.from('milestone_history').insert({milestone_id:id,project_id:proj?.id||null,old_date:newDate||null,new_date:oldDate||null,changed_by:currentUserName,reason:'Undo of manual edit'});
    }
    await loadAll();
    showToast('Undone ✓');
  });
  await loadAll();
}

    const tgt=milestones.find(m=>m.project_id===projId&&m.so_tag===so&&m.key===msKey&&m.label===msLabel)
             ||milestones.find(m=>m.project_id===projId&&m.so_tag===so&&m.label===msLabel)

    shipRows.push({_d:sd||'zzz',row:[p.name,p.so_number||'',p.client||'',p.pm||'',sd||'',dd||'',p.install_ticket_url||'',st.label]});
  });
  (adHocRows.shipping||[]).forEach(r=>{
    const sd=r.shipDate||r.ship_date||'';
    shipRows.push({_d:sd||'zzz',row:[r.name+' [Ad hoc]',r.so||'',r.client||'',r.pm||'',sd,r.deliveryDate||r.delivery_date||'',r.install_ticket_url||'',r.status||'']});
  });
  shipRows.sort((a,b)=>a._d.localeCompare(b._d)).forEach(x=>r8.push(x.row));
  const ws8=XLSX.utils.aoa_to_sheet(r8);
  ws8['!cols']=[{wch:32},{wch:18},{wch:22},{wch:12},{wch:14},{wch:14},{wch:40},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws8,'Shipping Schedule');
  XLSX.writeFile(wb,'Signifi_Ops'+filterSuffix+'_'+new Date().toISOString().split('T')[0]+'.xlsx');showToast('Excel downloaded ✓');
}

let ppProjId=null;
let ppData={team:[],actions:[],risks:[],decisions:[],sections:{},links:[],pmtasks:[]};
let ppSaveTimer=null;

async function loadProjPage(pid){

    sb.from('risks').select('*').eq('project_id',pid).order('created_at'),
    sb.from('decisions').select('*').eq('project_id',pid).order('decision_date',{ascending:false}),
    sb.from('project_sections').select('*').eq('project_id',pid),
    sb.from('project_links').select('*').eq('project_id',pid).order('sort_order'),
    sb.from('pm_tasks').select('*').eq('project_id',pid).order('sort_order'),

function renderProjPage(){
  const el=document.getElementById('tab-projpage');
  if(!projects.length){el.innerHTML='<div class="empty-state">No projects yet.</div>';return;}
  if(!ppProjId)ppProjId=selectedProjId||projects[0].id;
  const sortedProjs=[...projects].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const filteredProjList=sortedProjs.filter(p=>((!pmFilter||p.pm===pmFilter)&&(!salesFilter||p.sales===salesFilter)));
  if(pmFilter&&ppProjId&&!filteredProjList.find(p=>p.id===ppProjId)&&filteredProjList.length){ppProjId=filteredProjList[0].id;selectedProjId=ppProjId;}
  // Build a name->id map for the search
  const projNameMap={};
  sortedProjs.forEach(p=>{projNameMap[p.name+(p.so_number?' — '+p.so_number:'')]=p.id;});
  // Datalist uses display text as value so browser shows names not UUIDs
  const projOpts=filteredProjList.map(p=>`<option value="${p.name+(p.so_number?' — '+p.so_number:'')}">`).join('');
  // Build dropdown: group children under their master
  const masterProjs=filteredProjList.filter(p=>!p.parent_project_id);
  const childProjs=filteredProjList.filter(p=>p.parent_project_id);
  const selectOpts=masterProjs.map(p=>{
    const kids=childProjs.filter(c=>c.parent_project_id===p.id);
    const masterOpt=`<option value="${p.id}"${p.id===ppProjId?' selected':''}>${isMaster(p)?'🏛 ':''}${p.name+(p.so_number?' — '+p.so_number:'')}</option>`;
    const kidOpts=kids.map(c=>`<option value="${c.id}"${c.id===ppProjId?' selected':''}>　⬡ ${c.name+(c.so_number?' — '+c.so_number:'')}</option>`).join('');
    return masterOpt+kidOpts;
  }).join('')+childProjs.filter(c=>!masterProjs.find(m=>m.id===c.parent_project_id)).map(c=>`<option value="${c.id}"${c.id===ppProjId?' selected':''}>⬡ ${c.name+(c.so_number?' — '+c.so_number:'')}</option>`).join('');
  el.innerHTML=`
    <div class="proj-sel-bar">
      <label>Project</label>
      <div style="flex:1;display:flex;gap:6px">
        <input id="pp-proj-search" list="pp-proj-list" placeholder="Type to search..." style="font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);flex:1;min-width:0" onchange="onProjPageSearch(this.value)">
        <datalist id="pp-proj-list">${projOpts}</datalist>
        <select style="font-family:var(--font);font-size:13px;padding:6px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);max-width:260px" onchange="switchProjPage(this.value)">
          ${selectOpts}
        </select>
      </div>
      ${pmDropdown('renderProjPage')}${salesDropdown('renderProjPage')}
      <span id="pp-saved" class="pp-saved">Saved ✓</span>
    </div>
    <div id="pp-body"><div style="text-align:center;padding:3rem;color:var(--gray-500)"><div style="font-size:20px;margin-bottom:8px">⏳</div>Loading project page...</div></div>`;
  // Always reload from Supabase when visiting this tab,
  // UNLESS we're being called from loadAll() which already has fresh data —
  // in that case renderProjPageBody() directly to avoid a double-render race.
  if(window._skipProjPageReload){
    window._skipProjPageReload=false;
    renderProjPageBody();
    const proj=projects.find(p=>p.id===ppProjId);
    const inp=document.getElementById('pp-proj-search');
    if(inp&&proj)inp.value=proj.name+(proj.so_number?' — '+proj.so_number:'');
  } else {
    loadProjPage(ppProjId).then(()=>{
      renderProjPageBody();
      const proj=projects.find(p=>p.id===ppProjId);
      const inp=document.getElementById('pp-proj-search');
      if(inp&&proj)inp.value=proj.name+(proj.so_number?' — '+proj.so_number:'');
    });
