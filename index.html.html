<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi Solutions — Ops Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--red-mid:#f5c2cb;--black:#0f0f0f;--gray-900:#1a1a1a;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#ffffff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--purple:#7c3aed;--purple-bg:#ede9fe;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:6px;--radius-lg:10px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;}
.page-header{background:var(--black);position:sticky;top:0;z-index:100;}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 2rem;height:54px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:26px;height:26px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:13px;height:13px;fill:white;}
.logo-text{font-size:13px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.nav-tabs{display:flex;gap:2px;}
.ntab{font-size:12px;padding:6px 13px;border-radius:var(--radius);border:none;background:transparent;color:#888;cursor:pointer;font-family:var(--font);transition:all 0.15s;white-space:nowrap;}
.ntab:hover{background:#1a1a1a;color:white;}
.ntab.active{background:#1a1a1a;color:white;font-weight:500;}
.header-right{display:flex;align-items:center;gap:8px;}
.hdate{font-family:var(--mono);font-size:11px;color:#555;}
.page-body{max-width:1200px;margin:0 auto;padding:2rem 2rem 4rem;}
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem;}
.metric{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:14px 16px;}
.metric-label{font-size:11px;color:var(--gray-500);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em;}
.metric-val{font-size:24px;font-weight:600;color:var(--black);}
.metric-sub{font-size:11px;color:var(--gray-500);margin-top:2px;}
.metric-val.red{color:var(--red);}
.section{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.section-title{font-size:14px;font-weight:600;color:var(--black);display:flex;align-items:center;gap:8px;}
.section-meta{font-size:12px;color:var(--gray-500);}
.proj-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.ppill{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);transition:all 0.15s;}
.ppill:hover{border-color:var(--black);}
.ppill.active{background:var(--black);color:white;border-color:var(--black);}
.milestone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:14px 18px;}
.ms-item{border-radius:var(--radius);padding:11px 13px;border-left:3px solid var(--gray-300);background:var(--gray-50);cursor:pointer;transition:box-shadow 0.15s;}
.ms-item:hover{box-shadow:0 0 0 2px var(--gray-300);}
.ms-item.done{border-left-color:var(--success);background:#f0faf5;}
.ms-item.today{border-left-color:#059669;background:#ecfdf5;}
.ms-item.upcoming{border-left-color:#2563eb;background:#eff6ff;}
.ms-item.overdue{border-left-color:var(--red);background:var(--red-light);}
.ms-item.future{border-left-color:var(--gray-300);}
.ms-type{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;}
.ms-label{font-size:12px;font-weight:600;color:var(--black);line-height:1.3;}
.ms-date{font-size:12px;color:var(--gray-700);margin-top:2px;}
.ms-days{font-size:11px;margin-top:4px;font-weight:500;}
.ms-days.done{color:var(--success);}
.ms-days.today{color:#059669;}
.ms-days.upcoming{color:#2563eb;}
.ms-days.overdue{color:var(--red);}
.ms-days.future{color:var(--gray-500);}
.ms-edit-hint{font-size:10px;color:var(--gray-300);margin-top:3px;}
.week-nav-row{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.wnav{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:6px 11px;cursor:pointer;color:var(--gray-700);font-size:12px;font-family:var(--font);}
.wnav:hover{background:var(--gray-100);}
.wlabel{font-size:13px;color:var(--gray-700);min-width:160px;text-align:center;font-weight:500;}
.btn-add{font-size:12px;padding:6px 14px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red);color:white;cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-add:hover{background:#a80e26;}
.btn-export{font-size:12px;padding:6px 14px;border-radius:var(--radius);border:1px solid var(--success);background:var(--success-bg);color:var(--success);cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-export:hover{background:#d4edda;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1rem;}
.day-col{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);min-height:160px;overflow:hidden;}
.day-col.today-col{border:2px solid var(--black);}
.day-hdr{padding:9px 12px 7px;border-bottom:1px solid var(--gray-100);}
.day-name{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;}
.day-num{font-size:18px;font-weight:600;color:var(--black);line-height:1.2;}
.today-pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle;}
.day-events{padding:7px;}
.ev{border-radius:var(--radius);padding:5px 8px;margin-bottom:4px;}
.ev-ship{background:#d1fae5;border-left:3px solid #059669;}
.ev-arr{background:#dbeafe;border-left:3px solid #2563eb;}
.ev-prod{background:#ede9fe;border-left:3px solid #7c3aed;}
.ev-qa{background:#fef3c7;border-left:3px solid #d97706;}
.ev-uat{background:#dcfce7;border-left:3px solid #16a34a;}
.ev-inst{background:#fce7f3;border-left:3px solid #db2777;}
.ev-other{background:var(--gray-50);border-left:3px solid var(--gray-300);}
.ev-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-500);}
.ev-name{font-size:11px;font-weight:600;color:var(--black);line-height:1.3;}
.ev-proj{font-size:10px;color:var(--gray-500);}
.empty-day{font-size:11px;color:var(--gray-300);text-align:center;padding:1.5rem 0;}
.overdue-bar{background:var(--red-light);border:1px solid var(--red-mid);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;display:flex;gap:8px;}
.overdue-title{font-size:12px;font-weight:600;color:var(--red);margin-bottom:3px;}
.overdue-item{font-size:11px;color:var(--red);}
.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:1rem;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--gray-500);}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.pulse-form-wrap{padding:18px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{font-family:var(--font);font-size:13px;padding:8px 11px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.06);}
.field textarea{resize:vertical;min-height:70px;}
.rag-row{display:flex;gap:6px;}
.rag-opt{flex:1;padding:8px;border:1px solid var(--gray-300);border-radius:var(--radius);text-align:center;cursor:pointer;background:var(--white);font-family:var(--font);transition:all 0.15s;}
.rag-opt:hover{border-color:var(--gray-700);}
.rag-opt.sel-g{background:var(--success-bg);border-color:var(--success);}
.rag-opt.sel-a{background:var(--warning-bg);border-color:#c97d00;}
.rag-opt.sel-r{background:var(--red-light);border-color:var(--red);}
.rag-label{font-size:12px;font-weight:600;margin-top:2px;}
.rag-opt.sel-g .rag-label{color:var(--success);}
.rag-opt.sel-a .rag-label{color:var(--warning);}
.rag-opt.sel-r .rag-label{color:var(--red);}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 18px;}
.btn{font-family:var(--font);font-size:13px;font-weight:500;padding:8px 18px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--gray-700);cursor:pointer;}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--black);color:white;border-color:var(--black);}
.btn-primary:hover{background:var(--gray-900);}
.btn-red{background:var(--red);color:white;border-color:var(--red);}
.btn-red:hover{background:#a80e26;}
.pulse-results-table{width:100%;border-collapse:collapse;}
.pulse-results-table th{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:8px 18px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;}
.pulse-results-table td{font-size:13px;padding:10px 18px;border-bottom:1px solid var(--gray-50);color:var(--black);}
.pulse-results-table tr:last-child td{border-bottom:none;}
.pulse-results-table tr:hover td{background:var(--gray-50);}
.rag-pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;}
.rag-pill-g{background:var(--success-bg);color:var(--success);}
.rag-pill-a{background:var(--warning-bg);color:var(--warning);}
.rag-pill-r{background:var(--red-light);color:var(--red);}
.blocker-txt{font-size:11px;color:var(--red);margin-top:2px;}
.intake-body{padding:18px;}
.intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.intake-section-lbl{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px solid var(--gray-100);}
.intake-section-lbl:first-child{border-top:none;margin-top:0;padding-top:0;}
.ms-intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1;}
.ms-block{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius);padding:12px;}
.ms-block-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.ms-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ms-block .field{margin-bottom:6px;}
.ms-block .field:last-child{margin-bottom:0;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--black);color:white;padding:12px 20px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;z-index:999;display:none;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius-lg);width:440px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--gray-100);}
.modal-title{font-size:15px;font-weight:600;color:var(--black);}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-500);line-height:1;}
.modal-body{padding:18px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--gray-100);}
.conf-row{display:flex;align-items:center;gap:10px;}
.conf-row input[type=range]{flex:1;}
.conf-val{font-size:13px;font-weight:600;min-width:36px;color:var(--black);font-family:var(--mono);}
.empty-state{text-align:center;padding:3rem;color:var(--gray-500);font-size:13px;}
/* PRODUCTION VIEW */
.prod-gantt{overflow-x:auto;padding:0 18px 18px;}
.gantt-table{border-collapse:collapse;width:100%;min-width:700px;}
.gantt-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:6px 8px;text-align:center;border-bottom:1px solid var(--gray-100);font-weight:600;white-space:nowrap;min-width:36px;}
.gantt-table th.proj-col{text-align:left;min-width:180px;}
.gantt-table td{padding:5px 4px;border-bottom:1px solid var(--gray-50);vertical-align:middle;}
.gantt-table td.proj-name{font-size:13px;font-weight:500;color:var(--black);padding:5px 8px;white-space:nowrap;}
.gantt-table td.proj-so{font-size:11px;color:var(--gray-500);font-family:var(--mono);padding:0 8px 5px;white-space:nowrap;}
.gantt-bar{height:22px;border-radius:3px;position:relative;}
.gantt-cell{position:relative;text-align:center;}
.gantt-fill{height:22px;border-radius:3px;background:var(--purple);opacity:0.85;}
.gantt-fill.qa{background:#d97706;}
.gantt-fill.ship{background:#059669;}
.gantt-fill.install{background:#db2777;}
.gantt-fill.today-line{background:var(--red);width:2px;height:100%;position:absolute;top:0;}
.gantt-label{font-size:10px;color:var(--gray-500);text-align:center;padding:2px 4px;}
.gantt-today-col{background:#fff5f5;}
.status-chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;}
.chip-active{background:var(--success-bg);color:var(--success);}
.chip-pending{background:var(--gray-100);color:var(--gray-700);}
.chip-done{background:#dcfce7;color:#166534;}
.chip-atrisk{background:var(--warning-bg);color:var(--warning);}
/* SCHEDULE TABLE */
.sched-table{width:100%;border-collapse:collapse;}
.sched-table th{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);}
.sched-table td{font-size:13px;padding:10px 14px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.sched-table tr:hover td{background:var(--gray-50);}
.sched-table tr.dragging{opacity:0.4;}
.sched-table tr.drag-over td{border-top:2px solid var(--red);}
.drag-handle{cursor:grab;color:var(--gray-300);font-size:16px;padding:0 6px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.priority-num{font-family:var(--mono);font-size:12px;color:var(--gray-500);min-width:24px;display:inline-block;text-align:center;}
.sched-status{display:inline-flex;align-items:center;gap:6px;}
.status-select{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer;}
.actions-row{display:flex;align-items:center;gap:8px;padding:14px 18px;border-top:1px solid var(--gray-100);}
@media(max-width:700px){.metrics-row{grid-template-columns:1fr 1fr;}.week-grid{grid-template-columns:1fr;}.intake-grid,.form-grid,.ms-intake-grid{grid-template-columns:1fr;}.header-inner{padding:0 1rem;}.page-body{padding:1rem 1rem 3rem;}.nav-tabs{display:none;}}
</style>
</head>
<body>
<header class="page-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></div>
      <span class="logo-text">Signifi Ops Hub</span>
    </div>
    <div class="nav-tabs">
      <button class="ntab active" onclick="setTab('overview',this)">Overview</button>
      <button class="ntab" onclick="setTab('week',this)">This week</button>
      <button class="ntab" onclick="setTab('production',this)">Production</button>

      <button class="ntab" onclick="setTab('planogram',this)">Planogram</button>

      <button class="ntab" onclick="setTab('intake',this)">New project</button>

      <span class="hdate" id="hdate"></span>
    </div>
  </div>
</header>
<div class="page-body">
  <div id="tab-overview"></div>
  <div id="tab-week" style="display:none"></div>
  <div id="tab-production" style="display:none"></div>
  <div id="tab-vinyl" style="display:none"></div>
  <div id="tab-planogram" style="display:none"></div>
  <div id="tab-pulse" style="display:none"></div>
  <div id="tab-intake" style="display:none"></div>
</div>

<div id="modal-root"></div>
<script>
const SUPABASE_URL='https://oykgpkolliqjeznblayv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2dwa29sbGlxamV6bmJsYXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTI3ODgsImV4cCI6MjA5NTYyODc4OH0.kkOBhxyaqLG7PLPNI0SwPNwQSWmbpFjDoP2VQp33_X4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TYPE_CLS={shipping:'ev-ship',arrival:'ev-arr','production-start':'ev-prod','production-end':'ev-prod','quality-start':'ev-qa','quality-end':'ev-qa',uat:'ev-uat',installation:'ev-inst',delivery:'ev-inst',vinyl:'ev-qa',training:'ev-other','po-release':'ev-other',other:'ev-other'};
const TYPE_LBL={shipping:'Shipping',arrival:'Arrival','production-start':'Production start','production-end':'Production end','quality-start':'Quality start','quality-end':'Quality end',uat:'UAT',installation:'Installation',delivery:'Delivery',vinyl:'Vinyl / branding',training:'Training','po-release':'PO / MO release',other:'Other'};
const DEPTS=['Production','Quality / QA','Development / UI','Logistics','Purchasing / Supply Chain'];
let projects=[],milestones=[],pulses=[],vinylSchedule=[],planogramSchedule=[];
let selectedProjId=null,weekStart=monday(new Date()),selRag='',currentTab='overview';
let dragSrc=null,dragType='';

function today(){let t=new Date();t.setHours(0,0,0,0);return t;}
function monday(dt){let r=new Date(dt);let day=r.getDay();let diff=day===0?-6:1-day;r.setDate(r.getDate()+diff);r.setHours(0,0,0,0);return r;}
function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function isoD(dt){return dt.toISOString().split('T')[0];}
function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtFull(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function daysDiff(s){if(!s)return 999;let dt=new Date(s+'T00:00:00');return Math.round((dt-today())/86400000);}
function msStatus(s){let d=daysDiff(s);if(d<0)return{cls:'done',dcls:'done',txt:Math.abs(d)+'d ago'};if(d===0)return{cls:'today',dcls:'today',txt:'Today'};if(d<=7)return{cls:'upcoming',dcls:'upcoming',txt:'In '+d+'d'};return{cls:'future',dcls:'future',txt:fmtFull(s)};}
function ragPill(r){if(r==='G')return'<span class="rag-pill rag-pill-g">Green</span>';if(r==='A')return'<span class="rag-pill rag-pill-a">Amber</span>';return'<span class="rag-pill rag-pill-r">Red</span>';}
function showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},dur);}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

// ── DATA ──────────────────────────────────────────────────
async function loadAll(){
  const[pr,ms,pu]=await Promise.all([
    sb.from('projects').select('*').order('created_at'),
    sb.from('milestones').select('*').order('date'),
    sb.from('pulses').select('*').order('submitted_at',{ascending:false})
  ]);
  projects=pr.data||[];milestones=ms.data||[];pulses=pu.data||[];
  if(projects.length&&!selectedProjId)selectedProjId=projects[0].id;
  // Build vinyl + planogram schedules from milestones
  vinylSchedule=projects.map((p,i)=>{
    const vm=milestones.find(m=>m.project_id===p.id&&m.key==='vinyl');
    return{id:p.id,name:p.name,so:p.so_number,client:p.client,date:vm?vm.date:null,status:'Scheduled',priority:i+1};
  }).sort((a,b)=>a.priority-b.priority);
  planogramSchedule=projects.map((p,i)=>{
    const pm=milestones.find(m=>m.project_id===p.id&&(m.label||'').toLowerCase().includes('planogram'));
    return{id:p.id,name:p.name,so:p.so_number,client:p.client,date:pm?pm.date:null,status:'Pending',priority:i+1};
  }).sort((a,b)=>a.priority-b.priority);
  document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  renderTab();
}

function setTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
  ['overview','week','production','vinyl','planogram','pulse','intake'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'block':'none';});
  renderTab();
}
function renderTab(){
  if(currentTab==='overview')renderOverview();

  else if(currentTab==='production')renderProduction();
  else if(currentTab==='vinyl')renderSchedule('vinyl');
  else if(currentTab==='planogram')renderSchedule('planogram');

}

// ── PRODUCTION VIEW ───────────────────────────────────────
function renderProduction(){
  const el=document.getElementById('tab-production');
  if(!projects.length){el.innerHTML='<div class="empty-state">No projects yet.</div>';return;}

  // Build date range: earliest prod-start to latest prod-end across all projects
  const prodStarts=milestones.filter(m=>m.key==='production-start'&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const prodEnds=milestones.filter(m=>m.key==='production-end'&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const qaEnds=milestones.filter(m=>m.key==='quality-end'&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const shipDates=milestones.filter(m=>m.key==='shipping'&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const allDates=[...prodStarts,...prodEnds,...qaEnds,...shipDates];
  if(!allDates.length){el.innerHTML='<div class="section"><div class="section-head"><div class="section-title">Production schedule</div></div><div class="empty-state">No production dates set. Add milestone dates via the Overview tab.</div></div>';return;}

  let rangeStart=new Date(Math.min(...allDates));
  let rangeEnd=new Date(Math.max(...allDates));
  // round to mondays
  rangeStart=monday(rangeStart);
  rangeEnd=addD(rangeEnd,7);
  // build array of weekdays between rangeStart and rangeEnd
  const days=[];let cur=new Date(rangeStart);
  while(cur<=rangeEnd){const dow=cur.getDay();if(dow!==0&&dow!==6)days.push(new Date(cur));cur=addD(cur,1);}

  const todayD=today();
  const headerCells=days.map(d=>{
    const isT=sameDay(d,todayD);
    const label=d.getDate()===1||days.indexOf(d)===0?`<span style="font-size:9px;display:block;color:var(--gray-400)">${d.toLocaleDateString('en-US',{month:'short'})}</span>${d.getDate()}`:d.getDate();
    return `<th class="${isT?'gantt-today-col':''}">${label}</th>`;
  }).join('');

  const rows=projects.map(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);
    const getDate=key=>pMs.find(m=>m.key===key)?.date;
    const ps=getDate('production-start'),pe=getDate('production-end');
    const qs=getDate('quality-start'),qe=getDate('quality-end');
    const sh=getDate('shipping'),inst=getDate('installation');
    const segments=[
      {start:ps,end:pe,cls:'',label:'Build'},
      {start:qs,end:qe,cls:'qa',label:'QA'},
      {start:sh,end:sh,cls:'ship',label:'Ship'},
      {start:inst,end:inst,cls:'install',label:'Install'},
    ].filter(s=>s.start);

    const cells=days.map(d=>{
      const isT=sameDay(d,todayD);
      let fill='';
      segments.forEach(s=>{
        const sd=new Date(s.start+'T00:00:00');
        const ed=s.end?new Date(s.end+'T00:00:00'):sd;
        if(d>=sd&&d<=ed){
          const isFirst=sameDay(d,sd);
          fill=`<div class="gantt-fill ${s.cls}" title="${s.label}: ${fmt(s.start)}${s.end&&s.end!==s.start?' – '+fmt(s.end):''}" style="${isFirst?'border-radius:3px 0 0 3px':''};${sameDay(d,ed)?'border-radius:0 3px 3px 0':''}"></div>`;
        }
      });
      // today line
      const todayLine=isT?'<div style="position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(200,16,46,0.35);z-index:1"></div>':'';
      return `<td class="gantt-cell ${isT?'gantt-today-col':''}" style="position:relative">${todayLine}${fill}</td>`;
    }).join('');

    // status chip
    const now=todayD;
    let chip='<span class="status-chip chip-pending">Pending</span>';
    if(ps&&pe){const sd=new Date(ps+'T00:00:00');const ed=new Date(pe+'T00:00:00');if(now>ed)chip='<span class="status-chip chip-done">Done</span>';else if(now>=sd)chip='<span class="status-chip chip-active">In production</span>';}
    if(qs&&qe){const sd=new Date(qs+'T00:00:00');const ed=new Date(qe+'T00:00:00');if(now>=sd&&now<=ed)chip='<span class="status-chip chip-atrisk">In QA</span>';}

    return `<tr>
      <td class="proj-name">${p.name}<br><span style="font-family:var(--mono);font-size:10px;color:var(--gray-500)">${p.so_number||''}</span></td>
      <td style="padding:5px 8px;white-space:nowrap">${chip}</td>
      <td style="padding:5px 8px;font-size:12px;color:var(--gray-500);white-space:nowrap">${ps?fmt(ps):'—'} → ${pe?fmt(pe):'—'}</td>
      ${cells}
    </tr>`;
  }).join('');

  // week separators in header
  const weekLabels=[];let prevMon=null;
  days.forEach((d,i)=>{if(d.getDay()===1||i===0){if(prevMon)weekLabels.push({start:prevMon,end:i-1});prevMon=i;}});

  el.innerHTML=`
    <div class="section">
      <div class="section-head">
        <div class="section-title">Production schedule — all projects</div>
        <div style="display:flex;gap:8px">
          <button class="btn-export" onclick="exportToExcel()">⬇ Export Excel</button>
        </div>
      </div>
      <div class="legend-row" style="padding:10px 18px 0">
        <div class="leg"><div class="leg-dot" style="background:#7c3aed"></div>Build / production</div>
        <div class="leg"><div class="leg-dot" style="background:#d97706"></div>QA</div>
        <div class="leg"><div class="leg-dot" style="background:#059669"></div>Ship</div>
        <div class="leg"><div class="leg-dot" style="background:#db2777"></div>Installation</div>
        <div class="leg"><div class="leg-dot" style="background:rgba(200,16,46,0.35)"></div>Today</div>
      </div>
      <div class="prod-gantt">
        <table class="gantt-table">
          <thead><tr>
            <th class="proj-col" style="text-align:left">Project</th>
            <th>Status</th>
            <th>Dates</th>
            ${headerCells}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

      <td>
        <select class="status-select" onchange="updateSchedStatus('${type}',${i},this.value)">

  el.innerHTML=`

        <thead><tr>
          <th style="width:32px"></th>
          <th style="width:40px">#</th>
          <th>Project</th>
          <th>SO number</th>
          <th>Client</th>
          <th>${type==='vinyl'?'Vinyl date':'Planogram date'}</th>
          <th>Status</th>
        </tr></thead>
        <tbody id="sched-body-${type}">${rows}</tbody>
      </table>
      <div class="actions-row">
        <button class="btn btn-red" onclick="addSchedRow('${type}')">+ Add row</button>
        <span style="font-size:12px;color:var(--gray-500);margin-left:auto">Drag to reprioritize • Changes save automatically</span>
      </div>
    </div>`;
}

function updateSchedDate(type,idx,val){
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  data[idx].date=val;
  // also update the milestone in supabase
  const proj=projects.find(p=>p.id===data[idx].id);
  if(proj){
    const key=type==='vinyl'?'vinyl':'other';
    const label=type==='vinyl'?'Vinyl / branding':'Planogram sign-off';
    const existing=milestones.find(m=>m.project_id===proj.id&&m.key===key&&(m.label||'').toLowerCase().includes(type==='vinyl'?'vinyl':'planogram'));
    if(existing){sb.from('milestones').update({date:val}).eq('id',existing.id).then(()=>showToast('Date saved ✓'));}
    else{sb.from('milestones').insert({project_id:proj.id,key,label,date:val}).then(()=>{loadAll();showToast('Date saved ✓');});}
  }
}
function updateSchedStatus(type,idx,val){
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  data[idx].status=val;
  showToast('Status updated ✓');
}
function addSchedRow(type){
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  data.push({id:'custom-'+Date.now(),name:'New item',so:'',client:'',date:'',status:'Needs date',priority:data.length+1});
  renderSchedule(type);
}

// Drag and drop for schedule
function dragStart(e,idx,type){dragSrc=idx;dragType=type;e.currentTarget.classList.add('dragging');}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dragDrop(e,idx,type){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragSrc===null||dragSrc===idx||dragType!==type)return;
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  const moved=data.splice(dragSrc,1)[0];
  data.splice(idx,0,moved);
  data.forEach((item,i)=>item.priority=i+1);
  dragSrc=null;
  renderSchedule(type);
  showToast('Priority updated');
}

async function submitPulse(){
  const dept=document.getElementById('p-dept').value;
  const proj_id=document.getElementById('p-proj').value;
  if(!selRag){alert('Please select a status.');return;}
  const{error}=await sb.from('pulses').insert({project_id:proj_id,dept,rag:selRag,milestone:document.getElementById('p-ms').value,blocker:document.getElementById('p-block').value,confidence:parseInt(document.getElementById('p-conf').value)});
  if(error){alert('Error: '+error.message);return;}
  showToast('Pulse submitted ✓');clearPulse();await loadAll();
}
function clearPulse(){
  selRag='';['G','A','R'].forEach(x=>{const el=document.getElementById('rg-'+x);if(el)el.className='rag-opt';});
  ['p-ms','p-block'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const pc=document.getElementById('p-conf');if(pc)pc.value=80;
  const co=document.getElementById('conf-out');if(co)co.textContent='80%';
}

    <div class="section">

      <div class="intake-body">
        <div class="intake-grid">
          <div class="intake-section-lbl">Project information</div>
          <div class="field"><label>Project name *</label><input id="i-name" placeholder="e.g. Smart Control Drawer — Acme Corp"></div>
          <div class="field"><label>Sales order (SO) number *</label><input id="i-so" placeholder="e.g. SO-2026-0142" style="font-family:var(--mono)"></div>
          <div class="field"><label>Client *</label><input id="i-client" placeholder="Client name"></div>
          <div class="field"><label>Product type</label><select id="i-type"><option value="">Select...</option>${typeOpts}</select></div>
          <div class="field"><label>Quantity</label><input id="i-qty" type="number" min="1" placeholder="e.g. 2"></div>
          <div class="field"><label>Delivery location</label><input id="i-loc" placeholder="City, Province, Country"></div>
          <div class="intake-section-lbl">Key milestone dates</div>
          <div class="ms-intake-grid">
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#0f0f0f"></div>Readiness</div>
              <div class="field"><label>MO / PO release *</label><input id="i-po" type="date"></div>
              <div class="field"><label>Parts ordering start</label><input id="i-parts-start" type="date"></div>
              <div class="field"><label>Parts arrival</label><input id="i-parts-end" type="date"></div>
            </div>
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#7c3aed"></div>Production</div>
              <div class="field"><label>Inventory pick</label><input id="i-inv" type="date"></div>
              <div class="field"><label>Production start *</label><input id="i-ps" type="date"></div>
              <div class="field"><label>Production end *</label><input id="i-pe" type="date"></div>
            </div>
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#d97706"></div>Quality & testing</div>
              <div class="field"><label>Quality start *</label><input id="i-qs" type="date"></div>
              <div class="field"><label>Quality end *</label><input id="i-qe" type="date"></div>
              <div class="field"><label>Vinyl / branding</label><input id="i-vinyl" type="date"></div>
            </div>
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#16a34a"></div>UI & UAT</div>
              <div class="field"><label>UI start</label><input id="i-ui-s" type="date"></div>
              <div class="field"><label>UI end</label><input id="i-ui-e" type="date"></div>
              <div class="field"><label>UAT date *</label><input id="i-uat" type="date"></div>
            </div>
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#059669"></div>Shipping</div>
              <div class="field"><label>Pack & ship *</label><input id="i-ship" type="date"></div>
              <div class="field"><label>Delivery date</label><input id="i-del" type="date"></div>
              <div class="field"><label>Planogram sign-off</label><input id="i-plan" type="date"></div>
            </div>
            <div class="ms-block"><div class="ms-block-title"><div class="ms-dot" style="background:#db2777"></div>Delivery & install</div>
              <div class="field"><label>Training</label><input id="i-train" type="date"></div>
              <div class="field"><label>Installation *</label><input id="i-inst" type="date"></div>
              <div class="field"><label>Customer care start</label><input id="i-care" type="date"></div>
            </div>
          </div>
          <div class="intake-section-lbl">Notes</div>
          <div class="field" style="grid-column:1/-1"><textarea id="i-notes" placeholder="Special requirements, site constraints, IT notes..." style="min-height:90px"></textarea></div>
        </div>
      </div>
      <div class="form-actions"><button class="btn" onclick="clearIntake()">Clear</button><button class="btn btn-red" onclick="saveIntake()">Add to hub</button></div>
    </div>`;
}
async function saveIntake(){
  const name=document.getElementById('i-name').value.trim();
  const so=document.getElementById('i-so').value.trim();
  const client=document.getElementById('i-client').value.trim();
  if(!name||!so||!client){alert('Please fill in project name, SO number, and client.');return;}
  const{data:proj,error}=await sb.from('projects').insert({name,so_number:so,client,product_type:document.getElementById('i-type').value,quantity:parseInt(document.getElementById('i-qty').value)||null,location:document.getElementById('i-loc').value,notes:document.getElementById('i-notes').value,status:'active'}).select().single();
  if(error){alert('Error: '+error.message);return;}
  const msFields=[
    {id:'i-po',key:'po-release',label:'MO / PO Release'},{id:'i-parts-start',key:'arrival',label:'Parts ordering start'},
    {id:'i-parts-end',key:'arrival',label:'Parts arrival'},{id:'i-inv',key:'arrival',label:'Inventory pick'},
    {id:'i-ps',key:'production-start',label:'Production start'},{id:'i-pe',key:'production-end',label:'Production end'},
    {id:'i-qs',key:'quality-start',label:'Quality start'},{id:'i-qe',key:'quality-end',label:'Quality end'},
    {id:'i-vinyl',key:'vinyl',label:'Vinyl / branding'},{id:'i-ui-s',key:'other',label:'UI start'},
    {id:'i-ui-e',key:'other',label:'UI end'},{id:'i-uat',key:'uat',label:'UAT'},
    {id:'i-ship',key:'shipping',label:'Pack & ship'},{id:'i-del',key:'delivery',label:'Delivery'},
    {id:'i-plan',key:'other',label:'Planogram sign-off'},{id:'i-train',key:'training',label:'Training'},
    {id:'i-inst',key:'installation',label:'Installation'},{id:'i-care',key:'other',label:'Customer care start'},
  ];
  const msToInsert=msFields.map(f=>{const v=document.getElementById(f.id).value;return v?{project_id:proj.id,key:f.key,label:f.label,date:v}:null;}).filter(Boolean);
  if(msToInsert.length)await sb.from('milestones').insert(msToInsert);
  selectedProjId=proj.id;showToast('"'+name+'" added ✓');
  await loadAll();
  setTab('overview',document.querySelectorAll('.ntab')[0]);
}
function clearIntake(){document.querySelectorAll('#tab-intake input,#tab-intake select,#tab-intake textarea').forEach(el=>{el.value='';});}

// ── EDIT ──────────────────────────────────────────────────
function openEditProj(id){
  const proj=projects.find(p=>p.id===id);if(!proj)return;
  const projMs=milestones.filter(m=>m.project_id===id);
  const msRows=projMs.map(m=>`
    <div style="display:grid;grid-template-columns:1fr 140px 32px;gap:8px;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;color:var(--black);font-weight:500">${m.label}</div>
      <input type="date" value="${m.date||''}" id="ms-${m.id}" style="font-family:var(--font);font-size:12px;padding:5px 8px;border:1px solid var(--gray-300);border-radius:var(--radius);width:100%">
      <button onclick="deleteMs('${m.id}')" style="background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:18px;padding:0 4px">×</button>
    </div>`).join('');
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" style="width:540px" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">Edit project</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="form-grid" style="margin-bottom:16px">
          <div class="field"><label>Project name</label><input id="ep-name" value="${proj.name||''}"></div>
          <div class="field"><label>SO number</label><input id="ep-so" value="${proj.so_number||''}" style="font-family:var(--mono)"></div>
          <div class="field"><label>Client</label><input id="ep-client" value="${proj.client||''}"></div>
          <div class="field"><label>Status</label><select id="ep-status"><option value="active"${proj.status==='active'?' selected':''}>Active</option><option value="on-hold"${proj.status==='on-hold'?' selected':''}>On hold</option><option value="complete"${proj.status==='complete'?' selected':''}>Complete</option></select></div>
          <div class="field full"><label>Notes</label><textarea id="ep-notes" style="min-height:70px">${proj.notes||''}</textarea></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;padding-top:10px;border-top:1px solid var(--gray-100)">Milestone dates</div>
        <div id="ms-edit-rows">${msRows}</div>
      </div>
      <div class="modal-actions">
        <button class="btn" style="color:var(--red);border-color:var(--red-mid)" onclick="deleteProj('${id}')">Delete project</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditProj('${id}')">Save changes</button>
      </div>
    </div>
  </div>`;
}
async function saveEditProj(id){
  const{error}=await sb.from('projects').update({name:document.getElementById('ep-name').value.trim(),so_number:document.getElementById('ep-so').value.trim(),client:document.getElementById('ep-client').value.trim(),status:document.getElementById('ep-status').value,notes:document.getElementById('ep-notes').value,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Error: '+error.message);return;}
  const projMs=milestones.filter(m=>m.project_id===id);
  await Promise.all(projMs.map(m=>{const el=document.getElementById('ms-'+m.id);return el?sb.from('milestones').update({date:el.value}).eq('id',m.id):null;}).filter(Boolean));
  closeModal();showToast('Project updated ✓');await loadAll();
}
function openEditMs(id,label,date){
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" style="width:360px" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">Edit milestone</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:12px"><label>Label</label><input value="${label}" id="em-label-edit" style="font-family:var(--font);font-size:13px;padding:8px 11px;border:1px solid var(--gray-300);border-radius:var(--radius);width:100%"></div>
        <div class="field"><label>Date</label><input type="date" id="em-date-edit" value="${date||''}" style="font-family:var(--font);font-size:13px;padding:8px 11px;border:1px solid var(--gray-300);border-radius:var(--radius);width:100%"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" style="color:var(--red);border-color:var(--red-mid)" onclick="deleteMs('${id}')">Remove</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditMs('${id}')">Save</button>
      </div>
    </div>
  </div>`;
}
async function saveEditMs(id){
  const{error}=await sb.from('milestones').update({label:document.getElementById('em-label-edit').value.trim(),date:document.getElementById('em-date-edit').value}).eq('id',id);
  if(error){alert('Error: '+error.message);return;}
  closeModal();showToast('Date updated ✓');await loadAll();
}
async function deleteMs(id){if(!confirm('Remove this milestone?'))return;await sb.from('milestones').delete().eq('id',id);closeModal();showToast('Removed');await loadAll();}
async function deleteProj(id){if(!confirm('Delete this entire project? This cannot be undone.'))return;await sb.from('milestones').delete().eq('project_id',id);await sb.from('projects').delete().eq('id',id);selectedProjId=null;closeModal();showToast('Project deleted');await loadAll();}

// ── ADD EVENT MODAL ───────────────────────────────────────
function openAddEvModal(){
  const projOpts=projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  const typeOpts=Object.entries(TYPE_LBL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">Add milestone / event</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Project</label><select id="em-proj">${projOpts}</select></div>
          <div class="field"><label>Type</label><select id="em-type">${typeOpts}</select></div>
          <div class="field full"><label>Label</label><input id="em-label" placeholder="e.g. Parts arrive — batch 3"></div>
          <div class="field"><label>Date</label><input id="em-date" type="date" value="${isoD(today())}"></div>
        </div>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEv()">Add</button></div>
    </div>
  </div>`;
}
async function saveEv(){
  const proj_id=document.getElementById('em-proj').value;
  const label=document.getElementById('em-label').value.trim();
  const date=document.getElementById('em-date').value;
  if(!label||!date){alert('Please fill in all fields.');return;}
  const{error}=await sb.from('milestones').insert({project_id:proj_id,key:document.getElementById('em-type').value,label,date});
  if(error){alert('Error: '+error.message);return;}
  closeModal();showToast('Event added ✓');await loadAll();
}

// ── EXCEL EXPORT ──────────────────────────────────────────
function exportToExcel(){
  const wb=XLSX.utils.book_new();

  // Sheet 1: All projects + milestones
  const projRows=[['Project','SO Number','Client','Status','Milestone','Type','Date','Days from today']];
  projects.forEach(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);
    if(!pMs.length){projRows.push([p.name,p.so_number,p.client,p.status,'','','','']);}
    else{pMs.forEach((m,i)=>{projRows.push([i===0?p.name:'',i===0?p.so_number:'',i===0?p.client:'',i===0?p.status:'',m.label,TYPE_LBL[m.key]||m.key,m.date,m.date?daysDiff(m.date):'']);});}
  });
  const ws1=XLSX.utils.aoa_to_sheet(projRows);
  ws1['!cols']=[{wch:30},{wch:16},{wch:20},{wch:12},{wch:28},{wch:18},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'Projects & Milestones');

  // Sheet 2: Vinyl schedule
  const vinylRows=[['Priority','Project','SO Number','Client','Vinyl Date','Status']];
  vinylSchedule.forEach((item,i)=>vinylRows.push([i+1,item.name,item.so,item.client,item.date||'TBD',item.status]));
  const ws2=XLSX.utils.aoa_to_sheet(vinylRows);
  ws2['!cols']=[{wch:8},{wch:30},{wch:16},{wch:20},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'Vinyl Schedule');

  // Sheet 3: Planogram schedule
  const planRows=[['Priority','Project','SO Number','Client','Planogram Date','Status']];
  planogramSchedule.forEach((item,i)=>planRows.push([i+1,item.name,item.so,item.client,item.date||'TBD',item.status]));
  const ws3=XLSX.utils.aoa_to_sheet(planRows);
  ws3['!cols']=[{wch:8},{wch:30},{wch:16},{wch:20},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws3,'Planogram Schedule');

  // Sheet 4: This week
  const we=addD(weekStart,6);
  const weekRows=[['Day','Date','Project','Milestone','Type']];
  const allMs=milestones.map(m=>{const p=projects.find(x=>x.id===m.project_id);return{...m,projectName:p?p.name:''};});
  [0,1,2,3,4].forEach(i=>{
    const d=addD(weekStart,i);
    const dayName=['Monday','Tuesday','Wednesday','Thursday','Friday'][i];
    const evs=allMs.filter(m=>m.date&&sameDay(new Date(m.date+'T00:00:00'),d));
    if(evs.length)evs.forEach(e=>weekRows.push([dayName,isoD(d),e.projectName,e.label,TYPE_LBL[e.key]||e.key]));
    else weekRows.push([dayName,isoD(d),'','','']);
  });
  const ws4=XLSX.utils.aoa_to_sheet(weekRows);
  ws4['!cols']=[{wch:12},{wch:12},{wch:28},{wch:28},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws4,'This Week');

  const fname='Signifi_Ops_'+new Date().toISOString().split('T')[0]+'.xlsx';
  XLSX.writeFile(wb,fname);
  showToast('Excel downloaded ✓');
}

loadAll();
</script>
