<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signifi Solutions — Ops Hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#C8102E;--red-light:#fdf0f2;--red-mid:#f5c2cb;--black:#0f0f0f;--gray-900:#1a1a1a;--gray-700:#3d3d3d;--gray-500:#6b6b6b;--gray-300:#c4c4c4;--gray-200:#e0e0e0;--gray-100:#f2f2f2;--gray-50:#f8f8f8;--white:#fff;--success:#1a7a4a;--success-bg:#eaf5ef;--warning:#8a5a00;--warning-bg:#fff8e6;--purple:#7c3aed;--purple-bg:#ede9fe;--blue:#2563eb;--blue-bg:#eff6ff;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--radius:6px;--radius-lg:10px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--gray-50);color:var(--black);min-height:100vh;font-size:14px;}
/* HEADER */
.page-header{background:var(--black);position:sticky;top:0;z-index:100;}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:0 auto;padding:0 1.5rem;height:52px;gap:1rem;}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-mark{width:24px;height:24px;background:var(--red);border-radius:4px;display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:12px;height:12px;fill:white;}
.logo-text{font-size:12px;font-weight:600;color:white;letter-spacing:0.06em;text-transform:uppercase;}
.nav-tabs{display:flex;gap:1px;flex-wrap:wrap;}
.ntab{font-size:11px;padding:5px 11px;border-radius:var(--radius);border:none;background:transparent;color:#777;cursor:pointer;font-family:var(--font);transition:all 0.15s;white-space:nowrap;}
.ntab:hover{background:#1f1f1f;color:white;}
.ntab.active{background:#2a2a2a;color:white;font-weight:500;}
.ntab.active.tab-prod{border-bottom:2px solid var(--purple);}
.ntab.active.tab-qa{border-bottom:2px solid #d97706;}
.ntab.active.tab-ship{border-bottom:2px solid var(--success);}
.ntab.active.tab-install{border-bottom:2px solid #db2777;}
.ntab.active.tab-vinyl{border-bottom:2px solid var(--blue);}
.ntab.active.tab-plan{border-bottom:2px solid #0891b2;}
.hdate{font-family:var(--mono);font-size:11px;color:#555;flex-shrink:0;}
/* PAGE */
.page-body{max-width:1300px;margin:0 auto;padding:1.5rem 1.5rem 4rem;}
/* METRICS */
.metrics-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:12px 14px;}
.metric-label{font-size:10px;color:var(--gray-500);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.04em;}
.metric-val{font-size:22px;font-weight:600;color:var(--black);}
.metric-sub{font-size:10px;color:var(--gray-500);margin-top:2px;}
.metric-val.red{color:var(--red);}
.metric-val.green{color:var(--success);}
.metric-val.amber{color:var(--warning);}
/* AT A GLANCE */
.glance-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:1rem;}
.glance-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);overflow:hidden;}
.glance-card-head{padding:12px 14px 10px;border-bottom:1px solid var(--gray-100);}
.glance-proj-name{font-size:13px;font-weight:600;color:var(--black);}
.glance-proj-meta{display:flex;align-items:center;gap:8px;margin-top:3px;}
.glance-so{font-family:var(--mono);font-size:10px;color:var(--red);}
.glance-client{font-size:11px;color:var(--gray-500);}
.cycle-track{padding:12px 14px;}
.cycle-stages{display:flex;flex-direction:column;gap:4px;}
.cycle-stage{display:grid;grid-template-columns:100px 1fr 70px;align-items:center;gap:8px;}
.cycle-stage-name{font-size:11px;color:var(--gray-700);font-weight:500;}
.cycle-bar-wrap{background:var(--gray-100);border-radius:2px;height:6px;overflow:hidden;}
.cycle-bar{height:6px;border-radius:2px;transition:width 0.3s;}
.bar-done{background:var(--success);}
.bar-active{background:var(--blue);}
.bar-future{background:var(--gray-200);}
.bar-overdue{background:var(--red);}
.cycle-dates{font-size:10px;color:var(--gray-500);text-align:right;font-family:var(--mono);white-space:nowrap;}
.stage-chip{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600;display:inline-block;margin-top:6px;}
.chip-done{background:var(--success-bg);color:var(--success);}
.chip-active{background:var(--blue-bg);color:var(--blue);}
.chip-future{background:var(--gray-100);color:var(--gray-500);}
.chip-overdue{background:var(--red-light);color:var(--red);}
.chip-atrisk{background:var(--warning-bg);color:var(--warning);}
/* SECTION */
.section{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--gray-100);background:var(--gray-50);}
.section-title{font-size:13px;font-weight:600;color:var(--black);}
.section-meta{font-size:11px;color:var(--gray-500);}
.proj-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem;}
.ppill{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid var(--gray-300);cursor:pointer;color:var(--gray-700);background:var(--white);font-family:var(--font);transition:all 0.15s;}
.ppill:hover{border-color:var(--black);}
.ppill.active{background:var(--black);color:white;border-color:var(--black);}
/* MILESTONE GRID */
.milestone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:12px 16px;}
.ms-item{border-radius:var(--radius);padding:10px 12px;border-left:3px solid var(--gray-300);background:var(--gray-50);cursor:pointer;transition:box-shadow 0.15s;}
.ms-item:hover{box-shadow:0 0 0 2px var(--gray-300);}
.ms-item.done{border-left-color:var(--success);background:#f0faf5;}
.ms-item.today{border-left-color:#059669;background:#ecfdf5;}
.ms-item.upcoming{border-left-color:var(--blue);background:var(--blue-bg);}
.ms-item.overdue{border-left-color:var(--red);background:var(--red-light);}
.ms-item.future{border-left-color:var(--gray-300);}
.ms-type{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:2px;}
.ms-label{font-size:11px;font-weight:600;color:var(--black);line-height:1.3;}
.ms-date{font-size:11px;color:var(--gray-700);margin-top:2px;}
.ms-days{font-size:10px;margin-top:3px;font-weight:500;}
.ms-days.done{color:var(--success);}
.ms-days.today{color:#059669;}
.ms-days.upcoming{color:var(--blue);}
.ms-days.overdue{color:var(--red);}
.ms-days.future{color:var(--gray-500);}
.ms-edit-hint{font-size:9px;color:var(--gray-300);margin-top:2px;}
/* WEEK */
.week-nav-row{display:flex;align-items:center;gap:7px;margin-bottom:1rem;flex-wrap:wrap;}
.wnav{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:5px 10px;cursor:pointer;color:var(--gray-700);font-size:12px;font-family:var(--font);}
.wnav:hover{background:var(--gray-100);}
.wlabel{font-size:12px;color:var(--gray-700);min-width:150px;text-align:center;font-weight:500;}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:1rem;}
.day-col{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);min-height:140px;overflow:hidden;}
.day-col.today-col{border:2px solid var(--black);}
.day-hdr{padding:8px 10px 6px;border-bottom:1px solid var(--gray-100);}
.day-name{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;}
.day-num{font-size:17px;font-weight:600;color:var(--black);line-height:1.2;}
.today-pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle;}
.day-events{padding:6px;}
.ev{border-radius:var(--radius);padding:4px 7px;margin-bottom:3px;}
.ev-ship{background:#d1fae5;border-left:3px solid #059669;}
.ev-arr{background:#dbeafe;border-left:3px solid #2563eb;}
.ev-prod{background:#ede9fe;border-left:3px solid #7c3aed;}
.ev-qa{background:#fef3c7;border-left:3px solid #d97706;}
.ev-uat{background:#dcfce7;border-left:3px solid #16a34a;}
.ev-inst{background:#fce7f3;border-left:3px solid #db2777;}
.ev-other{background:var(--gray-50);border-left:3px solid var(--gray-300);}
.ev-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-500);}
.ev-name{font-size:10px;font-weight:600;color:var(--black);line-height:1.3;}
.ev-proj{font-size:9px;color:var(--gray-500);}
.empty-day{font-size:10px;color:var(--gray-300);text-align:center;padding:1.2rem 0;}
.overdue-bar{background:var(--red-light);border:1px solid var(--red-mid);border-radius:var(--radius);padding:9px 13px;margin-bottom:1rem;display:flex;gap:8px;}
.overdue-title{font-size:11px;font-weight:600;color:var(--red);margin-bottom:2px;}
.overdue-item{font-size:10px;color:var(--red);}
.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray-500);}
.leg-dot{width:7px;height:7px;border-radius:2px;}
/* DEPT VIEW */
.dept-table-wrap{overflow-x:auto;}
.dept-table{width:100%;border-collapse:collapse;min-width:600px;}
.dept-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:8px 14px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.dept-table td{font-size:12px;padding:10px 14px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.dept-table tr:hover td{background:var(--gray-50);}
.dept-table tr:last-child td{border-bottom:none;}
.date-cell{font-family:var(--mono);font-size:11px;}
.status-chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;white-space:nowrap;}
.chip-done{background:var(--success-bg);color:var(--success);}
.chip-active{background:var(--blue-bg);color:var(--blue);}
.chip-future{background:var(--gray-100);color:var(--gray-500);}
.chip-overdue{background:var(--red-light);color:var(--red);}
.chip-atrisk{background:var(--warning-bg);color:var(--warning);}
/* GANTT */
.prod-gantt{overflow-x:auto;padding:0 16px 16px;}
.gantt-table{border-collapse:collapse;width:100%;min-width:700px;}
.gantt-table th{font-size:9px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:5px 4px;text-align:center;border-bottom:1px solid var(--gray-100);font-weight:600;white-space:nowrap;min-width:32px;}
.gantt-table th.proj-col{text-align:left;min-width:160px;padding:5px 8px;}
.gantt-table td{padding:4px 3px;border-bottom:1px solid var(--gray-50);vertical-align:middle;}
.gantt-table td.proj-name{font-size:12px;font-weight:500;color:var(--black);padding:4px 8px;white-space:nowrap;}
.gantt-cell{position:relative;text-align:center;}
.gantt-fill{height:20px;border-radius:3px;}
.gantt-today-col{background:#fff8f8;}
/* SCHEDULE TABLE */
.sched-table{width:100%;border-collapse:collapse;}
.sched-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:9px 12px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;background:var(--gray-50);white-space:nowrap;}
.sched-table td{font-size:12px;padding:9px 12px;border-bottom:1px solid var(--gray-50);color:var(--black);vertical-align:middle;}
.sched-table tr:hover td{background:var(--gray-50);}
.sched-table tr.dragging{opacity:0.4;}
.sched-table tr.drag-over td{border-top:2px solid var(--red);}
.drag-handle{cursor:grab;color:var(--gray-300);font-size:15px;padding:0 4px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.priority-num{font-family:var(--mono);font-size:11px;color:var(--gray-500);}
.sched-input{font-family:var(--font);font-size:12px;padding:4px 8px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.sched-input:focus{outline:none;border-color:var(--black);}
.sched-select{font-family:var(--font);font-size:11px;padding:3px 7px;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--white);color:var(--black);cursor:pointer;}
/* FORMS */
.pulse-form-wrap{padding:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field.full{grid-column:1/-1;}
.field label{font-size:10px;font-weight:600;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.04em;}
.field input,.field select,.field textarea{font-family:var(--font);font-size:12px;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--black);width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(15,15,15,0.05);}
.field textarea{resize:vertical;min-height:65px;}
.rag-row{display:flex;gap:5px;}
.rag-opt{flex:1;padding:7px;border:1px solid var(--gray-300);border-radius:var(--radius);text-align:center;cursor:pointer;background:var(--white);font-family:var(--font);transition:all 0.15s;}
.rag-opt.sel-g{background:var(--success-bg);border-color:var(--success);}
.rag-opt.sel-a{background:var(--warning-bg);border-color:#c97d00;}
.rag-opt.sel-r{background:var(--red-light);border-color:var(--red);}
.rag-label{font-size:11px;font-weight:600;margin-top:2px;}
.rag-opt.sel-g .rag-label{color:var(--success);}
.rag-opt.sel-a .rag-label{color:var(--warning);}
.rag-opt.sel-r .rag-label{color:var(--red);}
.form-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 16px 16px;}
.btn{font-family:var(--font);font-size:12px;font-weight:500;padding:7px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);background:var(--white);color:var(--gray-700);cursor:pointer;}
.btn:hover{background:var(--gray-100);}
.btn-primary{background:var(--black);color:white;border-color:var(--black);}
.btn-primary:hover{background:var(--gray-900);}
.btn-red{background:var(--red);color:white;border-color:var(--red);}
.btn-red:hover{background:#a80e26;}
.btn-add{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red);color:white;cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-add:hover{background:#a80e26;}
.btn-export{font-size:11px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--success);background:var(--success-bg);color:var(--success);cursor:pointer;font-family:var(--font);font-weight:500;}
.btn-export:hover{background:#d4edda;}
/* PULSE */
.pulse-results-table{width:100%;border-collapse:collapse;}
.pulse-results-table th{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.04em;padding:7px 16px;text-align:left;border-bottom:1px solid var(--gray-100);font-weight:600;}
.pulse-results-table td{font-size:12px;padding:9px 16px;border-bottom:1px solid var(--gray-50);color:var(--black);}
.pulse-results-table tr:last-child td{border-bottom:none;}
.rag-pill{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;}
.rag-pill-g{background:var(--success-bg);color:var(--success);}
.rag-pill-a{background:var(--warning-bg);color:var(--warning);}
.rag-pill-r{background:var(--red-light);color:var(--red);}
.blocker-txt{font-size:10px;color:var(--red);margin-top:2px;}
/* INTAKE */
.intake-body{padding:16px;}
.intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.intake-section-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.05em;grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--gray-100);}
.intake-section-lbl:first-child{border-top:none;margin-top:0;padding-top:0;}
.ms-intake-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1;}
.ms-block{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:var(--radius);padding:10px;}
.ms-block-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ms-block .field{margin-bottom:5px;}
.ms-block .field:last-child{margin-bottom:0;}
/* MODAL */
.toast{position:fixed;bottom:22px;right:22px;background:var(--black);color:white;padding:10px 18px;border-radius:var(--radius-lg);font-size:12px;font-weight:500;z-index:999;display:none;animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{background:var(--white);border-radius:var(--radius-lg);width:480px;max-width:100%;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--gray-100);}
.modal-title{font-size:14px;font-weight:600;color:var(--black);}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-500);line-height:1;}
.modal-body{padding:16px;}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--gray-100);}
.conf-row{display:flex;align-items:center;gap:8px;}
.conf-row input[type=range]{flex:1;}
.conf-val{font-size:12px;font-weight:600;min-width:34px;color:var(--black);font-family:var(--mono);}
.empty-state{text-align:center;padding:2.5rem;color:var(--gray-500);font-size:12px;}
.actions-row{display:flex;align-items:center;gap:7px;padding:12px 16px;border-top:1px solid var(--gray-100);}
@media(max-width:800px){.metrics-row{grid-template-columns:repeat(2,1fr);}.week-grid{grid-template-columns:1fr;}.intake-grid,.form-grid,.ms-intake-grid{grid-template-columns:1fr;}.glance-grid{grid-template-columns:1fr;}.header-inner{padding:0 1rem;}.page-body{padding:1rem 1rem 3rem;}.nav-tabs{display:none;}}
</style>
</head>
<body>
<header class="page-header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></div>
      <span class="logo-text">Signifi Ops Hub</span>
    </div>
    <div class="nav-tabs">
      <button class="ntab active" onclick="setTab('glance',this)">At a glance</button>
      <button class="ntab" onclick="setTab('overview',this)">Overview</button>
      <button class="ntab" onclick="setTab('week',this)">This week</button>
      <button class="ntab tab-prod" onclick="setTab('production',this)">Production</button>
      <button class="ntab tab-qa" onclick="setTab('quality',this)">Quality</button>
      <button class="ntab tab-ship" onclick="setTab('shipping',this)">Shipping</button>
      <button class="ntab tab-install" onclick="setTab('installation',this)">Installation</button>
      <button class="ntab tab-vinyl" onclick="setTab('vinyl',this)">Vinyl</button>
      <button class="ntab tab-plan" onclick="setTab('planogram',this)">Planogram</button>
      <button class="ntab" onclick="setTab('pulse',this)">Daily pulse</button>
      <button class="ntab" onclick="setTab('intake',this)">New project</button>
    </div>
    <span class="hdate" id="hdate"></span>
  </div>
</header>
<div class="page-body">
  <div id="tab-glance"></div>
  <div id="tab-overview" style="display:none"></div>
  <div id="tab-week" style="display:none"></div>
  <div id="tab-production" style="display:none"></div>
  <div id="tab-quality" style="display:none"></div>
  <div id="tab-shipping" style="display:none"></div>
  <div id="tab-installation" style="display:none"></div>
  <div id="tab-vinyl" style="display:none"></div>

function monday(dt){let r=new Date(dt);let day=r.getDay();let diff=day===0?-6:1-day;r.setDate(r.getDate()+diff);r.setHours(0,0,0,0);return r;}
function addD(dt,n){let r=new Date(dt);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}

function fmt(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtFull(s){if(!s)return'—';return new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function daysDiff(s){if(!s)return 9999;return Math.round((new Date(s+'T00:00:00')-today())/86400000);}
function msStatus(s){let d=daysDiff(s);if(d<0)return{cls:'done',dcls:'done',txt:Math.abs(d)+'d ago'};if(d===0)return{cls:'today',dcls:'today',txt:'Today'};if(d<=7)return{cls:'upcoming',dcls:'upcoming',txt:'In '+d+'d'};return{cls:'future',dcls:'future',txt:fmtFull(s)};}
function stageStatus(start,end){
  const t=today();
  if(!start)return{label:'Not set',chip:'chip-future'};
  const s=new Date(start+'T00:00:00');
  const e=end?new Date(end+'T00:00:00'):s;
  if(t>e)return{label:'Done',chip:'chip-done'};
  if(t>=s)return{label:'In progress',chip:'chip-active'};
  const d=daysDiff(start);
  if(d<=7)return{label:'In '+d+'d',chip:'chip-atrisk'};
  return{label:fmt(start),chip:'chip-future'};
}

// ── DEPT VIEWS ────────────────────────────────────────────
function buildGantt(startKeys,endKeys,segments,title,legendItems){
  // startKeys / endKeys = arrays of milestone keys to find date range from
  const starts=milestones.filter(m=>startKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  const ends=milestones.filter(m=>endKeys.includes(m.key)&&m.date).map(m=>new Date(m.date+'T00:00:00'));
  if(!starts.length||!ends.length)return'';
  let rS=monday(new Date(Math.min(...starts)));
  let rE=addD(new Date(Math.max(...ends)),5);
  const days=[];let cur=new Date(rS);
  while(cur<=rE){const dow=cur.getDay();if(dow!==0&&dow!==6)days.push(new Date(cur));cur=addD(cur,1);}
  const t=today();
  const hdr=days.map(d=>`<th class="${sameDay(d,t)?'gantt-today-col':''}" style="min-width:28px">${d.getDate()===1||days.indexOf(d)===0?'<span style="font-size:8px;display:block">'+d.toLocaleDateString('en-US',{month:'short'})+'</span>'+d.getDate():d.getDate()}</th>`).join('');
  const gRows=projects.map(p=>{
    const pMs=milestones.filter(m=>m.project_id===p.id);
    const getD=k=>pMs.find(m=>m.key===k)?.date;
    const segs=segments(getD).filter(x=>x.s);
    const cells=days.map(d=>{
      const isT=sameDay(d,t);
      let fill='';
      segs.forEach(sg=>{
        const sd=new Date(sg.s+'T00:00:00');const ed=sg.e?new Date(sg.e+'T00:00:00'):sd;
        if(d>=sd&&d<=ed)fill=`<div class="gantt-fill" style="background:${sg.bg};opacity:0.85" title="${sg.lbl}"></div>`;
      });
      const tl=isT?'<div style="position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(200,16,46,0.4)"></div>':'';
      return `<td class="gantt-cell ${isT?'gantt-today-col':''}" style="position:relative">${tl}${fill}</td>`;
    }).join('');
    return `<tr><td class="proj-name">${p.name}<br><span style="font-family:var(--mono);font-size:9px;color:var(--gray-500)">${p.so_number||''}</span></td>${cells}</tr>`;
  }).join('');
  const legendHtml=legendItems.map(l=>`<div class="leg"><div class="leg-dot" style="background:${l.color}"></div>${l.label}</div>`).join('');
  return `<div class="section" style="margin-bottom:10px">
    <div class="section-head"><div class="section-title">${title} — Gantt</div><div class="legend-row" style="margin:0;gap:8px">${legendHtml}</div></div>
    <div class="prod-gantt"><table class="gantt-table"><thead><tr><th class="proj-col">Project</th>${hdr}</tr></thead><tbody>${gRows}</tbody></table></div>
  </div>`;
}

// Schedule helpers
function vs(i,k,v){vinylSchedule[i][k]=v;}
function ps2(i,k,v){planogramSchedule[i][k]=v;}
function vsDate(i,field,val,type){
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  data[i][field]=val;
  const proj=projects.find(p=>p.id===data[i].id);
  if(proj&&val){
    const key=type==='vinyl'?'vinyl':'other';
    const label=type==='vinyl'?'Vinyl / branding':'Planogram sign-off';
    const existing=milestones.find(m=>m.project_id===proj.id&&m.key===key);
    if(existing)sb.from('milestones').update({date:val}).eq('id',existing.id).then(()=>showToast('Date saved ✓'));
    else sb.from('milestones').insert({project_id:proj.id,key,label,date:val}).then(()=>{loadAll();showToast('Date saved ✓');});
  }
}
function addSchedRow(type){
  const row={id:'custom-'+Date.now(),name:'',so:'',client:'',date:'',status:'Needs date',priority:99};
  if(type==='vinyl'){row.vinylType='';row.shipDate='';row.pm='';row.formFactor='';vinylSchedule.push(row);}
  else{row.machineType='';planogramSchedule.push(row);}
  renderVinyl(); if(type==='planogram')renderPlanogram();
}
function removeSchedRow(type,i){
  if(type==='vinyl')vinylSchedule.splice(i,1);else planogramSchedule.splice(i,1);
  if(type==='vinyl')renderVinyl();else renderPlanogram();
}
function dragStart(e,idx,type){dragSrc=idx;dragType=type;e.currentTarget.classList.add('dragging');}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dragDrop(e,idx,type){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragSrc===null||dragSrc===idx||dragType!==type)return;
  const data=type==='vinyl'?vinylSchedule:planogramSchedule;
  const moved=data.splice(dragSrc,1)[0];data.splice(idx,0,moved);
  data.forEach((item,i)=>item.priority=i+1);dragSrc=null;
  if(type==='vinyl')renderVinyl();else renderPlanogram();
  showToast('Priority updated');
}

  const{error}=await sb.from('projects').update({name:document.getElementById('ep-name').value.trim(),so_number:document.getElementById('ep-so').value.trim(),client:document.getElementById('ep-client').value.trim(),status:document.getElementById('ep-status').value,notes:document.getElementById('ep-notes').value,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Error: '+error.message);return;}
  const projMs=milestones.filter(m=>m.project_id===id);
  await Promise.all(projMs.map(m=>{const e=document.getElementById('ms-'+m.id);return e?sb.from('milestones').update({date:e.value}).eq('id',m.id):null;}).filter(Boolean));
  closeModal();showToast('Saved ✓');await loadAll();
}
function openEditMs(id,label,date){
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" style="width:340px" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">Edit milestone</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="field" style="margin-bottom:10px"><label>Label</label><input value="${label}" id="em-lbl" style="font-size:13px;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);width:100%"></div>
        <div class="field"><label>Date</label><input type="date" id="em-dt" value="${date||''}" style="font-size:13px;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);width:100%"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" style="color:var(--red);border-color:var(--red-mid)" onclick="deleteMs('${id}')">Remove</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditMs('${id}')">Save</button>
      </div>
    </div>
  </div>`;
}
async function saveEditMs(id){
  const{error}=await sb.from('milestones').update({label:document.getElementById('em-lbl').value.trim(),date:document.getElementById('em-dt').value}).eq('id',id);
  if(error){alert('Error: '+error.message);return;}
  closeModal();showToast('Date updated ✓');await loadAll();
}
async function deleteMs(id){if(!confirm('Remove this milestone?'))return;await sb.from('milestones').delete().eq('id',id);closeModal();showToast('Removed');await loadAll();}
async function deleteProj(id){if(!confirm('Delete this project? Cannot be undone.'))return;await sb.from('milestones').delete().eq('project_id',id);await sb.from('projects').delete().eq('id',id);selectedProjId=null;closeModal();showToast('Deleted');await loadAll();}

function openAddEvModal(){
  const projOpts=projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  const typeOpts=Object.entries(TYPE_LBL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><span class="modal-title">Add milestone</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Project</label><select id="em-proj">${projOpts}</select></div>
          <div class="field"><label>Type</label><select id="em-type">${typeOpts}</select></div>
          <div class="field full"><label>Label</label><input id="em-label" placeholder="e.g. Parts arrive — batch 3"></div>
          <div class="field"><label>Date</label><input id="em-date" type="date" value="${isoD(today())}"></div>
        </div>
      </div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEv()">Add</button></div>
    </div>
  </div>`;
}
async function saveEv(){
  const label=document.getElementById('em-label').value.trim();
  const date=document.getElementById('em-date').value;
  if(!label||!date){alert('Fill in all fields.');return;}
  const{error}=await sb.from('milestones').insert({project_id:document.getElementById('em-proj').value,key:document.getElementById('em-type').value,label,date});
  if(error){alert('Error: '+error.message);return;}
  closeModal();showToast('Added ✓');await loadAll();
}

// ── EXCEL EXPORT ──────────────────────────────────────────
function exportToExcel(){
  const wb=XLSX.utils.book_new();
  // Projects & Milestones
  const r1=[['Project','SO Number','Client','Product Type','Status','Milestone','Type','Date','Days from today']];
  projects.forEach(p=>{const pMs=milestones.filter(m=>m.project_id===p.id);if(!pMs.length){r1.push([p.name,p.so_number,p.client,p.product_type,p.status,'','','','']);}else{pMs.forEach((m,i)=>r1.push([i===0?p.name:'',i===0?p.so_number:'',i===0?p.client:'',i===0?p.product_type:'',i===0?p.status:'',m.label,TYPE_LBL[m.key]||m.key,m.date,m.date?daysDiff(m.date):'']));}}); 
  const ws1=XLSX.utils.aoa_to_sheet(r1);ws1['!cols']=[{wch:28},{wch:14},{wch:18},{wch:18},{wch:10},{wch:26},{wch:16},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws1,'Projects & Milestones');
  // Vinyl
  const r2=[['Priority','SO Number','Customer','Project Name','Decal/Partial/Full Vinyl','Vinyl Date','Ship Date','Project Manager','Form Factor','Status']];
  vinylSchedule.forEach((item,i)=>r2.push([i+1,item.so,item.client,item.name,item.vinylType,item.date||'TBD',item.shipDate||'TBD',item.pm,item.formFactor,item.status]));
  const ws2=XLSX.utils.aoa_to_sheet(r2);ws2['!cols']=[{wch:6},{wch:14},{wch:18},{wch:26},{wch:18},{wch:12},{wch:12},{wch:16},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Vinyl Schedule');
  // Planogram
  const r3=[['Priority','SO Number','Customer','Project Name','Machine Type','Planogram Date','Status']];
  planogramSchedule.forEach((item,i)=>r3.push([i+1,item.so,item.client,item.name,item.machineType,item.date||'TBD',item.status]));
  const ws3=XLSX.utils.aoa_to_sheet(r3);ws3['!cols']=[{wch:6},{wch:14},{wch:18},{wch:26},{wch:16},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws3,'Planogram Schedule');
  // Production dept
  const r4=[['Project','SO Number','Client','Prod Start','Prod End','Duration (days)','Status']];
  projects.forEach(p=>{const sd=getMsDate(p.id,'production-start');const ed=getMsDate(p.id,'production-end');const dur=sd&&ed?Math.round((new Date(ed+'T00:00:00')-new Date(sd+'T00:00:00'))/86400000):'';const st=stageStatus(sd,ed);r4.push([p.name,p.so_number,p.client,sd||'',ed||'',dur,st.label]);});
  const ws4=XLSX.utils.aoa_to_sheet(r4);ws4['!cols']=[{wch:28},{wch:14},{wch:18},{wch:12},{wch:12},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws4,'Production');
  XLSX.writeFile(wb,'Signifi_Ops_'+new Date().toISOString().split('T')[0]+'.xlsx');
  showToast('Excel downloaded ✓');
}

loadAll();
</script>
